name: Recover HarmonyOS Quantized Professional Model

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/harmony-pro-model.yml"

permissions:
  contents: read

concurrency:
  group: dededi-harmony-quantized-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Recover Quantized Professional Model
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dependency manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ci

          cat << 'EOF' > .ci/requirements-harmony-pro.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          gdown==5.2.0
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: .ci/requirements-harmony-pro.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            -r .ci/requirements-harmony-pro.txt

      - name: Download professional model
        shell: bash
        run: |
          set -euo pipefail

          rm -rf harmony_pro_source
          rm -rf harmony_pro_model

          mkdir -p harmony_pro_source
          mkdir -p harmony_pro_model

          gdown \
            10NTeKyG6JigASVwsekKs3MJl0Ev4Oj29 \
            -O harmony_pro_source/pro_model.zip

          test -s harmony_pro_source/pro_model.zip || {
            echo "专业模型压缩包下载失败或为空"
            exit 1
          }

          unzip -oq \
            harmony_pro_source/pro_model.zip \
            -d harmony_pro_source/unpacked

          MODEL_PATH="$(
            find harmony_pro_source/unpacked \
              -type f \
              -name 'model_traced.pt' \
              -print \
              -quit
          )"

          TOKENIZER_PATH="$(
            find harmony_pro_source/unpacked \
              -type f \
              -name 'tokenizer.json' \
              -print \
              -quit
          )"

          test -n "$MODEL_PATH" || {
            echo "没有找到 model_traced.pt"
            exit 1
          }

          test -n "$TOKENIZER_PATH" || {
            echo "没有找到 tokenizer.json"
            exit 1
          }

          cp \
            "$MODEL_PATH" \
            harmony_pro_source/model_traced.pt

          cp \
            "$TOKENIZER_PATH" \
            harmony_pro_source/tokenizer.json

          echo "模型路径：$MODEL_PATH"
          echo "词表路径：$TOKENIZER_PATH"

          echo "模型大小：$(
            stat -c '%s' \
              harmony_pro_source/model_traced.pt
          ) bytes"

          echo "词表大小：$(
            stat -c '%s' \
              harmony_pro_source/tokenizer.json
          ) bytes"

      - name: Unpack, export and requantize model
        id: export
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > recover_quantized_professional.py
          import gc
          import hashlib
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch
          from onnxruntime.quantization import (
              QuantType,
              quantize_dynamic
          )


          SOURCE = Path(
              "harmony_pro_source/model_traced.pt"
          )

          TOKENIZER = Path(
              "harmony_pro_source/tokenizer.json"
          )

          OUTPUT_DIR = Path(
              "harmony_pro_model"
          )

          FLOAT_ONNX = OUTPUT_DIR / (
              "dededi_pro_float_tmp.onnx"
          )

          INT8_ONNX = OUTPUT_DIR / (
              "dededi_pro_int8.onnx"
          )

          VOCAB_OUTPUT = OUTPUT_DIR / (
              "roberta_vocab.json"
          )

          MANIFEST_OUTPUT = OUTPUT_DIR / (
              "model_manifest.json"
          )

          REPORT_OUTPUT = OUTPUT_DIR / (
              "conversion_report.txt"
          )

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          REPORT_LINES = []


          def log(message=""):
              text = str(message)

              print(
                  text,
                  flush=True
              )

              REPORT_LINES.append(
                  text
              )


          def save_report():
              REPORT_OUTPUT.write_text(
                  "\n".join(
                      REPORT_LINES
                  ) + "\n",
                  encoding="utf-8"
              )


          def github_output(
              name,
              value
          ):
              output_file = os.environ.get(
                  "GITHUB_OUTPUT"
              )

              if not output_file:
                  return

              with open(
                  output_file,
                  "a",
                  encoding="utf-8"
              ) as file:
                  file.write(
                      f"{name}={value}\n"
                  )


          def sha256(path):
              digest = hashlib.sha256()

              with path.open("rb") as file:
                  while True:
                      block = file.read(
                          1024 * 1024
                      )

                      if not block:
                          break

                      digest.update(
                          block
                      )

              return digest.hexdigest()


          def first_tensor(value):
              if torch.is_tensor(value):
                  return value

              if isinstance(
                  value,
                  (tuple, list)
              ):
                  for item in value:
                      try:
                          return first_tensor(
                              item
                          )
                      except TypeError:
                          pass

              if isinstance(
                  value,
                  dict
              ):
                  for item in value.values():
                      try:
                          return first_tensor(
                              item
                          )
                      except TypeError:
                          pass

              raise TypeError(
                  "模型输出中没有 Tensor："
                  f"{type(value)!r}"
              )


          def load_vocabulary():
              raw = json.loads(
                  TOKENIZER.read_text(
                      encoding="utf-8"
                  )
              )

              vocabulary = (
                  raw
                  .get("model", {})
                  .get("vocab")
              )

              if (
                  not isinstance(
                      vocabulary,
                      dict
                  )
                  or not vocabulary
              ):
                  raise ValueError(
                      "tokenizer.json "
                      "中没有有效 vocab"
                  )

              clean_vocabulary = {
                  str(token): int(index)
                  for token, index
                  in vocabulary.items()
              }

              VOCAB_OUTPUT.write_text(
                  json.dumps(
                      clean_vocabulary,
                      ensure_ascii=False,
                      separators=(",", ":")
                  ),
                  encoding="utf-8"
              )

              special_ids = {
                  "cls_id": int(
                      clean_vocabulary.get(
                          "[CLS]",
                          101
                      )
                  ),
                  "sep_id": int(
                      clean_vocabulary.get(
                          "[SEP]",
                          102
                      )
                  ),
                  "mask_id": int(
                      clean_vocabulary.get(
                          "[MASK]",
                          103
                      )
                  ),
                  "unk_id": int(
                      clean_vocabulary.get(
                          "[UNK]",
                          100
                      )
                  ),
                  "pad_id": int(
                      clean_vocabulary.get(
                          "[PAD]",
                          0
                      )
                  ),
                  "de_id": int(
                      clean_vocabulary["的"]
                  ),
                  "di_id": int(
                      clean_vocabulary["地"]
                  ),
                  "de2_id": int(
                      clean_vocabulary["得"]
                  )
              }

              vocabulary_size = (
                  max(
                      clean_vocabulary.values()
                  ) + 1
              )

              return (
                  clean_vocabulary,
                  vocabulary_size,
                  special_ids
              )


          def make_inputs(
              sequence_length,
              vocabulary_size,
              special_ids,
              seed
          ):
              if sequence_length < 4:
                  raise ValueError(
                      "测试长度至少为 4"
                  )

              generator = torch.Generator(
                  device="cpu"
              )

              generator.manual_seed(
                  seed
              )

              input_ids = torch.randint(
                  low=0,
                  high=vocabulary_size,
                  size=(
                      1,
                      sequence_length
                  ),
                  dtype=torch.long,
                  generator=generator
              )

              input_ids[
                  0,
                  0
              ] = special_ids["cls_id"]

              input_ids[
                  0,
                  -1
              ] = special_ids["sep_id"]

              for position in range(
                  2,
                  sequence_length - 1,
                  7
              ):
                  input_ids[
                      0,
                      position
                  ] = special_ids["mask_id"]

              attention_mask = torch.ones(
                  (
                      1,
                      sequence_length
                  ),
                  dtype=torch.long
              )

              token_type_ids = torch.zeros(
                  (
                      1,
                      sequence_length
                  ),
                  dtype=torch.long
              )

              return (
                  input_ids,
                  attention_mask,
                  token_type_ids
              )


          def run_torch(
              model,
              model_inputs
          ):
              with torch.inference_mode():
                  output = model(
                      *model_inputs
                  )

                  return (
                      first_tensor(output)
                      .detach()
                      .cpu()
                      .numpy()
                  )


          def collect_nodes(block):
              result = []

              for node in list(
                  block.nodes()
              ):
                  for sub_block in (
                      node.blocks()
                  ):
                      result.extend(
                          collect_nodes(
                              sub_block
                          )
                      )

                  result.append(
                      node
                  )

              return result


          def unpack_linear(
              packed_parameters
          ):
              errors = []

              try:
                  return (
                      torch
                      .ops
                      .quantized
                      .linear_unpack(
                          packed_parameters
                      )
                  )
              except Exception as error:
                  errors.append(
                      "linear_unpack: "
                      f"{type(error).__name__}: "
                      f"{error}"
                  )

              for method_name in (
                  "_weight_bias",
                  "__getstate__",
                  "unpack"
              ):
                  try:
                      method = getattr(
                          packed_parameters,
                          method_name
                      )

                      state = method()

                      if (
                          method_name
                          == "__getstate__"
                          and isinstance(
                              state,
                              tuple
                          )
                          and len(state) == 2
                          and isinstance(
                              state[0],
                              (tuple, list)
                          )
                      ):
                          state = state[0]

                      if (
                          isinstance(
                              state,
                              (tuple, list)
                          )
                          and len(state) >= 2
                          and torch.is_tensor(
                              state[0]
                          )
                      ):
                          return (
                              state[0],
                              state[1]
                          )

                  except Exception as error:
                      errors.append(
                          f"{method_name}: "
                          f"{type(error).__name__}: "
                          f"{error}"
                      )

              raise RuntimeError(
                  "无法解包量化线性层："
                  + "；".join(errors)
              )


          def dequantize_graph(module):
              graph = module.graph

              replaced_count = 0
              quantization_schemes = {}

              supported_nodes = (
                  "quantized::linear_dynamic",
                  "quantized::linear_relu_dynamic"
              )

              for node in collect_nodes(
                  graph
              ):
                  kind = node.kind()

                  if kind not in supported_nodes:
                      continue

                  node_inputs = list(
                      node.inputs()
                  )

                  if len(node_inputs) < 2:
                      raise RuntimeError(
                          f"{kind} 输入数量异常"
                      )

                  packed_parameters = (
                      node_inputs[1]
                      .toIValue()
                  )

                  if packed_parameters is None:
                      raise RuntimeError(
                          f"{kind} 的量化参数为空"
                      )

                  (
                      quantized_weight,
                      bias
                  ) = unpack_linear(
                      packed_parameters
                  )

                  if not torch.is_tensor(
                      quantized_weight
                  ):
                      raise RuntimeError(
                          "解包后的权重"
                          "不是 Tensor"
                      )

                  if quantized_weight.is_quantized:
                      scheme = str(
                          quantized_weight.qscheme()
                      )

                      weight = (
                          quantized_weight
                          .dequantize()
                      )
                  else:
                      scheme = "float"

                      weight = (
                          quantized_weight
                          .float()
                      )

                  quantization_schemes[
                      scheme
                  ] = (
                      quantization_schemes.get(
                          scheme,
                          0
                      ) + 1
                  )

                  weight = (
                      weight
                      .detach()
                      .cpu()
                      .contiguous()
                  )

                  if bias is not None:
                      bias = (
                          bias
                          .detach()
                          .cpu()
                          .float()
                          .contiguous()
                      )

                  graph.setInsertPoint(
                      node
                  )

                  weight_value = (
                      graph.insertConstant(
                          weight
                      )
                  )

                  bias_value = (
                      graph.insertConstant(
                          bias
                      )
                  )

                  linear_node = graph.create(
                      "aten::linear",
                      [
                          node_inputs[0],
                          weight_value,
                          bias_value
                      ],
                      1
                  )

                  linear_node.output().setType(
                      node.output().type()
                  )

                  linear_node.insertBefore(
                      node
                  )

                  replacement = (
                      linear_node.output()
                  )

                  if (
                      kind
                      == "quantized::linear_relu_dynamic"
                  ):
                      relu_node = graph.create(
                          "aten::relu",
                          [
                              replacement
                          ],
                          1
                      )

                      relu_node.output().setType(
                          node.output().type()
                      )

                      relu_node.insertBefore(
                          node
                      )

                      replacement = (
                          relu_node.output()
                      )

                  node.output().replaceAllUsesWith(
                      replacement
                  )

                  node.destroy()

                  replaced_count += 1

              if replaced_count == 0:
                  raise RuntimeError(
                      "没有找到任何 "
                      "quantized::linear_dynamic"
                  )

              torch._C._jit_pass_dce(
                  graph
              )

              for pass_name in (
                  "_jit_pass_constant_pooling",
                  "_jit_pass_canonicalize"
              ):
                  function = getattr(
                      torch._C,
                      pass_name,
                      None
                  )

                  if callable(function):
                      try:
                          function(
                              graph
                          )
                      except Exception:
                          pass

              graph.lint()

              remaining = [
                  node.kind()
                  for node
                  in collect_nodes(graph)
                  if node.kind().startswith(
                      "quantized::linear"
                  )
              ]

              if remaining:
                  raise RuntimeError(
                      "仍残留量化线性节点："
                      f"{remaining[:10]}"
                  )

              return (
                  replaced_count,
                  quantization_schemes
              )


          def compare_outputs(
              title,
              expected,
              actual,
              target_ids
          ):
              if expected.shape != actual.shape:
                  raise RuntimeError(
                      f"{title} 输出形状不同："
                      f"{expected.shape} != "
                      f"{actual.shape}"
                  )

              full_difference = np.abs(
                  expected.astype(
                      np.float64
                  )
                  - actual.astype(
                      np.float64
                  )
              )

              expected_targets = (
                  expected[
                      :,
                      :,
                      target_ids
                  ]
              )

              actual_targets = (
                  actual[
                      :,
                      :,
                      target_ids
                  ]
              )

              target_difference = np.abs(
                  expected_targets.astype(
                      np.float64
                  )
                  - actual_targets.astype(
                      np.float64
                  )
              )

              target_agreement = float(
                  np.mean(
                      np.argmax(
                          expected_targets,
                          axis=-1
                      )
                      == np.argmax(
                          actual_targets,
                          axis=-1
                      )
                  )
              )

              statistics = {
                  "full_max": float(
                      full_difference.max()
                  ),
                  "full_mean": float(
                      full_difference.mean()
                  ),
                  "target_max": float(
                      target_difference.max()
                  ),
                  "target_mean": float(
                      target_difference.mean()
                  ),
                  "target_agreement":
                      target_agreement
              }

              log(
                  f"{title}: "
                  f"full_max="
                  f"{statistics['full_max']:.12g}, "
                  f"full_mean="
                  f"{statistics['full_mean']:.12g}, "
                  f"target_max="
                  f"{statistics['target_max']:.12g}, "
                  f"target_agreement="
                  f"{target_agreement:.6f}"
              )

              return statistics


          def export_float_onnx(
              model,
              sample_inputs
          ):
              FLOAT_ONNX.unlink(
                  missing_ok=True
              )

              torch.onnx.export(
                  model,
                  sample_inputs,
                  str(FLOAT_ONNX),
                  export_params=True,
                  opset_version=13,
                  do_constant_folding=True,
                  input_names=[
                      "input_ids",
                      "attention_mask",
                      "token_type_ids"
                  ],
                  output_names=[
                      "logits"
                  ],
                  dynamic_axes={
                      "input_ids": {
                          1: "sequence"
                      },
                      "attention_mask": {
                          1: "sequence"
                      },
                      "token_type_ids": {
                          1: "sequence"
                      },
                      "logits": {
                          1: "sequence"
                      }
                  },
                  verbose=False
              )

              if (
                  not FLOAT_ONNX.is_file()
                  or FLOAT_ONNX.stat().st_size
                  < 1024
              ):
                  raise RuntimeError(
                      "临时浮点 ONNX "
                      "没有正确生成"
                  )

              onnx.checker.check_model(
                  str(FLOAT_ONNX)
              )

              log(
                  "临时浮点 ONNX 大小："
                  f"{FLOAT_ONNX.stat().st_size} "
                  "bytes"
              )


          def quantize_onnx():
              INT8_ONNX.unlink(
                  missing_ok=True
              )

              quantize_dynamic(
                  model_input=str(
                      FLOAT_ONNX
                  ),
                  model_output=str(
                      INT8_ONNX
                  ),
                  op_types_to_quantize=[
                      "MatMul",
                      "Gemm"
                  ],
                  per_channel=False,
                  reduce_range=True,
                  weight_type=QuantType.QInt8,
                  use_external_data_format=False,
                  extra_options={
                      "MatMulConstBOnly": True
                  }
              )

              if (
                  not INT8_ONNX.is_file()
                  or INT8_ONNX.stat().st_size
                  < 1024
              ):
                  raise RuntimeError(
                      "INT8 ONNX "
                      "没有正确生成"
                  )

              onnx.checker.check_model(
                  str(INT8_ONNX)
              )

              log(
                  "INT8 ONNX 大小："
                  f"{INT8_ONNX.stat().st_size} "
                  "bytes"
              )

              log(
                  "INT8 ONNX SHA-256："
                  f"{sha256(INT8_ONNX)}"
              )


          def run_onnx(
              session,
              model_inputs
          ):
              available_inputs = {
                  "input_ids": (
                      model_inputs[0]
                      .numpy()
                      .astype(np.int64)
                  ),
                  "attention_mask": (
                      model_inputs[1]
                      .numpy()
                      .astype(np.int64)
                  ),
                  "token_type_ids": (
                      model_inputs[2]
                      .numpy()
                      .astype(np.int64)
                  )
              }

              feed = {}

              for item in (
                  session.get_inputs()
              ):
                  if (
                      item.name
                      not in available_inputs
                  ):
                      raise RuntimeError(
                          "出现未知 ONNX 输入："
                          f"{item.name}"
                      )

                  feed[item.name] = (
                      available_inputs[
                          item.name
                      ]
                  )

              outputs = session.run(
                  None,
                  feed
              )

              if not outputs:
                  raise RuntimeError(
                      "ONNX Runtime "
                      "没有返回输出"
                  )

              return np.asarray(
                  outputs[0]
              )


          def main():
              log(
                  "===== Dededi 专业量化模型恢复 ====="
              )

              log(
                  f"Python：{sys.version}"
              )

              log(
                  f"PyTorch：{torch.__version__}"
              )

              log(
                  f"ONNX：{onnx.__version__}"
              )

              log(
                  "ONNX Runtime："
                  f"{ort.__version__}"
              )

              log(
                  "源模型大小："
                  f"{SOURCE.stat().st_size} "
                  "bytes"
              )

              log(
                  "源模型 SHA-256："
                  f"{sha256(SOURCE)}"
              )

              (
                  vocabulary,
                  vocabulary_size,
                  special_ids
              ) = load_vocabulary()

              target_ids = [
                  special_ids["de_id"],
                  special_ids["di_id"],
                  special_ids["de2_id"]
              ]

              log(
                  "词表项目数："
                  f"{len(vocabulary)}"
              )

              log(
                  "词表尺寸："
                  f"{vocabulary_size}"
              )

              log(
                  f"特殊 ID：{special_ids}"
              )

              model = torch.jit.load(
                  str(SOURCE),
                  map_location="cpu"
              )

              model.eval()

              log(
                  f"模型类型：{type(model)!r}"
              )

              log(
                  "forward schema："
                  f"{model.forward.schema}"
              )

              test_lengths = (
                  4,
                  16,
                  64,
                  128,
                  302
              )

              test_cases = {}

              for sequence_length in (
                  test_lengths
              ):
                  model_inputs = make_inputs(
                      sequence_length=(
                          sequence_length
                      ),
                      vocabulary_size=(
                          vocabulary_size
                      ),
                      special_ids=(
                          special_ids
                      ),
                      seed=(
                          20261000
                          + sequence_length
                      )
                  )

                  expected = run_torch(
                      model,
                      model_inputs
                  )

                  expected_shape = (
                      1,
                      sequence_length,
                      vocabulary_size
                  )

                  if (
                      expected.shape
                      != expected_shape
                  ):
                      raise RuntimeError(
                          "源模型输出形状异常："
                          f"{expected.shape}，"
                          f"预期 {expected_shape}"
                      )

                  test_cases[
                      sequence_length
                  ] = (
                      model_inputs,
                      expected
                  )

                  log(
                      "源模型测试通过："
                      f"sequence="
                      f"{sequence_length}"
                  )

              frozen_model = (
                  torch.jit.freeze(
                      model
                  )
              )

              del model
              gc.collect()

              (
                  replaced_count,
                  quantization_schemes
              ) = dequantize_graph(
                  frozen_model
              )

              log(
                  "已解包并替换量化线性层："
                  f"{replaced_count} 个"
              )

              log(
                  "原权重量化方案："
                  f"{quantization_schemes}"
              )

              dequantized_statistics = {}

              for (
                  sequence_length,
                  (
                      model_inputs,
                      expected
                  )
              ) in test_cases.items():
                  actual = run_torch(
                      frozen_model,
                      model_inputs
                  )

                  dequantized_statistics[
                      str(sequence_length)
                  ] = compare_outputs(
                      "解包模型 "
                      f"sequence="
                      f"{sequence_length}",
                      expected,
                      actual,
                      target_ids
                  )

              minimum_agreement = min(
                  item["target_agreement"]
                  for item in (
                      dequantized_statistics
                      .values()
                  )
              )

              maximum_target_error = max(
                  item["target_max"]
                  for item in (
                      dequantized_statistics
                      .values()
                  )
              )

              if (
                  minimum_agreement < 0.98
                  or maximum_target_error > 1.0
              ):
                  raise RuntimeError(
                      "解包模型偏差过大："
                      f"agreement="
                      f"{minimum_agreement}，"
                      f"target_error="
                      f"{maximum_target_error}"
                  )

              export_float_onnx(
                  frozen_model,
                  test_cases[16][0]
              )

              quantize_onnx()

              del frozen_model
              gc.collect()

              FLOAT_ONNX.unlink(
                  missing_ok=True
              )

              session_options = (
                  ort.SessionOptions()
              )

              session_options.graph_optimization_level = (
                  ort.GraphOptimizationLevel
                  .ORT_ENABLE_ALL
              )

              session = ort.InferenceSession(
                  str(INT8_ONNX),
                  sess_options=session_options,
                  providers=[
                      "CPUExecutionProvider"
                  ]
              )

              onnx_statistics = {}

              for (
                  sequence_length,
                  (
                      model_inputs,
                      expected
                  )
              ) in test_cases.items():
                  actual = run_onnx(
                      session,
                      model_inputs
                  )

                  onnx_statistics[
                      str(sequence_length)
                  ] = compare_outputs(
                      "INT8 ONNX "
                      f"sequence="
                      f"{sequence_length}",
                      expected,
                      actual,
                      target_ids
                  )

              minimum_onnx_agreement = min(
                  item["target_agreement"]
                  for item in (
                      onnx_statistics
                      .values()
                  )
              )

              maximum_onnx_target_error = max(
                  item["target_max"]
                  for item in (
                      onnx_statistics
                      .values()
                  )
              )

              if (
                  minimum_onnx_agreement < 0.98
                  or maximum_onnx_target_error > 1.0
              ):
                  raise RuntimeError(
                      "INT8 ONNX 偏差过大："
                      f"agreement="
                      f"{minimum_onnx_agreement}，"
                      f"target_error="
                      f"{maximum_onnx_target_error}"
                  )

              manifest = {
                  "model":
                      "DedediProfessionalBertMaskedLM",
                  "source_sha256":
                      sha256(SOURCE),
                  "onnx_sha256":
                      sha256(INT8_ONNX),
                  "vocabulary_size":
                      vocabulary_size,
                  "special_ids":
                      special_ids,
                  "labels": [
                      "的",
                      "地",
                      "得"
                  ],
                  "input_names": [
                      item.name
                      for item in (
                          session.get_inputs()
                      )
                  ],
                  "output_names": [
                      item.name
                      for item in (
                          session.get_outputs()
                      )
                  ],
                  "input_dtype":
                      "int64",
                  "output_dtype":
                      "float32",
                  "maximum_source_text_length":
                      300,
                  "maximum_model_sequence_length":
                      302,
                  "dynamic_sequence":
                      True,
                  "replaced_quantized_linear_count":
                      replaced_count,
                  "source_weight_qschemes":
                      quantization_schemes,
                  "dequantized_validation":
                      dequantized_statistics,
                  "int8_onnx_validation":
                      onnx_statistics
              }

              MANIFEST_OUTPUT.write_text(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              github_output(
                  "onnx_exported",
                  "true"
              )

              github_output(
                  "linear_count",
                  str(replaced_count)
              )

              github_output(
                  "agreement",
                  f"{minimum_onnx_agreement:.6f}"
              )

              github_output(
                  "target_error",
                  f"{maximum_onnx_target_error:.12g}"
              )

              log("")
              log(
                  "===== 最终结论 ====="
              )

              log(
                  "专业量化模型已解包、"
                  "导出并重新量化为 "
                  "INT8 ONNX。"
              )

              log(
                  "不需要重新训练。"
              )


          try:
              main()

          except Exception as error:
              github_output(
                  "onnx_exported",
                  "false"
              )

              log("")
              log(
                  "===== 转换失败 ====="
              )

              log(
                  f"{type(error).__name__}: "
                  f"{error}"
              )

              log(
                  traceback.format_exc()
              )

              raise

          finally:
              try:
                  FLOAT_ONNX.unlink(
                      missing_ok=True
                  )
              except Exception:
                  pass

              save_report()
          PY

          set +e

          python recover_quantized_professional.py

          CONVERSION_STATUS=$?

          set -e

          if [
            -f harmony_pro_model/conversion_report.txt
          ]; then
            {
              echo "## 专业量化模型恢复报告"
              echo ""
              echo '```text'

              tail -n 700 \
                harmony_pro_model/conversion_report.txt

              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$CONVERSION_STATUS"

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          ONNX_EXPORTED="${{ steps.export.outputs.onnx_exported }}"
          LINEAR_COUNT="${{ steps.export.outputs.linear_count }}"
          AGREEMENT="${{ steps.export.outputs.agreement }}"
          TARGET_ERROR="${{ steps.export.outputs.target_error }}"

          {
            echo ""
            echo "## 最终结果"
            echo ""
            echo "- 专业 INT8 ONNX 已生成：\`${ONNX_EXPORTED:-false}\`"
            echo "- 解包量化 Linear 数量：\`${LINEAR_COUNT:-unknown}\`"
            echo "- 的地得判断一致率：\`${AGREEMENT:-unknown}\`"
            echo "- 的地得 Logit 最大误差：\`${TARGET_ERROR:-unknown}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ONNX_EXPORTED" = "true" ]; then
            {
              echo "✅ 专业量化模型恢复成功。"
              echo ""
              echo "请下载 Artifact："
              echo "\`Dededi-Harmony-Professional-INT8-Model\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ 专业模型恢复失败。"
              echo "请查看上方完整转换报告。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload professional model package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Professional-INT8-Model
          path: |
            harmony_pro_model/dededi_pro_int8.onnx
            harmony_pro_model/roberta_vocab.json
            harmony_pro_model/model_manifest.json
            harmony_pro_model/conversion_report.txt
            recover_quantized_professional.py
          if-no-files-found: warn
          retention-days: 30
