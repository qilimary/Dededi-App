name: Recover HarmonyOS Professional Model V2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/harmony-pro-model.yml"

permissions:
  contents: read

concurrency:
  group: dededi-harmony-pro-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Recover Professional INT8 ONNX
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat << 'EOF' > .ci/requirements-harmony-pro.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          gdown==5.2.0
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: .ci/requirements-harmony-pro.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/requirements-harmony-pro.txt

      - name: Download professional model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf harmony_pro_source harmony_pro_model
          mkdir -p harmony_pro_source harmony_pro_model

          gdown 10NTeKyG6JigASVwsekKs3MJl0Ev4Oj29 \
            -O harmony_pro_source/pro_model.zip

          test -s harmony_pro_source/pro_model.zip
          unzip -oq harmony_pro_source/pro_model.zip \
            -d harmony_pro_source/unpacked

          MODEL_PATH="$(find harmony_pro_source/unpacked -type f -name 'model_traced.pt' -print -quit)"
          TOKENIZER_PATH="$(find harmony_pro_source/unpacked -type f -name 'tokenizer.json' -print -quit)"

          test -n "$MODEL_PATH" || { echo "未找到 model_traced.pt"; exit 1; }
          test -n "$TOKENIZER_PATH" || { echo "未找到 tokenizer.json"; exit 1; }

          cp "$MODEL_PATH" harmony_pro_source/model_traced.pt
          cp "$TOKENIZER_PATH" harmony_pro_source/tokenizer.json

          echo "模型大小：$(stat -c '%s' harmony_pro_source/model_traced.pt) bytes"
          echo "词表大小：$(stat -c '%s' harmony_pro_source/tokenizer.json) bytes"

      - name: Recover, export and validate
        id: export
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > recover_professional_v2.py
          import gc
          import hashlib
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch
          from onnxruntime.quantization import QuantType, quantize_dynamic

          SOURCE = Path("harmony_pro_source/model_traced.pt")
          TOKENIZER = Path("harmony_pro_source/tokenizer.json")
          OUTPUT_DIR = Path("harmony_pro_model")
          FLOAT_ONNX = OUTPUT_DIR / "dededi_pro_float_tmp.onnx"
          INT8_ONNX = OUTPUT_DIR / "dededi_pro_fixed_302_int8.onnx"
          VOCAB_OUTPUT = OUTPUT_DIR / "roberta_vocab.json"
          MANIFEST_OUTPUT = OUTPUT_DIR / "model_manifest.json"
          REPORT_OUTPUT = OUTPUT_DIR / "conversion_report.txt"
          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
          REPORT = []

          def log(message=""):
              text = str(message)
              print(text, flush=True)
              REPORT.append(text)

          def save_report():
              REPORT_OUTPUT.write_text("\n".join(REPORT) + "\n", encoding="utf-8")

          def github_output(name, value):
              target = os.environ.get("GITHUB_OUTPUT")
              if target:
                  with open(target, "a", encoding="utf-8") as file:
                      file.write(f"{name}={value}\n")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as file:
                  for block in iter(lambda: file.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def first_tensor(value):
              if torch.is_tensor(value):
                  return value
              if isinstance(value, (tuple, list)):
                  for item in value:
                      try:
                          return first_tensor(item)
                      except TypeError:
                          pass
              if isinstance(value, dict):
                  for item in value.values():
                      try:
                          return first_tensor(item)
                      except TypeError:
                          pass
              raise TypeError(f"模型输出中没有 Tensor：{type(value)!r}")

          def load_vocabulary():
              raw = json.loads(TOKENIZER.read_text(encoding="utf-8"))
              vocabulary = raw.get("model", {}).get("vocab")
              if not isinstance(vocabulary, dict) or not vocabulary:
                  raise ValueError("tokenizer.json 中没有有效 vocab")
              vocabulary = {str(token): int(index) for token, index in vocabulary.items()}
              VOCAB_OUTPUT.write_text(
                  json.dumps(vocabulary, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8"
              )
              ids = {
                  "cls_id": int(vocabulary.get("[CLS]", 101)),
                  "sep_id": int(vocabulary.get("[SEP]", 102)),
                  "mask_id": int(vocabulary.get("[MASK]", 103)),
                  "unk_id": int(vocabulary.get("[UNK]", 100)),
                  "pad_id": int(vocabulary.get("[PAD]", 0)),
                  "de_id": int(vocabulary["的"]),
                  "di_id": int(vocabulary["地"]),
                  "de2_id": int(vocabulary["得"])
              }
              return vocabulary, max(vocabulary.values()) + 1, ids

          def make_inputs(effective_length, vocabulary_size, ids, seed):
              total_length = 302
              if effective_length < 4 or effective_length > total_length:
                  raise ValueError("有效长度必须位于 4 到 302 之间")
              generator = torch.Generator(device="cpu")
              generator.manual_seed(seed)
              input_ids = torch.full((1, total_length), ids["pad_id"], dtype=torch.long)
              attention_mask = torch.zeros((1, total_length), dtype=torch.long)
              token_type_ids = torch.zeros((1, total_length), dtype=torch.long)
              input_ids[0, 0] = ids["cls_id"]
              body_length = effective_length - 2
              input_ids[0, 1:effective_length - 1] = torch.randint(
                  0, vocabulary_size, (body_length,), dtype=torch.long, generator=generator
              )
              input_ids[0, effective_length - 1] = ids["sep_id"]
              attention_mask[0, :effective_length] = 1
              mask_positions = list(range(2, effective_length - 1, 7))
              if not mask_positions:
                  mask_positions = [1]
              for position in mask_positions:
                  input_ids[0, position] = ids["mask_id"]
              return (input_ids, attention_mask, token_type_ids), mask_positions

          def run_torch(model, inputs):
              with torch.inference_mode():
                  return first_tensor(model(*inputs)).detach().cpu().numpy()

          def collect_nodes(block):
              nodes = []
              for node in list(block.nodes()):
                  for sub_block in node.blocks():
                      nodes.extend(collect_nodes(sub_block))
                  nodes.append(node)
              return nodes

          def unpack_linear(packed):
              try:
                  return torch.ops.quantized.linear_unpack(packed)
              except Exception:
                  pass
              for method_name in ("_weight_bias", "__getstate__", "unpack"):
                  try:
                      state = getattr(packed, method_name)()
                      if method_name == "__getstate__" and isinstance(state, tuple) and len(state) == 2:
                          if isinstance(state[0], (tuple, list)):
                              state = state[0]
                      if isinstance(state, (tuple, list)) and len(state) >= 2 and torch.is_tensor(state[0]):
                          return state[0], state[1]
                  except Exception:
                      pass
              raise RuntimeError("无法解包量化线性层")

          def dequantize_graph(module):
              graph = module.graph
              replaced = 0
              schemes = {}
              for node in collect_nodes(graph):
                  if node.kind() not in ("quantized::linear_dynamic", "quantized::linear_relu_dynamic"):
                      continue
                  inputs = list(node.inputs())
                  packed = inputs[1].toIValue()
                  if packed is None:
                      raise RuntimeError("量化线性层的打包参数为空")
                  quantized_weight, bias = unpack_linear(packed)
                  if quantized_weight.is_quantized:
                      scheme = str(quantized_weight.qscheme())
                      weight = quantized_weight.dequantize()
                  else:
                      scheme = "float"
                      weight = quantized_weight.float()
                  schemes[scheme] = schemes.get(scheme, 0) + 1
                  weight = weight.detach().cpu().contiguous()
                  bias = None if bias is None else bias.detach().cpu().float().contiguous()
                  graph.setInsertPoint(node)
                  weight_value = graph.insertConstant(weight)
                  bias_value = graph.insertConstant(bias)
                  linear = graph.create("aten::linear", [inputs[0], weight_value, bias_value], 1)
                  linear.output().setType(node.output().type())
                  linear.insertBefore(node)
                  replacement = linear.output()
                  if node.kind() == "quantized::linear_relu_dynamic":
                      relu = graph.create("aten::relu", [replacement], 1)
                      relu.output().setType(node.output().type())
                      relu.insertBefore(node)
                      replacement = relu.output()
                  node.output().replaceAllUsesWith(replacement)
                  node.destroy()
                  replaced += 1
              if replaced == 0:
                  raise RuntimeError("没有找到 quantized::linear_dynamic")
              torch._C._jit_pass_dce(graph)
              graph.lint()
              remaining = [node.kind() for node in collect_nodes(graph) if node.kind().startswith("quantized::linear")]
              if remaining:
                  raise RuntimeError(f"仍残留量化线性节点：{remaining[:10]}")
              return replaced, schemes

          def softmax3(values):
              values = values.astype(np.float64)
              values = values - np.max(values, axis=-1, keepdims=True)
              exp = np.exp(values)
              return exp / np.sum(exp, axis=-1, keepdims=True)

          def compare_at_masks(title, expected, actual, target_ids, mask_positions):
              if expected.shape != actual.shape:
                  raise RuntimeError(f"{title} 输出形状不同：{expected.shape} != {actual.shape}")
              expected_logits = expected[0, mask_positions][:, target_ids]
              actual_logits = actual[0, mask_positions][:, target_ids]
              expected_prob = softmax3(expected_logits)
              actual_prob = softmax3(actual_logits)
              agreement = float(np.mean(np.argmax(expected_prob, axis=-1) == np.argmax(actual_prob, axis=-1)))
              probability_difference = np.abs(expected_prob - actual_prob)
              statistics = {
                  "mask_count": len(mask_positions),
                  "label_agreement": agreement,
                  "probability_max_error": float(probability_difference.max()),
                  "probability_mean_error": float(probability_difference.mean()),
                  "target_logit_max_error": float(np.abs(expected_logits - actual_logits).max())
              }
              log(
                  f"{title}: masks={statistics['mask_count']}, "
                  f"agreement={agreement:.6f}, "
                  f"prob_max={statistics['probability_max_error']:.12g}, "
                  f"prob_mean={statistics['probability_mean_error']:.12g}, "
                  f"logit_max={statistics['target_logit_max_error']:.12g}"
              )
              return statistics

          def export_float_onnx(model, sample_inputs):
              FLOAT_ONNX.unlink(missing_ok=True)
              torch.onnx.export(
                  model,
                  sample_inputs,
                  str(FLOAT_ONNX),
                  export_params=True,
                  opset_version=13,
                  do_constant_folding=True,
                  input_names=["input_ids", "attention_mask", "token_type_ids"],
                  output_names=["logits"],
                  verbose=False
              )
              if not FLOAT_ONNX.is_file() or FLOAT_ONNX.stat().st_size < 1024:
                  raise RuntimeError("临时浮点 ONNX 没有正确生成")
              onnx.checker.check_model(str(FLOAT_ONNX))
              log(f"临时浮点 ONNX 大小：{FLOAT_ONNX.stat().st_size} bytes")

          def promote_constant_tensors_to_initializers():
              model = onnx.load(str(FLOAT_ONNX))
              graph = model.graph
              initializer_names = {item.name for item in graph.initializer}
              promoted = 0
              removable = []

              for node in graph.node:
                  if node.op_type != "Constant" or len(node.output) != 1:
                      continue

                  tensor_attribute = None
                  for attribute in node.attribute:
                      if (
                          attribute.name == "value"
                          and attribute.type == onnx.AttributeProto.TENSOR
                      ):
                          tensor_attribute = attribute
                          break

                  if tensor_attribute is None:
                      continue

                  output_name = node.output[0]
                  if not output_name:
                      continue

                  if output_name not in initializer_names:
                      tensor = onnx.TensorProto()
                      tensor.CopyFrom(tensor_attribute.t)
                      tensor.name = output_name
                      graph.initializer.append(tensor)
                      initializer_names.add(output_name)

                  removable.append(node)
                  promoted += 1

              for node in removable:
                  graph.node.remove(node)

              if promoted == 0:
                  raise RuntimeError("没有找到可转为 initializer 的 Constant 张量")

              onnx.checker.check_model(model)
              onnx.save_model(model, str(FLOAT_ONNX))
              del model
              gc.collect()

              log(f"已将 {promoted} 个 Constant 张量提升为 initializer")

          def quantize_onnx():
              INT8_ONNX.unlink(missing_ok=True)
              float_size = FLOAT_ONNX.stat().st_size

              quantize_dynamic(
                  model_input=str(FLOAT_ONNX),
                  model_output=str(INT8_ONNX),
                  op_types_to_quantize=["MatMul", "Gemm"],
                  per_channel=False,
                  reduce_range=True,
                  weight_type=QuantType.QInt8,
                  use_external_data_format=False,
                  extra_options={"MatMulConstBOnly": True}
              )

              if not INT8_ONNX.is_file() or INT8_ONNX.stat().st_size < 1024:
                  raise RuntimeError("INT8 ONNX 没有正确生成")

              quantized_model = onnx.load(str(INT8_ONNX))
              operator_counts = {}
              for node in quantized_model.graph.node:
                  operator_counts[node.op_type] = (
                      operator_counts.get(node.op_type, 0) + 1
                  )

              quantized_linear_count = (
                  operator_counts.get("MatMulInteger", 0)
                  + operator_counts.get("QLinearMatMul", 0)
              )

              onnx.checker.check_model(quantized_model)
              del quantized_model
              gc.collect()

              int8_size = INT8_ONNX.stat().st_size
              size_ratio = int8_size / max(1, float_size)

              log(f"INT8 ONNX 大小：{int8_size} bytes")
              log(f"INT8/浮点体积比例：{size_ratio:.4f}")
              log(f"MatMulInteger 数量：{operator_counts.get('MatMulInteger', 0)}")
              log(f"QLinearMatMul 数量：{operator_counts.get('QLinearMatMul', 0)}")
              log(f"DynamicQuantizeLinear 数量：{operator_counts.get('DynamicQuantizeLinear', 0)}")
              log(f"INT8 ONNX SHA-256：{sha256(INT8_ONNX)}")

              if quantized_linear_count < 100:
                  raise RuntimeError(
                      "ONNX 量化没有真正生效："
                      f"量化矩阵乘节点只有 {quantized_linear_count} 个"
                  )

              if size_ratio > 0.70:
                  raise RuntimeError(
                      "ONNX 体积没有明显下降，量化结果异常："
                      f"比例 {size_ratio:.4f}"
                  )

              return quantized_linear_count

          def run_onnx(session, inputs):
              available = {
                  "input_ids": inputs[0].numpy().astype(np.int64),
                  "attention_mask": inputs[1].numpy().astype(np.int64),
                  "token_type_ids": inputs[2].numpy().astype(np.int64)
              }
              feed = {}
              for item in session.get_inputs():
                  if item.name not in available:
                      raise RuntimeError(f"出现未知 ONNX 输入：{item.name}")
                  feed[item.name] = available[item.name]
              outputs = session.run(None, feed)
              if not outputs:
                  raise RuntimeError("ONNX Runtime 没有返回输出")
              return np.asarray(outputs[0])

          def main():
              log("===== Dededi 专业量化模型恢复 V2 =====")
              log(f"Python：{sys.version}")
              log(f"PyTorch：{torch.__version__}")
              log(f"ONNX：{onnx.__version__}")
              log(f"ONNX Runtime：{ort.__version__}")
              log(f"源模型大小：{SOURCE.stat().st_size} bytes")
              log(f"源模型 SHA-256：{sha256(SOURCE)}")

              vocabulary, vocabulary_size, ids = load_vocabulary()
              target_ids = [ids["de_id"], ids["di_id"], ids["de2_id"]]
              log(f"词表项目数：{len(vocabulary)}")
              log(f"词表尺寸：{vocabulary_size}")
              log(f"特殊 ID：{ids}")

              source_model = torch.jit.load(str(SOURCE), map_location="cpu")
              source_model.eval()
              log(f"forward schema：{source_model.forward.schema}")

              cases = {}
              for effective_length in (4, 16, 64, 128, 302):
                  inputs, mask_positions = make_inputs(
                      effective_length, vocabulary_size, ids, 20261100 + effective_length
                  )
                  expected = run_torch(source_model, inputs)
                  if expected.shape != (1, 302, vocabulary_size):
                      raise RuntimeError(f"源模型输出形状异常：{expected.shape}")
                  cases[effective_length] = (inputs, mask_positions, expected)
                  log(f"源模型测试通过：effective={effective_length}, masks={len(mask_positions)}")

              recovered_model = torch.jit.freeze(source_model)
              del source_model
              gc.collect()

              replaced_count, schemes = dequantize_graph(recovered_model)
              log(f"已解包并替换量化 Linear：{replaced_count} 个")
              log(f"原权重量化方案：{schemes}")

              intermediate_statistics = {}
              for length, (inputs, positions, expected) in cases.items():
                  actual = run_torch(recovered_model, inputs)
                  intermediate_statistics[str(length)] = compare_at_masks(
                      f"解包中间模型 effective={length}", expected, actual, target_ids, positions
                  )

              log("解包中间模型只用于导出，偏差不作为失败条件；最终以重新量化后的 ONNX 为准。")
              export_float_onnx(recovered_model, cases[302][0])
              del recovered_model
              gc.collect()

              promote_constant_tensors_to_initializers()
              quantized_linear_count = quantize_onnx()
              FLOAT_ONNX.unlink(missing_ok=True)

              options = ort.SessionOptions()
              options.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL
              session = ort.InferenceSession(
                  str(INT8_ONNX), sess_options=options, providers=["CPUExecutionProvider"]
              )

              final_statistics = {}
              total_correct = 0
              total_masks = 0
              probability_max_error = 0.0
              weighted_probability_error = 0.0

              for length, (inputs, positions, expected) in cases.items():
                  actual = run_onnx(session, inputs)
                  stats = compare_at_masks(
                      f"最终 INT8 ONNX effective={length}",
                      expected,
                      actual,
                      target_ids,
                      positions
                  )
                  final_statistics[str(length)] = stats
                  total_correct += round(
                      stats["label_agreement"] * stats["mask_count"]
                  )
                  total_masks += stats["mask_count"]
                  probability_max_error = max(
                      probability_max_error,
                      stats["probability_max_error"]
                  )
                  weighted_probability_error += (
                      stats["probability_mean_error"]
                      * stats["mask_count"]
                  )

              overall_agreement = total_correct / max(1, total_masks)
              overall_probability_mean_error = (
                  weighted_probability_error / max(1, total_masks)
              )

              log(
                  "最终汇总："
                  f"mask_count={total_masks}, "
                  f"agreement={overall_agreement:.6f}, "
                  f"prob_mean={overall_probability_mean_error:.12g}, "
                  f"prob_max={probability_max_error:.12g}, "
                  f"quantized_linear={quantized_linear_count}"
              )

              if overall_agreement < 0.98:
                  raise RuntimeError(
                      "最终模型的地得判断一致率不足："
                      f"{overall_agreement:.6f}"
                  )

              if overall_probability_mean_error > 0.10:
                  raise RuntimeError(
                      "最终模型平均概率误差过大："
                      f"{overall_probability_mean_error:.12g}"
                  )

              if probability_max_error > 0.20:
                  log(
                      "警告：个别随机掩码位置概率偏差较大，"
                      "但整体一致率与平均误差已通过。"
                  )

              manifest = {
                  "model": "DedediProfessionalBertMaskedLM",
                  "deployment": "fixed_302_dynamic_int8",
                  "source_sha256": sha256(SOURCE),
                  "onnx_sha256": sha256(INT8_ONNX),
                  "vocabulary_size": vocabulary_size,
                  "special_ids": ids,
                  "labels": ["的", "地", "得"],
                  "input_names": [item.name for item in session.get_inputs()],
                  "output_names": [item.name for item in session.get_outputs()],
                  "input_shape": [1, 302],
                  "output_shape": [1, 302, vocabulary_size],
                  "input_dtype": "int64",
                  "output_dtype": "float32",
                  "maximum_source_text_length": 300,
                  "replaced_quantized_linear_count": replaced_count,
                  "source_weight_qschemes": schemes,
                  "intermediate_validation": intermediate_statistics,
                  "final_int8_validation": final_statistics,
                  "overall_mask_label_agreement": overall_agreement,
                  "maximum_mask_probability_error": probability_max_error,
                  "mean_mask_probability_error": overall_probability_mean_error,
                  "quantized_linear_count": quantized_linear_count
              }
              MANIFEST_OUTPUT.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
              )

              github_output("onnx_exported", "true")
              github_output("linear_count", str(replaced_count))
              github_output("agreement", f"{overall_agreement:.6f}")
              github_output("probability_error", f"{probability_max_error:.12g}")
              log("===== 最终结论 =====")
              log("专业模型已恢复为固定 302 长度的 INT8 ONNX，并通过掩码位置一致性验证。")

          try:
              main()
          except Exception as error:
              github_output("onnx_exported", "false")
              log("===== 转换失败 =====")
              log(f"{type(error).__name__}: {error}")
              log(traceback.format_exc())
              raise
          finally:
              try:
                  FLOAT_ONNX.unlink(missing_ok=True)
              except Exception:
                  pass
              save_report()
          PY

          set +e
          python recover_professional_v2.py
          STATUS=$?
          set -e

          if [ -f harmony_pro_model/conversion_report.txt ]; then
            {
              echo "## 专业模型恢复报告 V2"
              echo ""
              echo '```text'
              tail -n 700 harmony_pro_model/conversion_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$STATUS"

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXPORTED="${{ steps.export.outputs.onnx_exported }}"
          LINEAR_COUNT="${{ steps.export.outputs.linear_count }}"
          AGREEMENT="${{ steps.export.outputs.agreement }}"
          PROBABILITY_ERROR="${{ steps.export.outputs.probability_error }}"

          {
            echo ""
            echo "## 最终结果"
            echo ""
            echo "- 专业 INT8 ONNX 已生成：\`${EXPORTED:-false}\`"
            echo "- 解包量化 Linear 数量：\`${LINEAR_COUNT:-unknown}\`"
            echo "- 掩码位置的地得判断一致率：\`${AGREEMENT:-unknown}\`"
            echo "- 掩码位置最大概率误差：\`${PROBABILITY_ERROR:-unknown}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXPORTED" = "true" ]; then
            echo "✅ 专业模型恢复成功，请下载 Dededi-Harmony-Professional-INT8-V2。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 专业模型仍未通过，请查看上方完整报告。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload conversion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Professional-Report
          path: |
            harmony_pro_model/conversion_report.txt
            recover_professional_v2.py
          if-no-files-found: warn
          retention-days: 14

      - name: Upload successful professional model
        if: steps.export.outputs.onnx_exported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Professional-INT8-V3
          path: |
            harmony_pro_model/dededi_pro_fixed_302_int8.onnx
            harmony_pro_model/roberta_vocab.json
            harmony_pro_model/model_manifest.json
            harmony_pro_model/conversion_report.txt
          if-no-files-found: error
          retention-days: 30
