name: Prepare HarmonyOS Professional Model

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/harmony-pro-model.yml"

permissions:
  contents: read

concurrency:
  group: dededi-harmony-pro-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Export Professional Model
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat << 'EOF' > .ci/requirements-harmony-pro.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          gdown==5.2.0
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: .ci/requirements-harmony-pro.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/requirements-harmony-pro.txt

      - name: Download professional model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf harmony_pro_source harmony_pro_model
          mkdir -p harmony_pro_source harmony_pro_model

          gdown 10NTeKyG6JigASVwsekKs3MJl0Ev4Oj29 \
            -O harmony_pro_source/pro_model.zip

          test -s harmony_pro_source/pro_model.zip
          unzip -oq harmony_pro_source/pro_model.zip \
            -d harmony_pro_source/unpacked

          MODEL_PATH="$(find harmony_pro_source/unpacked \
            -type f -name 'model_traced.pt' -print -quit)"

          TOKENIZER_PATH="$(find harmony_pro_source/unpacked \
            -type f -name 'tokenizer.json' -print -quit)"

          test -n "$MODEL_PATH" || {
            echo "未找到 model_traced.pt"
            exit 1
          }

          test -n "$TOKENIZER_PATH" || {
            echo "未找到 tokenizer.json"
            exit 1
          }

          cp "$MODEL_PATH" harmony_pro_source/model_traced.pt
          cp "$TOKENIZER_PATH" harmony_pro_source/tokenizer.json

          echo "模型大小：$(stat -c '%s' harmony_pro_source/model_traced.pt) bytes"
          echo "词表大小：$(stat -c '%s' harmony_pro_source/tokenizer.json) bytes"

      - name: Inspect, export and validate ONNX
        id: export
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > export_professional_model.py
          import hashlib
          import inspect
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch
          import torch.nn as nn


          SOURCE_MODEL = Path("harmony_pro_source/model_traced.pt")
          TOKENIZER = Path("harmony_pro_source/tokenizer.json")
          OUTPUT_DIR = Path("harmony_pro_model")
          DYNAMIC_ONNX = OUTPUT_DIR / "dededi_pro_dynamic.onnx"
          FIXED_ONNX = OUTPUT_DIR / "dededi_pro_fixed_302.onnx"
          VOCAB_OUTPUT = OUTPUT_DIR / "roberta_vocab.json"
          MANIFEST_OUTPUT = OUTPUT_DIR / "model_manifest.json"
          REPORT_OUTPUT = OUTPUT_DIR / "conversion_report.txt"

          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
          report = []


          def log(message=""):
              text = str(message)
              print(text, flush=True)
              report.append(text)


          def save_report():
              REPORT_OUTPUT.write_text(
                  "\n".join(report) + "\n",
                  encoding="utf-8"
              )


          def set_output(name, value):
              output_file = os.environ.get("GITHUB_OUTPUT")
              if not output_file:
                  return

              with open(output_file, "a", encoding="utf-8") as file:
                  file.write(f"{name}={value}\n")


          def sha256(path):
              digest = hashlib.sha256()

              with path.open("rb") as file:
                  while True:
                      block = file.read(1024 * 1024)

                      if not block:
                          break

                      digest.update(block)

              return digest.hexdigest()


          def first_tensor(value):
              if torch.is_tensor(value):
                  return value

              if isinstance(value, (tuple, list)):
                  for item in value:
                      if torch.is_tensor(item):
                          return item

              if isinstance(value, dict):
                  for item in value.values():
                      if torch.is_tensor(item):
                          return item

              raise TypeError(
                  "专业模型输出中没有找到 Tensor，"
                  f"实际类型为 {type(value)!r}"
              )


          class ProfessionalWrapper(nn.Module):
              def __init__(self, module):
                  super().__init__()
                  self.module = module

              def forward(
                  self,
                  input_ids,
                  attention_mask,
                  token_type_ids
              ):
                  output = self.module(
                      input_ids,
                      attention_mask,
                      token_type_ids
                  )

                  return first_tensor(output)


          def load_vocab():
              raw = json.loads(
                  TOKENIZER.read_text(encoding="utf-8")
              )

              model = raw.get("model")

              if not isinstance(model, dict):
                  raise ValueError(
                      "tokenizer.json 缺少 model"
                  )

              vocabulary = model.get("vocab")

              if (
                  not isinstance(vocabulary, dict)
                  or not vocabulary
              ):
                  raise ValueError(
                      "tokenizer.json 缺少有效 vocab"
                  )

              clean = {
                  str(token): int(index)
                  for token, index in vocabulary.items()
              }

              VOCAB_OUTPUT.write_text(
                  json.dumps(
                      clean,
                      ensure_ascii=False,
                      separators=(",", ":")
                  ),
                  encoding="utf-8"
              )

              vocabulary_size = max(clean.values()) + 1

              special_ids = {
                  "cls_id": int(
                      clean.get("[CLS]", 101)
                  ),
                  "sep_id": int(
                      clean.get("[SEP]", 102)
                  ),
                  "mask_id": int(
                      clean.get("[MASK]", 103)
                  ),
                  "unk_id": int(
                      clean.get("[UNK]", 100)
                  ),
                  "pad_id": int(
                      clean.get("[PAD]", 0)
                  ),
                  "de_id": int(
                      clean.get("的", 0)
                  ),
                  "di_id": int(
                      clean.get("地", 0)
                  ),
                  "de2_id": int(
                      clean.get("得", 0)
                  )
              }

              log(
                  f"词表项目数：{len(clean)}"
              )

              log(
                  f"词表尺寸：{vocabulary_size}"
              )

              log(
                  f"特殊 ID：{special_ids}"
              )

              return (
                  clean,
                  vocabulary_size,
                  special_ids
              )


          def make_inputs(
              sequence_length,
              vocabulary_size,
              special_ids,
              seed,
              padded_length=None
          ):
              if sequence_length < 2:
                  raise ValueError(
                      "序列长度至少为 2"
                  )

              total_length = (
                  padded_length
                  if padded_length is not None
                  else sequence_length
              )

              if total_length < sequence_length:
                  raise ValueError(
                      "填充长度不能小于有效长度"
                  )

              generator = torch.Generator(
                  device="cpu"
              )

              generator.manual_seed(seed)

              input_ids = torch.full(
                  (1, total_length),
                  special_ids["pad_id"],
                  dtype=torch.long
              )

              random_body = torch.randint(
                  low=0,
                  high=vocabulary_size,
                  size=(
                      1,
                      max(0, sequence_length - 2)
                  ),
                  dtype=torch.long,
                  generator=generator
              )

              input_ids[0, 0] = (
                  special_ids["cls_id"]
              )

              if sequence_length > 2:
                  input_ids[
                      0,
                      1:sequence_length - 1
                  ] = random_body

              input_ids[
                  0,
                  sequence_length - 1
              ] = special_ids["sep_id"]

              attention_mask = torch.zeros(
                  (1, total_length),
                  dtype=torch.long
              )

              attention_mask[
                  :,
                  :sequence_length
              ] = 1

              token_type_ids = torch.zeros(
                  (1, total_length),
                  dtype=torch.long
              )

              return (
                  input_ids,
                  attention_mask,
                  token_type_ids
              )


          def run_torch(wrapper, inputs):
              with torch.inference_mode():
                  return (
                      wrapper(*inputs)
                      .detach()
                      .cpu()
                      .numpy()
                  )


          def export_onnx(
              wrapper,
              inputs,
              output_path,
              dynamic
          ):
              dynamic_axes = None

              if dynamic:
                  dynamic_axes = {
                      "input_ids": {
                          0: "batch",
                          1: "sequence"
                      },
                      "attention_mask": {
                          0: "batch",
                          1: "sequence"
                      },
                      "token_type_ids": {
                          0: "batch",
                          1: "sequence"
                      },
                      "logits": {
                          0: "batch",
                          1: "sequence"
                      }
                  }

              torch.onnx.export(
                  wrapper,
                  inputs,
                  str(output_path),
                  export_params=True,
                  opset_version=13,
                  do_constant_folding=True,
                  input_names=[
                      "input_ids",
                      "attention_mask",
                      "token_type_ids"
                  ],
                  output_names=[
                      "logits"
                  ],
                  dynamic_axes=dynamic_axes,
                  verbose=False
              )

              if (
                  not output_path.is_file()
                  or output_path.stat().st_size < 1024
              ):
                  raise RuntimeError(
                      f"{output_path.name} 没有正确生成"
                  )

              model = onnx.load(
                  str(output_path)
              )

              onnx.checker.check_model(
                  model
              )

              log(
                  f"{output_path.name} 导出成功，"
                  f"大小 {output_path.stat().st_size} bytes"
              )

              log(
                  f"{output_path.name} SHA-256："
                  f"{sha256(output_path)}"
              )

              operator_counts = {}

              for node in model.graph.node:
                  operator_counts[node.op_type] = (
                      operator_counts.get(
                          node.op_type,
                          0
                      ) + 1
                  )

              log(
                  f"{output_path.name} 算子统计："
              )

              for name in sorted(
                  operator_counts
              ):
                  log(
                      f"  {name}: "
                      f"{operator_counts[name]}"
                  )


          def create_session(path):
              return ort.InferenceSession(
                  str(path),
                  providers=[
                      "CPUExecutionProvider"
                  ]
              )


          def run_onnx(session, inputs):
              available = {
                  "input_ids":
                      inputs[0]
                      .cpu()
                      .numpy()
                      .astype(np.int64),
                  "attention_mask":
                      inputs[1]
                      .cpu()
                      .numpy()
                      .astype(np.int64),
                  "token_type_ids":
                      inputs[2]
                      .cpu()
                      .numpy()
                      .astype(np.int64)
              }

              metadata = session.get_inputs()
              feed = {}

              for item in metadata:
                  if item.name not in available:
                      raise RuntimeError(
                          "出现未知 ONNX 输入："
                          f"{item.name}"
                      )

                  feed[item.name] = (
                      available[item.name]
                  )

              outputs = session.run(
                  None,
                  feed
              )

              if not outputs:
                  raise RuntimeError(
                      "ONNX 没有返回输出"
                  )

              return np.asarray(outputs[0])


          def compare_outputs(
              name,
              expected,
              actual
          ):
              if expected.shape != actual.shape:
                  raise RuntimeError(
                      f"{name} 输出形状不一致："
                      f"{expected.shape} != "
                      f"{actual.shape}"
                  )

              difference = np.abs(
                  expected.astype(np.float64)
                  - actual.astype(np.float64)
              )

              maximum = float(
                  np.max(difference)
              )

              mean = float(
                  np.mean(difference)
              )

              log(
                  f"{name}："
                  f"max_error={maximum:.12g}，"
                  f"mean_error={mean:.12g}"
              )

              if not np.allclose(
                  expected,
                  actual,
                  rtol=1e-4,
                  atol=3e-5
              ):
                  raise RuntimeError(
                      f"{name} 误差超过容许范围"
                  )

              return maximum


          def main():
              log(
                  "===== Dededi 专业模型鸿蒙转换 ====="
              )

              log(
                  f"Python：{sys.version}"
              )

              log(
                  f"PyTorch：{torch.__version__}"
              )

              log(
                  f"ONNX：{onnx.__version__}"
              )

              log(
                  "ONNX Runtime："
                  f"{ort.__version__}"
              )

              log(
                  "源模型大小："
                  f"{SOURCE_MODEL.stat().st_size} bytes"
              )

              log(
                  "源模型 SHA-256："
                  f"{sha256(SOURCE_MODEL)}"
              )

              (
                  _,
                  vocabulary_size,
                  special_ids
              ) = load_vocab()

              model = torch.jit.load(
                  str(SOURCE_MODEL),
                  map_location="cpu"
              )

              model.eval()

              log(
                  f"模型类型：{type(model)!r}"
              )

              try:
                  log(
                      "forward schema："
                      f"{model.forward.schema}"
                  )
              except Exception as error:
                  log(
                      "无法读取 forward schema："
                      f"{error}"
                  )

              try:
                  log(
                      "forward 签名："
                      f"{inspect.signature(model.forward)}"
                  )
              except Exception as error:
                  log(
                      "无法读取 forward 签名："
                      f"{error}"
                  )

              wrapper = ProfessionalWrapper(
                  model
              )

              wrapper.eval()

              probe_inputs = make_inputs(
                  sequence_length=16,
                  vocabulary_size=vocabulary_size,
                  special_ids=special_ids,
                  seed=20260720
              )

              probe_output = run_torch(
                  wrapper,
                  probe_inputs
              )

              if probe_output.ndim != 3:
                  raise RuntimeError(
                      "专业模型输出预期为三维，"
                      f"实际为 {probe_output.shape}"
                  )

              if probe_output.shape[0] != 1:
                  raise RuntimeError(
                      "专业模型 batch 维异常"
                  )

              if probe_output.shape[1] != 16:
                  raise RuntimeError(
                      "专业模型 sequence 维异常"
                  )

              if (
                  probe_output.shape[2]
                  != vocabulary_size
              ):
                  raise RuntimeError(
                      "专业模型输出词表维"
                      "与 tokenizer 不一致："
                      f"{probe_output.shape[2]} != "
                      f"{vocabulary_size}"
                  )

              log(
                  "PyTorch 探测输出："
                  f"{probe_output.shape}"
              )

              export_onnx(
                  wrapper,
                  probe_inputs,
                  DYNAMIC_ONNX,
                  dynamic=True
              )

              fixed_inputs = make_inputs(
                  sequence_length=302,
                  vocabulary_size=vocabulary_size,
                  special_ids=special_ids,
                  seed=20260721,
                  padded_length=302
              )

              export_onnx(
                  wrapper,
                  fixed_inputs,
                  FIXED_ONNX,
                  dynamic=False
              )

              dynamic_session = (
                  create_session(
                      DYNAMIC_ONNX
                  )
              )

              fixed_session = (
                  create_session(
                      FIXED_ONNX
                  )
              )

              dynamic_max_error = 0.0
              fixed_max_error = 0.0
              padded_equivalence_error = 0.0

              for sequence_length in (
                  4,
                  8,
                  16,
                  64,
                  128,
                  302
              ):
                  exact_inputs = make_inputs(
                      sequence_length=sequence_length,
                      vocabulary_size=vocabulary_size,
                      special_ids=special_ids,
                      seed=(
                          20260800
                          + sequence_length
                      )
                  )

                  torch_exact = run_torch(
                      wrapper,
                      exact_inputs
                  )

                  onnx_dynamic = run_onnx(
                      dynamic_session,
                      exact_inputs
                  )

                  dynamic_error = compare_outputs(
                      "动态 ONNX "
                      f"sequence={sequence_length}",
                      torch_exact,
                      onnx_dynamic
                  )

                  dynamic_max_error = max(
                      dynamic_max_error,
                      dynamic_error
                  )

                  padded_inputs = make_inputs(
                      sequence_length=sequence_length,
                      vocabulary_size=vocabulary_size,
                      special_ids=special_ids,
                      seed=(
                          20260800
                          + sequence_length
                      ),
                      padded_length=302
                  )

                  torch_padded = run_torch(
                      wrapper,
                      padded_inputs
                  )

                  onnx_fixed = run_onnx(
                      fixed_session,
                      padded_inputs
                  )

                  fixed_error = compare_outputs(
                      "固定 ONNX "
                      f"sequence={sequence_length}",
                      torch_padded,
                      onnx_fixed
                  )

                  fixed_max_error = max(
                      fixed_max_error,
                      fixed_error
                  )

                  valid_exact = (
                      torch_exact[
                          :,
                          :sequence_length,
                          :
                      ]
                  )

                  valid_padded = (
                      torch_padded[
                          :,
                          :sequence_length,
                          :
                      ]
                  )

                  padding_error = compare_outputs(
                      "填充等价 "
                      f"sequence={sequence_length}",
                      valid_exact,
                      valid_padded
                  )

                  padded_equivalence_error = max(
                      padded_equivalence_error,
                      padding_error
                  )

              dynamic_input_names = [
                  item.name
                  for item in (
                      dynamic_session.get_inputs()
                  )
              ]

              fixed_input_names = [
                  item.name
                  for item in (
                      fixed_session.get_inputs()
                  )
              ]

              manifest = {
                  "model":
                      "DedediProfessionalRoBERTa",
                  "dynamic_input_names":
                      dynamic_input_names,
                  "fixed_input_names":
                      fixed_input_names,
                  "input_dtype":
                      "int64",
                  "dynamic_input_shape": [
                      1,
                      "sequence"
                  ],
                  "fixed_input_shape": [
                      1,
                      302
                  ],
                  "output_name":
                      "logits",
                  "output_dtype":
                      "float32",
                  "output_shape": [
                      1,
                      "sequence",
                      vocabulary_size
                  ],
                  "vocabulary_size":
                      vocabulary_size,
                  "max_source_text_length":
                      300,
                  "max_model_sequence_length":
                      302,
                  "special_ids":
                      special_ids,
                  "dynamic_onnx_sha256":
                      sha256(DYNAMIC_ONNX),
                  "fixed_onnx_sha256":
                      sha256(FIXED_ONNX),
                  "dynamic_max_error":
                      dynamic_max_error,
                  "fixed_max_error":
                      fixed_max_error,
                  "padded_equivalence_max_error":
                      padded_equivalence_error
              }

              MANIFEST_OUTPUT.write_text(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              set_output(
                  "onnx_exported",
                  "true"
              )

              set_output(
                  "dynamic_max_error",
                  f"{dynamic_max_error:.12g}"
              )

              set_output(
                  "fixed_max_error",
                  f"{fixed_max_error:.12g}"
              )

              set_output(
                  "padding_max_error",
                  f"{padded_equivalence_error:.12g}"
              )

              log("")
              log(
                  "===== 最终结论 ====="
              )
              log(
                  "专业模型动态 ONNX "
                  "已导出并验证。"
              )
              log(
                  "专业模型固定 302 长度 "
                  "ONNX 已导出并验证。"
              )
              log(
                  "固定长度填充与原始动态长度"
                  "结果已完成对比。"
              )


          try:
              main()

          except Exception as error:
              set_output(
                  "onnx_exported",
                  "false"
              )

              log("")
              log(
                  "===== 转换失败 ====="
              )

              log(
                  f"{type(error).__name__}: "
                  f"{error}"
              )

              log(
                  traceback.format_exc()
              )

              raise

          finally:
              save_report()
          PY

          set +e
          python export_professional_model.py
          STATUS=$?
          set -e

          if [ -f harmony_pro_model/conversion_report.txt ]; then
            {
              echo "## 专业模型转换报告"
              echo ""
              echo '```text'
              tail -n 500 harmony_pro_model/conversion_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$STATUS"

      - name: Download official MindSpore Lite converter
        id: converter
        if: steps.export.outputs.onnx_exported == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="mindspore-lite-2.7.0-linux-x64.tar.gz"
          URL="https://ms-release.obs.cn-north-4.myhuaweicloud.com/2.7.0/MindSpore/lite/release/linux/x86_64/${PACKAGE}"
          EXPECTED_SHA256="8bb1097100c9fec12675670ba2d4264a2cd6da3a9be093eb56631d00fc0c455b"

          rm -rf mindspore_lite_package
          mkdir -p mindspore_lite_package

          curl -fL \
            --retry 3 \
            --retry-delay 3 \
            "$URL" \
            -o "mindspore_lite_package/$PACKAGE"

          echo "$EXPECTED_SHA256  mindspore_lite_package/$PACKAGE" \
            | sha256sum -c -

          tar -xzf \
            "mindspore_lite_package/$PACKAGE" \
            -C mindspore_lite_package

          CONVERTER="$(find mindspore_lite_package \
            -type f \
            -name converter_lite \
            -perm -u+x \
            -print -quit)"

          test -n "$CONVERTER" || {
            echo "官方发布包内没有找到 converter_lite"
            exit 1
          }

          CONVERTER_DIR="$(dirname "$CONVERTER")"
          CONVERTER_BASE="$(dirname "$CONVERTER_DIR")"
          LIB_DIR="$CONVERTER_BASE/lib"

          test -d "$LIB_DIR" || {
            echo "没有找到 converter 所需动态库目录：$LIB_DIR"
            exit 1
          }

          echo "converter_path=$CONVERTER" \
            >> "$GITHUB_OUTPUT"

          echo "library_path=$LIB_DIR" \
            >> "$GITHUB_OUTPUT"

      - name: Convert ONNX models to MindSpore Lite
        id: mindspore
        if: steps.converter.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CONVERTER: ${{ steps.converter.outputs.converter_path }}
          CONVERTER_LIB: ${{ steps.converter.outputs.library_path }}
        run: |
          set -o pipefail

          export LD_LIBRARY_PATH="$CONVERTER_LIB:${LD_LIBRARY_PATH:-}"

          REPORT="harmony_pro_model/mindspore_report.txt"

          {
            echo "===== MindSpore Lite 转换 ====="
            "$CONVERTER" --version || true
          } | tee "$REPORT"

          set +e

          "$CONVERTER" \
            --fmk=ONNX \
            --modelFile=harmony_pro_model/dededi_pro_dynamic.onnx \
            --outputFile=harmony_pro_model/dededi_pro_dynamic \
            2>&1 | tee -a "$REPORT"

          DYNAMIC_STATUS=${PIPESTATUS[0]}

          "$CONVERTER" \
            --fmk=ONNX \
            --modelFile=harmony_pro_model/dededi_pro_fixed_302.onnx \
            --outputFile=harmony_pro_model/dededi_pro_fixed_302 \
            2>&1 | tee -a "$REPORT"

          FIXED_STATUS=${PIPESTATUS[0]}

          set -e

          DYNAMIC_OK=false
          FIXED_OK=false

          test "$DYNAMIC_STATUS" -eq 0 \
            && test -s harmony_pro_model/dededi_pro_dynamic.ms \
            && DYNAMIC_OK=true

          test "$FIXED_STATUS" -eq 0 \
            && test -s harmony_pro_model/dededi_pro_fixed_302.ms \
            && FIXED_OK=true

          echo "dynamic_ms=$DYNAMIC_OK" \
            >> "$GITHUB_OUTPUT"

          echo "fixed_ms=$FIXED_OK" \
            >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### MindSpore Lite 转换结果"
            echo ""
            echo "- 动态模型：\`$DYNAMIC_OK\`"
            echo "- 固定 302 模型：\`$FIXED_OK\`"
            echo ""
            echo '```text'
            tail -n 300 "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          ONNX="${{ steps.export.outputs.onnx_exported }}"
          DYNAMIC_MS="${{ steps.mindspore.outputs.dynamic_ms }}"
          FIXED_MS="${{ steps.mindspore.outputs.fixed_ms }}"
          DYNAMIC_ERROR="${{ steps.export.outputs.dynamic_max_error }}"
          FIXED_ERROR="${{ steps.export.outputs.fixed_max_error }}"
          PADDING_ERROR="${{ steps.export.outputs.padding_max_error }}"

          {
            echo ""
            echo "## 最终结果"
            echo ""
            echo "- 专业模型 ONNX 已导出：\`${ONNX:-false}\`"
            echo "- 动态 MindSpore Lite 已生成：\`${DYNAMIC_MS:-false}\`"
            echo "- 固定 302 MindSpore Lite 已生成：\`${FIXED_MS:-false}\`"
            echo "- 动态 ONNX 最大误差：\`${DYNAMIC_ERROR:-unknown}\`"
            echo "- 固定 ONNX 最大误差：\`${FIXED_ERROR:-unknown}\`"
            echo "- 填充等价最大误差：\`${PADDING_ERROR:-unknown}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ONNX" = "true" ]; then
            {
              echo "✅ 专业模型 ONNX 转换与一致性验证成功。"
              echo ""
              echo "请下载 Artifact："
              echo "\`Dededi-Harmony-Professional-Model\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 专业模型导出失败，请查看上方报告。" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload professional model package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Professional-Model
          path: |
            harmony_pro_model/**
            export_professional_model.py
          if-no-files-found: warn
          retention-days: 30
