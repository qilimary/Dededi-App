name: Prepare HarmonyOS Professional Model

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/harmony-pro-model.yml"

permissions:
  contents: read

concurrency:
  group: dededi-harmony-pro-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Export Professional Model
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci

          cat << 'EOF' > .ci/requirements-harmony-pro.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          gdown==5.2.0
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: .ci/requirements-harmony-pro.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/requirements-harmony-pro.txt

      - name: Download professional model
        shell: bash
        run: |
          set -euo pipefail

          rm -rf harmony_pro_source harmony_pro_model
          mkdir -p harmony_pro_source
          mkdir -p harmony_pro_model

          gdown 10NTeKyG6JigASVwsekKs3MJl0Ev4Oj29 \
            -O harmony_pro_source/pro_model.zip

          test -s harmony_pro_source/pro_model.zip || {
            echo "专业模型压缩包下载失败或为空"
            exit 1
          }

          unzip -oq \
            harmony_pro_source/pro_model.zip \
            -d harmony_pro_source/unpacked

          MODEL_PATH="$(find harmony_pro_source/unpacked \
            -type f \
            -name 'model_traced.pt' \
            -print \
            -quit)"

          TOKENIZER_PATH="$(find harmony_pro_source/unpacked \
            -type f \
            -name 'tokenizer.json' \
            -print \
            -quit)"

          test -n "$MODEL_PATH" || {
            echo "没有找到 model_traced.pt"
            exit 1
          }

          test -n "$TOKENIZER_PATH" || {
            echo "没有找到 tokenizer.json"
            exit 1
          }

          cp "$MODEL_PATH" \
            harmony_pro_source/model_traced.pt

          cp "$TOKENIZER_PATH" \
            harmony_pro_source/tokenizer.json

          echo "模型路径：$MODEL_PATH"
          echo "词表路径：$TOKENIZER_PATH"
          echo "模型大小：$(stat -c '%s' harmony_pro_source/model_traced.pt) bytes"
          echo "词表大小：$(stat -c '%s' harmony_pro_source/tokenizer.json) bytes"

      - name: Export and validate professional model
        id: export
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > export_professional_model.py
          import gc
          import hashlib
          import json
          import os
          import sys
          import traceback
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch


          SOURCE_MODEL = Path(
              "harmony_pro_source/model_traced.pt"
          )

          TOKENIZER_FILE = Path(
              "harmony_pro_source/tokenizer.json"
          )

          OUTPUT_DIR = Path(
              "harmony_pro_model"
          )

          DYNAMIC_ONNX = OUTPUT_DIR / (
              "dededi_pro_dynamic.onnx"
          )

          FIXED_ONNX = OUTPUT_DIR / (
              "dededi_pro_fixed_302.onnx"
          )

          VOCAB_OUTPUT = OUTPUT_DIR / (
              "roberta_vocab.json"
          )

          MANIFEST_OUTPUT = OUTPUT_DIR / (
              "model_manifest.json"
          )

          REPORT_OUTPUT = OUTPUT_DIR / (
              "conversion_report.txt"
          )

          OUTPUT_DIR.mkdir(
              parents=True,
              exist_ok=True
          )

          REPORT_LINES = []


          def log(message=""):
              text = str(message)
              print(text, flush=True)
              REPORT_LINES.append(text)


          def save_report():
              REPORT_OUTPUT.write_text(
                  "\n".join(REPORT_LINES) + "\n",
                  encoding="utf-8"
              )


          def github_output(name, value):
              target = os.environ.get(
                  "GITHUB_OUTPUT"
              )

              if not target:
                  return

              with open(
                  target,
                  "a",
                  encoding="utf-8"
              ) as file:
                  file.write(
                      f"{name}={value}\n"
                  )


          def sha256(path):
              digest = hashlib.sha256()

              with path.open("rb") as file:
                  while True:
                      block = file.read(
                          1024 * 1024
                      )

                      if not block:
                          break

                      digest.update(block)

              return digest.hexdigest()


          def first_tensor(value):
              if torch.is_tensor(value):
                  return value

              if isinstance(
                  value,
                  (tuple, list)
              ):
                  for item in value:
                      try:
                          return first_tensor(item)
                      except TypeError:
                          continue

              if isinstance(value, dict):
                  for item in value.values():
                      try:
                          return first_tensor(item)
                      except TypeError:
                          continue

              raise TypeError(
                  "模型输出中没有找到 Tensor，"
                  f"实际输出类型：{type(value)!r}"
              )


          def load_vocabulary():
              raw = json.loads(
                  TOKENIZER_FILE.read_text(
                      encoding="utf-8"
                  )
              )

              tokenizer_model = raw.get(
                  "model"
              )

              if not isinstance(
                  tokenizer_model,
                  dict
              ):
                  raise ValueError(
                      "tokenizer.json 缺少 model"
                  )

              raw_vocabulary = (
                  tokenizer_model.get("vocab")
              )

              if (
                  not isinstance(
                      raw_vocabulary,
                      dict
                  )
                  or not raw_vocabulary
              ):
                  raise ValueError(
                      "tokenizer.json 缺少有效 vocab"
                  )

              vocabulary = {
                  str(token): int(index)
                  for token, index
                  in raw_vocabulary.items()
              }

              VOCAB_OUTPUT.write_text(
                  json.dumps(
                      vocabulary,
                      ensure_ascii=False,
                      separators=(",", ":")
                  ),
                  encoding="utf-8"
              )

              vocabulary_size = (
                  max(vocabulary.values()) + 1
              )

              special_ids = {
                  "cls_id": int(
                      vocabulary.get(
                          "[CLS]",
                          101
                      )
                  ),
                  "sep_id": int(
                      vocabulary.get(
                          "[SEP]",
                          102
                      )
                  ),
                  "mask_id": int(
                      vocabulary.get(
                          "[MASK]",
                          103
                      )
                  ),
                  "unk_id": int(
                      vocabulary.get(
                          "[UNK]",
                          100
                      )
                  ),
                  "pad_id": int(
                      vocabulary.get(
                          "[PAD]",
                          0
                      )
                  ),
                  "de_id": int(
                      vocabulary.get(
                          "的",
                          0
                      )
                  ),
                  "di_id": int(
                      vocabulary.get(
                          "地",
                          0
                      )
                  ),
                  "de2_id": int(
                      vocabulary.get(
                          "得",
                          0
                      )
                  )
              }

              log(
                  f"词表项目数："
                  f"{len(vocabulary)}"
              )

              log(
                  f"词表尺寸："
                  f"{vocabulary_size}"
              )

              log(
                  f"特殊 ID："
                  f"{special_ids}"
              )

              return (
                  vocabulary,
                  vocabulary_size,
                  special_ids
              )


          def make_inputs(
              effective_length,
              vocabulary_size,
              special_ids,
              seed,
              total_length=None
          ):
              if effective_length < 2:
                  raise ValueError(
                      "有效序列长度不能小于 2"
                  )

              if total_length is None:
                  total_length = effective_length

              if total_length < effective_length:
                  raise ValueError(
                      "总长度不能小于有效长度"
                  )

              generator = torch.Generator(
                  device="cpu"
              )

              generator.manual_seed(seed)

              input_ids = torch.full(
                  (1, total_length),
                  special_ids["pad_id"],
                  dtype=torch.long
              )

              attention_mask = torch.zeros(
                  (1, total_length),
                  dtype=torch.long
              )

              token_type_ids = torch.zeros(
                  (1, total_length),
                  dtype=torch.long
              )

              input_ids[0, 0] = (
                  special_ids["cls_id"]
              )

              body_length = max(
                  0,
                  effective_length - 2
              )

              if body_length > 0:
                  body = torch.randint(
                      low=0,
                      high=vocabulary_size,
                      size=(1, body_length),
                      dtype=torch.long,
                      generator=generator
                  )

                  input_ids[
                      0,
                      1:effective_length - 1
                  ] = body

              input_ids[
                  0,
                  effective_length - 1
              ] = special_ids["sep_id"]

              attention_mask[
                  0,
                  :effective_length
              ] = 1

              return (
                  input_ids,
                  attention_mask,
                  token_type_ids
              )


          def run_pytorch(
              model,
              model_inputs
          ):
              with torch.inference_mode():
                  output = model(
                      *model_inputs
                  )

                  tensor = first_tensor(
                      output
                  )

                  return (
                      tensor
                      .detach()
                      .cpu()
                      .numpy()
                  )


          def remove_if_exists(path):
              try:
                  path.unlink(
                      missing_ok=True
                  )
              except TypeError:
                  if path.exists():
                      path.unlink()


          def export_onnx_once(
              module,
              model_inputs,
              output_path,
              dynamic
          ):
              dynamic_axes = None

              if dynamic:
                  dynamic_axes = {
                      "input_ids": {
                          0: "batch",
                          1: "sequence"
                      },
                      "attention_mask": {
                          0: "batch",
                          1: "sequence"
                      },
                      "token_type_ids": {
                          0: "batch",
                          1: "sequence"
                      },
                      "logits": {
                          0: "batch",
                          1: "sequence"
                      }
                  }

              torch.onnx.export(
                  module,
                  model_inputs,
                  str(output_path),
                  export_params=True,
                  opset_version=13,
                  do_constant_folding=True,
                  input_names=[
                      "input_ids",
                      "attention_mask",
                      "token_type_ids"
                  ],
                  output_names=[
                      "logits"
                  ],
                  dynamic_axes=dynamic_axes,
                  verbose=False
              )


          def export_onnx(
              original_model,
              model_inputs,
              output_path,
              dynamic
          ):
              remove_if_exists(
                  output_path
              )

              candidates = [
                  (
                      "原始 TorchScript",
                      original_model
                  )
              ]

              try:
                  frozen_model = (
                      torch.jit.freeze(
                          original_model.eval()
                      )
                  )

                  candidates.insert(
                      0,
                      (
                          "冻结后的 TorchScript",
                          frozen_model
                      )
                  )
              except Exception as error:
                  log(
                      "TorchScript freeze 失败，"
                      "将使用原始模型："
                      f"{type(error).__name__}: "
                      f"{error}"
                  )

              failures = []

              for (
                  candidate_name,
                  candidate_model
              ) in candidates:
                  remove_if_exists(
                      output_path
                  )

                  try:
                      log(
                          f"正在使用"
                          f"{candidate_name}"
                          f"导出 "
                          f"{output_path.name}"
                      )

                      export_onnx_once(
                          candidate_model,
                          model_inputs,
                          output_path,
                          dynamic
                      )

                      if (
                          not output_path.is_file()
                          or output_path.stat().st_size
                          < 1024
                      ):
                          raise RuntimeError(
                              "导出的 ONNX "
                              "文件为空或异常"
                          )

                      onnx_model = onnx.load(
                          str(output_path)
                      )

                      onnx.checker.check_model(
                          onnx_model
                      )

                      log(
                          f"{output_path.name} "
                          f"导出成功"
                      )

                      log(
                          f"{output_path.name} "
                          f"大小："
                          f"{output_path.stat().st_size} "
                          f"bytes"
                      )

                      log(
                          f"{output_path.name} "
                          f"SHA-256："
                          f"{sha256(output_path)}"
                      )

                      operator_counts = {}

                      for node in (
                          onnx_model.graph.node
                      ):
                          operator_counts[
                              node.op_type
                          ] = (
                              operator_counts.get(
                                  node.op_type,
                                  0
                              ) + 1
                          )

                      log(
                          f"{output_path.name} "
                          "算子统计："
                      )

                      for operator_name in sorted(
                          operator_counts
                      ):
                          log(
                              f"  {operator_name}: "
                              f"{operator_counts[operator_name]}"
                          )

                      return candidate_name

                  except Exception as error:
                      failure = (
                          f"{candidate_name}："
                          f"{type(error).__name__}: "
                          f"{error}"
                      )

                      failures.append(
                          failure
                      )

                      log(
                          "导出尝试失败："
                          f"{failure}"
                      )

                      log(
                          traceback.format_exc()
                      )

              raise RuntimeError(
                  f"{output_path.name} "
                  "所有导出方式均失败："
                  + "；".join(failures)
              )


          def create_session(path):
              options = (
                  ort.SessionOptions()
              )

              options.graph_optimization_level = (
                  ort.GraphOptimizationLevel
                  .ORT_ENABLE_ALL
              )

              return ort.InferenceSession(
                  str(path),
                  sess_options=options,
                  providers=[
                      "CPUExecutionProvider"
                  ]
              )


          def run_onnx(
              session,
              model_inputs
          ):
              available_inputs = {
                  "input_ids": (
                      model_inputs[0]
                      .detach()
                      .cpu()
                      .numpy()
                      .astype(np.int64)
                  ),
                  "attention_mask": (
                      model_inputs[1]
                      .detach()
                      .cpu()
                      .numpy()
                      .astype(np.int64)
                  ),
                  "token_type_ids": (
                      model_inputs[2]
                      .detach()
                      .cpu()
                      .numpy()
                      .astype(np.int64)
                  )
              }

              feed = {}

              for metadata in (
                  session.get_inputs()
              ):
                  if (
                      metadata.name
                      not in available_inputs
                  ):
                      raise RuntimeError(
                          "ONNX 出现未知输入："
                          f"{metadata.name}"
                      )

                  feed[metadata.name] = (
                      available_inputs[
                          metadata.name
                      ]
                  )

              outputs = session.run(
                  None,
                  feed
              )

              if not outputs:
                  raise RuntimeError(
                      "ONNX Runtime "
                      "没有返回输出"
                  )

              return np.asarray(
                  outputs[0]
              )


          def compare_outputs(
              title,
              expected,
              actual
          ):
              if (
                  expected.shape
                  != actual.shape
              ):
                  raise RuntimeError(
                      f"{title} 输出形状不一致："
                      f"{expected.shape} != "
                      f"{actual.shape}"
                  )

              difference = np.abs(
                  expected.astype(
                      np.float64
                  )
                  - actual.astype(
                      np.float64
                  )
              )

              maximum_error = float(
                  np.max(difference)
              )

              mean_error = float(
                  np.mean(difference)
              )

              log(
                  f"{title}："
                  f"max_error="
                  f"{maximum_error:.12g}，"
                  f"mean_error="
                  f"{mean_error:.12g}"
              )

              if not np.allclose(
                  expected,
                  actual,
                  rtol=1e-4,
                  atol=3e-5
              ):
                  raise RuntimeError(
                      f"{title} "
                      "误差超过容许范围"
                  )

              return maximum_error


          def validate_dynamic_model(
              source_model,
              onnx_path,
              vocabulary_size,
              special_ids
          ):
              session = create_session(
                  onnx_path
              )

              log(
                  "动态 ONNX 输入："
              )

              for item in (
                  session.get_inputs()
              ):
                  log(
                      f"  name={item.name}, "
                      f"type={item.type}, "
                      f"shape={item.shape}"
                  )

              log(
                  "动态 ONNX 输出："
              )

              for item in (
                  session.get_outputs()
              ):
                  log(
                      f"  name={item.name}, "
                      f"type={item.type}, "
                      f"shape={item.shape}"
                  )

              maximum_error = 0.0

              for sequence_length in (
                  4,
                  8,
                  16,
                  64,
                  128,
                  302
              ):
                  model_inputs = make_inputs(
                      effective_length=(
                          sequence_length
                      ),
                      vocabulary_size=(
                          vocabulary_size
                      ),
                      special_ids=(
                          special_ids
                      ),
                      seed=(
                          20260800
                          + sequence_length
                      )
                  )

                  expected = run_pytorch(
                      source_model,
                      model_inputs
                  )

                  actual = run_onnx(
                      session,
                      model_inputs
                  )

                  case_error = (
                      compare_outputs(
                          "动态 ONNX "
                          f"sequence="
                          f"{sequence_length}",
                          expected,
                          actual
                      )
                  )

                  maximum_error = max(
                      maximum_error,
                      case_error
                  )

              del session
              gc.collect()

              return maximum_error


          def validate_fixed_model(
              source_model,
              onnx_path,
              vocabulary_size,
              special_ids
          ):
              session = create_session(
                  onnx_path
              )

              log(
                  "固定 ONNX 输入："
              )

              for item in (
                  session.get_inputs()
              ):
                  log(
                      f"  name={item.name}, "
                      f"type={item.type}, "
                      f"shape={item.shape}"
                  )

              log(
                  "固定 ONNX 输出："
              )

              for item in (
                  session.get_outputs()
              ):
                  log(
                      f"  name={item.name}, "
                      f"type={item.type}, "
                      f"shape={item.shape}"
                  )

              maximum_error = 0.0

              padding_maximum_error = 0.0

              for effective_length in (
                  4,
                  8,
                  16,
                  64,
                  128,
                  302
              ):
                  padded_inputs = make_inputs(
                      effective_length=(
                          effective_length
                      ),
                      total_length=302,
                      vocabulary_size=(
                          vocabulary_size
                      ),
                      special_ids=(
                          special_ids
                      ),
                      seed=(
                          20260900
                          + effective_length
                      )
                  )

                  expected_padded = (
                      run_pytorch(
                          source_model,
                          padded_inputs
                      )
                  )

                  actual_padded = run_onnx(
                      session,
                      padded_inputs
                  )

                  fixed_error = (
                      compare_outputs(
                          "固定 ONNX "
                          f"effective="
                          f"{effective_length}",
                          expected_padded,
                          actual_padded
                      )
                  )

                  maximum_error = max(
                      maximum_error,
                      fixed_error
                  )

                  exact_inputs = make_inputs(
                      effective_length=(
                          effective_length
                      ),
                      total_length=(
                          effective_length
                      ),
                      vocabulary_size=(
                          vocabulary_size
                      ),
                      special_ids=(
                          special_ids
                      ),
                      seed=(
                          20260900
                          + effective_length
                      )
                  )

                  expected_exact = (
                      run_pytorch(
                          source_model,
                          exact_inputs
                      )
                  )

                  exact_valid = (
                      expected_exact[
                          :,
                          :effective_length,
                          :
                      ]
                  )

                  padded_valid = (
                      expected_padded[
                          :,
                          :effective_length,
                          :
                      ]
                  )

                  padding_error = (
                      compare_outputs(
                          "填充等价 "
                          f"effective="
                          f"{effective_length}",
                          exact_valid,
                          padded_valid
                      )
                  )

                  padding_maximum_error = max(
                      padding_maximum_error,
                      padding_error
                  )

              del session
              gc.collect()

              return (
                  maximum_error,
                  padding_maximum_error
              )


          def main():
              log(
                  "===== Dededi 专业模型鸿蒙转换 ====="
              )

              log(
                  f"Python：{sys.version}"
              )

              log(
                  f"PyTorch："
                  f"{torch.__version__}"
              )

              log(
                  f"ONNX："
                  f"{onnx.__version__}"
              )

              log(
                  f"ONNX Runtime："
                  f"{ort.__version__}"
              )

              log(
                  "源模型大小："
                  f"{SOURCE_MODEL.stat().st_size} "
                  "bytes"
              )

              log(
                  "源模型 SHA-256："
                  f"{sha256(SOURCE_MODEL)}"
              )

              (
                  vocabulary,
                  vocabulary_size,
                  special_ids
              ) = load_vocabulary()

              model = torch.jit.load(
                  str(SOURCE_MODEL),
                  map_location="cpu"
              )

              model.eval()

              log(
                  f"模型类型："
                  f"{type(model)!r}"
              )

              try:
                  log(
                      "forward schema："
                      f"{model.forward.schema}"
                  )
              except Exception as error:
                  log(
                      "无法读取 "
                      "forward schema："
                      f"{error}"
                  )

              probe_inputs = make_inputs(
                  effective_length=16,
                  vocabulary_size=(
                      vocabulary_size
                  ),
                  special_ids=special_ids,
                  seed=20260720
              )

              probe_output = run_pytorch(
                  model,
                  probe_inputs
              )

              log(
                  "PyTorch 探测输出："
                  f"{probe_output.shape}"
              )

              if (
                  probe_output.ndim != 3
              ):
                  raise RuntimeError(
                      "模型输出不是三维："
                      f"{probe_output.shape}"
                  )

              if (
                  probe_output.shape[0] != 1
                  or probe_output.shape[1] != 16
                  or probe_output.shape[2]
                  != vocabulary_size
              ):
                  raise RuntimeError(
                      "模型输出形状异常："
                      f"{probe_output.shape}，"
                      "预期为 "
                      f"(1, 16, "
                      f"{vocabulary_size})"
                  )

              dynamic_export_method = (
                  export_onnx(
                      original_model=model,
                      model_inputs=probe_inputs,
                      output_path=(
                          DYNAMIC_ONNX
                      ),
                      dynamic=True
                  )
              )

              fixed_inputs = make_inputs(
                  effective_length=302,
                  total_length=302,
                  vocabulary_size=(
                      vocabulary_size
                  ),
                  special_ids=special_ids,
                  seed=20260721
              )

              fixed_export_method = (
                  export_onnx(
                      original_model=model,
                      model_inputs=fixed_inputs,
                      output_path=(
                          FIXED_ONNX
                      ),
                      dynamic=False
                  )
              )

              dynamic_max_error = (
                  validate_dynamic_model(
                      source_model=model,
                      onnx_path=(
                          DYNAMIC_ONNX
                      ),
                      vocabulary_size=(
                          vocabulary_size
                      ),
                      special_ids=(
                          special_ids
                      )
                  )
              )

              (
                  fixed_max_error,
                  padding_max_error
              ) = validate_fixed_model(
                  source_model=model,
                  onnx_path=(
                      FIXED_ONNX
                  ),
                  vocabulary_size=(
                      vocabulary_size
                  ),
                  special_ids=(
                      special_ids
                  )
              )

              manifest = {
                  "model": (
                      "DedediProfessionalRoBERTa"
                  ),
                  "source_model_type": (
                      str(type(model))
                  ),
                  "source_sha256": (
                      sha256(SOURCE_MODEL)
                  ),
                  "vocabulary_items": (
                      len(vocabulary)
                  ),
                  "vocabulary_size": (
                      vocabulary_size
                  ),
                  "special_ids": (
                      special_ids
                  ),
                  "maximum_source_text_length": (
                      300
                  ),
                  "maximum_model_sequence_length": (
                      302
                  ),
                  "input_names": [
                      "input_ids",
                      "attention_mask",
                      "token_type_ids"
                  ],
                  "input_dtype": (
                      "int64"
                  ),
                  "dynamic_input_shape": [
                      1,
                      "sequence"
                  ],
                  "fixed_input_shape": [
                      1,
                      302
                  ],
                  "output_name": (
                      "logits"
                  ),
                  "output_dtype": (
                      "float32"
                  ),
                  "output_shape": [
                      1,
                      "sequence",
                      vocabulary_size
                  ],
                  "dynamic_export_method": (
                      dynamic_export_method
                  ),
                  "fixed_export_method": (
                      fixed_export_method
                  ),
                  "dynamic_onnx_sha256": (
                      sha256(DYNAMIC_ONNX)
                  ),
                  "fixed_onnx_sha256": (
                      sha256(FIXED_ONNX)
                  ),
                  "dynamic_max_error": (
                      dynamic_max_error
                  ),
                  "fixed_max_error": (
                      fixed_max_error
                  ),
                  "padding_max_error": (
                      padding_max_error
                  )
              }

              MANIFEST_OUTPUT.write_text(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              github_output(
                  "onnx_exported",
                  "true"
              )

              github_output(
                  "dynamic_error",
                  f"{dynamic_max_error:.12g}"
              )

              github_output(
                  "fixed_error",
                  f"{fixed_max_error:.12g}"
              )

              github_output(
                  "padding_error",
                  f"{padding_max_error:.12g}"
              )

              github_output(
                  "dynamic_method",
                  dynamic_export_method
              )

              github_output(
                  "fixed_method",
                  fixed_export_method
              )

              log("")
              log(
                  "===== 最终结论 ====="
              )

              log(
                  "专业模型动态 ONNX "
                  "已成功导出并验证。"
              )

              log(
                  "专业模型固定 302 长度 "
                  "ONNX 已成功导出并验证。"
              )

              log(
                  "本次直接导出 TorchScript，"
                  "没有再套普通 Python Wrapper。"
              )

              log(
                  "专业模型不需要重新训练。"
              )


          try:
              main()

          except Exception as error:
              github_output(
                  "onnx_exported",
                  "false"
              )

              log("")
              log(
                  "===== 转换失败 ====="
              )

              log(
                  f"{type(error).__name__}: "
                  f"{error}"
              )

              log(
                  traceback.format_exc()
              )

              raise

          finally:
              save_report()
          PY

          set +e
          python export_professional_model.py
          EXPORT_STATUS=$?
          set -e

          if [ -f harmony_pro_model/conversion_report.txt ]; then
            {
              echo "## 专业模型转换报告"
              echo ""
              echo '```text'
              tail -n 600 \
                harmony_pro_model/conversion_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$EXPORT_STATUS"

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          ONNX_EXPORTED="${{ steps.export.outputs.onnx_exported }}"
          DYNAMIC_ERROR="${{ steps.export.outputs.dynamic_error }}"
          FIXED_ERROR="${{ steps.export.outputs.fixed_error }}"
          PADDING_ERROR="${{ steps.export.outputs.padding_error }}"
          DYNAMIC_METHOD="${{ steps.export.outputs.dynamic_method }}"
          FIXED_METHOD="${{ steps.export.outputs.fixed_method }}"

          {
            echo ""
            echo "## 最终结果"
            echo ""
            echo "- 专业模型 ONNX 已导出：\`${ONNX_EXPORTED:-false}\`"
            echo "- 动态 ONNX 最大误差：\`${DYNAMIC_ERROR:-unknown}\`"
            echo "- 固定 ONNX 最大误差：\`${FIXED_ERROR:-unknown}\`"
            echo "- 填充等价最大误差：\`${PADDING_ERROR:-unknown}\`"
            echo "- 动态模型导出方式：\`${DYNAMIC_METHOD:-unknown}\`"
            echo "- 固定模型导出方式：\`${FIXED_METHOD:-unknown}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ONNX_EXPORTED" = "true" ]; then
            {
              echo "✅ 专业模型 ONNX 转换和一致性验证成功。"
              echo ""
              echo "请下载页面底部的 Artifact："
              echo "\`Dededi-Harmony-Professional-Model\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ 专业模型导出失败。"
              echo "请查看上方专业模型转换报告。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload professional model package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Professional-Model
          path: |
            harmony_pro_model/**
            export_professional_model.py
          if-no-files-found: warn
          retention-days: 30
