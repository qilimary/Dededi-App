                editorFullHeader.setSpan(
                        new android.text.style
                            .TypefaceSpan(
                                "sans-serif-medium"
                            ),
                        0,
                        editorFullHeader.length(),
                        Spanned
                            .SPAN_EXCLUSIVE_EXCLUSIVE
                );

                editorOutput.append(
                        editorFullHeader
                );

                int topSectionEnd =
                        output.length();

                if (topSectionEnd > 0) {
                    output.setSpan(
                            new IgnoredInCopySpan(),
                            0,
                            topSectionEnd,
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );
                }

                int editorTopSectionEnd =
                        editorOutput.length();

                if (editorTopSectionEnd > 0) {
                    editorOutput.setSpan(
                            new IgnoredInCopySpan(),
                            0,
                            editorTopSectionEnd,
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );
                }

                baseOffset[0] =
                        output.length();

                output.append(fullText);
                editorOutput.append(
                        fullEditorText
                );

                lastEditorSpannable =
                        editorOutput;

                if (
                    lastSavedHistoryFileId !=
                    null &&
                    !allSentencesBlocks
                        .isEmpty()
                ) {
                    saveBlocksAsync(
                            lastSavedHistoryFileId,
                            allSentencesBlocks
                    );
                }

                outputText.setText(output);

                outputText.setMovementMethod(
                        MyLinkMovementMethod
                            .getInstance()
                );

                outputText.setHighlightColor(
                        Color.TRANSPARENT
                );
            }
        }
