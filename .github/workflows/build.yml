                                            firstNonSpace <
                                            lineEnd
                                        ) {
                                            replacements.add(
                                                    new int[]{
                                                            lineStart,
                                                            firstNonSpace
                                                    }
                                            );
                                        } else if (
                                            firstNonSpace ==
                                            lineEnd &&
                                            lineStart !=
                                            lineEnd
                                        ) {
                                            replacements.add(
                                                    new int[]{
