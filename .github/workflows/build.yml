            private void restoreEditorScroll(
                    ScrollView scrollView,
                    int desiredY
            ) {
                scrollView.post(() -> {
                    try {
                        View child =
                                scrollView.getChildAt(0);

                        int maximum =
                                child != null
                                ? Math.max(
                                    0,
                                    child.getHeight() -
                                    scrollView.getHeight()
                                  )
                                : desiredY;

                        scrollView.scrollTo(
                                0,
                                Math.max(
                                        0,
                                        Math.min(
                                                desiredY,
                                                maximum
                                        )
                                )
                        );
                    } catch (Exception ignored) {
                    }
                });
            }

            private static float parseFloatSafely(
                    String value,
                    float fallback
            ) {
                try {
                    return Float.parseFloat(value);
                } catch (Exception ignored) {
                    return fallback;
                }
            }

            private void renderCustomTyposUI() {
                FlowLayout customTyposLayout =
                        findViewById(
                                R.id.llCustomTypos
                        );

                Button expandButton =
                        findViewById(
                                R.id.btnExpandTypos
                        );

                EditText originalEdit =
                        findViewById(
                                R.id.etOriginal
                        );

                EditText correctedEdit =
                        findViewById(
                                R.id.etCorrected
                        );

                Button addButton =
                        findViewById(
                                R.id.btnAddTypo
                        );

                customTyposLayout.removeAllViews();

                try {
                    JSONObject object =
                            new JSONObject(
                                    sp.getString(
                                            "custom_typos",
                                            "{}"
                                    )
                            );

                    Iterator<String> keys =
                            object.keys();

                    List<String[]> entries =
                            new ArrayList<>();

                    while (keys.hasNext()) {
                        String key = keys.next();

                        entries.add(
                                new String[]{
                                        key,
                                        object
                                            .getString(key)
                                }
                        );
                    }

                    int displayCount =
                            isTyposExpanded
                            ? entries.size()
                            : Math.min(
                                entries.size(),
                                15
                              );

                    for (
                        int i = 0;
                        i < displayCount;
                        i++
                    ) {
                        String[] entry =
                                entries.get(i);

                        TextView item =
                                new TextView(this);

                        String displayText =
                                entry[0]
                                    .equals(entry[1])
                                ? entry[0]
                                : entry[0] +
                                  " → " +
                                  entry[1];

                        item.setText(displayText);
                        item.setPadding(
                                16,
                                16,
                                16,
                                16
                        );

                        item.setTextSize(14f);
                        item.setTextColor(
                                Color.parseColor(
                                        "#4CAF50"
                                )
                        );

                        item.setBackgroundResource(
                                R.drawable
                                    .item_bg_selector
                        );

                        item.setClickable(true);

                        item.setOnClickListener(
                                view -> new AlertDialog
                                    .Builder(this)
                                    .setTitle(
                                            "操作错词"
                                    )
                                    .setMessage(
                                            "原始：" +
                                            entry[0] +
                                            "\n修改后：" +
                                            (
                                                entry[0]
                                                    .equals(
                                                        entry[1]
                                                    )
                                                ? "（保持不变）"
                                                : entry[1]
                                            )
                                    )
                                    .setPositiveButton(
                                            "删除",
                                            (
                                                dialog,
                                                which
                                            ) -> {
                                                object.remove(
                                                        entry[0]
                                                );

                                                sp.edit()
                                                        .putString(
                                                                "custom_typos",
                                                                object
                                                                    .toString()
                                                        )
                                                        .apply();

                                                loadTypoMap(
                                                        this
                                                );

                                                renderCustomTyposUI();
                                            }
                                    )
                                    .setNeutralButton(
                                            "编辑",
                                            (
                                                dialog,
                                                which
                                            ) -> {
                                                editingTypoKey =
                                                        entry[0];

                                                originalEdit
                                                        .setText(
                                                                entry[0]
                                                        );

                                                correctedEdit
                                                        .setText(
                                                                entry[0]
                                                                    .equals(
                                                                        entry[1]
                                                                    )
                                                                ? ""
                                                                : entry[1]
                                                        );

                                                addButton
                                                        .setText(
                                                                "完成"
                                                        );
                                            }
                                    )
                                    .setNegativeButton(
                                            "取消",
                                            null
                                    )
                                    .show()
                        );

                        customTyposLayout.addView(
                                item
                        );
                    }

                    if (entries.size() > 15) {
                        expandButton.setVisibility(
                                View.VISIBLE
                        );

                        expandButton.setText(
                                isTyposExpanded
                                ? "折叠"
                                : "展开全部"
                        );

                        expandButton
                                .setOnClickListener(
                                        view -> {
                                            isTyposExpanded =
                                                    !isTyposExpanded;

                                            renderCustomTyposUI();
                                        }
                                );
                    } else {
                        expandButton.setVisibility(
                                View.GONE
                        );
                    }
                } catch (Exception ignored) {
                }
            }


