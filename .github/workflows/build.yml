                                                            block
                                                                .isMutable &&
                                                            !block
                                                                .current
                                                                .equals(
                                                                    block
                                                                        .original
                                                                )
                                                        ) {
                                                            corrections =
                                                                    true;
                                                            break outer;
                                                        }
                                                    }
                                                }
                                            }

                                            pendingSaveText =
                                                    textToSave;

                                            try {
                                                Intent intent =
                                                        new Intent(
                                                                Intent
                                                                    .ACTION_CREATE_DOCUMENT
                                                        );

                                                intent.addCategory(
                                                        Intent
                                                            .CATEGORY_OPENABLE
                                                );

                                                String fileName =
                                                        corrections
                                                        ? "纠错结果"
                                                        : "原始文本";

                                                if (which == 0) {
                                                    intent.setType(
                                                            "text/plain"
                                                    );
                                                    intent.putExtra(
                                                            Intent
                                                                .EXTRA_TITLE,
                                                            fileName +
                                                            ".txt"
                                                    );
                                                } else if (
                                                    which == 1
                                                ) {
                                                    intent.setType(
                                                            "text/markdown"
                                                    );
                                                    intent.putExtra(
                                                            Intent
                                                                .EXTRA_TITLE,
                                                            fileName +
                                                            ".md"
                                                    );
                                                } else if (
                                                    which == 2
                                                ) {
                                                    intent.setType(
                                                            "application/pdf"
                                                    );
                                                    intent.putExtra(
                                                            Intent
                                                                .EXTRA_TITLE,
                                                            fileName +
                                                            ".pdf"
                                                    );
                                                } else if (
                                                    which == 3
                                                ) {
                                                    intent.setType(
                                                            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                                                    );
                                                    intent.putExtra(
                                                            Intent
                                                                .EXTRA_TITLE,
                                                            fileName +
                                                            ".docx"
                                                    );
                                                } else if (
                                                    which == 4
                                                ) {
                                                    intent.setType(
                                                            "image/jpeg"
                                                    );
                                                    intent.putExtra(
                                                            Intent
                                                                .EXTRA_TITLE,
                                                            fileName +
                                                            ".jpg"
                                                    );
                                                } else {
                                                    intent.setType(
                                                            "image/png"
                                                    );
                                                    intent.putExtra(
                                                            Intent
                                                                .EXTRA_TITLE,
                                                            fileName +
                                                            ".png"
                                                    );
                                                }

                                                startActivityForResult(
                                                        intent,
                                                        101
                                                );
                                            } catch (
                                                Exception exception
                                            ) {
                                                Toast.makeText(
                                                        this,
                                                        "调起失败: " +
                                                        exception
                                                            .getMessage(),
                                                        Toast.LENGTH_SHORT
                                                ).show();
                                            }
                                        }
                                )
                                .show();
                        }
                );


                Button addTypoButton =
                        findViewById(
