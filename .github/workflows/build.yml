            private static List<String> splitSentences(
                    String text
            ) {
                List<String> result =
                        new ArrayList<>();
                StringBuilder builder =
                        new StringBuilder();

                for (
                    int i = 0;
                    i < text.length();
                    i++
                ) {
                    char character =
                            text.charAt(i);
                    builder.append(character);

                    if (
                        character == '。' ||
                        character == '！' ||
                        character == '？' ||
                        character == '!' ||
                        character == '?' ||
                        character == '\n'
                    ) {
                        result.add(
                                builder.toString()
                        );
                        builder.setLength(0);
                    }
                }

                if (builder.length() > 0) {
                    result.add(
                            builder.toString()
                    );
                }

                return result;
            }

            private static List<String> splitLongSegments(
                    List<String> segments,
                    int maximumLength
            ) {
                List<String> result =
                        new ArrayList<>();

                for (String segment : segments) {
                    if (
                        segment.length() <=
                        maximumLength
                    ) {
                        result.add(segment);
                        continue;
                    }

                    StringBuilder pending =
                            new StringBuilder();

                    for (
                        int index = 0;
                        index < segment.length();
                        index++
                    ) {
                        pending.append(
                                segment.charAt(index)
                        );

                        if (
                            pending.length() <
                            maximumLength
                        ) {
                            continue;
                        }

                        int splitPosition = -1;

                        for (
                            int search =
                                pending.length() - 1;
                            search >=
                            Math.max(
                                    0,
                                    pending.length() - 60
                            );
                            search--
                        ) {
                            char character =
                                    pending.charAt(search);

                            if (
                                character == '，' ||
                                character == ',' ||
                                character == '；' ||
                                character == ';' ||
                                character == '、'
                            ) {
                                splitPosition = search;
                                break;
                            }
                        }

                        if (splitPosition > 0) {
                            result.add(
                                    pending
                                        .substring(
                                                0,
                                                splitPosition +
                                                1
                                        )
                            );

                            String remainder =
                                    pending.substring(
                                            splitPosition + 1
                                    );

                            pending.setLength(0);
                            pending.append(remainder);
                        } else {
                            result.add(
                                    pending.toString()
                            );
                            pending.setLength(0);
                        }
                    }

                    if (pending.length() > 0) {
                        result.add(
                                pending.toString()
                        );
                    }
                }

                return result;
            }

