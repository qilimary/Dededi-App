                            @Override
                            public boolean onTouch(
                                    View view,
                                    MotionEvent event
                            ) {
                                switch (
                                    event.getActionMasked()
                                ) {
                                    case MotionEvent
                                        .ACTION_DOWN:
                                        longPressTriggered[0] =
                                                false;

                                        startX[0] =
                                                event.getX();

                                        startY[0] =
                                                event.getY();

                                        rawTouchPosition[0] =
                                                event.getRawX();

                                        rawTouchPosition[1] =
                                                event.getRawY();

                                        handler.removeCallbacks(
                                                longPressRunnable
                                        );

                                        handler.postDelayed(
                                                longPressRunnable,
                                                600
                                        );
                                        break;

                                    case MotionEvent
                                        .ACTION_MOVE:
                                        if (
                                            !longPressTriggered[0] &&
                                            (
                                                Math.abs(
                                                    event.getX() -
                                                    startX[0]
                                                ) >
                                                20 ||
                                                Math.abs(
                                                    event.getY() -
                                                    startY[0]
                                                ) >
                                                20
                                            )
                                        ) {
                                            handler.removeCallbacks(
                                                    longPressRunnable
                                            );
                                        }
                                        break;

                                    case MotionEvent
                                        .ACTION_UP:
                                    case MotionEvent
                                        .ACTION_CANCEL:
                                        handler.removeCallbacks(
                                                longPressRunnable
                                        );

                                        if (
                                            longPressTriggered[0]
                                        ) {
                                            longPressTriggered[0] =
                                                    false;

                                            MotionEvent cancel =
                                                    MotionEvent
                                                        .obtain(
                                                                event
                                                        );

                                            cancel.setAction(
                                                    MotionEvent
                                                        .ACTION_CANCEL
                                            );

                                            view.onTouchEvent(
                                                    cancel
                                            );

                                            cancel.recycle();
                                            return true;
                                        }
                                        break;
                                }

                                return false;
                            }
                        }
