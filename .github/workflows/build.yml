                                Toast.makeText(
                                        this,
                                        "文本为空",
                                        Toast.LENGTH_SHORT
                                ).show();
                            }
                        }
                );

                btnFloatCopy.setOnClickListener(
                        view -> {
                            String fullCleanText =
                                    MainActivity
                                            .getCleanTextStatic();

                            if (fullCleanText.isEmpty()) {
                                fullCleanText =
                                        editFloatInput
