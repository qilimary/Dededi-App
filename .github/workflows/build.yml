                            showStatus(
                                    "已切换至" +
                                    (
                                        newFast
                                        ? "极速"
                                        : "专业"
                                    ) +
                                    "模型",
                                    true
                            );
                        }
                );

                Runnable jumpToApp = () -> {
                    if (MainActivity.isEditorOpen) {
                        Toast.makeText(
                                FloatingService.this,
                                "编辑模式中无法跳转，请先保存或退出。",
                                Toast.LENGTH_SHORT
                        ).show();
                        return;
                    }

                    Intent intent =
                            new Intent(
                                    FloatingService.this,
                                    MainActivity.class
                            );

                    intent.addFlags(
                            Intent.FLAG_ACTIVITY_NEW_TASK |
                            Intent.FLAG_ACTIVITY_SINGLE_TOP
                    );

                    intent.putExtra(
                            "SYNC_TEXT",
                            editFloatInput
                                .getText()
                                .toString()
                    );

                    intent.putExtra(
                            "FROM_FLOAT_JUMP",
                            true
                    );

                    startActivity(intent);

                    panelInput.setVisibility(
                            View.GONE
                    );
                    setFocusable(false);

                    mainHandler.postDelayed(
                            () -> {
                                if (
                                    panelInput.getVisibility() ==
                                    View.VISIBLE
                                ) {
                                    panelInput.setVisibility(
                                            View.GONE
                                    );
                                    setFocusable(false);
                                }
                            },
                            200
                    );
                };

                btnFloatJump.setOnClickListener(
                        view -> jumpToApp.run()
                );

                btnFloatCloseAll.setOnClickListener(
                        view -> stopSelf()
                );

                View.OnTouchListener dragListener =
                        new View.OnTouchListener() {
                            private int initialX;
                            private int initialY;
                            private float initialTouchX;
                            private float initialTouchY;
                            private boolean isMoved = false;
                            private boolean isLongPressed = false;

                            private final Handler handler =
                                    new Handler(
                                            Looper.getMainLooper()
                                    );

                            private final Runnable
                                    longPressRunnable =
                                    () -> {
                                        isLongPressed = true;
                                        jumpToApp.run();
                                    };

                            @Override
                            public boolean onTouch(
                                    View view,
                                    MotionEvent event
                            ) {
                                switch (
                                    event.getAction()
                                ) {
                                    case MotionEvent
                                        .ACTION_DOWN:
                                        initialX = params.x;
                                        initialY = params.y;
                                        initialTouchX =
                                                event.getRawX();
                                        initialTouchY =
                                                event.getRawY();
                                        isMoved = false;
                                        isLongPressed = false;

                                        if (
                                            view.getId() ==
                                            R.id.btnCircle
                                        ) {
                                            handler.postDelayed(
                                                    longPressRunnable,
                                                    500
                                            );
                                        }
                                        return true;

                                    case MotionEvent
                                        .ACTION_MOVE:
                                        int deltaX =
                                                (int) (
                                                    event.getRawX() -
                                                    initialTouchX
                                                );

                                        int deltaY =
                                                (int) (
                                                    event.getRawY() -
                                                    initialTouchY
                                                );

                                        if (
                                            !isMoved &&
                                            (
                                                Math.abs(deltaX) >
                                                10 ||
                                                Math.abs(deltaY) >
                                                10
                                            )
                                        ) {
                                            isMoved = true;
                                            handler.removeCallbacks(
                                                    longPressRunnable
                                            );
                                        }

                                        if (
                                            isMoved &&
                                            windowManager != null &&
                                            floatView != null
                                        ) {
                                            params.x =
                                                    initialX +
                                                    deltaX;
                                            params.y =
                                                    initialY +
                                                    deltaY;

                                            windowManager
                                                    .updateViewLayout(
                                                            floatView,
                                                            params
                                                    );
                                        }
                                        return true;

                                    case MotionEvent
                                        .ACTION_UP:
                                    case MotionEvent
                                        .ACTION_CANCEL:
                                        handler.removeCallbacks(
                                                longPressRunnable
                                        );

                                        if (
                                            !isMoved &&
                                            !isLongPressed &&
                                            view.getId() ==
                                            R.id.btnCircle
                                        ) {
                                            if (!isChecking) {
                                                boolean visible =
                                                        panelInput
                                                            .getVisibility() ==
                                                        View.VISIBLE;

                                                if (!visible) {
                                                    String sync =
                                                            sp.getString(
                                                                    "sync_text",
                                                                    ""
                                                            );

                                                    if (
                                                        !sync.isEmpty() &&
                                                        !sync.equals(
                                                            editFloatInput
                                                                .getText()
                                                                .toString()
                                                        )
                                                    ) {
                                                        MainActivity
                                                                .isCleanDialogOpen =
                                                                true;

                                                        editFloatInput
                                                                .setText(
                                                                        sync
                                                                );

                                                        MainActivity
                                                                .isCleanDialogOpen =
                                                                false;
                                                    }
                                                }

                                                panelInput
                                                        .setVisibility(
                                                                visible
                                                                ? View.GONE
                                                                : View.VISIBLE
                                                        );

                                                setFocusable(
                                                        !visible
                                                );
                                            } else {
                                                isInterruptRequested =
                                                        true;

                                                showStatus(
                                                        "已中断",
                                                        true
                                                );
                                            }
                                        }

                                        return true;
                                }

                                return false;
                            }
                        };

                btnCircle.setOnTouchListener(
                        dragListener
                );
                panelTopBar.setOnTouchListener(
                        dragListener
                );
                panelInput.setOnTouchListener(
                        dragListener
                );

                if (windowManager != null) {
                    windowManager.addView(
                            floatView,
                            params
                    );
                }
            }

            private void setFocusable(
                    boolean focusable
            ) {
                if (
                    params == null ||
                    windowManager == null ||
                    floatView == null
                ) {
                    return;
                }

                if (focusable) {
                    params.flags =
                            WindowManager.LayoutParams
                                .FLAG_NOT_TOUCH_MODAL |
                            WindowManager.LayoutParams
                                .FLAG_WATCH_OUTSIDE_TOUCH;
                } else {
                    params.flags =
                            WindowManager.LayoutParams
                                .FLAG_NOT_FOCUSABLE |
                            WindowManager.LayoutParams
                                .FLAG_WATCH_OUTSIDE_TOUCH;
                }

                try {
                    windowManager.updateViewLayout(
                            floatView,
                            params
                    );
                } catch (Exception ignored) {
                }
            }

            private void showStatus(
                    String message,
                    boolean autoHide
            ) {
                mainHandler.post(() -> {
                    if (
                        tvStatus == null ||
                        statusContainer == null ||
                        floatProgressBar == null
                    ) {
                        return;
                    }

                    tvStatus.setText(message);
                    statusContainer.setVisibility(
                            View.VISIBLE
                    );
                    floatProgressBar.setVisibility(
                            View.GONE
                    );

                    statusContainer.removeCallbacks(
                            hideStatusRunnable
                    );

                    if (autoHide) {
                        statusContainer.postDelayed(
                                hideStatusRunnable,
                                3000
                        );
                    }
                });
            }

            private void syncShowStatus(
                    String message,
                    boolean isTypo
            ) {
                synchronized (statusLock) {
                    pendingStatusMessage = message;

                    if (!statusFlushScheduled) {
                        statusFlushScheduled = true;
                        mainHandler.post(
                                statusFlushRunnable
                        );
                    }
                }
            }


            private void startInference(
                    String text,
                    String fileId
            ) {
                boolean isFastMode =
                        sp.getBoolean(
                                "is_fast_mode",
                                false
                        );

                String prefix =
                        isFastMode
                        ? "fast_"
                        : "pro_";

                float temperature =
                        parseFloatSafely(
                                sp.getString(
                                        prefix + "temp",
                                        isFastMode
                                        ? "1.2"
                                        : "1.0"
                                ),
                                isFastMode
                                ? 1.2f
                                : 1.0f
                        );

                if (temperature > 0.0f) {
                    if (
                        isFastMode &&
                        MainActivity.fastModule == null
                    ) {
                        Toast.makeText(
                                this,
                                "极速引擎未加载，请先打开一次主界面",
                                Toast.LENGTH_SHORT
                        ).show();
                        return;
                    }

                    if (
                        !isFastMode &&
                        MainActivity.proModule == null
                    ) {
                        Toast.makeText(
                                this,
                                "专业大模型未加载，请先打开一次主界面",
                                Toast.LENGTH_SHORT
                        ).show();
                        return;
                    }
                } else {
                    Toast.makeText(
                            this,
                            "已关闭“的地得”纠错，仅开启错别字纠错。",
                            Toast.LENGTH_LONG
                    ).show();
                }

                float thresholdDe =
                        parseFloatSafely(
                                sp.getString(
                                        prefix + "th1",
                                        isFastMode
                                        ? "0.80"
                                        : "0.70"
                                ),
                                isFastMode
                                ? 0.80f
                                : 0.70f
                        );

                float thresholdDi =
                        parseFloatSafely(
                                sp.getString(
                                        prefix + "th2",
                                        isFastMode
                                        ? "0.80"
                                        : "0.75"
                                ),
                                isFastMode
                                ? 0.80f
                                : 0.75f
                        );

                float thresholdDe3 =
                        parseFloatSafely(
                                sp.getString(
                                        prefix + "th3",
                                        isFastMode
                                        ? "0.80"
                                        : "0.75"
                                ),
                                isFastMode
                                ? 0.80f
                                : 0.75f
                        );

                isChecking = true;
                isInterruptRequested = false;
                btnFloatSwitch.setEnabled(false);

                showStatus(
                        "正在纠错……",
                        false
                );

                mainHandler.post(() -> {
                    floatProgressBar.setVisibility(
                            View.VISIBLE
                    );
                    floatProgressBar.setProgress(0);
                });

                circleSpin.setVisibility(
                        View.VISIBLE
                );

                AppExecutors.INFERENCE.execute(() -> {
                    try {
                        String[] labels =
                                {
                                    "的",
                                    "地",
                                    "得"
                                };

                        List<String> firstSegments =
                                splitSentences(text);

                        List<String> finalSegments =
                                splitLongSegments(
                                        firstSegments,
                                        300
                                );

                        String[] sentences =
                                finalSegments.toArray(
                                        new String[0]
                                );

                        StringBuilder fullCleanText =
                                new StringBuilder(
                                        text.length()
                                );

                        int[] errorCount = {0};

                        long startTime =
                                System.currentTimeMillis();

                        List<
                            List<MainActivity.TextBlock>
                        > allBlocks =
                                new ArrayList<>(
                                        sentences.length
                                );

                        long lastUiUpdateTime =
                                System.currentTimeMillis();

                        for (
                            int sentenceIndex = 0;
                            sentenceIndex <
                            sentences.length;
                            sentenceIndex++
                        ) {
                            if (isInterruptRequested) {
                                mainHandler.post(() -> {
                                    isChecking = false;
                                    btnFloatSwitch
                                            .setEnabled(true);
                                    circleSpin
                                            .setVisibility(
                                                    View.INVISIBLE
                                            );
                                    floatProgressBar
                                            .setVisibility(
                                                    View.GONE
                                            );
                                });
                                return;
                            }

                            long now =
                                    System.currentTimeMillis();

                            if (
                                now -
                                lastUiUpdateTime >
                                300 ||
                                sentenceIndex ==
                                sentences.length - 1
                            ) {
                                lastUiUpdateTime = now;

                                final int currentProgress =
                                        sentenceIndex + 1;
                                final int maxProgress =
                                        sentences.length;

                                mainHandler.post(() -> {
                                    if (
                                        !isInterruptRequested
                                    ) {
                                        floatProgressBar
                                                .setMax(
                                                        maxProgress
                                                );
                                        floatProgressBar
                                                .setProgress(
                                                        currentProgress
                                                );
                                    }
                                });
                            }

                            String sentence =
                                    sentences[
                                        sentenceIndex
                                    ];

                            if (sentence.isEmpty()) {
                                continue;
                            }

                            List<MainActivity.TextBlock>
                                    intermediateBlocks =
                                    new ArrayList<>();

                            Matcher[] gramMatchers =
                                    new Matcher[
                                        MainActivity
                                            .gramRules
                                            .size()
                                    ];

                            for (
                                int matcherIndex = 0;
                                matcherIndex <
                                gramMatchers.length;
                                matcherIndex++
                            ) {
                                gramMatchers[
                                    matcherIndex
                                ] =
                                    MainActivity
                                        .gramRules
                                        .get(matcherIndex)
                                        .pattern
                                        .matcher(sentence)
                                        .useTransparentBounds(
                                                true
                                        );
                            }

                            int cursor = 0;

                            while (
                                cursor <
                                sentence.length()
                            ) {
                                boolean matchedTypo =
                                        false;
                                boolean matchedGram =
                                        false;
                                boolean matchedQuant =
                                        false;

                                if (
                                    MainActivity
                                        .maxTypoLen > 0
                                ) {
                                    int maxLength =
                                            Math.min(
                                                    MainActivity
                                                        .maxTypoLen,
                                                    sentence.length() -
                                                    cursor
                                            );

                                    for (
                                        int length =
                                            maxLength;
                                        length >=
                                            MainActivity
                                                .minTypoLen;
                                        length--
                                    ) {
                                        String candidate =
                                                sentence.substring(
                                                        cursor,
                                                        cursor +
                                                        length
                                                );

                                        String correction =
                                                MainActivity
                                                    .typoMap
                                                    .get(
                                                            candidate
                                                    );

                                        if (
                                            correction == null
                                        ) {
                                            continue;
                                        }

                                        if (
                                            MainActivity
                                                .isFalsePositiveTypo(
                                                        sentence,
                                                        cursor,
                                                        candidate
                                                )
                                        ) {
                                            continue;
                                        }

                                        if (
                                            !candidate.equals(
                                                correction
                                            ) &&
                                            MainActivity
                                                .isConflictingCorrection(
                                                        sentence,
                                                        cursor,
                                                        candidate,
                                                        correction
                                                )
                                        ) {
                                            continue;
                                        }

                                        boolean isRealTypo =
                                                !candidate
                                                    .equals(
                                                        correction
                                                    );

                                        int blockType =
                                                MainActivity
                                                    .customTypoKeys
                                                    .contains(
                                                            candidate
                                                    )
                                                ? 4
                                                : 2;

                                        intermediateBlocks.add(
                                                new MainActivity
                                                    .TextBlock(
                                                        candidate,
                                                        correction,
                                                        isRealTypo,
                                                        1.0f,
                                                        blockType
                                                    )
                                        );

                                        if (isRealTypo) {
                                            errorCount[0]++;

                                            syncShowStatus(
                                                    "发现错误：" +
                                                    candidate +
                                                    " → " +
                                                    correction +
                                                    " | 共 " +
                                                    errorCount[0] +
                                                    " 处",
                                                    true
                                            );
                                        }

                                        cursor += length;
                                        matchedTypo = true;
                                        break;
                                    }
                                }

                                if (matchedTypo) {
                                    continue;
                                }

                                for (
                                    int ruleIndex = 0;
                                    ruleIndex <
                                    MainActivity
                                        .gramRules
                                        .size();
                                    ruleIndex++
                                ) {
                                    MainActivity.GramRule
                                            rule =
                                            MainActivity
                                                .gramRules
                                                .get(
                                                        ruleIndex
                                                );

                                    Matcher matcher =
                                            gramMatchers[
                                                ruleIndex
                                            ];

                                    matcher.region(
                                            cursor,
                                            sentence.length()
                                    );

                                    if (!matcher.lookingAt()) {
                                        continue;
                                    }

                                    String group1 =
                                            matcher.group(1);
                                    String group2 =
                                            matcher.group(2);
                                    String group3 =
                                            matcher.group(3);

                                    String[] selected =
                                            rule.options[
                                                ThreadLocalRandom
                                                    .current()
                                                    .nextInt(
                                                        rule.options
                                                            .length
                                                    )
                                            ];

                                    String replacement1 =
                                            selected[0] != null
                                            ? selected[0]
                                            : group1;

                                    String replacement3 =
                                            selected.length > 1 &&
                                            selected[1] != null
                                            ? selected[1]
                                            : group3;

                                    String explanation =
                                            selected.length > 2 &&
                                            selected[2] != null
                                            ? selected[2]
                                            : "";

                                    boolean group1Error =
                                            !group1.equals(
                                                replacement1
                                            ) ||
                                            (
                                                !explanation
                                                    .isEmpty() &&
                                                selected[0] !=
                                                null
                                            );

                                    boolean group3Error =
                                            !group3.equals(
                                                replacement3
                                            ) ||
                                            (
                                                !explanation
                                                    .isEmpty() &&
                                                selected.length >
                                                1 &&
                                                selected[1] !=
                                                null
                                            );

                                    if (group1Error) {
                                        MainActivity.TextBlock
                                                block =
                                                new MainActivity
                                                    .TextBlock(
                                                        group1,
                                                        replacement1,
                                                        true,
                                                        1.0f,
                                                        6
                                                    );

                                        block.exp =
                                                explanation;

                                        intermediateBlocks.add(
                                                block
                                        );

                                        errorCount[0]++;

                                        syncShowStatus(
                                                "发现错误：" +
                                                group1 +
                                                " → " +
                                                (
                                                    replacement1
                                                        .isEmpty()
                                                    ? "(删除)"
                                                    : replacement1
                                                ) +
                                                " | 共 " +
                                                errorCount[0] +
                                                " 处",
                                                true
                                        );
                                    } else {
                                        for (
                                            int index = 0;
                                            index <
                                            group1.length();
                                            index++
                                        ) {
                                            String character =
                                                    String.valueOf(
                                                            group1
                                                                .charAt(
                                                                        index
                                                                )
                                                    );

                                            intermediateBlocks.add(
                                                    new MainActivity
                                                        .TextBlock(
                                                            character,
                                                            character,
                                                            false,
                                                            0f,
                                                            0
                                                        )
                                            );
                                        }
                                    }

                                    for (
                                        int index = 0;
                                        index <
                                        group2.length();
                                        index++
                                    ) {
                                        String character =
                                                String.valueOf(
                                                        group2
                                                            .charAt(
                                                                    index
                                                            )
                                                );

                                        intermediateBlocks.add(
                                                new MainActivity
                                                    .TextBlock(
                                                        character,
                                                        character,
                                                        false,
                                                        0f,
                                                        0
                                                    )
                                        );
                                    }

                                    if (group3Error) {
                                        MainActivity.TextBlock
                                                block =
                                                new MainActivity
                                                    .TextBlock(
                                                        group3,
                                                        replacement3,
                                                        true,
                                                        1.0f,
                                                        6
                                                    );

                                        block.exp =
                                                explanation;

                                        intermediateBlocks.add(
                                                block
                                        );

                                        errorCount[0]++;

                                        syncShowStatus(
                                                "发现错误：" +
                                                group3 +
                                                " → " +
                                                (
                                                    replacement3
                                                        .isEmpty()
                                                    ? "(删除)"
                                                    : replacement3
                                                ) +
                                                " | 共 " +
                                                errorCount[0] +
                                                " 处",
                                                true
                                        );
                                    } else {
                                        for (
                                            int index = 0;
                                            index <
                                            group3.length();
                                            index++
                                        ) {
                                            String character =
                                                    String.valueOf(
                                                            group3
                                                                .charAt(
                                                                        index
                                                                )
                                                    );

                                            intermediateBlocks.add(
                                                    new MainActivity
                                                        .TextBlock(
                                                            character,
                                                            character,
                                                            false,
                                                            0f,
                                                            0
                                                        )
                                            );
                                        }
                                    }

                                    cursor = matcher.end();
                                    matchedGram = true;
                                    break;
                                }

                                if (matchedGram) {
                                    continue;
                                }

                                if (
                                    cursor > 0 &&
                                    cursor + 1 <
                                    sentence.length()
                                ) {
                                    char numberCharacter =
                                            sentence.charAt(
                                                    cursor - 1
                                            );

                                    char quantifierCharacter =
                                            sentence.charAt(
                                                    cursor
                                            );

                                    char nounCharacter =
                                            sentence.charAt(
                                                    cursor + 1
                                            );

                                    if (
                                        MainActivity
                                            .KNOWN_QUANTS
                                            .indexOf(
                                                    quantifierCharacter
                                            ) >= 0 &&
                                        MainActivity
                                            .NUMS
                                            .indexOf(
                                                    numberCharacter
                                            ) >= 0
                                    ) {
                                        MainActivity
                                            .QuantifierRule rule =
                                            MainActivity
                                                .quantRules
                                                .get(
                                                        nounCharacter
                                                );

                                        if (
                                            rule != null &&
                                            rule.allowedQuants
                                                .indexOf(
                                                        quantifierCharacter
                                                ) < 0
                                        ) {
                                            char nextCharacter =
                                                    cursor + 2 <
                                                    sentence.length()
                                                    ? sentence
                                                        .charAt(
                                                                cursor +
                                                                2
                                                        )
                                                    : '\0';

                                            if (
                                                MainActivity
                                                    .isSafeCharAfterNoun(
                                                            nextCharacter
                                                    )
                                            ) {
                                                intermediateBlocks.add(
                                                        new MainActivity
                                                            .TextBlock(
                                                                String.valueOf(
                                                                        quantifierCharacter
                                                                ),
                                                                rule.primaryQuant,
                                                                true,
                                                                1.0f,
                                                                3
                                                            )
                                                );

                                                errorCount[0]++;

                                                syncShowStatus(
                                                        "发现错误：" +
                                                        numberCharacter +
                                                        quantifierCharacter +
                                                        nounCharacter +
                                                        " → " +
                                                        numberCharacter +
                                                        rule.primaryQuant +
                                                        nounCharacter +
                                                        " | 共 " +
                                                        errorCount[0] +
                                                        " 处",
                                                        true
                                                );

                                                cursor += 1;
                                                matchedQuant = true;
                                            }
                                        }
                                    }
                                }

                                if (matchedQuant) {
                                    continue;
                                }

                                String character =
                                        String.valueOf(
                                                sentence.charAt(
                                                        cursor
                                                )
                                        );

                                intermediateBlocks.add(
                                        new MainActivity
                                            .TextBlock(
                                                character,
                                                character,
                                                false,
                                                0f,
                                                0
                                            )
                                );

                                cursor++;
                            }


                            StringBuilder inferenceBuilder =
                                    new StringBuilder(
                                            sentence.length()
                                    );

                            for (
                                MainActivity.TextBlock block :
                                intermediateBlocks
                            ) {
                                inferenceBuilder.append(
                                        block.current
                                );
                            }

                            String inferenceText =
                                    inferenceBuilder.toString();

                            MainActivity.TextBlock[] mapList =
                                    new MainActivity
                                        .TextBlock[
                                            inferenceText.length()
                                        ];

                            int mapCursor = 0;

                            for (
                                MainActivity.TextBlock block :
                                intermediateBlocks
