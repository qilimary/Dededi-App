                                scrollY <
                                oldScrollY
                            ) {
                                autoScrollEnabled =
                                        false;
                            }

                            if (
                                !isTouchingScrollView &&
                                !view
                                    .canScrollVertically(
                                            1
                                    )
                            ) {
                                autoScrollEnabled =
                                        true;
                            }
                        }
                );

                View expandedEditorOverlay =
                        findViewById(
                                R.id
                                    .expandedEditorOverlay
                        );

                EditText expandedEditText =
                        findViewById(
                                R.id.expandedEditText
                        );

                ScrollView editorScrollView =
                        findViewById(
                                R.id.editorScrollView
                        );

                Button editorCollapseButton =
                        findViewById(
                                R.id.btnEditorCollapse
                        );

                Button editorIndentButton =
                        findViewById(
                                R.id.btnEditorIndent
                        );

                Button editorSaveButton =
                        findViewById(
                                R.id.btnEditorSave
                        );

                Button editorCloseButton =
                        findViewById(
                                R.id.btnEditorClose
                        );

                View editorScrollTouchArea =
                        findViewById(
                                R.id
                                    .editorScrollTouchArea
                        );

                expandedEditText.setOnTouchListener(
                        (view, event) -> {
                            if (
                                event.getAction() ==
                                MotionEvent.ACTION_UP
                            ) {
                                EditText widget =
                                        (EditText) view;

                                int x =
                                        (int) event.getX();
                                int y =
                                        (int) event.getY();

                                x -=
                                        widget
                                            .getTotalPaddingLeft();

                                y -=
                                        widget
                                            .getTotalPaddingTop();

                                x += widget.getScrollX();
                                y += widget.getScrollY();

                                Layout layout =
                                        widget.getLayout();

                                if (layout != null) {
                                    int line =
                                            layout
                                                .getLineForVertical(
                                                        y
                                                );

                                    int offset =
                                            layout
                                                .getOffsetForHorizontal(
                                                        line,
                                                        x
                                                );

                                    float right =
                                            layout
                                                .getLineRight(
                                                        line
                                                );

                                    if (x <= right) {
                                        JumpSpan[] links =
                                                widget
                                                    .getText()
                                                    .getSpans(
                                                            offset,
                                                            offset,
                                                            JumpSpan.class
                                                    );

                                        if (
                                            links.length !=
                                            0
                                        ) {
                                            MotionEvent
                                                    cancelEvent =
                                                    MotionEvent
                                                        .obtain(
                                                                event
                                                        );

                                            cancelEvent
                                                    .setAction(
                                                            MotionEvent
                                                                .ACTION_CANCEL
                                                    );

                                            view.onTouchEvent(
                                                    cancelEvent
                                            );

                                            cancelEvent
                                                    .recycle();

                                            links[0].onClick(
                                                    widget
                                            );

                                            return true;
                                        }
                                    }

                                    IgnoredInCopySpan[]
                                            lockedSpans =
                                            widget
                                                .getText()
                                                .getSpans(
                                                        0,
                                                        widget
                                                            .getText()
                                                            .length(),
                                                        IgnoredInCopySpan
                                                            .class
                                                );

                                    int maximumLockedEnd =
                                            0;

                                    for (
                                        IgnoredInCopySpan
                                                locked :
                                        lockedSpans
                                    ) {
                                        maximumLockedEnd =
                                                Math.max(
                                                        maximumLockedEnd,
                                                        widget
                                                            .getText()
                                                            .getSpanEnd(
                                                                    locked
                                                            )
                                                );
                                    }

                                    if (
                                        offset <
                                        maximumLockedEnd
                                    ) {
                                        final int target =
                                                maximumLockedEnd;

                                        widget.post(
                                                () -> {
                                                    int safe =
                                                            Math.max(
                                                                    0,
                                                                    Math.min(
                                                                            target,
                                                                            widget
                                                                                .length()
                                                                    )
                                                            );

                                                    widget.setSelection(
                                                            safe
                                                    );
                                                }
                                        );
                                    }
                                }
                            }

                            return false;
                        }
                );

                expandedEditText
                        .addTextChangedListener(
                                new TextWatcher() {
                                    @Override
                                    public void
                                            beforeTextChanged(
                                                    CharSequence text,
                                                    int start,
                                                    int count,
                                                    int after
                                            ) {
                                        if (
                                            isEditorSelfModifying ||
                                            isCheckingMain ||
                                            currentClauseLinks ==
                                            null
                                        ) {
                                            return;
                                        }

                                        try {
                                            SpannableStringBuilder
                                                    snapshot =
                                                    new SpannableStringBuilder(
                                                            text
                                                    );

                                            editorUndoStack.push(
                                                    new EditorState(
                                                            snapshot,
                                                            expandedEditText
                                                                .getSelectionStart()
                                                    )
                                            );

                                            if (
                                                editorUndoStack
                                                    .size() >
                                                50
                                            ) {
                                                editorUndoStack
                                                        .remove(0);
                                            }

                                            editorRedoStack
                                                    .clear();
                                        } catch (
                                            Exception ignored
                                        ) {
                                        }
                                    }

                                    @Override
                                    public void onTextChanged(
                                            CharSequence text,
                                            int start,
                                            int before,
                                            int count
                                    ) {
                                    }

                                    @Override
                                    public void afterTextChanged(
                                            Editable editable
                                    ) {
                                        if (
                                            isCheckingMain ||
                                            currentClauseLinks ==
                                            null ||
                                            isEditorSelfModifying
                                        ) {
                                            return;
                                        }

                                        boolean needsPurge =
                                                false;

                                        for (
                                            ClauseLink link :
                                            currentClauseLinks
                                        ) {
                                            if (link.isDead) {
                                                continue;
                                            }

                                            boolean altered =
                                                    false;

                                            for (
                                                TargetSpan target :
                                                link.targetSpans
                                            ) {
                                                int targetStart =
                                                        editable
                                                            .getSpanStart(
                                                                    target
                                                            );

                                                int targetEnd =
                                                        editable
                                                            .getSpanEnd(
                                                                    target
                                                            );

                                                if (
                                                    targetStart ==
                                                    -1 ||
                                                    targetEnd ==
                                                    -1
                                                ) {
                                                    altered =
                                                            true;
                                                    break;
                                                }

                                                String currentContent =
                                                        editable
                                                            .subSequence(
                                                                    targetStart,
                                                                    targetEnd
                                                            )
                                                            .toString();

                                                if (
                                                    !currentContent
                                                        .equals(
                                                            target
                                                                .expected
                                                        )
                                                ) {
                                                    altered =
                                                            true;
                                                    break;
                                                }
                                            }

                                            if (altered) {
                                                link.isDead =
                                                        true;
                                                needsPurge =
                                                        true;
                                            }
                                        }

                                        if (!needsPurge) {
                                            return;
                                        }

                                        expandedEditText.post(
                                                () -> {
                                                    isEditorSelfModifying =
                                                            true;

                                                    try {
                                                        Editable
                                                                current =
                                                                expandedEditText
                                                                    .getText();

                                                        List<
                                                            ListMarkerSpan
                                                        > spansToDelete =
                                                                new ArrayList<>();

                                                        for (
                                                            ClauseLink
                                                                    link :
                                                            currentClauseLinks
                                                        ) {
                                                            if (
                                                                link.isDead &&
                                                                current
                                                                    .getSpanStart(
                                                                            link
                                                                                .listMarkerSpan
                                                                    ) !=
                                                                -1
                                                            ) {
                                                                spansToDelete
                                                                        .add(
                                                                                link
                                                                                    .listMarkerSpan
                                                                        );
                                                            }
                                                        }

                                                        spansToDelete
                                                                .sort(
                                                                        (
                                                                            left,
                                                                            right
                                                                        ) ->
                                                                            Integer
                                                                                .compare(
                                                                                        current
                                                                                            .getSpanStart(
                                                                                                    right
                                                                                            ),
                                                                                        current
                                                                                            .getSpanStart(
                                                                                                    left
                                                                                            )
                                                                                )
                                                                );

                                                        for (
                                                            ListMarkerSpan
                                                                    marker :
                                                            spansToDelete
                                                        ) {
                                                            int markerStart =
                                                                    current
                                                                        .getSpanStart(
                                                                                marker
                                                                        );

                                                            int markerEnd =
                                                                    current
                                                                        .getSpanEnd(
                                                                                marker
                                                                        );

                                                            if (
                                                                markerStart ==
                                                                -1 ||
                                                                markerEnd ==
                                                                -1
                                                            ) {
                                                                continue;
                                                            }

                                                            int lineStart =
                                                                    markerStart;

                                                            while (
                                                                lineStart >
                                                                0 &&
                                                                current
                                                                    .charAt(
                                                                            lineStart -
                                                                            1
                                                                    ) !=
                                                                '\n'
                                                            ) {
                                                                lineStart--;
                                                            }

                                                            int lineEnd =
                                                                    markerEnd;

                                                            while (
                                                                lineEnd <
                                                                current
                                                                    .length() &&
                                                                current
                                                                    .charAt(
                                                                            lineEnd
                                                                    ) !=
                                                                '\n'
                                                            ) {
                                                                lineEnd++;
                                                            }

                                                            if (
                                                                lineEnd <
                                                                current
                                                                    .length()
                                                            ) {
                                                                lineEnd++;
                                                            }

                                                            current.delete(
                                                                    lineStart,
                                                                    lineEnd
                                                            );
                                                        }
                                                    } catch (
                                                        Exception ignored
                                                    ) {
                                                    } finally {
                                                        isEditorSelfModifying =
                                                                false;
                                                    }
                                                }
                                        );
                                    }
                                }
                        );

