            public static boolean isFalsePositiveTypo(
                    String sentence,
                    int index,
                    String candidate
            ) {
                if (candidate.length() == 0) {
                    return false;
                }

                for (String safeWord : WHITE_LIST) {
                    int searchStart =
                            Math.max(
                                    0,
                                    index -
                                    safeWord.length()
                            );

                    int searchEnd =
                            Math.min(
                                    sentence.length(),
                                    index +
                                    candidate.length() +
                                    safeWord.length()
                            );

                    String window =
                            sentence.substring(
                                    searchStart,
                                    searchEnd
                            );

                    int found =
                            window.indexOf(safeWord);

                    while (found >= 0) {
                        int actualStart =
                                searchStart +
                                found;
                        int actualEnd =
                                actualStart +
                                safeWord.length();

                        if (
                            actualStart <
                            index +
                            candidate.length() &&
                            actualEnd > index
                        ) {
                            return true;
                        }

                        found =
                                window.indexOf(
                                        safeWord,
                                        found + 1
                                );
                    }
                }

                char firstCharacter =
                        candidate.charAt(0);

                if (
                    firstCharacter == '做' ||
                    firstCharacter == '作'
                ) {
                    boolean falsePositive = false;

                    if (index > 0) {
                        char previousCharacter =
                                sentence.charAt(
                                        index - 1
                                );

                        String actionPrefixes =
                                "创去要在该想会能可来把给多没不曾刚才将正就爱肯敢配帮替让叫使令";

                        if (
                            actionPrefixes.indexOf(
                                    previousCharacter
                            ) >= 0
                        ) {
                            falsePositive = true;
                        }
                    }

                    if (
                        !falsePositive &&
                        index +
                        candidate.length() <
                        sentence.length()
                    ) {
                        char nextCharacter =
                                sentence.charAt(
                                        index +
                                        candidate.length()
                                );

                        String actionSuffixes =
                                "扇筝联山发牙眼肢手脚衣裤帽鞋饭菜汤了";

                        if (
                            actionSuffixes.indexOf(
                                    nextCharacter
                            ) >= 0
                        ) {
                            falsePositive = true;
                        }
                    }

                    if (falsePositive) {
                        return true;
                    }
                }

                return false;
            }

            public static boolean isConflictingCorrection(
                    String sentence,
                    int index,
                    String candidate,
                    String correction
            ) {
                if (candidate.equals(correction)) {
                    return false;
                }

                String simulated =
                        sentence.substring(0, index) +
                        correction +
                        sentence.substring(
                                index +
                                candidate.length()
                        );

                int replacementStart = index;
                int replacementEnd =
                        index +
                        correction.length();

                int searchStart =
                        Math.max(
                                0,
                                replacementStart -
                                maxTypoLen +
                                1
                        );

                for (
                    int position = searchStart;
                    position < replacementEnd;
                    position++
                ) {
                    for (
                        int length = minTypoLen;
                        length <= maxTypoLen;
                        length++
                    ) {
                        if (
                            position + length >
                            simulated.length()
                        ) {
                            continue;
                        }

                        boolean crossesLeft =
                                position <
                                replacementStart &&
                                position + length >
                                replacementStart;

                        boolean crossesRight =
                                position <
                                replacementEnd &&
                                position + length >
                                replacementEnd;

                        if (
                            !crossesLeft &&
                            !crossesRight
                        ) {
                            continue;
                        }

                        String simulatedCandidate =
                                simulated.substring(
                                        position,
                                        position +
                                        length
                                );

                        String simulatedCorrection =
                                typoMap.get(
                                        simulatedCandidate
                                );

                        if (
                            simulatedCorrection != null &&
                            !simulatedCandidate.equals(
                                    simulatedCorrection
                            )
                        ) {
                            return true;
                        }
                    }
                }

                return false;
            }

            public static String escapeHtmlQuick(
                    String text
            ) {
                if (text == null) {
                    return "";
                }

                StringBuilder builder =
                        new StringBuilder(
                                text.length() + 16
                        );

                for (
                    int i = 0;
                    i < text.length();
                    i++
                ) {
                    char character =
                            text.charAt(i);

                    if (character == '&') {
                        builder.append("&amp;");
                    } else if (character == '<') {
                        builder.append("&lt;");
                    } else if (character == '>') {
                        builder.append("&gt;");
                    } else {
                        builder.append(character);
                    }
                }

                return builder.toString();
            }

            public static String serializeSpannable(
                    Spannable spannable
            ) {
                if (spannable == null) {
                    return "";
                }

                try {
                    JSONObject object =
                            new JSONObject();

                    object.put(
                            "text",
                            spannable.toString()
                    );

                    JSONArray spansArray =
                            new JSONArray();

                    Object[] spans =
                            spannable.getSpans(
                                    0,
                                    spannable.length(),
                                    Object.class
                            );

                    for (Object span : spans) {
                        JSONObject spanObject =
                                new JSONObject();

                        spanObject.put(
                                "start",
                                spannable.getSpanStart(
                                        span
                                )
                        );

                        spanObject.put(
                                "end",
                                spannable.getSpanEnd(
                                        span
                                )
                        );

                        spanObject.put(
                                "flags",
                                spannable.getSpanFlags(
                                        span
                                )
                        );

                        if (
                            span instanceof
                            ForegroundColorSpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "ForegroundColorSpan"
                            );

                            spanObject.put(
                                    "color",
                                    (
                                        (ForegroundColorSpan)
                                        span
                                    ).getForegroundColor()
                            );
                        } else if (
                            span instanceof
                            android.text.style.StyleSpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "StyleSpan"
                            );

                            spanObject.put(
                                    "style",
                                    (
                                        (android.text.style
                                            .StyleSpan)
                                        span
                                    ).getStyle()
                            );
                        } else if (
                            span instanceof
                            WavyUnderlineSpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "WavyUnderlineSpan"
                            );

                            spanObject.put(
                                    "color",
                                    (
                                        (WavyUnderlineSpan)
                                        span
                                    ).color
                            );
                        } else if (
                            span instanceof
                            ColoredStrikethroughSpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "ColoredStrikethroughSpan"
                            );

                            spanObject.put(
                                    "textColor",
                                    (
                                        (ColoredStrikethroughSpan)
                                        span
                                    ).textColor
                            );

                            spanObject.put(
                                    "lineColor",
                                    (
                                        (ColoredStrikethroughSpan)
                                        span
                                    ).lineColor
                            );
                        } else if (
                            span instanceof
                            StrikethroughSpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "StrikethroughSpan"
                            );
                        } else if (
                            span instanceof
                            android.text.style
                                .RelativeSizeSpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "RelativeSizeSpan"
                            );

                            spanObject.put(
                                    "size",
                                    (double)
                                    (
                                        (android.text.style
                                            .RelativeSizeSpan)
                                        span
                                    ).getSizeChange()
                            );
                        } else if (
                            span instanceof JumpSpan
                        ) {
                            int target =
                                    (
                                        (JumpSpan) span
                                    ).getTargetOffset(
                                            spannable
                                    );

                            if (target < 0) {
                                continue;
                            }

                            spanObject.put(
                                    "type",
                                    "JumpSpan"
                            );
                            spanObject.put(
                                    "target",
                                    target
                            );
                        } else if (
                            span instanceof
                            IgnoredInCopySpan
                        ) {
                            spanObject.put(
                                    "type",
                                    "IgnoredInCopySpan"
                            );
                        } else {
                            continue;
                        }

                        spansArray.put(spanObject);
                    }

                    object.put(
                            "spans",
                            spansArray
                    );

                    return object.toString();
                } catch (Exception ignored) {
                    return "";
                }
            }

            public static SpannableStringBuilder
                    deserializeSpannable(
                            String json
                    ) {
                if (
                    json == null ||
                    json.isEmpty()
                ) {
                    return null;
                }

                try {
                    JSONObject object =
                            new JSONObject(json);

                    String text =
                            object.getString("text");

                    SpannableStringBuilder builder =
                            new SpannableStringBuilder(
                                    text
                            );

                    JSONArray spansArray =
                            object.getJSONArray(
                                    "spans"
                            );

                    for (
                        int i = 0;
                        i < spansArray.length();
                        i++
                    ) {
                        JSONObject spanObject =
                                spansArray
                                    .getJSONObject(i);

                        int start =
                                spanObject.getInt(
                                        "start"
                                );
                        int end =
                                spanObject.getInt(
                                        "end"
                                );
                        int flags =
                                spanObject.getInt(
                                        "flags"
                                );

                        String type =
                                spanObject.getString(
                                        "type"
                                );

                        Object span = null;

                        if (
                            type.equals(
                                "ForegroundColorSpan"
                            )
                        ) {
                            span =
                                    new ForegroundColorSpan(
                                            spanObject
                                                .getInt(
                                                        "color"
                                                )
                                    );
                        } else if (
                            type.equals("StyleSpan")
                        ) {
                            span =
                                    new android.text.style
                                        .StyleSpan(
                                            spanObject
                                                .getInt(
                                                        "style"
                                                )
                                    );
                        } else if (
                            type.equals(
                                "WavyUnderlineSpan"
                            )
                        ) {
                            span =
                                    new WavyUnderlineSpan(
                                            spanObject
                                                .getInt(
                                                        "color"
                                                )
                                    );
                        } else if (
                            type.equals(
                                "ColoredStrikethroughSpan"
                            )
                        ) {
                            span =
                                    new ColoredStrikethroughSpan(
                                            spanObject
                                                .getInt(
                                                        "textColor"
                                                ),
                                            spanObject
                                                .getInt(
                                                        "lineColor"
                                                )
                                    );
                        } else if (
                            type.equals(
                                "StrikethroughSpan"
                            )
                        ) {
                            span =
                                    new StrikethroughSpan();
                        } else if (
                            type.equals(
                                "RelativeSizeSpan"
                            )
                        ) {
                            span =
                                    new android.text.style
                                        .RelativeSizeSpan(
                                            (float)
                                            spanObject
                                                .getDouble(
                                                        "size"
                                                )
                                    );
                        } else if (
                            type.equals("JumpSpan")
                        ) {
                            final int targetOffset =
                                    spanObject.getInt(
                                            "target"
                                    );

                            span =
                                    new JumpSpan() {
                                        @Override
                                        public int
                                                getTargetOffset(
                                                        Spanned text
                                                ) {
                                            return targetOffset;
                                        }

                                        @Override
                                        public void onClick(
                                                View view
                                        ) {
                                            try {
                                                TextView textView =
                                                        (TextView)
                                                        view;

                                                Spannable text =
                                                        (Spannable)
                                                        textView
                                                            .getText();

                                                if (
                                                    targetOffset <
                                                    0 ||
                                                    targetOffset >
                                                    text.length()
                                                ) {
                                                    return;
                                                }

                                                Layout layout =
                                                        textView
                                                            .getLayout();

                                                if (layout == null) {
                                                    return;
                                                }

                                                int line =
                                                        layout
                                                            .getLineForOffset(
                                                                    targetOffset
                                                            );

                                                int y =
                                                        layout
                                                            .getLineTop(
                                                                    line
                                                            );

                                                ScrollView scroll =
                                                        null;

                                                if (
                                                    textView
                                                        .getContext()
                                                    instanceof
                                                    android.app
                                                        .Activity
                                                ) {
                                                    scroll =
                                                            (
                                                                (android.app
                                                                    .Activity)
                                                                textView
                                                                    .getContext()
                                                            ).findViewById(
                                                                    R.id
                                                                        .scrollView
                                                            );
                                                }

                                                if (
                                                    scroll == null &&
                                                    textView
                                                        .getParent() !=
                                                    null
                                                ) {
                                                    View parent =
                                                            (View)
                                                            textView
                                                                .getParent();

                                                    while (
                                                        parent !=
                                                        null
                                                    ) {
                                                        if (
                                                            parent
                                                            instanceof
                                                            ScrollView
                                                        ) {
                                                            scroll =
                                                                    (ScrollView)
                                                                    parent;
                                                            break;
                                                        }

                                                        if (
                                                            parent
                                                                .getParent()
                                                            instanceof
                                                            View
                                                        ) {
                                                            parent =
                                                                    (View)
                                                                    parent
                                                                        .getParent();
                                                        } else {
                                                            break;
                                                        }
                                                    }
                                                }

                                                if (scroll != null) {
                                                    scroll.scrollTo(
                                                            0,
                                                            Math.max(
                                                                    0,
                                                                    y -
                                                                    scroll
                                                                        .getHeight() /
                                                                    3
                                                            )
                                                    );
                                                }

                                                flashLine(
                                                        textView,
                                                        text,
                                                        layout,
                                                        line
                                                );
                                            } catch (
                                                Exception ignored
                                            ) {
                                            }
                                        }

                                        @Override
                                        public void
                                                updateDrawState(
                                                        TextPaint paint
                                                ) {
                                            paint.setColor(
                                                    0xFF2196F3
                                            );
                                            paint.setUnderlineText(
                                                    true
                                            );
                                            paint.setFakeBoldText(
                                                    true
                                            );
                                        }
                                    };
                        } else if (
                            type.equals(
                                "IgnoredInCopySpan"
                            )
                        ) {
                            span =
                                    new IgnoredInCopySpan();
                        }

                        if (
                            span != null &&
                            start >= 0 &&
                            end <= text.length() &&
                            start <= end
                        ) {
                            builder.setSpan(
                                    span,
                                    start,
                                    end,
                                    flags
                            );
                        }
                    }

                    return builder;
                } catch (Exception ignored) {
                    return null;
                }
            }


