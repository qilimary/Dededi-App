                                        }

                                        int firstNonSpace =
                                                lineStart;

                                        while (
                                            firstNonSpace <
                                            lineEnd
                                        ) {
                                            char character =
                                                    text.charAt(
                                                            firstNonSpace
                                                    );

                                            if (
                                                character == ' ' ||
                                                character == '\t' ||
                                                character == '\u3000'
