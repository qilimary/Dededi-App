                                        ClipData
                                            .newPlainText(
                                                    "Corrected",
                                                    fullCleanText
                                            )
                                );

                                showStatus(
                                        "已复制修正后的全文。",
                                        true
                                );
                            }
                        }
                );

                btnFloatSwitch.setOnClickListener(
                        view -> {
                            boolean currentFast =
                                    sp.getBoolean(
                                            "is_fast_mode",
                                            false
                                    );

                            boolean newFast =
