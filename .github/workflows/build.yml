                                                        getTargetOffset(
                                                                text
                                                        );

                                                if (
                                                    position < 0 ||
                                                    position >
                                                    text.length()
                                                ) {
                                                    return;
                                                }

                                                Layout layout =
                                                        textView
                                                            .getLayout();

                                                if (
                                                    layout ==
                                                    null
                                                ) {
                                                    return;
                                                }

                                                int line =
                                                        layout
                                                            .getLineForOffset(
                                                                position
                                                            );

                                                int y =
                                                        layout
                                                            .getLineTop(
                                                                line
                                                            );

                                                if (
                                                    textView
                                                    instanceof
                                                    EditText
                                                ) {
                                                    (
                                                        (EditText)
                                                        textView
                                                    ).setSelection(
                                                            position
                                                    );

                                                    ScrollView editorScroll =
                                                            (
                                                                (android.app
                                                                    .Activity)
