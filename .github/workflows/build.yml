        package com.app.dededi;

        import android.content.Context;
        import android.util.AttributeSet;
        import android.view.View;
        import android.view.ViewGroup;

        public class FlowLayout extends ViewGroup {
            private int hGap = 20;
            private int vGap = 20;

            public FlowLayout(Context context) {
                super(context);
            }

            public FlowLayout(
                    Context context,
                    AttributeSet attrs
            ) {
                super(context, attrs);
            }

            @Override
            protected void onMeasure(
                    int widthMeasureSpec,
                    int heightMeasureSpec
            ) {
                int sizeWidth =
                        MeasureSpec.getSize(
                                widthMeasureSpec
                        );
                int modeWidth =
                        MeasureSpec.getMode(
                                widthMeasureSpec
                        );
                int sizeHeight =
                        MeasureSpec.getSize(
                                heightMeasureSpec
                        );
                int modeHeight =
                        MeasureSpec.getMode(
                                heightMeasureSpec
                        );

                int width = 0;
                int height = 0;
                int lineWidth = 0;
                int lineHeight = 0;

                int availableWidth =
                        Math.max(
                                0,
                                sizeWidth -
                                getPaddingLeft() -
                                getPaddingRight()
                        );

                for (
                    int i = 0;
                    i < getChildCount();
                    i++
                ) {
                    View child = getChildAt(i);

                    if (child.getVisibility() == GONE) {
                        continue;
                    }

                    measureChildWithMargins(
                            child,
                            widthMeasureSpec,
                            0,
                            heightMeasureSpec,
                            0
                    );

                    MarginLayoutParams params =
                            (MarginLayoutParams)
                            child.getLayoutParams();

                    int childWidth =
                            child.getMeasuredWidth() +
                            params.leftMargin +
                            params.rightMargin;

                    int childHeight =
                            child.getMeasuredHeight() +
                            params.topMargin +
                            params.bottomMargin;

                    int requiredWidth =
                            lineWidth == 0
                            ? childWidth
                            : lineWidth + hGap + childWidth;

                    if (
                        lineWidth > 0 &&
                        requiredWidth > availableWidth
                    ) {
                        width =
                                Math.max(
                                        width,
                                        lineWidth
                                );

                        height += lineHeight + vGap;
                        lineWidth = childWidth;
                        lineHeight = childHeight;
                    } else {
                        lineWidth = requiredWidth;
                        lineHeight =
                                Math.max(
                                        lineHeight,
                                        childHeight
                                );
                    }
                }

                width = Math.max(width, lineWidth);
                height += lineHeight;

                int measuredWidth =
                        modeWidth ==
                        MeasureSpec.EXACTLY
                        ? sizeWidth
                        : width +
                          getPaddingLeft() +
                          getPaddingRight();

                int measuredHeight =
                        modeHeight ==
                        MeasureSpec.EXACTLY
                        ? sizeHeight
                        : height +
                          getPaddingTop() +
                          getPaddingBottom();

                setMeasuredDimension(
                        resolveSize(
                                measuredWidth,
                                widthMeasureSpec
                        ),
                        resolveSize(
                                measuredHeight,
                                heightMeasureSpec
                        )
                );
            }

            @Override
            protected void onLayout(
                    boolean changed,
                    int left,
                    int top,
                    int right,
                    int bottom
            ) {
                int availableWidth =
                        getWidth() -
                        getPaddingLeft() -
                        getPaddingRight();

                int lineWidth = 0;
                int lineHeight = 0;
                int x = getPaddingLeft();
                int y = getPaddingTop();

                for (
                    int i = 0;
                    i < getChildCount();
                    i++
                ) {
                    View child = getChildAt(i);

                    if (child.getVisibility() == GONE) {
                        continue;
                    }

                    MarginLayoutParams params =
                            (MarginLayoutParams)
                            child.getLayoutParams();

                    int childWidth =
                            child.getMeasuredWidth();
                    int childHeight =
                            child.getMeasuredHeight();

                    int totalChildWidth =
                            params.leftMargin +
                            childWidth +
                            params.rightMargin;

                    int totalChildHeight =
                            params.topMargin +
                            childHeight +
                            params.bottomMargin;

                    int requiredWidth =
                            lineWidth == 0
                            ? totalChildWidth
                            : lineWidth +
                              hGap +
                              totalChildWidth;

                    if (
                        lineWidth > 0 &&
                        requiredWidth > availableWidth
                    ) {
                        x = getPaddingLeft();
                        y += lineHeight + vGap;
                        lineWidth = 0;
                        lineHeight = 0;
                    }

                    if (lineWidth > 0) {
                        x += hGap;
                        lineWidth += hGap;
                    }

                    int childLeft =
                            x + params.leftMargin;
                    int childTop =
                            y + params.topMargin;

                    child.layout(
                            childLeft,
                            childTop,
                            childLeft + childWidth,
                            childTop + childHeight
                    );

                    x += totalChildWidth;
                    lineWidth += totalChildWidth;
                    lineHeight =
                            Math.max(
                                    lineHeight,
                                    totalChildHeight
                            );
                }
            }

            @Override
            protected LayoutParams generateDefaultLayoutParams() {
                return new MarginLayoutParams(
                        LayoutParams.WRAP_CONTENT,
                        LayoutParams.WRAP_CONTENT
                );
            }

            @Override
            public LayoutParams generateLayoutParams(
                    AttributeSet attrs
            ) {
                return new MarginLayoutParams(
                        getContext(),
                        attrs
                );
            }

            @Override
            protected LayoutParams generateLayoutParams(
                    LayoutParams params
            ) {
                return new MarginLayoutParams(params);
            }

            @Override
            protected boolean checkLayoutParams(
                    LayoutParams params
            ) {
                return params instanceof MarginLayoutParams;
            }
        }
