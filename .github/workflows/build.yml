            @Override
            protected void onActivityResult(
                    int requestCode,
                    int resultCode,
                    Intent data
            ) {
                super.onActivityResult(
                        requestCode,
                        resultCode,
                        data
                );

                if (requestCode == 201) {
                    if (
                        android.os.Build.VERSION.SDK_INT >=
                        android.os.Build.VERSION_CODES.M &&
                        android.provider.Settings
                            .canDrawOverlays(this)
                    ) {
                        startFloatingService();
                    } else {
                        Toast.makeText(
                                this,
                                "悬浮窗权限未被授予，无法开启",
                                Toast.LENGTH_SHORT
                        ).show();
                    }
                }

                if (
                    requestCode == 102 &&
                    resultCode == RESULT_OK &&
                    data != null
                ) {
                    List<android.net.Uri> uris =
                            new ArrayList<>();

                    if (data.getClipData() != null) {
                        int count =
                                data.getClipData()
                                    .getItemCount();

                        int limit =
                                Math.min(
                                        count,
                                        20
                                );

                        for (
                            int i = 0;
                            i < limit;
                            i++
                        ) {
                            uris.add(
                                    data.getClipData()
                                        .getItemAt(i)
                                        .getUri()
                            );
                        }

                        if (count > 20) {
                            Toast.makeText(
                                    this,
                                    "最多支持选择20个文件，已截断前20个",
                                    Toast.LENGTH_SHORT
                            ).show();
                        }
                    } else if (
                        data.getData() != null
                    ) {
                        uris.add(
                                data.getData()
                        );
                    }

                    if (!uris.isEmpty()) {
                        Toast.makeText(
                                this,
                                "正在处理导入文件，请稍候...",
                                Toast.LENGTH_SHORT
                        ).show();

                        progressBar.setVisibility(
                                View.VISIBLE
                        );

                        progressBar.setIndeterminate(
                                false
                        );

                        progressBar.setMax(100);
                        progressBar.setProgress(0);

                        AppExecutors.IO.execute(
                                () -> {
                                    StringBuilder combined =
                                            new StringBuilder();

                                    for (
                                        int i = 0;
                                        i < uris.size();
                                        i++
                                    ) {
                                        final int fileIndex =
                                                i;

                                        String text =
                                                extractTextFromUriSync(
                                                        this,
                                                        uris.get(i),
                                                        new TextExtractCallback() {
                                                            @Override
                                                            public void onStart() {
                                                            }

                                                            @Override
                                                            public void onProgress(
                                                                    int progress,
                                                                    int maximum
                                                            ) {
                                                                int safeMaximum =
                                                                        Math.max(
                                                                                1,
                                                                                maximum
                                                                        );

                                                                int overall =
                                                                        (
                                                                            fileIndex *
                                                                            100 /
                                                                            uris.size()
                                                                        ) +
                                                                        (
                                                                            progress *
                                                                            100 /
                                                                            safeMaximum /
                                                                            uris.size()
                                                                        );

                                                                AppExecutors
                                                                        .MAIN
                                                                        .post(
                                                                                () -> progressBar
                                                                                    .setProgress(
                                                                                            overall
                                                                                    )
                                                                        );
                                                            }

                                                            @Override
                                                            public void onExtracted(
                                                                    String text
                                                            ) {
                                                            }
                                                        }
                                                );

                                        if (text == null) {
                                            text = "";
                                        }

                                        combined.append(text);

                                        if (
                                            i <
                                            uris.size() - 1
                                        ) {
                                            combined.append(
                                                    "\n\n---------------------------------\n\n"
                                            );
                                        }

                                        final int completed =
                                                (
                                                    i + 1
                                                ) *
                                                100 /
                                                uris.size();

                                        AppExecutors
                                                .MAIN
                                                .post(
                                                        () -> progressBar
                                                            .setProgress(
                                                                    completed
                                                            )
                                                );
                                    }

                                    final String finalText =
                                            combined.toString();

                                    AppExecutors
                                            .MAIN
                                            .post(
                                                    () -> {
                                                        progressBar
                                                                .setVisibility(
                                                                        View.INVISIBLE
                                                                );

                                                        if (
                                                            !finalText
                                                                .trim()
                                                                .isEmpty()
                                                        ) {
                                                            checkAndPromptCleanup(
                                                                    MainActivity.this,
                                                                    finalText,
                                                                    cleaned -> {
                                                                        lastSavedHistoryFileId =
                                                                                null;

                                                                        inputText
                                                                                .setText(
                                                                                        cleaned
                                                                                );

                                                                        sp.edit()
                                                                                .putString(
                                                                                        "sync_text",
                                                                                        cleaned
                                                                                )
                                                                                .apply();

                                                                        saveHistory(
                                                                                cleaned,
                                                                                null
                                                                        );

                                                                        Toast.makeText(
                                                                                MainActivity.this,
                                                                                "导入成功",
                                                                                Toast.LENGTH_SHORT
                                                                        ).show();
                                                                    }
                                                            );
                                                        } else {
                                                            Toast.makeText(
                                                                    MainActivity.this,
                                                                    "无法读取文件内容或未识别到文字",
                                                                    Toast.LENGTH_SHORT
                                                            ).show();
                                                        }
                                                    }
                                            );
                                }
                        );
                    }
                }

                if (
                    requestCode == 101 &&
                    resultCode == RESULT_OK &&
                    data != null &&
                    data.getData() != null
                ) {
                    android.net.Uri outputUri =
                            data.getData();

                    String textSnapshot =
                            pendingSaveText;

                    int formatSnapshot =
                            saveFormat;

                    AppExecutors.IO.execute(() -> {
                        boolean success = false;

                        try (
                            OutputStream output =
                                    getContentResolver()
                                        .openOutputStream(
                                                outputUri
                                        )
                        ) {
                            if (output == null) {
                                throw new java.io
                                    .IOException(
                                        "无法打开保存位置"
                                    );
                            }

                            if (
                                formatSnapshot == 0 ||
                                formatSnapshot == 1
                            ) {
                                output.write(
                                        textSnapshot
                                            .getBytes(
                                                StandardCharsets
                                                    .UTF_8
                                            )
                                );
                            } else if (
                                formatSnapshot == 2
                            ) {
                                writePdf(
                                        output,
                                        textSnapshot
                                );
                            } else if (
                                formatSnapshot == 3
                            ) {
                                writeDocx(
                                        output,
                                        textSnapshot
                                );
                            } else {
                                writeImage(
                                        output,
                                        textSnapshot,
                                        formatSnapshot == 4
                                );
                            }

                            output.flush();
                            success = true;
                        } catch (Exception ignored) {
                        }

                        final boolean saved =
                                success;

                        AppExecutors.MAIN.post(
                                () -> Toast.makeText(
                                        MainActivity.this,
                                        saved
                                        ? "保存成功"
                                        : "保存过程出现错误",
                                        Toast.LENGTH_SHORT
                                ).show()
                        );
                    });
                }
            }


            private static void writePdf(
                    OutputStream output,
                    String text
            ) throws Exception {
                android.graphics.pdf.PdfDocument
                        document =
                        new android.graphics.pdf
                            .PdfDocument();

                try {
                    TextPaint paint =
                            new TextPaint();

                    paint.setTextSize(14);
                    paint.setColor(
                            Color.BLACK
                    );

                    android.text.StaticLayout layout =
                            new android.text.StaticLayout(
                                    text,
                                    paint,
                                    555,
                                    Layout.Alignment
                                        .ALIGN_NORMAL,
                                    1.5f,
                                    0.0f,
                                    false
                            );

                    int textHeight =
                            layout.getHeight() +
                            40;

                    int pageHeight =
                            Math.max(
                                    842,
                                    textHeight
                            );

                    android.graphics.pdf
                            .PdfDocument.PageInfo
                            pageInfo =
                            new android.graphics.pdf
                                .PdfDocument.PageInfo
                                .Builder(
                                        595,
                                        pageHeight,
                                        1
                                )
                                .create();

                    android.graphics.pdf
                            .PdfDocument.Page page =
                            document.startPage(
                                    pageInfo
                            );

                    android.graphics.Canvas canvas =
                            page.getCanvas();

                    canvas.translate(20, 20);
                    layout.draw(canvas);

                    document.finishPage(page);
                    document.writeTo(output);
                } finally {
                    document.close();
                }
            }

            private static void writeDocx(
                    OutputStream output,
                    String text
            ) throws Exception {
                try (
                    java.util.zip.ZipOutputStream
                            zipOutput =
                            new java.util.zip
                                .ZipOutputStream(
                                        output
                                )
                ) {
                    zipOutput.putNextEntry(
                            new java.util.zip
                                .ZipEntry(
                                    "[Content_Types].xml"
                                )
                    );

                    zipOutput.write(
                            (
                                "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" +
                                "<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">" +
                                "<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>" +
                                "<Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>" +
                                "</Types>"
                            ).getBytes(
                                    StandardCharsets.UTF_8
                            )
                    );

                    zipOutput.closeEntry();

                    zipOutput.putNextEntry(
                            new java.util.zip
                                .ZipEntry(
                                    "_rels/.rels"
                                )
                    );

                    zipOutput.write(
                            (
                                "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" +
                                "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">" +
                                "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>" +
                                "</Relationships>"
                            ).getBytes(
                                    StandardCharsets.UTF_8
                            )
                    );

                    zipOutput.closeEntry();

                    zipOutput.putNextEntry(
                            new java.util.zip
                                .ZipEntry(
                                    "word/document.xml"
                                )
                    );

                    String safeText =
                            text.replace(
                                    "&",
                                    "&amp;"
                            )
                            .replace(
                                    "<",
                                    "&lt;"
                            )
                            .replace(
                                    ">",
                                    "&gt;"
                            );

                    StringBuilder content =
                            new StringBuilder(
                                    "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" +
                                    "<w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\">" +
                                    "<w:body>"
                            );

                    for (
                        String paragraph :
                        safeText.split(
                                "\n",
                                -1
                        )
                    ) {
                        content.append(
                                "<w:p><w:r><w:t xml:space=\"preserve\">"
                        )
                        .append(paragraph)
                        .append(
                                "</w:t></w:r></w:p>"
                        );
                    }

                    content.append(
                            "</w:body></w:document>"
                    );

                    zipOutput.write(
                            content.toString()
                                .getBytes(
                                    StandardCharsets.UTF_8
                                )
                    );

                    zipOutput.closeEntry();
                }
            }

            private static void writeImage(
                    OutputStream output,
                    String text,
                    boolean jpeg
            ) throws Exception {
                TextPaint paint =
                        new TextPaint();

                paint.setTextSize(40);
                paint.setColor(Color.BLACK);
                paint.setAntiAlias(true);

                String safeText =
                        text.isEmpty()
                        ? "无内容"
                        : text;

                android.text.StaticLayout layout =
                        new android.text.StaticLayout(
                                safeText,
                                paint,
                                1000,
                                Layout.Alignment
                                    .ALIGN_NORMAL,
                                1.5f,
                                0.0f,
                                false
                        );

                Bitmap bitmap =
                        Bitmap.createBitmap(
                                1080,
                                layout.getHeight() +
                                80,
                                Bitmap.Config.ARGB_8888
                        );

                try {
                    android.graphics.Canvas canvas =
                            new android.graphics.Canvas(
                                    bitmap
                            );

                    canvas.drawColor(Color.WHITE);
                    canvas.translate(40, 40);
                    layout.draw(canvas);

                    if (jpeg) {
                        bitmap.compress(
                                Bitmap.CompressFormat
                                    .JPEG,
                                90,
                                output
                        );
                    } else {
                        bitmap.compress(
                                Bitmap.CompressFormat
                                    .PNG,
                                100,
                                output
                        );
                    }
                } finally {
                    bitmap.recycle();
                }
            }

            private void loadVocab(
                    Map<String, Long> destination,
                    String assetName
            ) throws Exception {
                String jsonText =
                        getEncryptedStringNative(
                                getAssets(),
                                assetName
                        );

                if (
                    jsonText == null ||
                    jsonText.isEmpty()
                ) {
                    return;
                }

                JSONObject object =
                        new JSONObject(
                                jsonText
                        );

                Iterator<String> keys =
                        object.keys();

                while (keys.hasNext()) {
                    String key = keys.next();

                    destination.put(
                            key,
                            (long)
                            object.getInt(key)
                    );
                }
            }

            private Module loadDecryptedModule(
                    Context context,
                    String assetName,
                    String cacheKey
            ) throws Exception {
                File cacheFile =
                        new File(
                                context.getFilesDir(),
                                cacheKey + ".ptl"
                        );

                File[] existingFiles =
                        context.getFilesDir()
                            .listFiles();

                if (existingFiles != null) {
                    String prefix =
                            cacheKey.contains("_v")
                            ? cacheKey.substring(
                                0,
                                cacheKey.indexOf(
                                        "_v"
                                )
                              )
                            : cacheKey;

                    for (File file : existingFiles) {
                        String name =
                                file.getName();

                        if (
                            name.endsWith(".ptl") &&
                            name.startsWith(
                                    prefix
                            ) &&
                            !name.equals(
                                cacheFile.getName()
                            )
                        ) {
                            file.delete();
                        }
                    }
                }

                if (
                    cacheFile.exists() &&
                    cacheFile.length() > 0
                ) {
                    try {
                        return LiteModuleLoader.load(
                                cacheFile
                                    .getAbsolutePath()
                        );
                    } catch (Exception ignored) {
                        cacheFile.delete();
                    }
                }

                boolean success =
                        decryptFileNative(
                                context.getAssets(),
                                assetName,
                                cacheFile
                                    .getAbsolutePath()
                        );

                if (!success) {
                    throw new Exception(
                            "底层解密失败"
                    );
                }

                try {
                    return LiteModuleLoader.load(
                            cacheFile
                                .getAbsolutePath()
                    );
                } catch (Exception exception) {
                    cacheFile.delete();
                    throw exception;
                }
            }

            private static List<String>
                    splitSentences(
                            String text
                    ) {
                List<String> result =
                        new ArrayList<>();

                StringBuilder builder =
                        new StringBuilder();

                for (
                    int i = 0;
                    i < text.length();
                    i++
                ) {
                    char character =
                            text.charAt(i);

                    builder.append(character);

                    if (
                        character == '。' ||
                        character == '！' ||
                        character == '？' ||
                        character == '!' ||
                        character == '?' ||
                        character == '\n'
                    ) {
                        result.add(
                                builder.toString()
                        );

                        builder.setLength(0);
                    }
                }

                if (builder.length() > 0) {
                    result.add(
                            builder.toString()
                    );
                }

                return result;
            }

            private static List<String>
                    splitLongSegments(
                            List<String> segments,
                            int maximumLength
                    ) {
                List<String> result =
                        new ArrayList<>();

                for (String segment : segments) {
                    if (
                        segment.length() <=
                        maximumLength
                    ) {
                        result.add(segment);
                        continue;
                    }

                    StringBuilder pending =
                            new StringBuilder();

                    for (
                        int index = 0;
                        index < segment.length();
                        index++
                    ) {
                        pending.append(
                                segment.charAt(index)
                        );

                        if (
                            pending.length() <
                            maximumLength
                        ) {
                            continue;
                        }

                        int splitPosition = -1;

                        for (
                            int search =
                                pending.length() - 1;
                            search >=
                            Math.max(
                                    0,
                                    pending.length() -
                                    60
                            );
                            search--
                        ) {
                            char character =
                                    pending.charAt(
                                            search
                                    );

                            if (
                                character == '，' ||
                                character == ',' ||
                                character == '；' ||
                                character == ';' ||
                                character == '、'
                            ) {
                                splitPosition =
                                        search;
                                break;
                            }
                        }

                        if (splitPosition > 0) {
                            result.add(
                                    pending.substring(
                                            0,
                                            splitPosition +
                                            1
                                    )
                            );

                            String remainder =
                                    pending.substring(
                                            splitPosition + 1
                                    );

                            pending.setLength(0);
                            pending.append(
                                    remainder
                            );
                        } else {
                            result.add(
                                    pending.toString()
                            );

                            pending.setLength(0);
                        }
                    }

                    if (pending.length() > 0) {
                        result.add(
                                pending.toString()
                        );
                    }
                }

                return result;
            }


            private static boolean isBlockError(
                    TextBlock block
            ) {
                return block.isMutable &&
                       (
                           !block.current.equals(
                                block.original
                           ) ||
                           block.userModified ||
                           (
                               block.exp != null &&
                               !block.exp.isEmpty()
                           )
                       );
            }

            private static List<List<TextBlock>>
                    splitIntoRawClauses(
                            List<TextBlock> blocks
                    ) {
                List<List<TextBlock>> clauses =
                        new ArrayList<>();

                List<TextBlock> current =
                        new ArrayList<>();

                for (TextBlock block : blocks) {
                    if (block.isMutable) {
                        current.add(block);
                        continue;
                    }

                    String text =
                            block.original;

                    int lastCut = 0;

                    for (
                        int i = 0;
                        i < text.length();
                        i++
                    ) {
                        char character =
                                text.charAt(i);

                        if (
                            character == '，' ||
                            character == ',' ||
                            character == '；' ||
                            character == ';' ||
                            character == '、' ||
                            character == '\n'
                        ) {
                            String part =
                                    text.substring(
                                            lastCut,
                                            i + 1
                                    );

                            if (!part.isEmpty()) {
                                current.add(
                                        new TextBlock(
                                                part,
                                                part,
                                                false,
                                                0f,
                                                0
                                        )
                                );
                            }

                            clauses.add(current);
                            current =
                                    new ArrayList<>();

                            lastCut = i + 1;
                        }
                    }

                    if (
                        lastCut <
                        text.length()
                    ) {
                        String part =
                                text.substring(
                                        lastCut
                                );

                        current.add(
                                new TextBlock(
                                        part,
                                        part,
                                        false,
                                        0f,
                                        0
                                )
                        );
                    }
                }

                if (!current.isEmpty()) {
                    clauses.add(current);
                }

                return clauses;
            }

            private static List<List<TextBlock>>
                    groupErrorClauses(
                            List<List<TextBlock>>
                                    rawClauses
                    ) {
                List<List<TextBlock>> groups =
                        new ArrayList<>();

                List<TextBlock> currentGroup =
                        new ArrayList<>();

                for (
                    List<TextBlock> clause :
                    rawClauses
                ) {
                    boolean containsError = false;

                    for (TextBlock block : clause) {
                        if (isBlockError(block)) {
                            containsError = true;
                            break;
                        }
                    }

                    if (containsError) {
                        currentGroup.addAll(
                                clause
                        );
                    } else if (
                        !currentGroup.isEmpty()
                    ) {
                        groups.add(currentGroup);
                        currentGroup =
                                new ArrayList<>();
                    }
                }

                if (!currentGroup.isEmpty()) {
                    groups.add(currentGroup);
                }

                return groups;
            }

            private void doInference(
                    boolean fastMode
            ) {
                String text =
                        inputText
                            .getText()
                            .toString();

                if (text.isEmpty()) {
                    isCheckingMain = false;
                    btnCheck.setText(
                            "开始纠错"
                    );
                    return;
                }

                btnCopy.setEnabled(false);
                btnSaveTxt.setEnabled(false);

                final float temperature =
                        parseFloatSafely(
                                editTemp
                                    .getText()
                                    .toString(),
                                1.0f
                        );

                final float thresholdDe =
                        parseFloatSafely(
                                editThreshDe1
                                    .getText()
                                    .toString(),
                                0.70f
                        );

                final float thresholdDi =
                        parseFloatSafely(
                                editThreshDe2
                                    .getText()
                                    .toString(),
                                0.75f
                        );

                final float thresholdDe3 =
                        parseFloatSafely(
                                editThreshDe3
                                    .getText()
                                    .toString(),
                                0.75f
                        );

                AppExecutors.INFERENCE.execute(() -> {
                    try {
                        AppExecutors.MAIN.post(
                                () -> {
                                    getWindow().addFlags(
                                            WindowManager
                                                .LayoutParams
                                                .FLAG_KEEP_SCREEN_ON
                                    );

                                    progressBar
                                            .setVisibility(
                                                    View.VISIBLE
                                            );

                                    progressBar
                                            .setIndeterminate(
                                                    false
                                            );

                                    progressBar
                                            .setProgress(0);
                                }
                        );

                        long startTime =
                                System.currentTimeMillis();

                        String[] labels =
                                {
                                    "的",
                                    "地",
                                    "得"
                                };

                        List<String> firstSegments =
                                splitSentences(text);

                        List<String> finalSegments =
                                splitLongSegments(
                                        firstSegments,
                                        300
                                );

                        String[] sentences =
                                finalSegments.toArray(
                                        new String[0]
                                );

                        AppExecutors.MAIN.post(
                                () -> progressBar
                                    .setMax(
                                            Math.max(
                                                    1,
                                                    sentences
                                                        .length
                                            )
                                    )
                        );

                        boolean multipleDocuments =
                                false;

                        for (String sentence : sentences) {
                            if (
                                sentence.contains(
                                    "---------------------------------"
                                )
                            ) {
                                multipleDocuments =
                                        true;
                                break;
                            }
                        }

                        List<List<TextBlock>>
                                resultBlocks =
                                new ArrayList<>(
                                        sentences.length
                                );

                        StringBuilder liveErrorsHtml =
                                new StringBuilder();

                        StringBuilder liveFullText =
                                new StringBuilder(
                                        text.length() +
                                        100
                                );

                        long lastUiUpdateTime =
                                System.currentTimeMillis();

                        int liveErrorCount = 0;
                        int liveDocumentIndex = 1;
                        boolean livePendingMarker =
                                multipleDocuments;

                        for (
                            int sentenceIndex = 0;
                            sentenceIndex <
                            sentences.length;
                            sentenceIndex++
                        ) {
                            if (!isCheckingMain) {
                                AppExecutors.MAIN.post(
                                        () -> {
                                            outputText
                                                    .setText(
                                                            "已取消纠错。"
                                                    );

                                            btnCheck.setText(
                                                    "开始纠错"
                                            );

                                            btnCheck
                                                    .setEnabled(
                                                            true
                                                    );

                                            progressBar
                                                    .setVisibility(
                                                            View.INVISIBLE
                                                    );
                                        }
                                );

                                return;
                            }

                            String sentence =
                                    sentences[
                                        sentenceIndex
                                    ];

                            if (sentence.isEmpty()) {
                                continue;
                            }

                            List<TextBlock>
                                    intermediateBlocks =
                                    new ArrayList<>();

                            Matcher[] gramMatchers =
                                    new Matcher[
                                        gramRules.size()
                                    ];

                            for (
                                int matcherIndex = 0;
                                matcherIndex <
                                gramMatchers.length;
                                matcherIndex++
                            ) {
                                gramMatchers[
                                    matcherIndex
                                ] =
                                    gramRules
                                        .get(matcherIndex)
                                        .pattern
                                        .matcher(sentence)
                                        .useTransparentBounds(
                                                true
                                        );
                            }

                            int cursor = 0;

                            while (
                                cursor <
                                sentence.length()
                            ) {
                                boolean matchedTypo =
                                        false;
                                boolean matchedGrammar =
                                        false;
                                boolean matchedQuantifier =
                                        false;

                                if (maxTypoLen > 0) {
                                    int maximumLength =
                                            Math.min(
                                                    maxTypoLen,
                                                    sentence
                                                        .length() -
                                                    cursor
                                            );

                                    for (
                                        int length =
                                            maximumLength;
                                        length >=
                                            minTypoLen;
                                        length--
                                    ) {
                                        String candidate =
                                                sentence.substring(
                                                        cursor,
                                                        cursor +
                                                        length
                                                );

                                        String correction =
                                                typoMap.get(
                                                        candidate
                                                );

                                        if (
                                            correction == null
                                        ) {
                                            continue;
                                        }

                                        if (
                                            isFalsePositiveTypo(
                                                    sentence,
                                                    cursor,
                                                    candidate
                                            )
                                        ) {
                                            continue;
                                        }

                                        if (
                                            !candidate.equals(
                                                correction
                                            ) &&
                                            isConflictingCorrection(
                                                    sentence,
                                                    cursor,
                                                    candidate,
                                                    correction
                                            )
                                        ) {
                                            continue;
                                        }

                                        boolean realTypo =
                                                !candidate
                                                    .equals(
                                                        correction
                                                    );

                                        int blockType =
                                                customTypoKeys
                                                    .contains(
                                                        candidate
                                                    )
                                                ? 4
                                                : 2;

                                        intermediateBlocks.add(
                                                new TextBlock(
                                                        candidate,
                                                        correction,
                                                        realTypo,
                                                        1.0f,
                                                        blockType
                                                )
                                        );

                                        cursor += length;
                                        matchedTypo = true;
                                        break;
                                    }
                                }

                                if (matchedTypo) {
                                    continue;
                                }

                                for (
                                    int ruleIndex = 0;
                                    ruleIndex <
                                    gramRules.size();
                                    ruleIndex++
                                ) {
                                    GramRule rule =
                                            gramRules.get(
                                                    ruleIndex
                                            );

                                    Matcher matcher =
                                            gramMatchers[
                                                ruleIndex
                                            ];

                                    matcher.region(
                                            cursor,
                                            sentence.length()
                                    );

                                    if (!matcher.lookingAt()) {
                                        continue;
                                    }

                                    String group1 =
                                            matcher.group(1);
                                    String group2 =
                                            matcher.group(2);
                                    String group3 =
                                            matcher.group(3);

                                    String[] selected =
                                            rule.options[
                                                ThreadLocalRandom
                                                    .current()
                                                    .nextInt(
                                                        rule.options
                                                            .length
                                                    )
                                            ];

                                    String replacement1 =
                                            selected[0] != null
                                            ? selected[0]
                                            : group1;

                                    String replacement3 =
                                            selected.length > 1 &&
                                            selected[1] != null
                                            ? selected[1]
                                            : group3;

                                    String explanation =
                                            selected.length > 2 &&
                                            selected[2] != null
                                            ? selected[2]
                                            : "";

                                    boolean group1Error =
                                            !group1.equals(
                                                replacement1
                                            ) ||
                                            (
                                                !explanation
                                                    .isEmpty() &&
                                                selected[0] !=
                                                null
                                            );

                                    boolean group3Error =
                                            !group3.equals(
                                                replacement3
                                            ) ||
                                            (
                                                !explanation
                                                    .isEmpty() &&
                                                selected.length >
                                                1 &&
                                                selected[1] !=
                                                null
                                            );

                                    if (group1Error) {
                                        TextBlock block =
                                                new TextBlock(
                                                        group1,
                                                        replacement1,
                                                        true,
                                                        1.0f,
                                                        6
                                                );

                                        block.exp =
                                                explanation;

                                        intermediateBlocks
                                                .add(block);
                                    } else {
                                        for (
                                            int i = 0;
                                            i <
                                            group1.length();
                                            i++
                                        ) {
                                            String character =
                                                    String.valueOf(
                                                            group1
                                                                .charAt(i)
                                                    );

                                            intermediateBlocks
                                                    .add(
                                                        new TextBlock(
                                                            character,
                                                            character,
                                                            false,
                                                            0f,
                                                            0
                                                        )
                                                    );
                                        }
                                    }

                                    for (
                                        int i = 0;
                                        i <
                                        group2.length();
                                        i++
                                    ) {
                                        String character =
                                                String.valueOf(
                                                        group2
                                                            .charAt(i)
                                                );

                                        intermediateBlocks.add(
                                                new TextBlock(
                                                        character,
                                                        character,
                                                        false,
                                                        0f,
                                                        0
                                                )
                                        );
                                    }

                                    if (group3Error) {
                                        TextBlock block =
                                                new TextBlock(
                                                        group3,
                                                        replacement3,
                                                        true,
                                                        1.0f,
                                                        6
                                                );

                                        block.exp =
                                                explanation;

                                        intermediateBlocks
                                                .add(block);
                                    } else {
                                        for (
                                            int i = 0;
                                            i <
                                            group3.length();
                                            i++
                                        ) {
                                            String character =
                                                    String.valueOf(
                                                            group3
                                                                .charAt(i)
                                                    );

                                            intermediateBlocks
                                                    .add(
                                                        new TextBlock(
                                                            character,
                                                            character,
                                                            false,
                                                            0f,
                                                            0
                                                        )
                                                    );
                                        }
                                    }

                                    cursor = matcher.end();
                                    matchedGrammar = true;
                                    break;
                                }

                                if (matchedGrammar) {
                                    continue;
                                }

                                if (
                                    cursor > 0 &&
                                    cursor + 1 <
                                    sentence.length()
                                ) {
                                    char numberCharacter =
                                            sentence.charAt(
                                                    cursor - 1
                                            );

                                    char quantifierCharacter =
                                            sentence.charAt(
                                                    cursor
                                            );

                                    char nounCharacter =
                                            sentence.charAt(
                                                    cursor + 1
                                            );

                                    if (
                                        KNOWN_QUANTS.indexOf(
                                                quantifierCharacter
                                        ) >= 0 &&
                                        NUMS.indexOf(
                                                numberCharacter
                                        ) >= 0
                                    ) {
                                        QuantifierRule rule =
                                                quantRules.get(
                                                        nounCharacter
                                                );

                                        if (
                                            rule != null &&
                                            rule.allowedQuants
                                                .indexOf(
                                                    quantifierCharacter
                                                ) < 0
                                        ) {
                                            char nextCharacter =
                                                    cursor + 2 <
                                                    sentence.length()
                                                    ? sentence
                                                        .charAt(
                                                            cursor + 2
                                                        )
                                                    : '\0';

                                            if (
                                                isSafeCharAfterNoun(
                                                        nextCharacter
                                                )
                                            ) {
                                                intermediateBlocks
                                                        .add(
                                                            new TextBlock(
                                                                String.valueOf(
                                                                        quantifierCharacter
                                                                ),
                                                                rule.primaryQuant,
                                                                true,
                                                                1.0f,
                                                                3
                                                            )
                                                        );

                                                cursor += 1;
                                                matchedQuantifier =
                                                        true;
                                            }
                                        }
                                    }
                                }

                                if (matchedQuantifier) {
                                    continue;
                                }

                                String character =
                                        String.valueOf(
                                                sentence
                                                    .charAt(
                                                        cursor
                                                    )
                                        );

                                intermediateBlocks.add(
                                        new TextBlock(
                                                character,
                                                character,
                                                false,
                                                0f,
                                                0
                                        )
                                );

                                cursor++;
                            }


                            StringBuilder inferenceBuilder =
                                    new StringBuilder(
                                            sentence.length()
                                    );

                            for (
                                TextBlock block :
                                intermediateBlocks
                            ) {
                                inferenceBuilder.append(
                                        block.current
                                );
                            }

                            String inferenceText =
                                    inferenceBuilder
                                        .toString();

                            TextBlock[] positionMap =
                                    new TextBlock[
                                        inferenceText
                                            .length()
                                    ];

                            int mapCursor = 0;

                            for (
                                TextBlock block :
                                intermediateBlocks
                            ) {
                                for (
                                    int i = 0;
                                    i <
                                    block.current.length();
                                    i++
                                ) {
                                    positionMap[
                                        mapCursor++
                                    ] = block;
                                }
                            }

                            boolean[] ignored =
                                    new boolean[
                                        inferenceText.length()
                                    ];

                            int ignoredCursor = 0;

                            for (
                                TextBlock block :
                                intermediateBlocks
                            ) {
                                int length =
                                        block.current.length();

                                if (block.type != 0) {
                                    Arrays.fill(
                                            ignored,
                                            ignoredCursor,
                                            ignoredCursor +
                                            length,
                                            true
                                    );
                                }

                                ignoredCursor += length;
                            }

                            for (
                                String ignoredWord :
                                IGNORE_WORDS
                            ) {
                                int index =
                                        inferenceText.indexOf(
                                                ignoredWord
                                        );

                                while (index >= 0) {
                                    Arrays.fill(
                                            ignored,
                                            index,
                                            index +
                                            ignoredWord.length(),
                                            true
                                    );

                                    index =
                                            inferenceText.indexOf(
                                                    ignoredWord,
                                                    index + 1
                                            );
                                }
                            }

                            boolean hasTarget = false;

                            for (
                                int i = 0;
                                i <
                                inferenceText.length();
                                i++
                            ) {
                                char character =
                                        inferenceText.charAt(
                                                i
                                        );

                                if (
                                    (
                                        character == '的' ||
                                        character == '地' ||
                                        character == '得'
                                    ) &&
                                    !ignored[i]
                                ) {
                                    hasTarget = true;
                                    break;
                                }
                            }

                            if (
                                hasTarget &&
                                temperature > 0.0f
                            ) {
                                float[] scores;
                                int vocabularySize = 3;

                                if (fastMode) {
                                    long unknownId =
                                            fastVocab
                                                .getOrDefault(
                                                        "[UNK]",
                                                        1L
                                                );

                                    long maskToken =
                                            fastVocab
                                                .getOrDefault(
                                                        "[MASK]",
                                                        2L
                                                );

                                    long[] ids =
                                            new long[
                                                inferenceText
                                                    .length()
                                            ];

                                    for (
                                        int i = 0;
                                        i <
                                        inferenceText.length();
                                        i++
                                    ) {
                                        char character =
                                                inferenceText
                                                    .charAt(i);

                                        if (
                                            !ignored[i] &&
                                            (
                                                character == '的' ||
                                                character == '地' ||
                                                character == '得'
                                            )
                                        ) {
                                            ids[i] =
                                                    maskToken;
                                        } else {
                                            ids[i] =
                                                    fastVocab
                                                        .getOrDefault(
                                                            String
                                                                .valueOf(
                                                                    character
                                                                ),
                                                            unknownId
                                                        );
                                        }
                                    }

                                    Tensor inputTensor =
                                            Tensor.fromBlob(
                                                    ids,
                                                    new long[]{
                                                            1,
                                                            inferenceText
                                                                .length()
                                                    }
                                            );

                                    scores =
                                            fastModule
                                                .forward(
                                                    IValue.from(
                                                        inputTensor
                                                    )
                                                )
                                                .toTensor()
                                                .getDataAsFloatArray();
                                } else {
                                    int exactLength =
                                            inferenceText.length() +
                                            2;

                                    long[] ids =
                                            new long[
                                                exactLength
                                            ];

                                    long[] masks =
                                            new long[
                                                exactLength
                                            ];

                                    long[] types =
                                            new long[
                                                exactLength
                                            ];

                                    ids[0] = clsId;
                                    masks[0] = 1;
                                    types[0] = 0;

                                    for (
                                        int i = 0;
                                        i <
                                        inferenceText.length();
                                        i++
                                    ) {
                                        char character =
                                                inferenceText
                                                    .charAt(i);

                                        if (
                                            !ignored[i] &&
                                            (
                                                character == '的' ||
                                                character == '地' ||
                                                character == '得'
                                            )
                                        ) {
                                            ids[i + 1] =
                                                    maskId;
                                        } else {
                                            ids[i + 1] =
                                                    proVocab
                                                        .getOrDefault(
                                                            String
                                                                .valueOf(
                                                                    character
                                                                ),
                                                            unkId
                                                        );
                                        }

                                        masks[i + 1] = 1;
                                        types[i + 1] = 0;
                                    }

                                    ids[exactLength - 1] =
                                            sepId;

                                    masks[exactLength - 1] =
                                            1;

                                    types[exactLength - 1] =
                                            0;

                                    Tensor idsTensor =
                                            Tensor.fromBlob(
                                                    ids,
                                                    new long[]{
                                                            1,
                                                            exactLength
                                                    }
                                            );

                                    Tensor masksTensor =
                                            Tensor.fromBlob(
                                                    masks,
                                                    new long[]{
                                                            1,
                                                            exactLength
                                                    }
                                            );

                                    Tensor typesTensor =
                                            Tensor.fromBlob(
                                                    types,
                                                    new long[]{
                                                            1,
                                                            exactLength
                                                    }
                                            );

                                    IValue output =
                                            proModule.forward(
                                                    IValue.from(
                                                            idsTensor
                                                    ),
                                                    IValue.from(
                                                            masksTensor
                                                    ),
                                                    IValue.from(
                                                            typesTensor
                                                    )
                                            );

                                    Tensor outputTensor =
                                            output.isTuple()
                                            ? output
                                                .toTuple()[0]
                                                .toTensor()
                                            : output.toTensor();

                                    long[] shape =
                                            outputTensor.shape();

                                    vocabularySize =
                                            (int) shape[
                                                shape.length - 1
                                            ];

                                    scores =
                                            outputTensor
                                                .getDataAsFloatArray();
                                }

                                float[] probabilities =
                                        new float[3];

                                for (
                                    int i = 0;
                                    i <
                                    inferenceText.length();
                                    i++
                                ) {
                                    char character =
                                            inferenceText
                                                .charAt(i);

                                    if (
                                        ignored[i] ||
                                        (
                                            character != '的' &&
                                            character != '地' &&
                                            character != '得'
                                        )
                                    ) {
                                        continue;
                                    }

                                    float logit0;
                                    float logit1;
                                    float logit2;

                                    if (fastMode) {
                                        int base = i * 3;

                                        logit0 =
                                                scores[base];
                                        logit1 =
                                                scores[
                                                    base + 1
                                                ];
                                        logit2 =
                                                scores[
                                                    base + 2
                                                ];
                                    } else {
                                        int sequencePosition =
                                                i + 1;

                                        int base =
                                                sequencePosition *
                                                vocabularySize;

                                        logit0 =
                                                scores[
                                                    base +
                                                    (int) deId
                                                ];

                                        logit1 =
                                                scores[
                                                    base +
                                                    (int) diId
                                                ];

                                        logit2 =
                                                scores[
                                                    base +
                                                    (int) de2Id
                                                ];
                                    }

                                    softmax3Stable(
                                            logit0,
                                            logit1,
                                            logit2,
                                            temperature,
                                            probabilities
                                    );

                                    int maximumIndex = 0;

                                    float maximumProbability =
                                            probabilities[0];

                                    if (
                                        probabilities[1] >
                                        maximumProbability
                                    ) {
                                        maximumProbability =
                                                probabilities[1];

                                        maximumIndex = 1;
                                    }

                                    if (
                                        probabilities[2] >
                                        maximumProbability
                                    ) {
                                        maximumProbability =
                                                probabilities[2];

                                        maximumIndex = 2;
                                    }

                                    float threshold =
                                            maximumIndex == 1
                                            ? thresholdDi
                                            : (
                                                maximumIndex ==
                                                2
                                                ? thresholdDe3
                                                : thresholdDe
                                            );

                                    String prediction =
                                            labels[
                                                maximumIndex
                                            ];

                                    if (
                                        prediction.equals(
                                            String.valueOf(
                                                character
                                            )
                                        ) ||
                                        maximumProbability <
                                        threshold
                                    ) {
                                        continue;
                                    }

                                    TextBlock block =
                                            positionMap[i];

                                    block.current =
                                            prediction;

                                    block.modelCorrected =
                                            prediction;

                                    block.isMutable = true;
                                    block.conf =
                                            maximumProbability;
                                    block.type = 1;
                                }
                            }

                            List<TextBlock>
                                    finalSentenceBlocks =
                                    mergeNormalBlocks(
                                            intermediateBlocks
                                    );

                            List<List<TextBlock>>
                                    errorGroups =
                                    groupErrorClauses(
                                            splitIntoRawClauses(
                                                    finalSentenceBlocks
                                            )
                                    );

                            if (!errorGroups.isEmpty()) {
                                StringBuilder sentenceErrors =
                                        new StringBuilder();

                                for (
                                    List<TextBlock> group :
                                    errorGroups
                                ) {
                                    List<TextBlock>
                                            errorsInGroup =
                                            new ArrayList<>();

                                    for (
                                        TextBlock block :
                                        group
                                    ) {
                                        if (
                                            isBlockError(
                                                    block
                                            )
                                        ) {
                                            errorsInGroup.add(
                                                    block
                                            );
                                        }
                                    }

                                    sentenceErrors.append(
                                            "<font color='#2196F3'><b>["
                                    );

                                    for (
                                        int errorIndex = 0;
                                        errorIndex <
                                        errorsInGroup.size();
                                        errorIndex++
                                    ) {
                                        sentenceErrors.append(
                                                liveErrorCount +
                                                errorIndex +
                                                1
                                        );

                                        if (
                                            errorIndex <
                                            errorsInGroup
                                                .size() -
                                            1
                                        ) {
                                            sentenceErrors
                                                    .append(",");
                                        }
                                    }

                                    sentenceErrors.append(
                                            "]</b></font> "
                                    );

                                    for (
                                        TextBlock block :
                                        group
                                    ) {
                                        String safeOriginal =
                                                escapeHtmlQuick(
                                                        block.original
                                                );

                                        String safeCurrent =
                                                escapeHtmlQuick(
                                                        block.current
                                                );

                                        if (
                                            isBlockError(
                                                    block
                                            )
                                        ) {
                                            liveErrorCount++;

                                            String detail =
                                                    block.type ==
                                                    1
                                                    ? String.format(
                                                        Locale.getDefault(),
                                                        " (置信度:%.2f)",
                                                        block.conf
                                                      )
                                                    : (
                                                        block.type ==
                                                        4
                                                        ? " (自定义)"
                                                        : ""
                                                    );

                                            if (
                                                block.exp != null &&
                                                !block.exp
                                                    .isEmpty()
                                            ) {
                                                detail +=
                                                        " (" +
                                                        escapeHtmlQuick(
                                                            block.exp
                                                        ) +
                                                        ")";
                                            }

                                            String originalColor =
                                                    block.type ==
                                                    6
                                                    ? "#E53935"
                                                    : "#9E9E9E";

                                            if (
                                                block.current
                                                    .equals(
                                                        block.original
                                                    )
                                            ) {
                                                sentenceErrors
                                                        .append(
                                                            "<font color='#E53935'><b>"
                                                        )
                                                        .append(
                                                            safeOriginal
                                                        )
                                                        .append(
                                                            "</b></font><font color='#9E9E9E'><small>"
                                                        )
                                                        .append(
                                                            detail
                                                        )
                                                        .append(
                                                            "</small></font>"
                                                        );
                                            } else {
                                                sentenceErrors
                                                        .append(
                                                            "<font color='"
                                                        )
                                                        .append(
                                                            originalColor
                                                        )
                                                        .append(
                                                            "'><s>"
                                                        )
                                                        .append(
                                                            safeOriginal
                                                        )
                                                        .append(
                                                            "</s></font> <font color='#E53935'><b>"
                                                        )
                                                        .append(
                                                            safeCurrent
                                                        )
                                                        .append(
                                                            "</b></font><font color='#9E9E9E'><small>"
                                                        )
                                                        .append(
                                                            detail
                                                        )
                                                        .append(
                                                            "</small></font>"
                                                        );
                                            }
                                        } else {
                                            sentenceErrors.append(
                                                    safeOriginal
                                            );
                                        }
                                    }

                                    sentenceErrors.append(
                                            "<br>"
                                    );
                                }

                                liveErrorsHtml.append(
                                        sentenceErrors
                                ).append("<br>");
                            }

                            resultBlocks.add(
                                    finalSentenceBlocks
                            );

                            for (
                                TextBlock block :
                                finalSentenceBlocks
                            ) {
                                if (
                                    livePendingMarker &&
                                    liveDocumentIndex == 1
                                ) {
                                    liveFullText
                                            .append(
                                                "<font color='#757575'>［文档"
                                            )
                                            .append(
                                                liveDocumentIndex
                                            )
                                            .append(
                                                "］</font><br>"
                                            );

                                    liveDocumentIndex++;
                                    livePendingMarker = false;
                                }

                                liveFullText.append(
                                        escapeHtmlQuick(
                                                block.current
                                        )
                                );

                                if (
                                    block.current.contains(
                                        "---------------------------------"
                                    )
                                ) {
                                    liveFullText
                                            .append(
                                                "<br><font color='#757575'>［文档"
                                            )
                                            .append(
                                                liveDocumentIndex
                                            )
                                            .append(
                                                "］</font><br>"
                                            );

                                    liveDocumentIndex++;
                                }
                            }

                            long now =
                                    System.currentTimeMillis();

                            final int currentProgress =
                                    sentenceIndex + 1;

                            if (
                                now -
                                lastUiUpdateTime >
                                350
                            ) {
                                lastUiUpdateTime = now;

                                final String progressHtml =
                                        "<b>AI 正在审查中...</b><br>" +
                                        "已耗时 " +
                                        String.format(
                                                Locale.getDefault(),
                                                "%.1f",
                                                (
                                                    now -
                                                    startTime
                                                ) /
                                                1000.0
                                        ) +
                                        " 秒<br>进度：" +
                                        currentProgress +
                                        " / " +
                                        sentences.length +
                                        "<br><br>" +
                                        (
                                            liveErrorsHtml.length() >
                                            0
                                            ? "<b><font color='#757575'>【发现错误】：</font></b><br>" +
                                              liveErrorsHtml
                                            : ""
                                        ) +
                                        "<br><b><font color='#757575'>【全文预览】：</font></b><br>" +
                                        liveFullText
                                            .toString()
                                            .replace(
                                                "\n",
                                                "<br>"
                                            );

                                final int errorCountSnapshot =
                                        liveErrorCount;

                                AppExecutors.MAIN.post(
                                        () -> {
                                            progressBar
                                                    .setProgress(
                                                            currentProgress
                                                    );

                                            outputText.setText(
                                                    Html.fromHtml(
                                                            progressHtml,
                                                            Html
                                                                .FROM_HTML_MODE_COMPACT
                                                    )
                                            );

                                            if (
                                                !autoScrollEnabled
                                            ) {
                                                return;
                                            }

                                            scrollView.post(
                                                    () -> {
                                                        if (
                                                            errorCountSnapshot >
                                                            0
                                                        ) {
                                                            Layout layout =
                                                                    outputText
                                                                        .getLayout();

                                                            if (
                                                                layout !=
                                                                null
                                                            ) {
                                                                String
                                                                        displayed =
                                                                        outputText
                                                                            .getText()
                                                                            .toString();

                                                                int offset =
                                                                        displayed
                                                                            .indexOf(
                                                                                "【发现错误】："
                                                                            );

                                                                if (
                                                                    offset !=
                                                                    -1
                                                                ) {
                                                                    int line =
                                                                            layout
                                                                                .getLineForOffset(
                                                                                        offset
                                                                                );

                                                                    int y =
                                                                            layout
                                                                                .getLineTop(
                                                                                        line
                                                                                );

                                                                    scrollView
                                                                            .scrollTo(
                                                                                    0,
                                                                                    Math.max(
                                                                                            0,
                                                                                            y -
                                                                                            scrollView
                                                                                                .getHeight() +
                                                                                            150
                                                                                    )
                                                                            );
                                                                }
                                                            }
                                                        } else {
                                                            scrollView
                                                                    .scrollTo(
                                                                            0,
                                                                            0
                                                                    );
                                                        }
                                                    }
                                            );
                                        }
                                );
                            }
                        }

                        allSentencesBlocks =
                                resultBlocks;

                        lastTimeMs =
                                System.currentTimeMillis() -
                                startTime;

                        if (
                            lastSavedHistoryFileId !=
                            null &&
                            !resultBlocks.isEmpty()
                        ) {
                            saveBlocksAsync(
                                    lastSavedHistoryFileId,
                                    resultBlocks
                            );
                        }

                        AppExecutors.MAIN.post(
                                () -> {
                                    isCheckingMain = false;

                                    btnCheck.setText(
                                            "开始纠错"
                                    );

                                    renderFinalBlocks();

                                    btnCheck.setEnabled(true);
                                    btnCopy.setEnabled(true);
                                    btnSaveTxt.setEnabled(
                                            true
                                    );

                                    scrollView.post(
                                            () -> scrollView
                                                .fullScroll(
                                                    View.FOCUS_UP
                                                )
                                    );
                                }
                        );
                    } catch (Exception exception) {
                        final String message =
                                exception.getMessage();

                        AppExecutors.MAIN.post(
                                () -> {
                                    isCheckingMain = false;

                                    btnCheck.setText(
                                            "开始纠错"
                                    );

                                    outputText.setText(
                                            "推理运行中断: " +
                                            message
                                    );

                                    btnCheck.setEnabled(
                                            true
                                    );

                                    btnSaveTxt.setEnabled(
                                            true
                                    );
                                }
                        );
                    } finally {
                        AppExecutors.MAIN.post(
                                () -> {
                                    getWindow().clearFlags(
                                            WindowManager
                                                .LayoutParams
                                                .FLAG_KEEP_SCREEN_ON
                                    );

                                    progressBar
                                            .setVisibility(
                                                    View.INVISIBLE
                                            );
                                }
                        );
                    }
                });
            }


            private void showEditDialog(
                    TextBlock block
            ) {
                if (isManuallyEditedOut) {
                    Toast.makeText(
                            this,
                            "文本已手动编辑，无法使用还原。请长按进入便签模式修改。",
                            Toast.LENGTH_LONG
                    ).show();
                    return;
                }

                if (block.type == 1) {
                    String[] options =
                            {
                                "的",
                                "地",
                                "得",
                                "还原为原字 (" +
                                block.original +
                                ")"
                            };

                    new AlertDialog
                        .Builder(this)
                        .setTitle(
                                "手动修改 (当前：" +
                                block.current +
                                ")"
                        )
                        .setItems(
                                options,
                                (
                                    dialog,
                                    which
                                ) -> {
                                    String choice =
                                            which == 0
                                            ? "的"
                                            : (
                                                which == 1
                                                ? "地"
                                                : (
                                                    which == 2
                                                    ? "得"
                                                    : block
                                                        .original
                                                )
                                            );

                                    block.userModified =
                                            !choice.equals(
                                                block
                                                    .modelCorrected
                                            );

                                    block.current =
                                            choice;

                                    renderFinalBlocks();
                                }
                        )
                        .show();
                } else {
                    String[] options =
                            {
                                "采用修改 (" +
                                block.modelCorrected +
                                ")",
                                "还原 (" +
                                block.original +
                                ")"
                            };

                    new AlertDialog
                        .Builder(this)
                        .setTitle(
                                "手动修改 (当前：" +
                                block.current +
                                ")"
                        )
                        .setItems(
                                options,
                                (
                                    dialog,
                                    which
                                ) -> {
                                    String choice =
                                            which == 0
                                            ? block
                                                .modelCorrected
                                            : block.original;

                                    block.userModified =
                                            !choice.equals(
                                                block
                                                    .modelCorrected
                                            );

                                    block.current =
                                            choice;

                                    renderFinalBlocks();
                                }
                        )
                        .show();
                }
            }

            private void renderFinalBlocks() {
                blockToMainTargetSpan.clear();

                Map<TextBlock, Integer>
                        blockToAbsoluteOffset =
                        new HashMap<>();

                int currentErrors = 0;

                for (
                    List<TextBlock> sentence :
                    allSentencesBlocks
                ) {
                    for (
                        TextBlock block :
                        sentence
                    ) {
                        if (
                            block.isMutable &&
                            (
                                !block.current.equals(
                                    block.original
                                ) ||
                                (
                                    block.exp != null &&
                                    !block.exp.isEmpty()
                                )
                            )
                        ) {
                            currentErrors++;
                        }
                    }
                }

                final int[] baseOffset =
                        {0};

                SpannableStringBuilder fullText =
                        new SpannableStringBuilder();

                SpannableStringBuilder
                        fullEditorText =
                        new SpannableStringBuilder();

                currentClauseLinks.clear();

                Map<TextBlock, TargetSpan>
                        blockToEditorTarget =
                        new HashMap<>();

                boolean multipleDocuments =
                        false;

                outer:
                for (
                    List<TextBlock> sentence :
                    allSentencesBlocks
                ) {
                    for (
                        TextBlock block :
                        sentence
                    ) {
                        if (
                            block.current.contains(
                                "---------------------------------"
                            )
                        ) {
                            multipleDocuments =
                                    true;
                            break outer;
                        }
                    }
                }

                int documentIndex = 1;

                boolean pendingDocumentMarker =
                        multipleDocuments;

                for (
                    List<TextBlock> sentence :
                    allSentencesBlocks
                ) {
                    for (
                        TextBlock block :
                        sentence
                    ) {
                        if (
                            pendingDocumentMarker &&
                            documentIndex == 1
                        ) {
                            String marker =
                                    "［文档" +
                                    documentIndex +
                                    "］\n";

                            int start =
                                    fullText.length();

                            fullText.append(marker);

                            fullText.setSpan(
                                    new ForegroundColorSpan(
                                            0xFF757575
                                    ),
                                    start,
                                    fullText.length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            fullText.setSpan(
                                    new IgnoredInCopySpan(),
                                    start,
                                    fullText.length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            int editorStart =
                                    fullEditorText
                                        .length();

                            fullEditorText.append(
                                    marker
                            );

                            fullEditorText.setSpan(
                                    new ForegroundColorSpan(
                                            0xFF757575
                                    ),
                                    editorStart,
                                    fullEditorText
                                        .length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            fullEditorText.setSpan(
                                    new IgnoredInCopySpan(),
                                    editorStart,
                                    fullEditorText
                                        .length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            documentIndex++;
                            pendingDocumentMarker =
                                    false;
                        }

                        boolean error =
                                block.isMutable &&
                                (
                                    !block.current.equals(
                                        block.original
                                    ) ||
                                    (
                                        block.exp != null &&
                                        !block.exp
                                            .isEmpty()
                                    )
                                );

                        int start =
                                fullText.length();

                        fullText.append(
                                block.current
                        );

                        int spanStart = start;
                        int spanEnd =
                                fullText.length();

                        if (
                            spanStart == spanEnd &&
                            spanStart > 0
                        ) {
                            spanStart--;
                        }

                        int flags =
                                spanStart == spanEnd
                                ? Spanned.SPAN_POINT_MARK
                                : Spanned
                                    .SPAN_EXCLUSIVE_EXCLUSIVE;

                        if (error) {
                            TargetSpan target =
                                    new TargetSpan(
                                            block.current
                                    );

                            blockToMainTargetSpan.put(
                                    block,
                                    target
                            );

                            fullText.setSpan(
                                    target,
                                    spanStart,
                                    spanEnd,
                                    flags
                            );

                            blockToAbsoluteOffset.put(
                                    block,
                                    spanStart
                            );
                        }

                        if (block.isMutable) {
                            EditSpan editSpan =
                                    new EditSpan() {
                                        @Override
                                        public void onClick(
                                                View view
                                        ) {
                                            showEditDialog(
                                                    block
                                            );
                                        }

                                        @Override
                                        public void
                                            updateDrawState(
                                                    TextPaint paint
                                            ) {
                                            paint.setUnderlineText(
                                                    true
                                            );

                                            if (
                                                !block.current
                                                    .equals(
                                                        block
                                                            .original
                                                    ) ||
                                                (
                                                    block.exp !=
                                                    null &&
                                                    !block.exp
                                                        .isEmpty()
                                                )
                                            ) {
                                                if (
                                                    block
                                                        .userModified &&
                                                    !block.current
                                                        .equals(
                                                            block
                                                                .original
                                                        )
                                                ) {
                                                    paint.setColor(
                                                            0xFF4CAF50
                                                    );
                                                } else {
                                                    paint.setColor(
                                                            0xFFE53935
                                                    );
                                                }

                                                paint.setTypeface(
                                                        android.graphics
                                                            .Typeface
                                                            .create(
                                                                    "sans-serif-medium",
                                                                    android.graphics
                                                                        .Typeface
                                                                        .NORMAL
                                                            )
                                                );
                                            } else {
                                                paint.setColor(
                                                        0xFF2196F3
                                                );
                                            }
                                        }
                                    };

                            fullText.setSpan(
                                    editSpan,
                                    spanStart,
                                    spanEnd,
                                    flags
                            );
                        }

                        int editorStart =
                                fullEditorText
                                    .length();

                        fullEditorText.append(
                                block.current
                        );

                        int editorSpanStart =
                                editorStart;

                        int editorSpanEnd =
                                fullEditorText
                                    .length();

                        if (
                            editorSpanStart ==
                            editorSpanEnd &&
                            editorSpanStart > 0
                        ) {
                            editorSpanStart--;
                        }

                        int editorFlags =
                                editorSpanStart ==
                                editorSpanEnd
                                ? Spanned.SPAN_POINT_MARK
                                : Spanned
                                    .SPAN_EXCLUSIVE_EXCLUSIVE;

                        if (block.isMutable) {
                            if (error) {
                                TargetSpan target =
                                        new TargetSpan(
                                                block.current
                                        );

                                blockToEditorTarget.put(
                                        block,
                                        target
                                );

                                fullEditorText.setSpan(
                                        target,
                                        editorSpanStart,
                                        editorSpanEnd,
                                        editorFlags
                                );
                            }

                            if (
                                !block.current.equals(
                                    block.original
                                )
                            ) {
                                fullEditorText.setSpan(
                                        new WavyUnderlineSpan(
                                                0xFF4CAF50
                                        ),
                                        editorSpanStart,
                                        editorSpanEnd,
                                        editorFlags
                                );
                            }
                        }

                        if (
                            block.current.contains(
                                "---------------------------------"
                            )
                        ) {
                            String marker =
                                    "［文档" +
                                    documentIndex +
                                    "］\n";

                            int markerStart =
                                    fullText.length();

                            fullText.append(marker);

                            fullText.setSpan(
                                    new ForegroundColorSpan(
                                            0xFF757575
                                    ),
                                    markerStart,
                                    fullText.length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            fullText.setSpan(
                                    new IgnoredInCopySpan(),
                                    markerStart,
                                    fullText.length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            int editorMarkerStart =
                                    fullEditorText
                                        .length();

                            fullEditorText.append(
                                    marker
                            );

                            fullEditorText.setSpan(
                                    new ForegroundColorSpan(
                                            0xFF757575
                                    ),
                                    editorMarkerStart,
                                    fullEditorText
                                        .length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            fullEditorText.setSpan(
                                    new IgnoredInCopySpan(),
                                    editorMarkerStart,
                                    fullEditorText
                                        .length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            documentIndex++;
                        }
                    }
                }

                SpannableStringBuilder output =
                        new SpannableStringBuilder();

                SpannableStringBuilder editorOutput =
                        new SpannableStringBuilder();

                if (currentErrors == 0) {
                    String header =
                            "检查完毕！未检测到错误。耗时 " +
                            String.format(
                                    Locale.getDefault(),
                                    "%.2f",
                                    lastTimeMs /
                                    1000.0
                            ) +
                            " 秒。\n\n";

                    SpannableString headerSpan =
                            new SpannableString(
                                    header
                            );

                    headerSpan.setSpan(
                            new ForegroundColorSpan(
                                    0xFF4CAF50
                            ),
                            0,
                            header.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    output.append(headerSpan);
                } else {
                    String header =
                            "检查完毕！共更正 " +
                            currentErrors +
                            " 处。耗时 " +
                            String.format(
                                    Locale.getDefault(),
                                    "%.2f",
                                    lastTimeMs /
                                    1000.0
                            ) +
                            " 秒。\n（点击序号可快速跳转）\n\n";

                    SpannableString headerSpan =
                            new SpannableString(
                                    header
                            );

                    headerSpan.setSpan(
                            new ForegroundColorSpan(
                                    0xFF757575
                            ),
                            0,
                            header.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    output.append(headerSpan);

                    SpannableString listHeader =
                            new SpannableString(
                                    "【纠错清单：】\n"
                            );

                    listHeader.setSpan(
                            new ForegroundColorSpan(
                                    0xFF757575
                            ),
                            0,
                            listHeader.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    listHeader.setSpan(
                            new android.text.style
                                .TypefaceSpan(
                                    "sans-serif-medium"
                                ),
                            0,
                            listHeader.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    output.append(listHeader);

                    SpannableString editorListHeader =
                            new SpannableString(
                                    "【纠错清单：】\n"
                            );

                    editorListHeader.setSpan(
                            new ForegroundColorSpan(
                                    0xFF757575
                            ),
                            0,
                            editorListHeader.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    editorListHeader.setSpan(
                            new android.text.style
                                .TypefaceSpan(
                                    "sans-serif-medium"
                                ),
                            0,
                            editorListHeader.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    editorOutput.append(
                            editorListHeader
                    );

                    int listErrorIndex = 0;


                    for (
                        List<TextBlock> sentence :
                        allSentencesBlocks
                    ) {
                        List<List<TextBlock>> clauses =
                                groupErrorClauses(
                                        splitIntoRawClauses(
                                                sentence
                                        )
                                );

                        for (
                            List<TextBlock> clause :
                            clauses
                        ) {
                            List<TextBlock>
                                    errorsInClause =
                                    new ArrayList<>();

                            for (
                                TextBlock block :
                                clause
                            ) {
                                if (isBlockError(block)) {
                                    errorsInClause.add(
                                            block
                                    );
                                }
                            }

                            if (
                                errorsInClause.isEmpty()
                            ) {
                                continue;
                            }

                            int markerStart =
                                    output.length();

                            output.append("[");

                            for (
                                int i = 0;
                                i <
                                errorsInClause.size();
                                i++
                            ) {
                                output.append(
                                        String.valueOf(
                                                listErrorIndex +
                                                i +
                                                1
                                        )
                                );

                                if (
                                    i <
                                    errorsInClause
                                        .size() -
                                    1
                                ) {
                                    output.append(",");
                                }
                            }

                            output.append("] ");

                            JumpSpan jumpSpan =
                                    new JumpSpan() {
                                        @Override
                                        public int
                                            getTargetOffset(
                                                    Spanned text
                                            ) {
                                            for (
                                                TextBlock
                                                        block :
                                                clause
                                            ) {
                                                if (
                                                    !isBlockError(
                                                        block
                                                    )
                                                ) {
                                                    continue;
                                                }

                                                Integer relative =
                                                        blockToAbsoluteOffset
                                                            .get(
                                                                block
                                                            );

                                                if (
                                                    relative !=
                                                    null
                                                ) {
                                                    return baseOffset[0] +
                                                           relative;
                                                }
                                            }

                                            return -1;
                                        }

                                        @Override
                                        public void onClick(
                                                View view
                                        ) {
                                            try {
                                                TextView textView =
                                                        (TextView)
                                                        view;

                                                Spannable text =
                                                        (Spannable)
                                                        textView
                                                            .getText();

                                                int offset =
                                                        getTargetOffset(
                                                                text
                                                        );

                                                if (
                                                    offset < 0 ||
                                                    offset >
                                                    text.length()
                                                ) {
                                                    return;
                                                }

                                                Layout layout =
                                                        textView
                                                            .getLayout();

                                                if (
                                                    layout ==
                                                    null
                                                ) {
                                                    return;
                                                }

                                                int line =
                                                        layout
                                                            .getLineForOffset(
                                                                offset
                                                            );

                                                int y =
                                                        layout
                                                            .getLineTop(
                                                                line
                                                            );

                                                scrollView
                                                        .scrollTo(
                                                                0,
                                                                Math.max(
                                                                        0,
                                                                        y -
                                                                        scrollView
                                                                            .getHeight() /
                                                                        3
                                                                )
                                                        );

                                                flashLine(
                                                        textView,
                                                        text,
                                                        layout,
                                                        line
                                                );
                                            } catch (
                                                Exception ignored
                                            ) {
                                            }
                                        }

                                        @Override
                                        public void
                                            updateDrawState(
                                                    TextPaint paint
                                            ) {
                                            paint.setColor(
                                                    0xFF2196F3
                                            );

                                            paint.setUnderlineText(
                                                    true
                                            );

                                            paint.setTypeface(
                                                    android.graphics
                                                        .Typeface
                                                        .create(
                                                                "sans-serif-medium",
                                                                android.graphics
                                                                    .Typeface
                                                                    .NORMAL
                                                        )
                                            );
                                        }
                                    };

                            output.setSpan(
                                    jumpSpan,
                                    markerStart,
                                    output.length(),
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            for (
                                TextBlock block :
                                clause
                            ) {
                                if (
                                    !isBlockError(block)
                                ) {
                                    output.append(
                                            block.current
                                    );
                                    continue;
                                }

                                int newTextStart;
                                int newTextEnd;

                                if (
                                    block.current.equals(
                                        block.original
                                    )
                                ) {
                                    newTextStart =
                                            output.length();

                                    output.append(
                                            block.original
                                    );

                                    newTextEnd =
                                            output.length();
                                } else {
                                    int oldTextStart =
                                            output.length();

                                    output.append(
                                            block.original
                                    );

                                    if (block.type == 6) {
                                        output.setSpan(
                                                new ColoredStrikethroughSpan(
                                                        0xFF9E9E9E,
                                                        0xFFE53935
                                                ),
                                                oldTextStart,
                                                output.length(),
                                                Spanned
                                                    .SPAN_EXCLUSIVE_EXCLUSIVE
                                        );
                                    } else {
                                        output.setSpan(
                                                new StrikethroughSpan(),
                                                oldTextStart,
                                                output.length(),
                                                Spanned
                                                    .SPAN_EXCLUSIVE_EXCLUSIVE
                                        );

                                        output.setSpan(
                                                new ForegroundColorSpan(
                                                        0xFF9E9E9E
                                                ),
                                                oldTextStart,
                                                output.length(),
                                                Spanned
                                                    .SPAN_EXCLUSIVE_EXCLUSIVE
                                        );
                                    }

                                    output.append(" ");

                                    newTextStart =
                                            output.length();

                                    output.append(
                                            block.current
                                    );

                                    newTextEnd =
                                            output.length();
                                }

                                if (
                                    newTextStart ==
                                    newTextEnd &&
                                    newTextStart > 0
                                ) {
                                    newTextStart--;
                                }

                                int listFlags =
                                        newTextStart ==
                                        newTextEnd
                                        ? Spanned
                                            .SPAN_POINT_MARK
                                        : Spanned
                                            .SPAN_EXCLUSIVE_EXCLUSIVE;

                                EditSpan clickSpan =
                                        new EditSpan() {
                                            @Override
                                            public void onClick(
                                                    View view
                                            ) {
                                                showEditDialog(
                                                        block
                                                );
                                            }

                                            @Override
                                            public void
                                                updateDrawState(
                                                        TextPaint paint
                                                ) {
                                                if (
                                                    !block.current
                                                        .equals(
                                                            block
                                                                .original
                                                        ) ||
                                                    (
                                                        block.exp !=
                                                        null &&
                                                        !block.exp
                                                            .isEmpty()
                                                    )
                                                ) {
                                                    if (
                                                        block
                                                            .userModified &&
                                                        !block.current
                                                            .equals(
                                                                block
                                                                    .original
