                                    )
                            );

                    for (
                        int i = 0;
                        i < records.length();
                        i++
                    ) {
                        JSONObject record =
                                records.getJSONObject(i);

                        String time =
                                record.optString(
                                        "time",
                                        ""
                                );

                        String preview =
                                record.optString(
                                        "preview",
                                        ""
                                );

                        if (
                            preview.isEmpty() &&
                            record.has("text")
                        ) {
                            String raw =
                                    record.optString(
                                            "text",
                                            ""
                                    );

                            preview =
                                    raw.length() > 16
                                    ? raw.substring(0, 16)
                                        .replace(
                                            "\n",
                                            " "
