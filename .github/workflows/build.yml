                                                    block.conf
                                            );

                                    int detailStart =
                                            output.length();

                                    output.append("(")
                                            .append(
                                                confidenceText
                                            )
                                            .append(")");

                                    output.setSpan(
                                            new ForegroundColorSpan(
                                                    0xFF9E9E9E
                                            ),
                                            detailStart,
                                            output.length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );

                                    output.setSpan(
                                            new android.text.style
                                                .RelativeSizeSpan(
                                                    0.85f
                                                ),
                                            detailStart,
                                            output.length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );
                                } else if (
                                    !block.userModified &&
                                    block.type == 4
                                ) {
                                    int detailStart =
                                            output.length();

                                    output.append(
                                            "(自定义)"
                                    );

                                    output.setSpan(
                                            new ForegroundColorSpan(
                                                    0xFF9E9E9E
                                            ),
                                            detailStart,
                                            output.length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );

                                    output.setSpan(
                                            new android.text.style
                                                .RelativeSizeSpan(
                                                    0.85f
                                                ),
                                            detailStart,
                                            output.length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );
                                }

                                if (
                                    !block.userModified &&
                                    block.exp != null &&
                                    !block.exp.isEmpty()
                                ) {
                                    int explanationStart =
                                            output.length();

                                    output.append("(")
                                            .append(
                                                block.exp
                                            )
                                            .append(")");

                                    output.setSpan(
                                            new ForegroundColorSpan(
                                                    0xFF9E9E9E
                                            ),
                                            explanationStart,
                                            output.length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );

                                    output.setSpan(
                                            new android.text.style
                                                .RelativeSizeSpan(
                                                    0.85f
                                                ),
                                            explanationStart,
                                            output.length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );
                                }

                                listErrorIndex++;
                            }

                            output.append("\n");

                            ClauseLink link =
                                    new ClauseLink();

                            int editorMarkerStart =
                                    editorOutput
                                        .length();

                            editorOutput.append("[");

                            for (
                                int i = 0;
                                i <
                                errorsInClause.size();
                                i++
                            ) {
                                editorOutput.append(
                                        String.valueOf(
                                                listErrorIndex -
                                                errorsInClause
                                                    .size() +
                                                i +
                                                1
                                        )
                                );

                                if (
                                    i <
                                    errorsInClause
                                        .size() -
                                    1
                                ) {
                                    editorOutput.append(
                                            ","
                                    );
                                }
                            }

                            editorOutput.append("] ");

                            int editorMarkerEnd =
                                    editorOutput
                                        .length();

                            ListMarkerSpan listMarker =
                                    new ListMarkerSpan();

                            editorOutput.setSpan(
                                    listMarker,
                                    editorMarkerStart,
                                    editorMarkerEnd,
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            editorOutput.setSpan(
                                    new ForegroundColorSpan(
                                            0xFF2196F3
                                    ),
                                    editorMarkerStart,
                                    editorMarkerEnd,
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            editorOutput.setSpan(
                                    new android.text.style
                                        .TypefaceSpan(
                                            "sans-serif-medium"
                                        ),
                                    editorMarkerStart,
                                    editorMarkerEnd,
                                    Spanned
                                        .SPAN_EXCLUSIVE_EXCLUSIVE
                            );

                            link.listMarkerSpan =
                                    listMarker;

                            JumpSpan editorJumpSpan =
                                    new JumpSpan() {
                                        @Override
                                        public int
                                            getTargetOffset(
                                                    Spanned text
                                            ) {
                                            if (
                                                link.isDead ||
                                                link.targetSpans
                                                    .isEmpty()
                                            ) {
                                                return -1;
                                            }

                                            for (
                                                TargetSpan target :
                                                link.targetSpans
                                            ) {
                                                int start =
                                                        text
                                                            .getSpanStart(
                                                                target
                                                            );

                                                if (
                                                    start >= 0 &&
                                                    start <=
                                                    text.length()
                                                ) {
                                                    return start;
                                                }
                                            }

                                            return -1;
                                        }

                                        @Override
