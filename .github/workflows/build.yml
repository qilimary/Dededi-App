            public static List<TextBlock>
                    mergeNormalBlocks(
                            List<TextBlock>
                                    intermediateBlocks
                    ) {
                List<TextBlock> result =
                        new ArrayList<>();

                StringBuilder normalOriginal =
                        new StringBuilder();

                StringBuilder normalCurrent =
                        new StringBuilder();

                for (
                    TextBlock block :
                    intermediateBlocks
                ) {
                    if (
                        block.type == 0 &&
                        !block.isMutable
                    ) {
                        normalOriginal.append(
                                block.original
                        );

                        normalCurrent.append(
                                block.current
                        );
                    } else {
                        if (
                            normalOriginal.length() >
                            0
                        ) {
                            result.add(
                                    new TextBlock(
                                            normalOriginal
                                                .toString(),
                                            normalCurrent
                                                .toString(),
                                            false,
                                            0f,
                                            0
                                    )
                            );

                            normalOriginal.setLength(0);
                            normalCurrent.setLength(0);
                        }

                        result.add(block);
                    }
                }

                if (
                    normalOriginal.length() > 0
                ) {
                    result.add(
                            new TextBlock(
                                    normalOriginal
                                        .toString(),
                                    normalCurrent
                                        .toString(),
                                    false,
                                    0f,
                                    0
                            )
                    );
                }

                return result;
            }

            public static void softmax3Stable(
                    float logit0,
                    float logit1,
                    float logit2,
                    float temperature,
                    float[] output
            ) {
                float safeTemperature =
                        Math.max(
                                0.000001f,
                                temperature
                        );

                float inverse =
                        1.0f /
                        safeTemperature;

                float scaled0 =
                        logit0 * inverse;
                float scaled1 =
                        logit1 * inverse;
                float scaled2 =
                        logit2 * inverse;

                float maximum =
                        Math.max(
                                scaled0,
                                Math.max(
                                        scaled1,
                                        scaled2
                                )
                        );

                float exponential0 =
                        (float) Math.exp(
                                scaled0 -
                                maximum
                        );

                float exponential1 =
                        (float) Math.exp(
                                scaled1 -
                                maximum
                        );

                float exponential2 =
                        (float) Math.exp(
                                scaled2 -
                                maximum
                        );

                float sum =
                        exponential0 +
                        exponential1 +
                        exponential2;

                if (
                    !Float.isFinite(sum) ||
                    sum <= 0.0f
                ) {
                    output[0] =
                            1.0f / 3.0f;
                    output[1] =
                            1.0f / 3.0f;
                    output[2] =
                            1.0f / 3.0f;
                    return;
                }

                output[0] =
                        exponential0 / sum;
                output[1] =
                        exponential1 / sum;
                output[2] =
                        exponential2 / sum;
            }


            public static String serializeBlocks(
                    List<List<TextBlock>> blocks
            ) {
                JSONArray array =
                        new JSONArray();

                try {
                    for (
                        List<TextBlock> sentence :
                        blocks
                    ) {
                        JSONArray sentenceArray =
                                new JSONArray();

                        for (
                            TextBlock block :
                            sentence
                        ) {
                            JSONObject object =
                                    new JSONObject();

                            object.put(
                                    "o",
                                    block.original
                            );
                            object.put(
                                    "c",
                                    block.current
                            );
                            object.put(
                                    "mc",
                                    block.modelCorrected
                            );
                            object.put(
                                    "m",
                                    block.isMutable
                            );
                            object.put(
                                    "f",
                                    block.conf
                            );
                            object.put(
                                    "t",
                                    block.type
                            );
                            object.put(
                                    "u",
                                    block.userModified
                            );

                            if (
                                block.exp != null &&
                                !block.exp.isEmpty()
                            ) {
                                object.put(
                                        "exp",
                                        block.exp
                                );
                            }

                            sentenceArray.put(
                                    object
                            );
                        }

                        array.put(
                                sentenceArray
                        );
                    }
                } catch (Exception ignored) {
                }

                return array.toString();
            }

            public static List<List<TextBlock>>
                    deserializeBlocks(
                            String json
                    ) {
                List<List<TextBlock>> blocks =
                        new ArrayList<>();

                try {
                    JSONArray array =
                            new JSONArray(json);

                    for (
                        int i = 0;
                        i < array.length();
                        i++
                    ) {
                        JSONArray sentenceArray =
                                array.getJSONArray(i);

                        List<TextBlock> sentence =
                                new ArrayList<>();

                        for (
                            int j = 0;
                            j <
                            sentenceArray.length();
                            j++
                        ) {
                            JSONObject object =
                                    sentenceArray
                                        .getJSONObject(j);

                            TextBlock block =
                                    new TextBlock(
                                            object
                                                .getString(
                                                        "o"
                                                ),
                                            object
                                                .getString(
                                                        "c"
                                                ),
                                            object
                                                .getBoolean(
                                                        "m"
                                                ),
                                            (float)
                                            object
                                                .getDouble(
                                                        "f"
                                                ),
                                            object
                                                .getInt(
                                                        "t"
                                                )
                                    );

                            block.modelCorrected =
                                    object
                                        .optString(
                                                "mc",
                                                block.current
                                        );

                            block.userModified =
                                    object
                                        .optBoolean(
                                                "u",
                                                false
                                        );

                            block.exp =
                                    object
                                        .optString(
                                                "exp",
                                                ""
                                        );

                            sentence.add(block);
                        }

                        blocks.add(sentence);
                    }
                } catch (Exception ignored) {
                }

                return blocks;
            }

            public static synchronized void loadTypoMap(
                    Context context
            ) {
                typoMap.clear();
                customTypoKeys.clear();
                maxTypoLen = 0;
                minTypoLen =
                        Integer.MAX_VALUE;

                try {
                    String typoData =
                            getEncryptedStringNative(
                                    context.getAssets(),
                                    "sys_typo.dat"
                            );

                    if (
                        typoData != null &&
                        !typoData.isEmpty()
                    ) {
                        String[] lines =
                                typoData.split("\n");

                        for (String line : lines) {
                            String trimmed =
                                    line.trim();

                            if (trimmed.isEmpty()) {
                                continue;
                            }

                            String[] parts =
                                    trimmed.split(
                                            "\\s+"
                                    );

                            if (parts.length < 2) {
                                continue;
                            }

                            String error =
                                    parts[0];
                            String correction =
                                    parts[1];

                            if (
                                error.equals(
                                    correction
                                )
                            ) {
                                continue;
                            }

                            typoMap.put(
                                    error,
                                    correction
                            );

                            maxTypoLen =
                                    Math.max(
                                            maxTypoLen,
                                            error.length()
                                    );

                            minTypoLen =
                                    Math.min(
                                            minTypoLen,
                                            error.length()
                                    );
                        }
                    }
                } catch (Exception ignored) {
                }

                try {
                    SharedPreferences preferences =
                            context
                                .getSharedPreferences(
                                        "DedediConfig",
                                        Context.MODE_PRIVATE
                                );

                    JSONObject customTypos =
                            new JSONObject(
                                    preferences
                                        .getString(
                                                "custom_typos",
                                                "{}"
                                        )
                            );

                    Iterator<String> keys =
                            customTypos.keys();

                    while (keys.hasNext()) {
                        String error =
                                keys.next();

                        String correction =
                                customTypos
                                    .getString(error);

                        typoMap.put(
                                error,
                                correction
                        );

                        customTypoKeys.add(error);

                        maxTypoLen =
                                Math.max(
                                        maxTypoLen,
                                        error.length()
                                );

                        minTypoLen =
                                Math.min(
                                        minTypoLen,
                                        error.length()
                                );
                    }
                } catch (Exception ignored) {
                }

                if (
                    minTypoLen ==
                    Integer.MAX_VALUE
                ) {
                    minTypoLen = 0;
                }

                typoMapLoaded = true;
            }

            public static void extractTextFromUriAsync(
                    Context context,
                    android.net.Uri uri,
                    TextExtractCallback callback
            ) {
                AppExecutors.MAIN.post(() -> {
                    if (callback != null) {
                        callback.onStart();
                    }
                });

                AppExecutors.IO.execute(() -> {
                    try {
                        String mimeType =
                                context
                                    .getContentResolver()
                                    .getType(uri);

                        String name =
                                getFileName(
                                        context,
                                        uri
                                );

                        if (name != null) {
                            name =
                                    name.toLowerCase(
                                            Locale.ROOT
                                    );
                        }

                        if (
                            (
                                name != null &&
                                (
                                    name.endsWith(
                                            ".jpg"
                                    ) ||
                                    name.endsWith(
                                            ".jpeg"
                                    ) ||
                                    name.endsWith(
                                            ".png"
                                    ) ||
                                    name.endsWith(
                                            ".bmp"
                                    ) ||
                                    name.endsWith(
                                            ".webp"
                                    )
                                )
                            ) ||
                            (
                                mimeType != null &&
                                mimeType.startsWith(
                                        "image/"
                                )
                            )
                        ) {
                            Bitmap bitmap = null;
                            String result = "";

                            try {
                                bitmap =
                                        decodeBitmapFromUri(
                                                context,
                                                uri
                                        );

                                result =
                                        performOcrOnBitmap(
                                                bitmap,
                                                context,
                                                callback
                                        );
                            } finally {
                                if (
                                    bitmap != null &&
                                    !bitmap.isRecycled()
                                ) {
                                    bitmap.recycle();
                                }
                            }

                            final String extracted =
                                    result;

                            AppExecutors.MAIN.post(
                                    () -> {
                                        if (
                                            callback != null
                                        ) {
                                            callback
                                                .onExtracted(
                                                        extracted
                                                );
                                        }
                                    }
                            );

                            return;
                        }

                        if (
                            (
                                name != null &&
                                name.endsWith(".pdf")
                            ) ||
                            "application/pdf".equals(
                                    mimeType
                            )
                        ) {
                            String result =
                                    performOcrOnPdf(
                                            uri,
                                            context,
                                            callback
                                    );

                            AppExecutors.MAIN.post(
                                    () -> {
                                        if (
                                            callback != null
                                        ) {
                                            callback
                                                .onExtracted(
                                                        result
                                                );
                                        }
                                    }
                            );

                            return;
                        }

                        String text =
                                extractTextFromUri(
                                        context,
                                        uri
                                );

                        AppExecutors.MAIN.post(
                                () -> {
                                    if (callback != null) {
                                        callback
                                            .onExtracted(
                                                    text
                                            );
                                    }
                                }
                        );
                    } catch (Exception ignored) {
                        AppExecutors.MAIN.post(
                                () -> {
                                    if (callback != null) {
                                        callback
                                            .onExtracted(
                                                    ""
                                            );
                                    }
                                }
                        );
                    }
                });
            }

            public static Bitmap decodeBitmapFromUri(
                    Context context,
                    android.net.Uri uri
            ) throws Exception {
                if (
                    android.os.Build.VERSION.SDK_INT >=
                    28
                ) {
                    android.graphics.ImageDecoder.Source
                            source =
                            android.graphics.ImageDecoder
                                .createSource(
                                        context
                                            .getContentResolver(),
                                        uri
                                );

                    return android.graphics.ImageDecoder
                            .decodeBitmap(
                                    source,
                                    (
                                        decoder,
                                        info,
                                        imageSource
                                    ) -> decoder
                                            .setAllocator(
                                                    android.graphics
                                                        .ImageDecoder
                                                        .ALLOCATOR_SOFTWARE
                                            )
                            );
                }

                try (
                    InputStream input =
                            context
                                .getContentResolver()
                                .openInputStream(uri)
                ) {
                    if (input == null) {
                        throw new java.io
                            .IOException(
                                "无法打开图片"
                            );
                    }

                    Bitmap bitmap =
                            android.graphics.BitmapFactory
                                .decodeStream(input);

                    if (bitmap == null) {
                        throw new java.io
                            .IOException(
                                "图片解码失败"
                            );
                    }

                    return bitmap;
                }
            }

            public static String cleanOcrText(
                    String text
            ) {
                if (text == null) {
                    return "";
                }

                String[] lines =
                        text.split(
                                "\n",
                                -1
                        );

                StringBuilder builder =
                        new StringBuilder(
                                text.length()
                        );

                boolean first = true;

                for (String line : lines) {
                    String trimmed =
                            line.trim();

                    if (
                        trimmed.length() == 1 &&
                        "个口日目一丨丶卜丿〇回凸凹卐卍了的地得"
                            .contains(trimmed)
                    ) {
                        continue;
                    }

                    if (!first) {
                        builder.append('\n');
                    }

                    builder.append(line);
                    first = false;
                }

                return builder.toString();
            }

            public static int countDarkPixels(
                    Bitmap bitmap,
                    int y,
                    int[] rowPixels
            ) {
                int width =
                        bitmap.getWidth();

                int step =
                        Math.max(
                                1,
                                width / 30
                        );

                int count = 0;

                bitmap.getPixels(
                        rowPixels,
                        0,
                        width,
                        0,
                        y,
                        width,
                        1
                );

                for (
                    int x = 0;
                    x < width;
                    x += step
                ) {
                    int color =
                            rowPixels[x];

                    int red =
                            Color.red(color);
                    int green =
                            Color.green(color);
                    int blue =
                            Color.blue(color);

                    if (
                        red < 220 &&
                        green < 220 &&
                        blue < 220
                    ) {
                        count++;
                    }
                }

                return count;
            }

            public static String performOcrOnBitmap(
                    Bitmap fullBitmap,
                    Context context,
                    TextExtractCallback callback
            ) throws Exception {
                TextRecognizer recognizer =
                        TextRecognition.getClient(
                                new ChineseTextRecognizerOptions
                                    .Builder()
                                    .build()
                        );

                try {
                    StringBuilder fullText =
                            new StringBuilder();

                    List<Integer> splitPoints =
                            new ArrayList<>();

                    splitPoints.add(0);

                    int maximumHeight = 3000;
                    int currentY = 0;

                    int[] rowPixels =
                            new int[
                                fullBitmap.getWidth()
                            ];

                    while (
                        currentY <
                        fullBitmap.getHeight()
                    ) {
                        if (
                            fullBitmap.getHeight() -
                            currentY <=
                            maximumHeight
                        ) {
                            splitPoints.add(
                                    fullBitmap
                                        .getHeight()
                            );
                            break;
                        }

                        int searchStart =
                                Math.max(
                                        currentY +
                                        maximumHeight /
                                        2,
                                        currentY + 10
                                );

                        int searchEnd =
                                Math.min(
                                        currentY +
                                        maximumHeight,
                                        fullBitmap
                                            .getHeight()
                                );

                        int bestBlankHeight = 0;
                        int currentBlankHeight = 0;
                        int potentialSplit =
                                searchEnd;
                        int minimumDarkPixels =
                                Integer.MAX_VALUE;
                        int bestRow = searchEnd;

                        for (
                            int y = searchStart;
                            y < searchEnd;
                            y++
                        ) {
                            int darkPixels =
                                    countDarkPixels(
                                            fullBitmap,
                                            y,
                                            rowPixels
                                    );

                            if (
                                darkPixels <
                                minimumDarkPixels
                            ) {
                                minimumDarkPixels =
                                        darkPixels;
                                bestRow = y;
                            }

                            if (darkPixels <= 5) {
                                currentBlankHeight++;

                                if (
                                    currentBlankHeight >
                                    bestBlankHeight
                                ) {
                                    bestBlankHeight =
                                            currentBlankHeight;

                                    potentialSplit =
                                            y -
                                            currentBlankHeight /
                                            2;
                                }
                            } else {
                                currentBlankHeight = 0;
                            }
                        }

                        int splitY =
                                bestBlankHeight >= 5
                                ? potentialSplit
                                : bestRow;

                        if (splitY <= currentY) {
                            splitY =
                                    Math.min(
                                            currentY +
                                            maximumHeight,
                                            fullBitmap
                                                .getHeight()
                                    );
                        }

                        splitPoints.add(splitY);
                        currentY = splitY;
                    }

                    int totalChunks =
                            splitPoints.size() - 1;

                    for (
                        int i = 0;
                        i < totalChunks;
                        i++
                    ) {
                        final int progress = i + 1;

                        if (callback != null) {
                            AppExecutors.MAIN.post(
                                    () -> callback
                                        .onProgress(
                                                progress,
                                                totalChunks
                                        )
                            );
                        }

                        int startY =
                                splitPoints.get(i);

                        int height =
                                splitPoints.get(i + 1) -
                                startY;

                        Bitmap chunk = null;

                        try {
                            chunk =
                                    Bitmap.createBitmap(
                                            fullBitmap,
                                            0,
                                            startY,
                                            fullBitmap
                                                .getWidth(),
                                            height
                                    );

                            InputImage image =
                                    InputImage.fromBitmap(
                                            chunk,
                                            0
                                    );

                            Task<Text> task =
                                    recognizer.process(
                                            image
                                    );

                            Text recognized =
                                    Tasks.await(task);

                            fullText.append(
                                    recognized.getText()
                            ).append('\n');
                        } finally {
                            if (
                                chunk != null &&
                                chunk != fullBitmap &&
                                !chunk.isRecycled()
                            ) {
                                chunk.recycle();
                            }
                        }
                    }

                    return cleanOcrText(
                            fixPunctuation(
                                    fullText.toString()
                            )
                    );
                } finally {
                    recognizer.close();
                }
            }


            public static String performOcrOnPdf(
                    android.net.Uri uri,
                    Context context,
                    TextExtractCallback callback
            ) throws Exception {
                TextRecognizer recognizer =
                        TextRecognition.getClient(
                                new ChineseTextRecognizerOptions
                                    .Builder()
                                    .build()
                        );

                android.os.ParcelFileDescriptor
                        descriptor = null;

                android.graphics.pdf.PdfRenderer
                        renderer = null;

                try {
                    descriptor =
                            context
                                .getContentResolver()
                                .openFileDescriptor(
                                        uri,
                                        "r"
                                );

                    if (descriptor == null) {
                        return "";
                    }

                    renderer =
                            new android.graphics.pdf
                                .PdfRenderer(
                                        descriptor
                                );

                    StringBuilder fullText =
                            new StringBuilder();

                    int pageCount =
                            renderer.getPageCount();

                    for (
                        int pageIndex = 0;
                        pageIndex < pageCount;
                        pageIndex++
                    ) {
                        final int progress =
                                pageIndex + 1;

                        if (callback != null) {
                            AppExecutors.MAIN.post(
                                    () -> callback
                                        .onProgress(
                                                progress,
                                                pageCount
                                        )
                            );
                        }

                        android.graphics.pdf
                                .PdfRenderer.Page page =
                                null;

                        Bitmap bitmap = null;

                        try {
                            page =
                                    renderer.openPage(
                                            pageIndex
                                    );

                            bitmap =
                                    Bitmap.createBitmap(
                                            page.getWidth() *
                                            2,
                                            page.getHeight() *
                                            2,
                                            Bitmap.Config
                                                .ARGB_8888
                                    );

                            bitmap.eraseColor(
                                    Color.WHITE
                            );

                            page.render(
                                    bitmap,
                                    null,
                                    null,
                                    android.graphics.pdf
                                        .PdfRenderer.Page
                                        .RENDER_MODE_FOR_DISPLAY
                            );

                            InputImage image =
                                    InputImage.fromBitmap(
                                            bitmap,
                                            0
                                    );

                            Text recognized =
                                    Tasks.await(
                                            recognizer
                                                .process(
                                                        image
                                                )
                                    );

                            fullText.append(
                                    recognized.getText()
                            ).append('\n');
                        } finally {
                            if (page != null) {
                                page.close();
                            }

                            if (
                                bitmap != null &&
                                !bitmap.isRecycled()
                            ) {
                                bitmap.recycle();
                            }
                        }
                    }

                    return fixPunctuation(
                            fullText.toString()
                    );
                } finally {
                    if (renderer != null) {
                        renderer.close();
                    }

                    if (descriptor != null) {
                        descriptor.close();
                    }

                    recognizer.close();
                }
            }

            private static final Pattern
                    PUNCT_PATTERN_1 =
                    Pattern.compile(
                            "(?<=[\\u4e00-\\u9fa5])\\.{2,6}"
                    );

            private static final Pattern
                    PUNCT_PATTERN_2 =
                    Pattern.compile(
                            "\\.{2,6}(?=[\\u4e00-\\u9fa5])"
                    );

            public static String fixPunctuation(
                    String text
            ) {
                if (text == null) {
                    return "";
                }

                text =
                        PUNCT_PATTERN_1
                            .matcher(text)
                            .replaceAll("……");

                text =
                        PUNCT_PATTERN_2
                            .matcher(text)
                            .replaceAll("……");

                StringBuilder builder =
                        new StringBuilder(
                                text.length()
                        );

                boolean inQuote = false;

                for (
                    int i = 0;
                    i < text.length();
                    i++
                ) {
                    char character =
                            text.charAt(i);

                    boolean punctuation =
                            character == ',' ||
                            character == '.' ||
                            character == ':' ||
                            character == ';' ||
                            character == '?' ||
                            character == '!' ||
                            character == '"' ||
                            character == '(' ||
                            character == ')' ||
                            character == '\'';

                    if (punctuation) {
                        boolean previousChinese =
                                false;
                        boolean nextChinese =
                                false;

                        for (
                            int j = i - 1;
                            j >=
                            Math.max(
                                    0,
                                    i - 3
                            );
                            j--
                        ) {
                            char previous =
                                    text.charAt(j);

                            if (isChinese(previous)) {
                                previousChinese = true;
                                break;
                            }

                            if (
                                Character.isWhitespace(
                                        previous
                                )
                            ) {
                                continue;
                            }

                            break;
                        }

                        for (
                            int j = i + 1;
                            j <
                            Math.min(
                                    text.length(),
                                    i + 4
                            );
                            j++
                        ) {
                            char next =
                                    text.charAt(j);

                            if (isChinese(next)) {
                                nextChinese = true;
                                break;
                            }

                            if (
                                Character.isWhitespace(
                                        next
                                )
                            ) {
                                continue;
                            }

                            break;
                        }

                        if (
                            previousChinese ||
                            nextChinese
                        ) {
                            if (character == ',') {
                                character = '，';
                            } else if (
                                character == '.'
                            ) {
                                character = '。';
                            } else if (
                                character == ':'
                            ) {
                                character = '：';
                            } else if (
                                character == ';'
                            ) {
                                character = '；';
                            } else if (
                                character == '?'
                            ) {
                                character = '？';
                            } else if (
                                character == '!'
                            ) {
                                character = '！';
                            } else if (
                                character == '('
                            ) {
                                character = '（';
                            } else if (
                                character == ')'
                            ) {
                                character = '）';
                            } else if (
                                character == '"'
                            ) {
                                character =
                                        inQuote
                                        ? '”'
                                        : '“';

                                inQuote = !inQuote;
                            } else if (
                                character == '\''
                            ) {
                                character = '’';
                            }
                        }
                    }

                    builder.append(character);
                }

                return builder.toString();
            }

            public static boolean isChinese(
                    char character
            ) {
                return character >= '\u4e00' &&
                       character <= '\u9fa5';
            }

            public static String extractTextFromUri(
                    Context context,
                    android.net.Uri uri
            ) {
                try {
                    String name =
                            getFileName(
                                    context,
                                    uri
                            );

                    String mimeType =
                            context
                                .getContentResolver()
                                .getType(uri);

                    String lowerName =
                            name == null
                            ? ""
                            : name.toLowerCase(
                                    Locale.ROOT
                            );

                    if (
                        lowerName.endsWith(".docx") ||
                        "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                            .equals(mimeType)
                    ) {
                        try (
                            InputStream input =
                                    context
                                        .getContentResolver()
                                        .openInputStream(uri);
                            java.util.zip.ZipInputStream
                                    zipInput =
                                    new java.util.zip
                                        .ZipInputStream(
                                                input
                                        )
                        ) {
                            java.util.zip.ZipEntry entry;
                            String xmlContent = null;

                            while (
                                (
                                    entry =
                                    zipInput
                                        .getNextEntry()
                                ) != null
                            ) {
                                if (
                                    "word/document.xml"
                                        .equals(
                                            entry.getName()
                                        )
                                ) {
                                    ByteArrayOutputStream
                                            output =
                                            new ByteArrayOutputStream();

                                    byte[] buffer =
                                            new byte[8192];

                                    int count;

                                    while (
                                        (
                                            count =
                                            zipInput.read(
                                                    buffer
                                            )
                                        ) != -1
                                    ) {
                                        output.write(
                                                buffer,
                                                0,
                                                count
                                        );
                                    }

                                    xmlContent =
                                            output.toString(
                                                    "UTF-8"
                                            );

                                    break;
                                }
                            }

                            if (xmlContent == null) {
                                return "";
                            }

                            StringBuilder textBuilder =
                                    new StringBuilder();

                            try {
                                org.xmlpull.v1
                                        .XmlPullParserFactory
                                        factory =
                                        org.xmlpull.v1
                                            .XmlPullParserFactory
                                            .newInstance();

                                org.xmlpull.v1
                                        .XmlPullParser parser =
                                        factory
                                            .newPullParser();

                                parser.setInput(
                                        new java.io
                                            .StringReader(
                                                xmlContent
                                            )
                                );

                                int eventType =
                                        parser.getEventType();

                                boolean inText = false;

                                while (
                                    eventType !=
                                    org.xmlpull.v1
                                        .XmlPullParser
                                        .END_DOCUMENT
                                ) {
                                    String tagName =
                                            parser.getName();

                                    if (
                                        eventType ==
                                        org.xmlpull.v1
                                            .XmlPullParser
                                            .START_TAG
                                    ) {
                                        if (
                                            "t".equals(
                                                tagName
                                            ) ||
                                            "w:t".equals(
                                                tagName
                                            )
                                        ) {
                                            inText = true;
                                        }
                                    } else if (
                                        eventType ==
                                        org.xmlpull.v1
                                            .XmlPullParser
                                            .TEXT &&
                                        inText
                                    ) {
                                        textBuilder.append(
                                                parser.getText()
                                        );
                                    } else if (
                                        eventType ==
                                        org.xmlpull.v1
                                            .XmlPullParser
                                            .END_TAG
                                    ) {
                                        if (
                                            "t".equals(
                                                tagName
                                            ) ||
                                            "w:t".equals(
                                                tagName
                                            )
                                        ) {
                                            inText = false;
                                        } else if (
                                            "p".equals(
                                                tagName
                                            ) ||
                                            "w:p".equals(
                                                tagName
                                            )
                                        ) {
                                            textBuilder.append(
                                                    '\n'
                                            );
                                        }
                                    }

                                    eventType =
                                            parser.next();
                                }
                            } catch (
                                Exception parserError
                            ) {
                                Matcher matcher =
                                        Pattern.compile(
                                                "<w:t[^>]*>(.*?)</w:t>",
                                                Pattern.DOTALL
                                        ).matcher(
                                                xmlContent
                                        );

                                while (matcher.find()) {
                                    textBuilder.append(
                                            matcher.group(1)
                                    );
                                }
                            }

                            String raw =
                                    textBuilder.toString();

                            if (
                                raw.indexOf('&') !=
                                -1
                            ) {
                                raw =
                                        raw.replace(
                                                "&lt;",
                                                "<"
                                        )
                                        .replace(
                                                "&gt;",
                                                ">"
                                        )
                                        .replace(
                                                "&quot;",
                                                "\""
                                        )
                                        .replace(
                                                "&apos;",
                                                "'"
                                        )
                                        .replace(
                                                "&amp;",
                                                "&"
                                        );
                            }

                            return raw;
                        }
                    }

                    if (
                        lowerName.endsWith(".pptx") ||
                        "application/vnd.openxmlformats-officedocument.presentationml.presentation"
                            .equals(mimeType)
                    ) {
                        try (
                            InputStream input =
                                    context
                                        .getContentResolver()
                                        .openInputStream(uri);
                            java.util.zip.ZipInputStream
                                    zipInput =
                                    new java.util.zip
                                        .ZipInputStream(
                                                input
                                        )
                        ) {
                            java.util.zip.ZipEntry entry;
                            StringBuilder textBuilder =
                                    new StringBuilder();

                            byte[] buffer =
                                    new byte[8192];

                            Pattern textPattern =
                                    Pattern.compile(
                                            "<a:t[^>]*>(.*?)</a:t>",
                                            Pattern.DOTALL
                                    );

                            while (
                                (
                                    entry =
                                    zipInput
                                        .getNextEntry()
                                ) != null
                            ) {
                                String entryName =
                                        entry.getName();

                                if (
                                    entryName.startsWith(
                                            "ppt/slides/slide"
                                    ) &&
                                    entryName.endsWith(
                                            ".xml"
                                    )
                                ) {
                                    ByteArrayOutputStream
                                            output =
                                            new ByteArrayOutputStream();

                                    int count;

                                    while (
                                        (
                                            count =
                                            zipInput.read(
                                                    buffer
                                            )
                                        ) != -1
                                    ) {
                                        output.write(
                                                buffer,
                                                0,
                                                count
                                        );
                                    }

                                    String xml =
                                            output.toString(
                                                    "UTF-8"
                                            );

                                    Matcher matcher =
                                            textPattern.matcher(
                                                    xml
                                            );

                                    while (
                                        matcher.find()
                                    ) {
                                        textBuilder.append(
                                                matcher.group(1)
                                        );
                                    }

                                    textBuilder.append(
                                            "\n\n"
                                    );
                                }
                            }

                            String raw =
                                    textBuilder.toString();

                            if (
                                raw.indexOf('&') !=
                                -1
                            ) {
                                raw =
                                        raw.replace(
                                                "&lt;",
                                                "<"
                                        )
                                        .replace(
                                                "&gt;",
                                                ">"
                                        )
                                        .replace(
                                                "&quot;",
                                                "\""
                                        )
                                        .replace(
                                                "&apos;",
                                                "'"
                                        )
                                        .replace(
                                                "&amp;",
                                                "&"
                                        );
                            }

                            return raw.trim();
                        }
                    }

                    try (
                        InputStream input =
                                context
                                    .getContentResolver()
                                    .openInputStream(uri);
                        BufferedReader reader =
                                new BufferedReader(
                                        new InputStreamReader(
                                                input,
                                                StandardCharsets
                                                    .UTF_8
                                        )
                                )
                    ) {
                        StringBuilder builder =
                                new StringBuilder();

                        String line;

                        while (
                            (
                                line =
                                reader.readLine()
                            ) != null
                        ) {
                            builder.append(
                                    line
                            ).append('\n');
                        }

                        return builder.toString();
                    }
                } catch (Exception exception) {
                    exception.printStackTrace();
                    return "";
                }
            }

            public static String getFileName(
                    Context context,
                    android.net.Uri uri
            ) {
                String result = null;

                if (
                    "content".equals(
                        uri.getScheme()
                    )
                ) {
                    try (
                        android.database.Cursor
                                cursor =
                                context
                                    .getContentResolver()
                                    .query(
                                            uri,
                                            null,
                                            null,
                                            null,
                                            null
                                    )
                    ) {
                        if (
                            cursor != null &&
                            cursor.moveToFirst()
                        ) {
                            int index =
                                    cursor.getColumnIndex(
                                            android.provider
                                                .OpenableColumns
                                                .DISPLAY_NAME
                                    );

                            if (index >= 0) {
                                result =
                                        cursor.getString(
                                                index
                                        );
                            }
                        }
                    } catch (Exception ignored) {
                    }
                }

                if (result == null) {
                    result = uri.getPath();

                    if (result != null) {
                        int cut =
                                result.lastIndexOf(
                                        '/'
                                );

                        if (cut != -1) {
                            result =
                                    result.substring(
                                            cut + 1
                                    );
                        }
                    }
                }

                return result;
            }

            private void openFilePicker() {
                Intent intent =
                        new Intent(
                                Intent.ACTION_GET_CONTENT
                        );

                intent.setType("*/*");

                intent.putExtra(
                        Intent.EXTRA_ALLOW_MULTIPLE,
                        true
                );

                intent.putExtra(
                        Intent.EXTRA_MIME_TYPES,
                        new String[]{
                                "text/plain",
                                "text/markdown",
                                "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                                "application/vnd.openxmlformats-officedocument.presentationml.presentation",
                                "application/pdf",
                                "image/*"
                        }
                );

                startActivityForResult(
                        intent,
                        102
                );
            }

            public static String extractTextFromUriSync(
                    Context context,
                    android.net.Uri uri,
                    TextExtractCallback callback
            ) {
                try {
                    String mimeType =
                            context
                                .getContentResolver()
                                .getType(uri);

                    String name =
                            getFileName(
                                    context,
                                    uri
                            );

                    if (name != null) {
                        name =
                                name.toLowerCase(
                                        Locale.ROOT
                                );
                    }

                    if (
                        (
                            name != null &&
                            (
                                name.endsWith(
                                        ".jpg"
                                ) ||
                                name.endsWith(
                                        ".jpeg"
                                ) ||
                                name.endsWith(
                                        ".png"
                                ) ||
                                name.endsWith(
                                        ".bmp"
                                ) ||
                                name.endsWith(
                                        ".webp"
                                )
                            )
                        ) ||
                        (
                            mimeType != null &&
                            mimeType.startsWith(
                                    "image/"
                            )
                        )
                    ) {
                        Bitmap bitmap = null;

                        try {
                            bitmap =
                                    decodeBitmapFromUri(
                                            context,
                                            uri
                                    );

                            return performOcrOnBitmap(
                                    bitmap,
                                    context,
                                    callback
                            );
                        } finally {
                            if (
                                bitmap != null &&
                                !bitmap.isRecycled()
                            ) {
                                bitmap.recycle();
                            }
                        }
                    }

                    if (
                        (
                            name != null &&
                            name.endsWith(".pdf")
                        ) ||
                        "application/pdf".equals(
                                mimeType
                        )
                    ) {
                        return performOcrOnPdf(
                                uri,
                                context,
                                callback
                        );
                    }

                    return extractTextFromUri(
                            context,
                            uri
                    );
                } catch (Exception ignored) {
                    return "";
                }
            }


            private static String readUtf8File(
                    File file
            ) throws Exception {
                try (
                    FileInputStream input =
                            new FileInputStream(file);
                    ByteArrayOutputStream output =
                            new ByteArrayOutputStream(
                                    (int)
                                    Math.min(
                                            file.length(),
                                            64 * 1024
                                    )
                            )
                ) {
                    byte[] buffer =
                            new byte[16 * 1024];

                    int count;

                    while (
                        (
                            count =
                            input.read(buffer)
                        ) != -1
                    ) {
                        output.write(
                                buffer,
                                0,
                                count
                        );
                    }

                    return new String(
                            output.toByteArray(),
                            StandardCharsets.UTF_8
                    );
                }
            }

            private static void writeUtf8Atomic(
                    File target,
                    String text
            ) throws Exception {
                File temporary =
                        new File(
                                target.getParentFile(),
                                target.getName() +
                                ".tmp"
                        );

                try (
                    FileOutputStream output =
                            new FileOutputStream(
                                    temporary
                            )
                ) {
                    output.write(
                            text.getBytes(
                                    StandardCharsets.UTF_8
                            )
                    );
                    output.flush();
                    output.getFD().sync();
                }

                if (
                    target.exists() &&
                    !target.delete()
                ) {
                    temporary.delete();
                    throw new java.io.IOException(
                            "无法替换旧文件"
                    );
                }

                if (
                    !temporary.renameTo(target)
                ) {
                    temporary.delete();
                    throw new java.io.IOException(
                            "文件替换失败"
                    );
                }
            }

            private void saveHistory(
                    String text,
                    String existingFileId
            ) {
                if (
                    text == null ||
                    text.trim().isEmpty()
                ) {
                    return;
                }

                String resolvedFileId =
                        existingFileId;

                try {
                    JSONArray records =
                            new JSONArray(
                                    sp.getString(
                                            "history_records",
                                            "[]"
                                    )
                            );

                    if (records.length() > 0) {
                        JSONObject latest =
                                records.getJSONObject(0);

                        boolean sameHash =
                                latest.optInt(
                                        "textHash",
                                        Integer.MIN_VALUE
                                ) == text.hashCode();

                        boolean sameLength =
                                !latest.has(
                                        "textLength"
                                ) ||
                                latest.optInt(
                                        "textLength",
                                        -1
                                ) == text.length();

                        if (
                            sameHash &&
                            sameLength
                        ) {
                            String latestId =
                                    latest.optString(
                                            "file",
                                            ""
                                    );

                            if (!latestId.isEmpty()) {
                                resolvedFileId =
                                        latestId;
                            }
                        }
                    }
                } catch (Exception ignored) {
                }

                if (
                    resolvedFileId == null ||
                    resolvedFileId.isEmpty()
                ) {
                    resolvedFileId =
                            UUID.randomUUID()
                                .toString();
                }

                lastSavedHistoryFileId =
                        resolvedFileId;

                final String fileId =
                        resolvedFileId;
                final String textSnapshot =
                        text;

                AppExecutors.IO.execute(() -> {
                    try {
                        JSONArray historyArray =
                                new JSONArray(
                                        sp.getString(
                                                "history_records",
                                                "[]"
                                        )
                                );

                        JSONArray filtered =
                                new JSONArray();

                        for (
                            int i = 0;
                            i <
                            historyArray.length();
                            i++
                        ) {
                            JSONObject object =
                                    historyArray
                                        .getJSONObject(i);

                            if (
                                !fileId.equals(
                                    object.optString(
                                            "file",
                                            ""
                                    )
                                )
                            ) {
                                filtered.put(object);
                            }
                        }

                        JSONObject newRecord =
                                new JSONObject();

                        newRecord.put(
                                "time",
                                new SimpleDateFormat(
                                        "yyyy-MM-dd HH:mm:ss",
                                        Locale.getDefault()
                                ).format(new Date())
                        );

                        newRecord.put(
                                "textHash",
                                textSnapshot.hashCode()
                        );

                        newRecord.put(
                                "textLength",
                                textSnapshot.length()
                        );

                        String preview =
                                textSnapshot.length() > 16
                                ? textSnapshot
                                    .substring(0, 16)
                                    .replace("\n", " ") +
                                  "..."
                                : textSnapshot.replace(
                                    "\n",
                                    " "
                                );

                        newRecord.put(
                                "preview",
                                preview
                        );

                        newRecord.put(
                                "file",
                                fileId
                        );

                        File directory =
                                new File(
                                        getFilesDir(),
                                        "history"
                                );

                        if (
                            !directory.exists() &&
                            !directory.mkdirs()
                        ) {
                            return;
                        }

                        writeUtf8Atomic(
                                new File(
                                        directory,
                                        fileId + ".txt"
                                ),
                                textSnapshot
                        );

                        JSONArray finalArray =
                                new JSONArray();

                        finalArray.put(newRecord);

                        int keepCount =
                                Math.min(
                                        filtered.length(),
                                        49
                                );

                        for (
                            int i = 0;
                            i < keepCount;
                            i++
                        ) {
                            finalArray.put(
                                    filtered
                                        .getJSONObject(i)
                            );
                        }

                        for (
                            int i = 49;
                            i < filtered.length();
                            i++
                        ) {
                            String oldFileId =
                                    filtered
                                        .getJSONObject(i)
                                        .optString(
                                                "file",
                                                ""
                                        );

                            if (
                                oldFileId.isEmpty()
                            ) {
                                continue;
                            }

                            new File(
                                    directory,
                                    oldFileId + ".txt"
                            ).delete();

                            new File(
                                    directory,
                                    oldFileId +
                                    "_blocks.json"
                            ).delete();

                            new File(
                                    directory,
                                    oldFileId +
                                    "_manual.json"
                            ).delete();
                        }

                        sp.edit()
                                .putString(
                                        "history_records",
                                        finalArray
                                            .toString()
                                )
                                .commit();

                        AppExecutors.MAIN.post(
                                this::renderHistoryUI
                        );
                    } catch (Exception ignored) {
                    }
                });
            }

            private void saveBlocksAsync(
                    String fileId,
                    List<List<TextBlock>> blocks
            ) {
                if (
                    fileId == null ||
                    fileId.isEmpty() ||
                    blocks == null ||
                    blocks.isEmpty()
                ) {
                    return;
                }

                AppExecutors.IO.execute(() -> {
                    try {
                        String json =
                                serializeBlocks(
                                        blocks
                                );

                        File directory =
                                new File(
                                        getFilesDir(),
                                        "history"
                                );

                        if (
                            !directory.exists()
                        ) {
                            directory.mkdirs();
                        }

                        writeUtf8Atomic(
                                new File(
                                        directory,
                                        fileId +
                                        "_blocks.json"
                                ),
                                json
                        );
                    } catch (Exception ignored) {
                    }
                });
            }

            private void saveManualAsync(
                    String fileId,
