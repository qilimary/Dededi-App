                                                ).show();
                                            }

                                            if (cbStar.isChecked()) {
                                                result =
                                                        result.replace(
                                                                "*",
                                                                ""
                                                        );
                                            }

                                            if (cbHash.isChecked()) {
                                                result =
                                                        result.replace(
                                                                "#",
                                                                ""
                                                        );
                                            }

                                            if (cbDash.isChecked()) {
                                                result =
                                                        result.replace(
                                                                "-",
                                                                ""
                                                        );
                                            }

                                            result =
                                                    removeCustomSymbol(
                                                            result,
                                                            c1
                                                    );
                                            result =
                                                    removeCustomSymbol(
                                                            result,
                                                            c2
                                                    );
                                            result =
                                                    removeCustomSymbol(
                                                            result,
                                                            c3
                                                    );
                                            result =
                                                    removeCustomSymbol(
                                                            result,
                                                            c4
                                                    );

                                            if (callback != null) {
                                                callback.onCleaned(result);
                                            }

