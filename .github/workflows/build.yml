                        starCount++;
                    } else if (character == '#') {
                        hashCount++;
                    } else if (character == '-') {
                        dashCount++;
                    }
                }

                if (
                    starCount >= 4 ||
                    hashCount >= 4 ||
                    dashCount >= 4
