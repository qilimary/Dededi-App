            private EditText createSymbolEditText(
                    int viewId
            ) {
                EditText editText =
                        new EditText(this);

                editText.setId(viewId);
                editText.setFilters(
                        new InputFilter[]{
                                new InputFilter
                                        .LengthFilter(1)
                        }
                );

                LinearLayout.LayoutParams params =
                        new LinearLayout.LayoutParams(
                                0,
                                ViewGroup.LayoutParams.WRAP_CONTENT,
                                1
                        );

                params.setMargins(
                        6,
                        -10,
                        6,
                        -10
                );

                editText.setLayoutParams(params);
                editText.setGravity(Gravity.CENTER);
                editText.setTextSize(14f);
                editText.setPadding(0, 0, 0, 0);
                editText.setHint("");
                editText.setScaleX(0.70f);
                editText.setScaleY(0.70f);

                return editText;
            }

            private String removeCustomSymbol(
                    String text,
                    String symbol
            ) {
                if (symbol == null || symbol.isEmpty()) {
                    return text;
                }

                String result =
                        text.replace(symbol, "");

                if (symbol.equals(">")) {
                    result = result.replace("＞", "");
                }

                if (symbol.equals("<")) {
                    result = result.replace("＜", "");
                }

                return result;
            }

            @Override
            public void finish() {
                super.finish();
                overridePendingTransition(0, 0);
                MainActivity.isCleanDialogOpen = false;
            }
        }
