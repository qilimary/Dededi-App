                                            }

                                            boolean corrections =
                                                    false;

                                            if (
                                                textToSave
                                                    .isEmpty()
                                            ) {
                                                textToSave =
                                                        currentRaw;

                                                String format =
                                                        options[
                                                            which
                                                        ].split(
                                                                " "
                                                        )[0];

