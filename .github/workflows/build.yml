                                                        null
                                                    ) {
                                                        editorScroll.post(
                                                                () -> editorScroll
                                                                    .scrollTo(
                                                                            0,
                                                                            Math.max(
                                                                                    0,
                                                                                    y -
                                                                                    editorScroll
                                                                                        .getHeight() /
                                                                                    3
                                                                            )
                                                                    )
                                                        );
                                                    }
                                                } else {
                                                    scrollView
                                                            .scrollTo(
                                                                    0,
