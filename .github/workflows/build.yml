                                                ),
                                            explanationStart,
                                            editorOutput
                                                .length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );
                                }
                            }

                            editorOutput.append("\n");

                            for (
                                TextBlock block :
                                clause
                            ) {
                                if (
                                    !isBlockError(block)
                                ) {
                                    continue;
                                }

                                TargetSpan target =
                                        blockToEditorTarget
                                            .get(block);

                                if (target != null) {
                                    link.targetSpans.add(
                                            target
                                    );
                                }
                            }

                            currentClauseLinks.add(
                                    link
                            );
                        }
                    }

                    SpannableString separator =
                            new SpannableString(
                                    "\n---------------------------------\n\n"
                            );

                    separator.setSpan(
                            new ForegroundColorSpan(
                                    0xFF757575
                            ),
                            0,
                            separator.length(),
                            Spanned
                                .SPAN_EXCLUSIVE_EXCLUSIVE
                    );

                    output.append(separator);
                    editorOutput.append(separator);
                }

                SpannableString fullHeader =
                        new SpannableString(
                                currentErrors > 0
                                ? "【修正后的全文】\n"
                                : "【原文】\n"
                        );

                fullHeader.setSpan(
                        new ForegroundColorSpan(
                                0xFF757575
                        ),
                        0,
                        fullHeader.length(),
                        Spanned
                            .SPAN_EXCLUSIVE_EXCLUSIVE
                );

                fullHeader.setSpan(
                        new android.text.style
                            .TypefaceSpan(
                                "sans-serif-medium"
                            ),
                        0,
                        fullHeader.length(),
                        Spanned
                            .SPAN_EXCLUSIVE_EXCLUSIVE
                );

                output.append(fullHeader);

                SpannableString editorFullHeader =
                        new SpannableString(
