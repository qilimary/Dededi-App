                                    editorRedoStack.clear();

                                    String text =
                                            editable.toString();

                                    List<int[]> replacements =
                                            new ArrayList<>();

                                    int contentStart = 0;

                                    int correctedIndex =
                                            text.indexOf(
                                                    "【修正后的全文】\n"
                                            );

                                    int originalIndex =
                                            text.indexOf(
                                                    "【原文】\n"
                                            );

                                    if (
                                        correctedIndex !=
                                        -1
                                    ) {
                                        contentStart =
                                                correctedIndex +
                                                "【修正后的全文】\n"
                                                    .length();
                                    } else if (
                                        originalIndex !=
                                        -1
                                    ) {
                                        contentStart =
                                                originalIndex +
                                                "【原文】\n"
                                                    .length();
                                    }

                                    int lineStart =
                                            contentStart;

                                    while (
                                        lineStart <
                                        text.length()
                                    ) {
                                        int lineEnd =
                                                text.indexOf(
                                                        '\n',
                                                        lineStart
                                                );

                                        if (lineEnd == -1) {
                                            lineEnd =
                                                    text.length();
                                        }

                                        String line =
                                                text.substring(
                                                        lineStart,
                                                        lineEnd
                                                ).trim();

                                        if (
                                            line.startsWith(
                                                    "［文档"
                                            ) &&
                                            line.endsWith(
                                                    "］"
                                            )
                                        ) {
                                            lineStart =
                                                    lineEnd + 1;
