name: Build Android APK


on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==1.13.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
        python -m pip install gdown==5.2.0 pycryptodome==3.20.0

    - name: Download, Unzip and Preprocess Pro Model
      run: |
        echo "正在利用云端从 Google Drive 下载专业版大模型..."
        gdown 10NTeKyG6JigASVwsekKs3MJl0Ev4Oj29 -O dededi_mobile_model_quantized.zip

        echo "正在解压..."
        unzip -o dededi_mobile_model_quantized.zip

        cat << 'EOF' > convert.py
        import json
        import os

        import torch
        from torch.utils.mobile_optimizer import optimize_for_mobile

        model_path = None
        vocab_path = None

        for root, dirs, files in os.walk('.'):
            if model_path is None and 'model_traced.pt' in files:
                model_path = os.path.join(root, 'model_traced.pt')
            if vocab_path is None and 'tokenizer.json' in files:
                vocab_path = os.path.join(root, 'tokenizer.json')
            if model_path is not None and vocab_path is not None:
                break

        if model_path is None:
            raise FileNotFoundError("未找到 model_traced.pt")
        if vocab_path is None:
            raise FileNotFoundError("未找到 tokenizer.json")

        with open(vocab_path, 'r', encoding='utf-8') as file:
            data = json.load(file)

        raw_vocab = data['model']['vocab']
        clean_vocab = {
            token: int(index)
            for token, index in raw_vocab.items()
        }

        with open('roberta_vocab.json', 'w', encoding='utf-8') as file:
            json.dump(
                clean_vocab,
                file,
                ensure_ascii=False,
                separators=(',', ':')
            )

        model = torch.jit.load(
            model_path,
            map_location='cpu'
        )
        model.eval()

        optimized_model = optimize_for_mobile(model)
        optimized_model._save_for_lite_interpreter(
            'roberta_mobile.ptl'
        )
        EOF

        python convert.py

    - name: Compress and Encrypt Models (Size & Security)
      run: |
        cat << 'EOF' > encrypt.py
        import gzip
        import os
        from pathlib import Path

        from Crypto.Cipher import ARC4

        KEY = b'xT9#mP2!qL5*vN8^cK4@bJ7$zR1%yW0&'

        def encrypt_compressed(data: bytes, compress_level: int) -> bytes:
            compressed = gzip.compress(
                data,
                compresslevel=compress_level,
                mtime=0
            )
            cipher = ARC4.new(KEY)
            return cipher.encrypt(compressed)

        def process_model(file_in: str, file_out: str) -> None:
            source = Path(file_in)
            if not source.exists():
                return

            data = bytearray(source.read_bytes())

            if len(data) > 2 and data[0] == 0x50 and data[1] == 0x4B:
                data[0] = 0x44
                data[1] = 0x45

            Path(file_out).write_bytes(
                encrypt_compressed(
                    bytes(data),
                    compress_level=1
                )
            )

        def process_text(file_in: str, file_out: str) -> None:
            source = Path(file_in)
            if not source.exists():
                return

            Path(file_out).write_bytes(
                encrypt_compressed(
                    source.read_bytes(),
                    compress_level=9
                )
            )

        print("正在加密极速模型...")
        process_model(
            'dededi_mobile.ptl',
            'sys_core_f.dat'
        )

        print("正在加密专业模型...")
        process_model(
            'roberta_mobile.ptl',
            'sys_core_p.dat'
        )

        print("正在加密词表和规则...")
        process_text(
            '错别字.txt',
            'sys_typo.dat'
        )
        process_text(
            'student_vocab.json',
            'sys_vocab_f.dat'
        )
        process_text(
            'roberta_vocab.json',
            'sys_vocab_p.dat'
        )

        print("加密完成！")
        EOF

        python encrypt.py

    - name: Scaffold Android Project
      run: |
        mkdir -p app/src/main/java/com/app/dededi
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/values-night
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/cpp

        cp sys_core_f.dat app/src/main/assets/ || true
        cp sys_core_p.dat app/src/main/assets/
        cp sys_vocab_f.dat app/src/main/assets/ || true
        cp sys_vocab_p.dat app/src/main/assets/
        cp sys_typo.dat app/src/main/assets/ || true
        cp app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=true
        org.gradle.caching=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }

            dependencies {
                classpath "com.android.tools.build:gradle:7.4.2"
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "Dededi"
        include ':app'
        EOF

        cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.10.2)
        project("dededi")

        add_library(
            dededi
            SHARED
            native-lib.cpp
        )

        target_compile_features(
            dededi
            PRIVATE
            cxx_std_11
        )

        target_compile_options(
            dededi
            PRIVATE
            -O2
            -fvisibility=hidden
            -ffunction-sections
            -fdata-sections
        )

        find_library(
            log-lib
            log
        )

        target_link_libraries(
            dededi
            ${log-lib}
            android
            z
            -Wl,--gc-sections
        )
        EOF

        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <cstdio>
        #include <cstdlib>
        #include <cstring>
        #include <cstdint>
        #include <string>
        #include <vector>
        #include <limits>
        #include <unistd.h>
        #include <android/asset_manager.h>
        #include <android/asset_manager_jni.h>
        #include <zlib.h>

        namespace {

        constexpr unsigned char KEY[] =
                "xT9#mP2!qL5*vN8^cK4@bJ7$zR1%yW0&";
        constexpr size_t KEY_LEN = sizeof(KEY) - 1;
        constexpr size_t IO_BUFFER_SIZE = 64 * 1024;

        struct Rc4State {
            unsigned char s[256];
            unsigned int i = 0;
            unsigned int j = 0;
        };

        void rc4Init(Rc4State& state) {
            for (unsigned int n = 0; n < 256; ++n) {
                state.s[n] = static_cast<unsigned char>(n);
            }

            unsigned int j = 0;
            for (unsigned int n = 0; n < 256; ++n) {
                j = (
                    j +
                    state.s[n] +
                    KEY[n % KEY_LEN]
                ) & 0xFFU;

                unsigned char temp = state.s[n];
                state.s[n] = state.s[j];
                state.s[j] = temp;
            }

            state.i = 0;
            state.j = 0;
        }

        void rc4Process(
                Rc4State& state,
                unsigned char* data,
                size_t length
        ) {
            for (size_t n = 0; n < length; ++n) {
                state.i = (state.i + 1U) & 0xFFU;
                state.j = (
                    state.j +
                    state.s[state.i]
                ) & 0xFFU;

                unsigned char temp =
                        state.s[state.i];
                state.s[state.i] =
                        state.s[state.j];
                state.s[state.j] = temp;

                unsigned int keyIndex = (
                    state.s[state.i] +
                    state.s[state.j]
                ) & 0xFFU;

                data[n] ^= state.s[keyIndex];
            }
        }

        bool writeAll(
                FILE* file,
                const unsigned char* data,
                size_t length
        ) {
            size_t written = 0;

            while (written < length) {
                size_t current = fwrite(
                        data + written,
                        1,
                        length - written,
                        file
                );

                if (current == 0) {
                    return false;
                }

                written += current;
            }

            return true;
        }

        struct HeaderPatchState {
            unsigned char pending[2] = {0, 0};
            size_t pendingSize = 0;
            bool completed = false;
        };

        bool writeWithModelHeaderPatch(
                FILE* file,
                const unsigned char* data,
                size_t length,
                HeaderPatchState& state
        ) {
            size_t offset = 0;

            if (!state.completed) {
                while (
                    state.pendingSize < 2 &&
                    offset < length
                ) {
                    state.pending[state.pendingSize++] =
                            data[offset++];
                }

                if (state.pendingSize == 2) {
                    if (
                        state.pending[0] == 0x44 &&
                        state.pending[1] == 0x45
                    ) {
                        state.pending[0] = 0x50;
                        state.pending[1] = 0x4B;
                    }

                    if (!writeAll(
                            file,
                            state.pending,
                            2
                    )) {
                        return false;
                    }

                    state.completed = true;
                }
            }

            if (offset < length) {
                return writeAll(
                        file,
                        data + offset,
                        length - offset
                );
            }

            return true;
        }

        bool streamDecryptAndInflate(
                AAsset* asset,
                const char* outputPath
        ) {
            if (
                asset == nullptr ||
                outputPath == nullptr
            ) {
                return false;
            }

            std::string temporaryPath(outputPath);
            temporaryPath += ".tmp";

            FILE* output =
                    fopen(temporaryPath.c_str(), "wb");

            if (output == nullptr) {
                return false;
            }

            z_stream stream;
            std::memset(
                    &stream,
                    0,
                    sizeof(stream)
            );

            if (
                inflateInit2(
                    &stream,
                    16 + MAX_WBITS
                ) != Z_OK
            ) {
                fclose(output);
                remove(temporaryPath.c_str());
                return false;
            }

            Rc4State rc4;
            rc4Init(rc4);

            std::vector<unsigned char> input(
                    IO_BUFFER_SIZE
            );
            std::vector<unsigned char> outputBuffer(
                    IO_BUFFER_SIZE
            );
            HeaderPatchState headerState;

            bool success = false;
            bool finished = false;

            while (!finished) {
                int readCount = AAsset_read(
                        asset,
                        input.data(),
                        input.size()
                );

                if (readCount <= 0) {
                    break;
                }

                rc4Process(
                        rc4,
                        input.data(),
                        static_cast<size_t>(readCount)
                );

                stream.next_in = input.data();
                stream.avail_in =
                        static_cast<uInt>(readCount);

                do {
                    stream.next_out =
                            outputBuffer.data();
                    stream.avail_out =
                            static_cast<uInt>(
                                outputBuffer.size()
                            );

                    int result = inflate(
                            &stream,
                            Z_NO_FLUSH
                    );

                    if (
                        result != Z_OK &&
                        result != Z_STREAM_END
                    ) {
                        success = false;
                        finished = true;
                        break;
                    }

                    size_t produced =
                            outputBuffer.size() -
                            stream.avail_out;

                    if (
                        produced > 0 &&
                        !writeWithModelHeaderPatch(
                            output,
                            outputBuffer.data(),
                            produced,
                            headerState
                        )
                    ) {
                        success = false;
                        finished = true;
                        break;
                    }

                    if (result == Z_STREAM_END) {
                        success = true;
                        finished = true;
                        break;
                    }
                } while (
                    stream.avail_in > 0 ||
                    stream.avail_out == 0
                );
            }

            if (
                !headerState.completed &&
                headerState.pendingSize > 0
            ) {
                if (!writeAll(
                        output,
                        headerState.pending,
                        headerState.pendingSize
                )) {
                    success = false;
                }
            }

            inflateEnd(&stream);

            if (fflush(output) != 0) {
                success = false;
            }

            int descriptor = fileno(output);
            if (
                descriptor >= 0 &&
                fsync(descriptor) != 0
            ) {
                success = false;
            }

            if (fclose(output) != 0) {
                success = false;
            }

            if (!success) {
                remove(temporaryPath.c_str());
                return false;
            }

            remove(outputPath);

            if (
                rename(
                    temporaryPath.c_str(),
                    outputPath
                ) != 0
            ) {
                remove(temporaryPath.c_str());
                return false;
            }

            return true;
        }

        bool readEntireAsset(
                AAsset* asset,
                std::vector<unsigned char>& destination
        ) {
            if (asset == nullptr) {
                return false;
            }

            off64_t length64 =
                    AAsset_getLength64(asset);

            if (
                length64 < 0 ||
                static_cast<uint64_t>(length64) >
                std::numeric_limits<size_t>::max()
            ) {
                return false;
            }

            size_t length =
                    static_cast<size_t>(length64);

            destination.resize(length);

            size_t offset = 0;

            while (offset < length) {
                int readCount = AAsset_read(
                        asset,
                        destination.data() + offset,
                        length - offset
                );

                if (readCount <= 0) {
                    return false;
                }

                offset +=
                        static_cast<size_t>(readCount);
            }

            return true;
        }

        bool inflateToVector(
                const unsigned char* source,
                size_t sourceLength,
                std::vector<unsigned char>& destination
        ) {
            if (
                sourceLength >
                std::numeric_limits<uInt>::max()
            ) {
                return false;
            }

            z_stream stream;
            std::memset(
                    &stream,
                    0,
                    sizeof(stream)
            );

            if (
                inflateInit2(
                    &stream,
                    16 + MAX_WBITS
                ) != Z_OK
            ) {
                return false;
            }

            stream.next_in =
                    const_cast<Bytef*>(
                        reinterpret_cast<
                            const Bytef*
                        >(source)
                    );
            stream.avail_in =
                    static_cast<uInt>(sourceLength);

            destination.clear();
            destination.reserve(
                    sourceLength < 4096
                    ? 16384
                    : sourceLength * 2
            );

            unsigned char buffer[32 * 1024];
            bool success = false;

            while (true) {
                stream.next_out = buffer;
                stream.avail_out = sizeof(buffer);

                int result = inflate(
                        &stream,
                        Z_NO_FLUSH
                );

                size_t produced =
                        sizeof(buffer) -
                        stream.avail_out;

                if (produced > 0) {
                    destination.insert(
                            destination.end(),
                            buffer,
                            buffer + produced
                    );
                }

                if (result == Z_STREAM_END) {
                    success = true;
                    break;
                }

                if (result != Z_OK) {
                    break;
                }

                if (
                    produced == 0 &&
                    stream.avail_in == 0
                ) {
                    break;
                }
            }

            inflateEnd(&stream);
            return success;
        }

        }  // namespace

        extern "C"
        JNIEXPORT jboolean JNICALL
        Java_com_app_dededi_MainActivity_decryptFileNative(
                JNIEnv* env,
                jclass,
                jobject assetManager,
                jstring assetName,
                jstring outputPath
        ) {
            if (
                assetManager == nullptr ||
                assetName == nullptr ||
                outputPath == nullptr
            ) {
                return JNI_FALSE;
            }

            const char* assetNameChars =
                    env->GetStringUTFChars(
                        assetName,
                        nullptr
                    );

            const char* outputPathChars =
                    env->GetStringUTFChars(
                        outputPath,
                        nullptr
                    );

            if (
                assetNameChars == nullptr ||
                outputPathChars == nullptr
            ) {
                if (assetNameChars != nullptr) {
                    env->ReleaseStringUTFChars(
                            assetName,
                            assetNameChars
                    );
                }

                if (outputPathChars != nullptr) {
                    env->ReleaseStringUTFChars(
                            outputPath,
                            outputPathChars
                    );
                }

                return JNI_FALSE;
            }

            AAssetManager* manager =
                    AAssetManager_fromJava(
                        env,
                        assetManager
                    );

            AAsset* asset =
                    manager == nullptr
                    ? nullptr
                    : AAssetManager_open(
                        manager,
                        assetNameChars,
                        AASSET_MODE_STREAM
                    );

            bool success = false;

            if (asset != nullptr) {
                success = streamDecryptAndInflate(
                        asset,
                        outputPathChars
                );
                AAsset_close(asset);
            }

            env->ReleaseStringUTFChars(
                    assetName,
                    assetNameChars
            );
            env->ReleaseStringUTFChars(
                    outputPath,
                    outputPathChars
            );

            return success
                    ? JNI_TRUE
                    : JNI_FALSE;
        }

        extern "C"
        JNIEXPORT jstring JNICALL
        Java_com_app_dededi_MainActivity_getEncryptedStringNative(
                JNIEnv* env,
                jclass,
                jobject assetManager,
                jstring assetName
        ) {
            if (
                assetManager == nullptr ||
                assetName == nullptr
            ) {
                return env->NewStringUTF("");
            }

            const char* assetNameChars =
                    env->GetStringUTFChars(
                        assetName,
                        nullptr
                    );

            if (assetNameChars == nullptr) {
                return env->NewStringUTF("");
            }

            AAssetManager* manager =
                    AAssetManager_fromJava(
                        env,
                        assetManager
                    );

            AAsset* asset =
                    manager == nullptr
                    ? nullptr
                    : AAssetManager_open(
                        manager,
                        assetNameChars,
                        AASSET_MODE_STREAM
                    );

            env->ReleaseStringUTFChars(
                    assetName,
                    assetNameChars
            );

            if (asset == nullptr) {
                return env->NewStringUTF("");
            }

            std::vector<unsigned char> encrypted;
            bool readOk =
                    readEntireAsset(
                        asset,
                        encrypted
                    );

            AAsset_close(asset);

            if (!readOk) {
                return env->NewStringUTF("");
            }

            Rc4State rc4;
            rc4Init(rc4);
            rc4Process(
                    rc4,
                    encrypted.data(),
                    encrypted.size()
            );

            std::vector<unsigned char> decompressed;

            if (!inflateToVector(
                    encrypted.data(),
                    encrypted.size(),
                    decompressed
            )) {
                return env->NewStringUTF("");
            }

            decompressed.push_back('\0');

            return env->NewStringUTF(
                    reinterpret_cast<const char*>(
                        decompressed.data()
                    )
            );
        }
        EOF

