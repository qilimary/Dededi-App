            public static class MyLinkMovementMethod
                    extends LinkMovementMethod {
                private static MyLinkMovementMethod instance;

                public static MyLinkMovementMethod
                        getInstance() {
                    if (instance == null) {
                        instance =
                                new MyLinkMovementMethod();
                    }
                    return instance;
                }

                @Override
                public boolean onTouchEvent(
                        TextView widget,
                        Spannable buffer,
                        MotionEvent event
                ) {
                    int action =
                            event.getActionMasked();

                    if (
                        action ==
                        MotionEvent.ACTION_UP ||
                        action ==
                        MotionEvent.ACTION_DOWN
                    ) {
                        int x = (int) event.getX();
                        int y = (int) event.getY();

                        x -= widget
                                .getTotalPaddingLeft();
                        y -= widget
                                .getTotalPaddingTop();

                        x += widget.getScrollX();
                        y += widget.getScrollY();

                        Layout layout =
                                widget.getLayout();

                        if (layout != null) {
                            int line =
                                    layout
                                        .getLineForVertical(
                                                y
                                        );

                            int offset =
                                    layout
                                        .getOffsetForHorizontal(
                                                line,
                                                x
                                        );

                            ClickableSpan[] links =
                                    buffer.getSpans(
                                            offset,
                                            offset,
                                            ClickableSpan.class
                                    );

                            if (links.length != 0) {
                                if (
                                    action ==
                                    MotionEvent.ACTION_UP
                                ) {
                                    links[0].onClick(
                                            widget
                                    );
                                }

                                return true;
                            }
                        }
                    }

                    return super.onTouchEvent(
                            widget,
                            buffer,
                            event
                    );
                }
            }

            public static class WavyUnderlineSpan
                    extends android.text.style
                        .ReplacementSpan {
                public int color;

                private final android.graphics.Paint
                        wavePaint;

                private final android.graphics.Path
                        wavePath;

                private float cachedWidth = -1f;
                private float textWidth = -1f;

                public WavyUnderlineSpan(int color) {
                    this.color = color;

                    wavePaint =
                            new android.graphics.Paint(
                                    android.graphics.Paint
                                        .ANTI_ALIAS_FLAG
                            );

                    wavePaint.setColor(color);
                    wavePaint.setStyle(
                            android.graphics.Paint
                                .Style.STROKE
                    );
                    wavePaint.setStrokeWidth(3.5f);

                    wavePath =
                            new android.graphics.Path();
                }

                @Override
                public int getSize(
                        android.graphics.Paint paint,
                        CharSequence text,
                        int start,
                        int end,
                        android.graphics.Paint
                            .FontMetricsInt metrics
                ) {
                    textWidth =
                            paint.measureText(
                                    text,
                                    start,
                                    end
                            );

                    return (int) textWidth;
                }

                @Override
                public void draw(
                        android.graphics.Canvas canvas,
                        CharSequence text,
                        int start,
                        int end,
                        float x,
                        int top,
                        int y,
                        int bottom,
                        android.graphics.Paint paint
                ) {
                    canvas.drawText(
                            text,
                            start,
                            end,
                            x,
                            y,
                            paint
                    );

                    float width =
                            textWidth > 0
                            ? textWidth
                            : paint.measureText(
                                    text,
                                    start,
                                    end
                            );

                    if (cachedWidth != width) {
                        cachedWidth = width;
                        wavePath.reset();

                        float waveLength = 12f;
                        float amplitude = 2.5f;
                        float currentY =
                                paint
                                    .getFontMetrics()
                                    .descent +
                                3;

                        wavePath.moveTo(
                                0,
                                currentY
                        );

                        for (
                            float position = 0;
                            position < width;
                            position += waveLength
                        ) {
                            float nextX =
                                    Math.min(
                                            position +
                                            waveLength,
                                            width
                                    );

                            wavePath.quadTo(
                                    position +
                                    waveLength / 4,
                                    currentY -
                                    amplitude,
                                    position +
                                    waveLength / 2,
                                    currentY
                            );

                            wavePath.quadTo(
                                    position +
                                    waveLength * 3 / 4,
                                    currentY +
                                    amplitude,
                                    nextX,
                                    currentY
                            );
                        }
                    }

                    int saveCount = canvas.save();
                    canvas.translate(x, y);
                    canvas.drawPath(
                            wavePath,
                            wavePaint
                    );
                    canvas.restoreToCount(
                            saveCount
                    );
                }
            }

            public static class ColoredStrikethroughSpan
                    extends android.text.style
                        .ReplacementSpan {
                public int textColor;
                public int lineColor;
                private float cachedWidth = -1f;

                public ColoredStrikethroughSpan(
                        int textColor,
                        int lineColor
                ) {
                    this.textColor = textColor;
                    this.lineColor = lineColor;
                }

                @Override
                public int getSize(
                        android.graphics.Paint paint,
                        CharSequence text,
                        int start,
                        int end,
                        android.graphics.Paint
                            .FontMetricsInt metrics
                ) {
                    cachedWidth =
                            paint.measureText(
                                    text,
                                    start,
                                    end
                            );

                    return (int) cachedWidth;
                }

                @Override
                public void draw(
                        android.graphics.Canvas canvas,
                        CharSequence text,
                        int start,
                        int end,
                        float x,
                        int top,
                        int y,
                        int bottom,
                        android.graphics.Paint paint
                ) {
                    int oldColor =
                            paint.getColor();

                    float oldStrokeWidth =
                            paint.getStrokeWidth();

                    android.graphics.Paint.Style
                            oldStyle =
                            paint.getStyle();

                    paint.setStyle(
                            android.graphics.Paint
                                .Style.FILL
                    );
                    paint.setColor(textColor);

                    canvas.drawText(
                            text,
                            start,
                            end,
                            x,
                            y,
                            paint
                    );

                    paint.setColor(lineColor);
                    paint.setStrokeWidth(
                            paint.getTextSize() /
                            14f
                    );

                    float lineY =
                            y -
                            paint.getTextSize() *
                            0.3f;

                    float width =
                            cachedWidth > 0
                            ? cachedWidth
                            : paint.measureText(
                                    text,
                                    start,
                                    end
                            );

                    canvas.drawLine(
                            x,
                            lineY,
                            x + width,
                            lineY,
                            paint
                    );

                    paint.setColor(oldColor);
                    paint.setStrokeWidth(
                            oldStrokeWidth
                    );
                    paint.setStyle(oldStyle);
                }
            }

            private static void flashLine(
                    TextView textView,
                    Spannable text,
                    Layout layout,
                    int line
            ) {
                int lineStart =
                        layout.getLineStart(line);

                int lineEnd =
                        layout.getLineEnd(line);

                if (
                    lineStart < 0 ||
                    lineEnd < lineStart ||
                    lineEnd > text.length()
                ) {
                    return;
                }

                BackgroundColorSpan flashSpan =
                        new BackgroundColorSpan(
                                0x609E9E9E
                        );

                text.setSpan(
                        flashSpan,
                        lineStart,
                        lineEnd,
                        Spanned
                            .SPAN_EXCLUSIVE_EXCLUSIVE
                );

                textView.invalidate();

                Handler handler =
                        new Handler(
                                Looper.getMainLooper()
                        );

                handler.postDelayed(
                        () -> {
                            try {
                                text.removeSpan(
                                        flashSpan
                                );
                                textView.invalidate();
                            } catch (
                                Exception ignored
                            ) {
                            }
                        },
                        500
                );

                handler.postDelayed(
                        () -> {
                            try {
                                if (
                                    lineStart >= 0 &&
                                    lineEnd <=
                                    text.length()
                                ) {
                                    text.setSpan(
                                            flashSpan,
                                            lineStart,
                                            lineEnd,
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );
                                    textView.invalidate();
                                }
                            } catch (
                                Exception ignored
                            ) {
                            }
                        },
                        800
                );

                handler.postDelayed(
                        () -> {
                            try {
                                text.removeSpan(
                                        flashSpan
                                );
                                textView.invalidate();
                            } catch (
                                Exception ignored
                            ) {
                            }
                        },
                        1300
                );
            }

            public static String
                    extractCleanTextFromSpanned(
                            Spanned spanned
                    ) {
                if (
                    spanned == null ||
                    spanned.length() == 0
                ) {
                    return "";
                }

                IgnoredInCopySpan[] spans =
                        spanned.getSpans(
                                0,
                                spanned.length(),
                                IgnoredInCopySpan.class
                        );

                if (spans.length == 0) {
                    return spanned.toString();
                }

                Arrays.sort(
                        spans,
                        (
                            left,
                            right
                        ) -> Integer.compare(
                                spanned.getSpanStart(
                                        left
                                ),
                                spanned.getSpanStart(
                                        right
                                )
                        )
                );

                StringBuilder result =
                        new StringBuilder(
                                spanned.length()
                        );

                int cursor = 0;

                for (
                    IgnoredInCopySpan span :
                    spans
                ) {
                    int start =
                            Math.max(
                                    0,
                                    spanned.getSpanStart(
                                            span
                                    )
                            );

                    int end =
                            Math.min(
                                    spanned.length(),
                                    spanned.getSpanEnd(
                                            span
                                    )
                            );

                    if (
                        start < 0 ||
                        end < start ||
                        end <= cursor
                    ) {
                        continue;
                    }

                    if (start > cursor) {
                        result.append(
                                spanned,
                                cursor,
                                start
                        );
                    }

                    cursor =
                            Math.max(
                                    cursor,
                                    end
                            );
                }

                if (
                    cursor <
                    spanned.length()
                ) {
                    result.append(
                            spanned,
                            cursor,
                            spanned.length()
                    );
                }

                return result.toString();
            }

