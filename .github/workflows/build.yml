            public void onFloatResultReady() {
                if (
                    !hasNewFloatResult ||
                    !isWaitingForFloatResult
                ) {
                    return;
                }

                hasNewFloatResult = false;
                isWaitingForFloatResult = false;
                isManuallyEditedOut = false;

                if (
                    pendingFloatFileId != null
                ) {
                    lastSavedHistoryFileId =
                            pendingFloatFileId;
                }

                allSentencesBlocks =
                        new ArrayList<>(
                                pendingFloatBlocks
                        );

                lastTimeMs =
                        pendingFloatTimeMs;

                String sync =
                        sp.getString(
                                "sync_text",
                                ""
                        );

                if (
                    !sync.isEmpty() &&
                    !sync.equals(
                        inputText
                            .getText()
                            .toString()
                    )
                ) {
                    boolean old =
                            isRestoringHistory;

                    isRestoringHistory = true;
                    inputText.setText(sync);
                    isRestoringHistory = old;
                }

                renderFinalBlocks();

                btnCopy.setEnabled(true);
                btnCheck.setEnabled(true);
                btnCheck.setText("继续纠错");
                btnSaveTxt.setEnabled(true);

                scrollView.post(
                        () -> scrollView
                            .fullScroll(
                                    View.FOCUS_UP
                            )
                );
            }

            @Override
            protected void onResume() {
                super.onResume();

                String sync =
                        sp.getString(
                                "sync_text",
                                ""
                        );

                if (
                    !sync.isEmpty() &&
                    !sync.equals(
                        inputText
                            .getText()
                            .toString()
                    )
                ) {
                    isRestoringHistory = true;
                    inputText.setText(sync);
                    isRestoringHistory = false;
                }

                boolean savedFast =
                        sp.getBoolean(
                                "is_fast_mode",
                                false
                        );

                if (
                    savedFast !=
                    currentIsFast ||
                    rgMode
                        .getCheckedRadioButtonId() ==
                    -1
                ) {
                    currentIsFast =
                            savedFast;

                    rgMode.check(
                            currentIsFast
                            ? R.id.rbFast
                            : R.id.rbPro
                    );

                    loadSettings(
                            currentIsFast
                    );
                }

                if (
                    hasNewFloatResult &&
                    isWaitingForFloatResult
                ) {
                    onFloatResultReady();
                }
            }

            @Override
            protected void onNewIntent(
                    Intent intent
            ) {
                super.onNewIntent(intent);
                setIntent(intent);
                handleIntent(intent);
            }


            private void handleIntent(
                    Intent intent
            ) {
                if (intent == null) {
                    return;
                }

                if (
                    intent.getBooleanExtra(
                            "FROM_FLOAT_JUMP",
                            false
                    )
                ) {
                    isWaitingForFloatResult =
                            true;

                    if (hasNewFloatResult) {
                        onFloatResultReady();
                    }
                }

                if (
                    Intent.ACTION_SEND.equals(
                            intent.getAction()
                    ) &&
                    intent.getType() != null
                ) {
                    if (
                        "text/plain".equals(
                            intent.getType()
                        )
                    ) {
                        String sharedText =
                                intent.getStringExtra(
                                        Intent.EXTRA_TEXT
                                );

                        if (sharedText != null) {
                            checkAndPromptCleanup(
                                    this,
                                    sharedText,
                                    cleaned -> {
                                        lastSavedHistoryFileId =
                                                null;

                                        inputText.setText(
                                                cleaned
                                        );

                                        sp.edit()
                                                .putString(
                                                        "sync_text",
                                                        cleaned
                                                )
                                                .apply();
                                    }
                            );
                        }
                    } else if (
                        intent.getType()
                            .startsWith(
                                    "image/"
                            )
                    ) {
                        android.net.Uri imageUri;

                        if (
                            android.os.Build.VERSION.SDK_INT >=
                            33
                        ) {
                            imageUri =
                                    intent.getParcelableExtra(
                                            Intent.EXTRA_STREAM,
                                            android.net.Uri.class
                                    );
                        } else {
                            imageUri =
                                    intent.getParcelableExtra(
                                            Intent.EXTRA_STREAM
                                    );
                        }

                        if (imageUri != null) {
                            Toast.makeText(
                                    this,
                                    "正在处理导入图片，请稍候...",
                                    Toast.LENGTH_SHORT
                            ).show();

                            extractTextFromUriAsync(
                                    this,
                                    imageUri,
                                    new TextExtractCallback() {
                                        @Override
                                        public void onStart() {
                                            progressBar
                                                    .setVisibility(
                                                            View.VISIBLE
                                                    );

                                            progressBar
                                                    .setProgress(0);
                                        }

                                        @Override
                                        public void onProgress(
                                                int progress,
                                                int maximum
                                        ) {
                                            progressBar
                                                    .setMax(
                                                            maximum
                                                    );

                                            progressBar
                                                    .setProgress(
                                                            progress
                                                    );
                                        }

                                        @Override
                                        public void onExtracted(
                                                String text
                                        ) {
                                            progressBar
                                                    .setVisibility(
                                                            View.INVISIBLE
                                                    );

                                            if (
                                                text != null &&
                                                !text.trim()
                                                    .isEmpty()
                                            ) {
                                                checkAndPromptCleanup(
                                                        MainActivity.this,
                                                        text,
                                                        cleaned -> {
                                                            lastSavedHistoryFileId =
                                                                    null;

                                                            inputText
                                                                    .setText(
                                                                            cleaned
                                                                    );

                                                            sp.edit()
                                                                    .putString(
                                                                            "sync_text",
                                                                            cleaned
                                                                    )
                                                                    .apply();

                                                            saveHistory(
                                                                    cleaned,
                                                                    null
                                                            );
                                                        }
                                                );
                                            } else {
                                                Toast.makeText(
                                                        MainActivity.this,
                                                        "无法读取图片文字",
                                                        Toast.LENGTH_SHORT
                                                ).show();
                                            }
                                        }
                                    }
                            );
                        }
                    }
                } else if (
                    intent.hasExtra("SYNC_TEXT")
                ) {
                    String syncText =
                            intent.getStringExtra(
                                    "SYNC_TEXT"
                            );

                    if (
                        syncText != null &&
                        !syncText.isEmpty()
                    ) {
                        boolean old =
                                isRestoringHistory;

                        isRestoringHistory = true;
                        inputText.setText(syncText);
                        isRestoringHistory = old;

                        sp.edit()
                                .putString(
                                        "sync_text",
                                        syncText
                                )
                                .apply();
                    }
                }
            }

            private void startFloatingService() {
                Intent intent =
                        new Intent(
                                this,
                                FloatingService.class
                        );

                if (
                    android.os.Build.VERSION.SDK_INT >=
                    android.os.Build.VERSION_CODES.O
                ) {
                    startForegroundService(intent);
                } else {
                    startService(intent);
                }

                Toast.makeText(
                        this,
                        "悬浮窗已开启",
                        Toast.LENGTH_SHORT
                ).show();

                moveTaskToBack(true);
            }

            private boolean hasError(
                    List<TextBlock> clause
            ) {
                for (TextBlock block : clause) {
                    if (
                        block.isMutable &&
                        (
                            !block.current.equals(
                                block.original
                            ) ||
                            block.userModified
                        )
                    ) {
                        return true;
                    }
                }

                return false;
            }

