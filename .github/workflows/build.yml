                                                .length(),
                                            Spanned
                                                .SPAN_EXCLUSIVE_EXCLUSIVE
                                    );
                                }

                                editorOutput.setSpan(
                                        new android.text.style
                                            .TypefaceSpan(
                                                "sans-serif-medium"
                                            ),
                                        editorNewStart,
                                        editorOutput
                                            .length(),
                                        Spanned
                                            .SPAN_EXCLUSIVE_EXCLUSIVE
                                );

                                if (
                                    !block.userModified &&
                                    block.type == 1
                                ) {
                                    String confidenceText =
                                            "置信度: " +
                                            String.format(
                                                    Locale.getDefault(),
                                                    "%.2f",
                                                    block.conf
                                            );

                                    int detailStart =
