        package com.app.dededi;

        import android.os.Handler;
        import android.os.Looper;
        import android.os.Process;

        import java.util.concurrent.ExecutorService;
        import java.util.concurrent.Executors;
        import java.util.concurrent.ThreadFactory;
        import java.util.concurrent.atomic.AtomicInteger;

        public final class AppExecutors {
            public static final Handler MAIN =
                    new Handler(Looper.getMainLooper());

            public static final ExecutorService INFERENCE =
                    Executors.newSingleThreadExecutor(
                            namedFactory(
                                    "Dededi-Inference",
                                    false
                            )
                    );

            public static final ExecutorService IO =
                    Executors.newSingleThreadExecutor(
                            namedFactory(
                                    "Dededi-IO",
                                    true
                            )
                    );

            public static final ExecutorService CPU =
                    Executors.newSingleThreadExecutor(
                            namedFactory(
                                    "Dededi-CPU",
                                    true
                            )
                    );

            private AppExecutors() {
            }

            private static ThreadFactory namedFactory(
                    String prefix,
                    boolean backgroundPriority
            ) {
                AtomicInteger number =
                        new AtomicInteger(1);

                return runnable -> {
                    Thread thread = new Thread(() -> {
                        if (backgroundPriority) {
                            Process.setThreadPriority(
                                    Process.THREAD_PRIORITY_BACKGROUND
                            );
                        }
                        runnable.run();
                    });

                    thread.setName(
                            prefix +
                            "-" +
                            number.getAndIncrement()
                    );

                    return thread;
                };
            }
        }
