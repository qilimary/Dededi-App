                });

                dialog.setOnDismissListener(
                        ignored -> finish()
                );

                android.view.WindowManager.LayoutParams
                        dialogLayoutParams =
                        new android.view.WindowManager
                                .LayoutParams();

                dialogLayoutParams.copyFrom(
                        dialog.getWindow()
                                .getAttributes()
                );

                dialogLayoutParams.width =
                        (int) (
                            getResources()
                                    .getDisplayMetrics()
                                    .widthPixels *
                            0.80f
                        );

                dialog.getWindow().setAttributes(
                        dialogLayoutParams
                );
