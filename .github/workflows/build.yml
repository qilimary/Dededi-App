                inputText.addTextChangedListener(
                        new TextWatcher() {
                            private final Handler handler =
                                    new Handler(
                                            Looper
                                                .getMainLooper()
                                    );

                            private Runnable debounceRunnable;

                            @Override
                            public void beforeTextChanged(
                                    CharSequence text,
                                    int start,
                                    int count,
                                    int after
                            ) {
                            }

                            @Override
                            public void onTextChanged(
                                    CharSequence text,
                                    int start,
                                    int before,
                                    int count
                            ) {
                                if (
                                    count <= 2 ||
                                    isRestoringHistory ||
                                    MainActivity
                                        .isCleanDialogOpen
                                ) {
                                    return;
                                }

                                int starCount = 0;
                                int hashCount = 0;
                                int dashCount = 0;
                                boolean trigger = false;

                                int end =
                                        Math.min(
                                                text.length(),
                                                start + count
                                        );

                                for (
                                    int i = start;
                                    i < end;
                                    i++
                                ) {
                                    char character =
                                            text.charAt(i);

                                    if (character == '*') {
                                        starCount++;

                                        if (
                                            starCount >= 4
                                        ) {
                                            trigger = true;
                                            break;
                                        }
                                    } else if (
                                        character == '#'
                                    ) {
                                        hashCount++;

                                        if (
                                            hashCount >= 4
                                        ) {
                                            trigger = true;
                                            break;
                                        }
                                    } else if (
                                        character == '-'
                                    ) {
                                        dashCount++;

                                        if (
                                            dashCount >= 4
                                        ) {
                                            trigger = true;
                                            break;
                                        }
                                    }
                                }

                                if (!trigger) {
                                    return;
                                }

                                checkAndPromptCleanup(
                                        MainActivity.this,
                                        inputText
                                            .getText()
                                            .toString(),
                                        cleaned -> {
                                            String current =
                                                    inputText
                                                        .getText()
                                                        .toString();

                                            if (
                                                cleaned.equals(
                                                        current
                                                )
                                            ) {
                                                return;
                                            }

                                            boolean old =
                                                    isRestoringHistory;

                                            isRestoringHistory =
                                                    true;

                                            inputText.setText(
                                                    cleaned
                                            );

                                            inputText.setSelection(
                                                    cleaned.length()
                                            );

                                            sp.edit()
                                                    .putString(
                                                            "sync_text",
                                                            cleaned
                                                    )
                                                    .apply();

                                            isRestoringHistory =
                                                    old;
                                        }
                                );
                            }

                            @Override
                            public void afterTextChanged(
                                    Editable editable
                            ) {
                                btnSaveTxt.setEnabled(
                                        editable.length() >
                                        0
                                );

                                if (
                                    !isRestoringHistory &&
                                    "继续纠错".contentEquals(
                                            btnCheck.getText()
                                    )
                                ) {
                                    btnCheck.setText(
                                            "开始纠错"
                                    );

                                    allSentencesBlocks =
                                            new ArrayList<>();

                                    outputText.setText("");
                                    btnCopy.setEnabled(false);

                                    lastSavedHistoryFileId =
                                            null;
                                }

                                if (
                                    debounceRunnable != null
                                ) {
                                    handler.removeCallbacks(
                                            debounceRunnable
                                    );
                                }

                                final String textSnapshot =
                                        editable.toString();

                                final int version =
                                        inputTextVersion
                                            .incrementAndGet();

                                debounceRunnable =
                                        () -> AppExecutors
                                            .CPU
                                            .execute(
                                                    () -> {
                                                        int count =
                                                                0;

                                                        for (
                                                            int i =
                                                                0;
                                                            i <
                                                            textSnapshot
                                                                .length();
                                                            i++
                                                        ) {
                                                            if (
                                                                Character
                                                                    .isLetterOrDigit(
                                                                            textSnapshot
                                                                                .charAt(
                                                                                        i
                                                                                )
                                                                    )
                                                            ) {
                                                                count++;
                                                            }
                                                        }

                                                        final int
                                                                finalCount =
                                                                count;

                                                        AppExecutors
                                                                .MAIN
                                                                .post(
                                                                        () -> {
                                                                            if (
                                                                                version !=
                                                                                inputTextVersion
                                                                                    .get()
                                                                            ) {
                                                                                return;
                                                                            }

                                                                            tvWordCount
                                                                                    .setText(
                                                                                            finalCount +
                                                                                            " 字"
                                                                                    );

                                                                            sp.edit()
                                                                                    .putString(
                                                                                            "sync_text",
                                                                                            textSnapshot
                                                                                    )
                                                                                    .apply();
                                                                        }
                                                                );
                                                    }
                                            );

                                handler.postDelayed(
                                        debounceRunnable,
                                        400
                                );
                            }
                        }
                );

                btnSaveTxt.setEnabled(
                        inputText
                            .getText()
                            .length() >
                        0
