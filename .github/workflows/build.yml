            private String saveHistory(
                    String text,
                    String existingFileId
            ) {
                if (
                    text == null ||
                    text.trim().isEmpty()
                ) {
                    return existingFileId;
                }

                String resolvedFileId =
                        existingFileId;

                try {
                    JSONArray existingRecords =
                            new JSONArray(
                                    sp.getString(
                                            "history_records",
                                            "[]"
                                    )
                            );

                    if (
                        existingRecords.length() > 0
                    ) {
                        JSONObject latest =
                                existingRecords
                                        .getJSONObject(0);

                        boolean sameHash =
                                latest.optInt(
                                        "textHash",
                                        Integer.MIN_VALUE
                                ) == text.hashCode();

                        boolean sameLength =
                                !latest.has(
                                        "textLength"
                                ) ||
                                latest.optInt(
                                        "textLength",
                                        -1
                                ) == text.length();

                        if (
                            sameHash &&
                            sameLength
                        ) {
                            String latestId =
                                    latest.optString(
                                            "file",
                                            ""
                                    );

                            if (!latestId.isEmpty()) {
                                resolvedFileId =
                                        latestId;
                            }
                        }
                    }
                } catch (Exception ignored) {
                }

                if (
                    resolvedFileId == null ||
                    resolvedFileId.isEmpty()
                ) {
                    resolvedFileId =
                            UUID.randomUUID().toString();
                }

                currentHistoryFileId =
                        resolvedFileId;

                final String fileId =
                        resolvedFileId;
                final String textSnapshot = text;

                AppExecutors.IO.execute(() -> {
                    try {
                        JSONArray historyArray =
                                new JSONArray(
                                        sp.getString(
                                                "history_records",
                                                "[]"
                                        )
                                );

                        JSONArray filtered =
                                new JSONArray();

                        for (
                            int i = 0;
                            i < historyArray.length();
                            i++
                        ) {
                            JSONObject object =
                                    historyArray
                                            .getJSONObject(i);

                            if (
                                !fileId.equals(
                                    object.optString(
                                            "file",
                                            ""
                                    )
                                )
                            ) {
                                filtered.put(object);
                            }
                        }

                        JSONObject newRecord =
                                new JSONObject();

                        newRecord.put(
                                "time",
                                new SimpleDateFormat(
                                        "yyyy-MM-dd HH:mm:ss",
                                        Locale.getDefault()
                                ).format(new Date())
                        );
                        newRecord.put(
                                "textHash",
                                textSnapshot.hashCode()
                        );
                        newRecord.put(
                                "textLength",
                                textSnapshot.length()
                        );

                        String preview =
                                textSnapshot.length() > 16
                                ? textSnapshot
                                    .substring(0, 16)
                                    .replace("\n", " ") +
                                  "..."
                                : textSnapshot.replace(
                                    "\n",
                                    " "
                                );

                        newRecord.put(
                                "preview",
                                preview
                        );
                        newRecord.put(
                                "file",
                                fileId
                        );

                        File directory =
                                new File(
                                        getFilesDir(),
                                        "history"
                                );

                        if (
                            !directory.exists() &&
                            !directory.mkdirs()
                        ) {
                            return;
                        }

                        File textFile =
                                new File(
                                        directory,
                                        fileId + ".txt"
                                );

                        File temporaryFile =
                                new File(
                                        directory,
                                        fileId + ".txt.tmp"
                                );

                        try (
                            FileOutputStream output =
                                    new FileOutputStream(
                                            temporaryFile
                                    )
                        ) {
                            output.write(
                                    textSnapshot.getBytes(
                                            StandardCharsets.UTF_8
                                    )
                            );
                            output.flush();
                            output.getFD().sync();
                        }

                        if (
                            textFile.exists() &&
                            !textFile.delete()
                        ) {
                            temporaryFile.delete();
                            return;
                        }

                        if (
                            !temporaryFile.renameTo(
                                    textFile
                            )
                        ) {
                            temporaryFile.delete();
                            return;
                        }

                        JSONArray finalArray =
                                new JSONArray();
                        finalArray.put(newRecord);

                        int keepCount =
                                Math.min(
                                        filtered.length(),
                                        49
                                );

                        for (
                            int i = 0;
                            i < keepCount;
                            i++
                        ) {
                            finalArray.put(
                                    filtered
                                            .getJSONObject(i)
                            );
                        }

                        if (filtered.length() > 49) {
                            for (
                                int i = 49;
                                i < filtered.length();
                                i++
                            ) {
                                String oldFileId =
                                        filtered
                                            .getJSONObject(i)
                                            .optString(
                                                    "file",
                                                    ""
                                            );

                                if (!oldFileId.isEmpty()) {
                                    new File(
                                            directory,
                                            oldFileId +
                                            ".txt"
                                    ).delete();

                                    new File(
                                            directory,
                                            oldFileId +
                                            "_blocks.json"
                                    ).delete();

                                    new File(
                                            directory,
                                            oldFileId +
                                            "_manual.json"
                                    ).delete();
                                }
                            }
                        }

                        sp.edit()
                                .putString(
                                        "history_records",
                                        finalArray.toString()
                                )
                                .commit();
                    } catch (Exception ignored) {
                    }
                });

                return fileId;
            }

