                                                                1
                                                        ),
                                                        IgnoredInCopySpan
                                                            .class
                                                );

                                        for (
                                            IgnoredInCopySpan
                                                    span :
                                            spans
                                        ) {
                                            int spanStart =
                                                    editable
                                                        .getSpanStart(
                                                                span
                                                        );

                                            int spanEnd =
                                                    editable
                                                        .getSpanEnd(
                                                                span
                                                        );

                                            boolean overlap =
                                                    Math.max(
                                                            destinationStart,
                                                            spanStart
                                                    ) <
                                                    Math.min(
                                                            destinationEnd,
                                                            spanEnd
                                                    );

                                            boolean insertionInside =
                                                    destinationStart >
                                                    spanStart &&
                                                    destinationStart <
                                                    spanEnd;

                                            if (
                                                overlap ||
                                                insertionInside
                                            ) {
                                                return destination
                                                        .subSequence(
                                                                destinationStart,
                                                                destinationEnd
                                                        );
                                            }
                                        }

                                        return null;
                                    }
                                }
                        }
