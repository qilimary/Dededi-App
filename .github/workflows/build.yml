                                                ).show();
                                            } else if (
                                                isManuallyEditedOut
                                            ) {
                                                corrections =
                                                        true;
                                            } else {
                                                outer:
                                                for (
                                                    List<TextBlock>
                                                            sentence :
                                                    allSentencesBlocks
                                                ) {
                                                    for (
                                                        TextBlock block :
                                                        sentence
                                                    ) {
