            public static boolean isSafeCharAfterNoun(
                    char character
            ) {
                if (character == '\0') {
                    return true;
                }

                if (
                    character < '\u4E00' ||
                    character > '\u9FFF'
                ) {
                    return true;
                }

                String safeCharacters =
                        "的了着过是在被把让给对和与同或就也都还很太真会能可要想走跑跳吃喝咬叫哭笑我看你他她它们这那\n";

                return safeCharacters.indexOf(
                        character
                ) >= 0;
            }

