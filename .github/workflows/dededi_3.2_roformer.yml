        package com.app.dededi;
        import android.os.Handler;
        import android.os.Looper;
        import java.util.concurrent.ExecutorService;
        import java.util.concurrent.Executors;
        import java.util.concurrent.ThreadFactory;
        import java.util.concurrent.atomic.AtomicInteger;

        public final class AppExecutors {
            public static final Handler MAIN = new Handler(Looper.getMainLooper());
            public static final Object HISTORY_LOCK = new Object();
            public static final ExecutorService IO = Executors.newFixedThreadPool(2, namedFactory("dededi-io"));
            public static final ExecutorService HISTORY = Executors.newSingleThreadExecutor(namedFactory("dededi-history"));
            public static final ExecutorService INFERENCE = Executors.newSingleThreadExecutor(namedFactory("dededi-inference"));
            private AppExecutors() {}
            private static ThreadFactory namedFactory(String prefix) {
                AtomicInteger counter = new AtomicInteger(1);
                return runnable -> {
                    Thread thread = new Thread(runnable, prefix + "-" + counter.getAndIncrement());
                    thread.setPriority(Thread.NORM_PRIORITY - 1);
                    return thread;
                };
            }
        }
