name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: dededi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare Python dependency manifest
      run: |
        mkdir -p .ci
        cat << 'EOF' > .ci/requirements-build.txt
        --extra-index-url https://download.pytorch.org/whl/cpu
        torch==1.13.1+cpu
        gdown==5.2.0
        pycryptodome==3.20.0
        EOF

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: .ci/requirements-build.txt

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r .ci/requirements-build.txt

    - name: Download and Validate RoFormerV2 Pro Model
      run: |
        set -euo pipefail
        MODEL_FOLDER_URL="https://drive.google.com/drive/folders/1ZN4esCrLkyuFYGqGgeDZfS6BnTN2IMTU"
        MODEL_DIR="roformer_v2_mobile"

        echo "正在从 Google Drive 下载 02_mobile_legacy_qint8 专业模型..."
        gdown --folder "$MODEL_FOLDER_URL" --remaining-ok --no-cookies -O "$MODEL_DIR"
        test -s "$MODEL_DIR/dededi_mobile.ptl"
        test -s "$MODEL_DIR/deploy_info.json"
        test -s "$MODEL_DIR/vocab.txt"

        cat << 'EOF' > validate_roformer.py
        import hashlib
        import json
        import pickletools
        import zipfile
        from pathlib import Path

        import torch
        from torch.jit.mobile import _load_for_lite_interpreter

        root = Path('roformer_v2_mobile')
        model_path = root / 'dededi_mobile.ptl'
        vocab_path = root / 'vocab.txt'
        info_path = root / 'deploy_info.json'

        expected_hashes = {
            model_path: 'd95812cd7ce9d7cfa9509244706bc5eebdbfee100abd89ed13915b3f74047cd5',
            vocab_path: '722b0e17d2c0d35a835811967e74f1ec3203c885bade5cd523086594e3d0b29e',
            info_path: '9137b6b8f937470ffa1d54cc7c3485b3f877e8bc9a7382f331f39b7350d659e9',
        }
        for path, expected in expected_hashes.items():
            if not path.is_file() or path.stat().st_size == 0:
                raise FileNotFoundError(f'模型资源不存在或为空：{path}')
            actual = hashlib.sha256(path.read_bytes()).hexdigest()
            if actual != expected:
                raise RuntimeError(f'模型资源校验失败：{path.name}，实际 SHA256={actual}')

        info = json.loads(info_path.read_text(encoding='utf-8'))
        expected_inputs = [
            'input_ids:int64[B,L]',
            'attention_mask:int64[B,L]',
            'token_type_ids:int64[B,L]',
        ]
        if info.get('inputs') != expected_inputs or info.get('output') != 'logits:float[B,L,3]':
            raise RuntimeError(f'RoFormerV2 输入输出签名不匹配：{info}')
        if 'TorchScript Lite' not in str(info.get('format', '')):
            raise RuntimeError('下载到的不是 TorchScript Lite 移动模型')

        with zipfile.ZipFile(model_path) as archive:
            bytecode_name = next((name for name in archive.namelist() if name.endswith('/bytecode.pkl')), None)
            if bytecode_name is None:
                raise RuntimeError('PTL 中缺少 bytecode.pkl')
            operations = pickletools.genops(archive.read(bytecode_name))
            next(operations)  # PROTO
            _, bytecode_version, _ = next(operations)
            if bytecode_version != 8:
                raise RuntimeError(f'不支持的 Lite bytecode 版本：{bytecode_version}')

        tokens = vocab_path.read_text(encoding='utf-8').splitlines()
        if len(tokens) != len(set(tokens)):
            raise RuntimeError('vocab.txt 中存在重复 token')
        vocab = {token: index for index, token in enumerate(tokens)}
        expected_ids = {
            '[PAD]': 0, '[UNK]': 100, '[CLS]': 101, '[SEP]': 102, '[MASK]': 103,
            '地': 1285, '得': 2108, '的': 4334,
        }
        for token, expected_id in expected_ids.items():
            if vocab.get(token) != expected_id:
                raise RuntimeError(f'词表编号异常：{token}={vocab.get(token)}，预期={expected_id}')

        # 使用与 Android 相同的 PyTorch Lite 1.13.1 实际载入并运行三组样例，
        # 同时锁定三分类标签顺序为 [的, 地, 得]。
        torch.set_num_threads(2)
        model = _load_for_lite_interpreter(str(model_path), map_location='cpu')
        labels = ['的', '地', '得']
        examples = [
            ('这是我的书。', '的'),
            ('他高兴地跑了。', '地'),
            ('他跑得很快。', '得'),
        ]
        with torch.inference_mode():
            for text, expected in examples:
                target_index = text.index(expected)
                ids = [vocab['[CLS]']] + [
                    vocab['[MASK]'] if index == target_index else vocab.get(character, vocab['[UNK]'])
                    for index, character in enumerate(text)
                ] + [vocab['[SEP]']]
                attention = [1] * len(ids)
                token_types = [0] * len(ids)
                output = model(
                    torch.tensor([ids], dtype=torch.long),
                    torch.tensor([attention], dtype=torch.long),
                    torch.tensor([token_types], dtype=torch.long),
                )
                if isinstance(output, (tuple, list)):
                    output = output[0]
                if tuple(output.shape) != (1, len(ids), 3):
                    raise RuntimeError(f'模型输出形状异常：{tuple(output.shape)}')
                predicted = labels[int(output[0, target_index + 1].argmax().item())]
                if predicted != expected:
                    raise RuntimeError(f'模型标签顺序或推理结果异常：{text}，预测={predicted}')

        Path('roformer_mobile.ptl').write_bytes(model_path.read_bytes())
        Path('roformer_vocab.json').write_text(
            json.dumps(vocab, ensure_ascii=False, separators=(',', ':')),
            encoding='utf-8',
        )
        print(f'RoFormerV2 校验通过：Torch={torch.__version__}，词表={len(vocab)}，输出=[B,L,3]。')
        EOF
        python validate_roformer.py

    - name: Encrypt Models and Rules (AES-256-GCM)
      run: |
        set -euo pipefail
        cat << 'EOF' > encrypt.py
        import gzip
        import hmac
        import hashlib
        import json
        import secrets
        import shutil
        import tempfile
        from pathlib import Path
        from Crypto.Cipher import AES

        MAGIC = b'DDA3'
        VERSION = 1
        DOMAIN = b'DEDEDI-ASSET-V2\x00'
        CHUNK = 512 * 1024
        GENERATED = Path('generated_security')
        GENERATED.mkdir(exist_ok=True)

        master = secrets.token_bytes(32)
        part_a = secrets.token_bytes(32)
        part_b = secrets.token_bytes(32)
        part_c = bytes(master[i] ^ part_a[i] ^ part_b[i] for i in range(32))
        build_token = secrets.token_bytes(16)
        Path('.ci').mkdir(exist_ok=True)
        Path('.ci/security_material.json').write_text(json.dumps({'master': master.hex(), 'token': build_token.hex()}, separators=(',', ':')), encoding='utf-8')

        def rol8(v: int, shift: int) -> int:
            shift &= 7
            return ((v << shift) | (v >> (8 - shift))) & 0xFF if shift else v

        def encode_part(part: bytes, variant: int):
            masks = secrets.token_bytes(32)
            encoded = []
            for i, value in enumerate(part):
                shift = ((i * (variant + 2) + variant) % 7) + 1
                mixed = value ^ masks[i] ^ ((i * (31 + variant * 7) + 17 * variant) & 0xFF)
                encoded.append(rol8(mixed, shift))
            return bytes(encoded), masks

        def cpp_array(data: bytes) -> str:
            return ','.join(f'0x{x:02X}' for x in data)

        def java_array(data: bytes) -> str:
            return ','.join(f'(byte)0x{x:02X}' for x in data)

        def write_cpp_share(path: Path, function_name: str, part: bytes, variant: int) -> None:
            encoded, masks = encode_part(part, variant)
            path.write_text(f'''#include <cstdint>\n\nnamespace {{\nconstexpr uint8_t ENCODED[32] = {{{cpp_array(encoded)}}};\nconstexpr uint8_t MASKS[32] = {{{cpp_array(masks)}}};\ninline uint8_t ror8(uint8_t value, unsigned shift) {{ shift &= 7U; return shift ? static_cast<uint8_t>((value >> shift) | (value << (8U - shift))) : value; }}\n}}\n\nextern "C" void {function_name}(uint8_t out[32]) {{\n    for (unsigned i = 0; i < 32; ++i) {{\n        unsigned shift = ((i * {variant + 2}U + {variant}U) % 7U) + 1U;\n        out[i] = static_cast<uint8_t>(ror8(ENCODED[i], shift) ^ MASKS[i] ^ ((i * {31 + variant * 7}U + {17 * variant}U) & 0xFFU));\n    }}\n}}\n''', encoding='utf-8')

        write_cpp_share(GENERATED / 'key-part-a.cpp', 'dedediFillKeyPartA', part_a, 1)
        write_cpp_share(GENERATED / 'key-part-b.cpp', 'dedediFillKeyPartB', part_b, 2)

        encoded_c, masks_c = encode_part(part_c, 3)
        (GENERATED / 'GeneratedSecuritySeed.java').write_text(f'''package com.app.dededi;\n\nfinal class GeneratedSecuritySeed {{\n    private static final byte[] ENCODED = new byte[]{{{java_array(encoded_c)}}};\n    private static final byte[] MASKS = new byte[]{{{java_array(masks_c)}}};\n    private static final byte[] TOKEN = new byte[]{{{java_array(build_token)}}};\n    private GeneratedSecuritySeed() {{}}\n    private static int ror8(int value, int shift) {{ shift &= 7; return shift == 0 ? value & 0xFF : ((value >>> shift) | (value << (8 - shift))) & 0xFF; }}\n    static byte[] revealPart() {{\n        byte[] out = new byte[32];\n        for (int i = 0; i < out.length; i++) {{\n            int shift = ((i * 5 + 3) % 7) + 1;\n            out[i] = (byte)(ror8(ENCODED[i] & 0xFF, shift) ^ (MASKS[i] & 0xFF) ^ ((i * 52 + 51) & 0xFF));\n        }}\n        return out;\n    }}\n    static byte[] buildToken() {{ return TOKEN.clone(); }}\n}}\n''', encoding='utf-8')

        def derive_key(salt: bytes, asset_name: str) -> bytes:
            message = DOMAIN + build_token + salt + asset_name.encode('utf-8')
            return hmac.new(master, message, hashlib.sha256).digest()

        def gzip_source(source: Path, level: int, patch_zip_header: bool) -> Path:
            fd, name = tempfile.mkstemp(prefix='dededi_', suffix='.gz')
            import os
            os.close(fd)
            target = Path(name)
            try:
                with source.open('rb') as src, target.open('wb') as raw_out:
                    with gzip.GzipFile(fileobj=raw_out, mode='wb', compresslevel=level, mtime=0) as gz:
                        first = src.read(2)
                        if patch_zip_header and first == b'PK':
                            gz.write(b'DE')
                        else:
                            gz.write(first)
                        shutil.copyfileobj(src, gz, length=CHUNK)
                return target
            except Exception:
                target.unlink(missing_ok=True)
                raise

        def encrypt_asset(file_in: str, file_out: str, level: int, patch_zip_header: bool) -> None:
            source = Path(file_in)
            if not source.exists():
                print(f'跳过不存在的文件: {file_in}')
                return
            salt = secrets.token_bytes(16)
            nonce_prefix = secrets.token_bytes(8)
            flags = 1 if patch_zip_header else 0
            asset_name = Path(file_out).name
            key = derive_key(salt, asset_name)
            compressed = gzip_source(source, level, patch_zip_header)
            try:
                total_length = compressed.stat().st_size
                chunk_count = (total_length + CHUNK - 1) // CHUNK
                header = (MAGIC + bytes((VERSION, flags)) + salt + nonce_prefix
                          + CHUNK.to_bytes(4, 'big')
                          + total_length.to_bytes(8, 'big')
                          + chunk_count.to_bytes(4, 'big'))
                aad_base = header + asset_name.encode('utf-8')
                with compressed.open('rb') as src, Path(file_out).open('wb') as dst:
                    dst.write(header)
                    for index in range(chunk_count):
                        plain = src.read(CHUNK)
                        if not plain:
                            raise RuntimeError('压缩资源长度异常')
                        length_bytes = len(plain).to_bytes(4, 'big')
                        nonce = nonce_prefix + index.to_bytes(4, 'big')
                        cipher = AES.new(key, AES.MODE_GCM, nonce=nonce, mac_len=16)
                        cipher.update(aad_base + index.to_bytes(4, 'big') + length_bytes)
                        encrypted, tag = cipher.encrypt_and_digest(plain)
                        dst.write(length_bytes)
                        dst.write(encrypted)
                        dst.write(tag)
                    if src.read(1):
                        raise RuntimeError('压缩资源分块计数异常')
                if Path(file_out).stat().st_size <= 70:
                    raise RuntimeError(f'{file_out} 加密结果异常')
            finally:
                compressed.unlink(missing_ok=True)

        print('正在使用 AES-256-GCM 加固 RoFormerV2、词表和规则文件...')
        encrypt_asset('roformer_mobile.ptl', 'sys_core_p.dat', 1, True)
        encrypt_asset('错别字.txt', 'sys_typo.dat', 9, False)
        encrypt_asset('roformer_vocab.json', 'sys_vocab_p.dat', 9, False)
        print('AES-256-GCM 加固完成；每次构建均使用全新主密钥、盐和 Nonce。')
        EOF
        python encrypt.py

    - name: Scaffold Android Project
      run: |
        set -euo pipefail
        mkdir -p app/src/main/java/com/app/dededi
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/values-night
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/cpp

        cp generated_security/GeneratedSecuritySeed.java app/src/main/java/com/app/dededi/
        cp generated_security/key-part-a.cpp app/src/main/cpp/
        cp generated_security/key-part-b.cpp app/src/main/cpp/

        cp sys_core_p.dat app/src/main/assets/
        cp sys_vocab_p.dat app/src/main/assets/
        cp sys_typo.dat app/src/main/assets/ || true
        cp app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        android.nonTransitiveRClass=true
        org.gradle.caching=true
        org.gradle.parallel=true
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.11.1" }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "Dededi"
        include ':app'
        EOF

        cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.10.2)
        project("dededi")
        add_library(dededi SHARED native-lib.cpp key-part-a.cpp key-part-b.cpp)
        target_compile_features(dededi PRIVATE cxx_std_11)
        target_compile_options(dededi PRIVATE -O2 -fvisibility=hidden -ffunction-sections -fdata-sections)
        find_library(log-lib log)
        target_link_libraries(dededi ${log-lib} android -Wl,--gc-sections)
        EOF

        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <algorithm>
        #include <array>
        #include <cctype>
        #include <cstdio>
        #include <cstdint>
        #include <cstdlib>
        #include <cstring>
        #include <string>
        #include <vector>

        extern "C" void dedediFillKeyPartA(uint8_t out[32]);
        extern "C" void dedediFillKeyPartB(uint8_t out[32]);

        namespace {
        constexpr char DOMAIN[] = "DEDEDI-ASSET-V2\0";

        void wipe(void* pointer, size_t length) {
            volatile unsigned char* bytes = static_cast<volatile unsigned char*>(pointer);
            while (length--) *bytes++ = 0;
        }

        bool tracerAttached() {
            FILE* file = fopen("/proc/self/status", "r");
            if (!file) return false;
            char line[256];
            bool attached = false;
            while (fgets(line, sizeof(line), file)) {
                if (strncmp(line, "TracerPid:", 10) == 0) {
                    const char* value = line + 10;
                    while (*value && std::isspace(static_cast<unsigned char>(*value))) ++value;
                    attached = atoi(value) != 0;
                    break;
                }
            }
            fclose(file);
            return attached;
        }

        bool suspiciousMappings() {
            FILE* file = fopen("/proc/self/maps", "r");
            if (!file) return false;
            char line[1024];
            bool suspicious = false;
            while (fgets(line, sizeof(line), file)) {
                std::string value(line);
                std::transform(value.begin(), value.end(), value.begin(), [](unsigned char c) { return static_cast<char>(std::tolower(c)); });
                if (value.find("frida") != std::string::npos || value.find("gum-js-loop") != std::string::npos || value.find("libgadget") != std::string::npos) {
                    suspicious = true;
                    break;
                }
            }
            fclose(file);
            return suspicious;
        }

        bool sha256(JNIEnv* env, const std::vector<uint8_t>& input, std::array<uint8_t, 32>& output) {
            jclass cls = env->FindClass("java/security/MessageDigest");
            if (!cls) return false;
            jmethodID getInstance = env->GetStaticMethodID(cls, "getInstance", "(Ljava/lang/String;)Ljava/security/MessageDigest;");
            jmethodID digest = env->GetMethodID(cls, "digest", "([B)[B");
            if (!getInstance || !digest) { env->DeleteLocalRef(cls); return false; }
            jstring algorithm = env->NewStringUTF("SHA-256");
            jobject md = env->CallStaticObjectMethod(cls, getInstance, algorithm);
            env->DeleteLocalRef(algorithm);
            if (env->ExceptionCheck() || !md) { env->ExceptionClear(); env->DeleteLocalRef(cls); return false; }
            jbyteArray bytes = env->NewByteArray(static_cast<jsize>(input.size()));
            if (!bytes) { env->DeleteLocalRef(md); env->DeleteLocalRef(cls); return false; }
            if (!input.empty()) env->SetByteArrayRegion(bytes, 0, static_cast<jsize>(input.size()), reinterpret_cast<const jbyte*>(input.data()));
            auto result = static_cast<jbyteArray>(env->CallObjectMethod(md, digest, bytes));
            bool ok = !env->ExceptionCheck() && result && env->GetArrayLength(result) == 32;
            if (env->ExceptionCheck()) env->ExceptionClear();
            if (ok) env->GetByteArrayRegion(result, 0, 32, reinterpret_cast<jbyte*>(output.data()));
            if (result) env->DeleteLocalRef(result);
            env->DeleteLocalRef(bytes); env->DeleteLocalRef(md); env->DeleteLocalRef(cls);
            return ok;
        }

        bool hmacSha256(JNIEnv* env, const uint8_t key[32], const std::vector<uint8_t>& message, std::array<uint8_t, 32>& output) {
            std::array<uint8_t, 64> ipad{}, opad{};
            for (size_t i = 0; i < 64; ++i) {
                uint8_t value = i < 32 ? key[i] : 0;
                ipad[i] = static_cast<uint8_t>(value ^ 0x36U);
                opad[i] = static_cast<uint8_t>(value ^ 0x5CU);
            }
            std::vector<uint8_t> inner; inner.reserve(64 + message.size()); inner.insert(inner.end(), ipad.begin(), ipad.end()); inner.insert(inner.end(), message.begin(), message.end());
            std::array<uint8_t, 32> innerHash{};
            if (!sha256(env, inner, innerHash)) return false;
            std::vector<uint8_t> outer; outer.reserve(96); outer.insert(outer.end(), opad.begin(), opad.end()); outer.insert(outer.end(), innerHash.begin(), innerHash.end());
            bool ok = sha256(env, outer, output);
            wipe(inner.data(), inner.size()); wipe(outer.data(), outer.size()); wipe(innerHash.data(), innerHash.size()); wipe(ipad.data(), ipad.size()); wipe(opad.data(), opad.size());
            return ok;
        }
        }

        extern "C" JNIEXPORT jbyteArray JNICALL
        Java_com_app_dededi_NativeSecurity_deriveAssetKeyNative(JNIEnv* env, jclass, jbyteArray javaPart, jbyteArray buildToken, jbyteArray salt, jstring assetName) {
            if (!javaPart || !buildToken || !salt || !assetName || (tracerAttached() && suspiciousMappings())) return nullptr;
            if (env->GetArrayLength(javaPart) != 32 || env->GetArrayLength(buildToken) != 16 || env->GetArrayLength(salt) != 16) return nullptr;
            std::array<uint8_t, 32> partA{}, partB{}, partC{}, master{}, derived{};
            std::array<uint8_t, 16> token{}, saltBytes{};
            dedediFillKeyPartA(partA.data()); dedediFillKeyPartB(partB.data());
            env->GetByteArrayRegion(javaPart, 0, 32, reinterpret_cast<jbyte*>(partC.data()));
            env->GetByteArrayRegion(buildToken, 0, 16, reinterpret_cast<jbyte*>(token.data()));
            env->GetByteArrayRegion(salt, 0, 16, reinterpret_cast<jbyte*>(saltBytes.data()));
            for (size_t i = 0; i < 32; ++i) master[i] = static_cast<uint8_t>(partA[i] ^ partB[i] ^ partC[i]);
            const char* name = env->GetStringUTFChars(assetName, nullptr);
            if (!name) return nullptr;
            std::vector<uint8_t> message;
            message.insert(message.end(), DOMAIN, DOMAIN + sizeof(DOMAIN) - 1);
            message.insert(message.end(), token.begin(), token.end());
            message.insert(message.end(), saltBytes.begin(), saltBytes.end());
            message.insert(message.end(), name, name + strlen(name));
            env->ReleaseStringUTFChars(assetName, name);
            bool ok = hmacSha256(env, master.data(), message, derived);
            jbyteArray result = nullptr;
            if (ok) {
                result = env->NewByteArray(32);
                if (result) env->SetByteArrayRegion(result, 0, 32, reinterpret_cast<const jbyte*>(derived.data()));
            }
            wipe(partA.data(), partA.size()); wipe(partB.data(), partB.size()); wipe(partC.data(), partC.size()); wipe(master.data(), master.size()); wipe(derived.data(), derived.size()); wipe(token.data(), token.size()); wipe(saltBytes.data(), saltBytes.size()); wipe(message.data(), message.size());
            return result;
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.app.dededi'
            compileSdk 36
            defaultConfig {
                applicationId "com.app.dededi"
                minSdk 24
                targetSdk 36
                versionCode 27
                versionName "3.2"
                ndk { abiFilters "arm64-v8a" }
                externalNativeBuild { cmake { cppFlags "" } }
            }
            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    signingConfig signingConfigs.debug
                }
            }
            externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
            aaptOptions { noCompress 'dat' }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'org.pytorch:pytorch_android_lite:1.13.1'
            implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
            implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
        }
        EOF

        cat << 'EOF' > app/proguard-rules.pro
        -keep class org.pytorch.** { *; }
        -keep class com.facebook.jni.** { *; }
        -keepclasseswithmembers class * { native <methods>; }
        -keep class com.app.dededi.NativeSecurity { *; }

        # ML Kit OCR relies on component discovery, reflection and native entry points.
