            private void migrateProfessionalThresholdDefaults() {
                if (sp.getBoolean("pro_threshold_defaults_3_2_1", false)) return;
                boolean missingAll = !sp.contains("pro_th1") && !sp.contains("pro_th2") && !sp.contains("pro_th3");
                float oldDe = parseFloatSafe(sp.getString("pro_th1", "0.70"), Float.NaN);
                float oldDi = parseFloatSafe(sp.getString("pro_th2", "0.75"), Float.NaN);
                float oldDe3 = parseFloatSafe(sp.getString("pro_th3", "0.75"), Float.NaN);
                boolean stillLegacyDefaults = Math.abs(oldDe - 0.70f) < 0.0001f
                        && Math.abs(oldDi - 0.75f) < 0.0001f
                        && Math.abs(oldDe3 - 0.75f) < 0.0001f;
                SharedPreferences.Editor editor = sp.edit().putBoolean("pro_threshold_defaults_3_2_1", true);
                if (missingAll || stillLegacyDefaults) {
                    editor.putString("pro_th1", "0.75")
                            .putString("pro_th2", "0.70")
                            .putString("pro_th3", "0.72");
                }
                editor.apply();
            }

