            private void loadCharVocab(int[] charIds, String asset) throws Exception {
                String json = SecureAsset.readUtf8(this, asset);
                if (json == null || json.isEmpty()) throw new IllegalStateException("词表资源为空：" + asset);
                JSONObject object = new JSONObject(json);
                if (object.length() == 0) throw new IllegalStateException("词表内容为空：" + asset);

                long unknownId = object.optLong("[UNK]", 100L);
                if (unknownId < 0L || unknownId > Integer.MAX_VALUE) throw new IllegalStateException("词表 UNK 编号异常：" + asset);
                Arrays.fill(charIds, (int) unknownId);

                Iterator<String> keys = object.keys();
                while (keys.hasNext()) {
                    String token = keys.next();
                    int tokenId = object.getInt(token);
                    if (token.length() == 1) charIds[token.charAt(0)] = tokenId;
                }

                clsId = object.optLong("[CLS]", -1L);
                sepId = object.optLong("[SEP]", -1L);
                maskId = object.optLong("[MASK]", -1L);
                unkId = unknownId;
                if (clsId != 101L || sepId != 102L || maskId != 103L || unkId != 100L) {
                    throw new IllegalStateException("RoFormerV2 特殊 token 编号异常");
                }
                proVocabReady = true;
            }

            private File resolvePersistentModelCacheFile(Context context, String cacheKey) throws IOException {
                File directory = new File(context.getNoBackupFilesDir(), "dededi_models");
                if (!directory.exists() && !directory.mkdirs()) throw new IOException("无法创建持久模型缓存目录");

                long packageUpdateTime = 0L;
                try {
                    packageUpdateTime = context.getPackageManager().getPackageInfo(context.getPackageName(), 0).lastUpdateTime;
                } catch (Exception ignored) {}

                String safeCacheKey = (cacheKey + "_" + packageUpdateTime).replaceAll("[^a-zA-Z0-9._-]", "_");
                return new File(directory, "dededi_model_" + safeCacheKey + ".ptl");
            }

            private boolean hasPersistentModelCache(Context context, String cacheKey) {
                try {
                    File cachedModel = resolvePersistentModelCacheFile(context, cacheKey);
                    return cachedModel.isFile() && cachedModel.length() > 4096L;
                } catch (Exception ignored) {
                    return false;
                }
            }

            private Module loadDecryptedModule(Context context, String assetName, String cacheKey, Object modelLock) throws Exception {
                synchronized (modelLock) {
                    File cachedModel = resolvePersistentModelCacheFile(context, cacheKey);
                    File directory = cachedModel.getParentFile();
                    if (directory == null) throw new IOException("无法获取模型缓存目录");

                    if (cachedModel.isFile() && cachedModel.length() > 4096L) {
                        try {
                            long startTime = System.currentTimeMillis();
                            Module cachedModule = LiteModuleLoader.load(cachedModel.getAbsolutePath());
                            cachedModel.setLastModified(System.currentTimeMillis());
                            android.util.Log.i("DedediModel", "已从持久缓存载入模型：" + assetName + "，耗时 " + (System.currentTimeMillis() - startTime) + "ms");
                            return cachedModule;
                        } catch (Throwable cacheError) {
                            android.util.Log.w("DedediModel", "持久模型缓存无效，准备重新生成：" + assetName, cacheError);
                            if (!cachedModel.delete()) android.util.Log.w("DedediModel", "无法立即删除失效缓存：" + cachedModel);
                        }
                    }

                    String cachePrefix = "dededi_model_" + cacheKey.replaceAll("[^a-zA-Z0-9._-]", "_") + "_";
                    File[] staleCaches = directory.listFiles((dir, name) ->
                            name.startsWith(cachePrefix)
                                    && name.endsWith(".ptl")
                                    && !name.equals(cachedModel.getName())
                    );
                    if (staleCaches != null) {
                        for (File stale : staleCaches) if (!stale.delete()) android.util.Log.w("DedediModel", "无法删除旧模型缓存：" + stale);
                    }

                    long decryptStart = System.currentTimeMillis();
                    if (!SecureAsset.decryptToFile(context, assetName, cachedModel)) {
                        throw new Exception("模型完整性校验或解密失败：" + SecureAsset.lastErrorSummary());
                    }
                    if (!cachedModel.isFile() || cachedModel.length() <= 4096L) {
                        cachedModel.delete();
                        throw new IOException("生成的模型持久缓存文件异常");
                    }
                    android.util.Log.i("DedediModel", "模型首次解密并持久缓存完成：" + assetName + "，耗时 " + (System.currentTimeMillis() - decryptStart) + "ms");

                    try {
                        long loadStart = System.currentTimeMillis();
                        Module module = LiteModuleLoader.load(cachedModel.getAbsolutePath());
                        cachedModel.setLastModified(System.currentTimeMillis());
                        android.util.Log.i("DedediModel", "首次载入模型完成：" + assetName + "，耗时 " + (System.currentTimeMillis() - loadStart) + "ms");
                        return module;
                    } catch (Throwable error) {
                        cachedModel.delete();
                        if (error instanceof Exception) throw (Exception) error;
                        if (error instanceof Error) throw (Error) error;
                        throw new Exception("模型加载失败", error);
                    }
                }
            }

