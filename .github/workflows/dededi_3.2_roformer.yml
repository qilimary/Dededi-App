                                IValue.from(Tensor.fromBlob(ids, new long[]{1, exactLength})),
                                IValue.from(Tensor.fromBlob(masks, new long[]{1, exactLength})),
                                IValue.from(Tensor.fromBlob(types, new long[]{1, exactLength}))
