        package com.app.dededi;

        import android.content.Context;
        import android.content.res.AssetManager;
        import java.io.ByteArrayOutputStream;
        import java.io.File;
        import java.io.FileInputStream;
        import java.io.FileOutputStream;
        import java.io.IOException;
        import java.io.InputStream;
        import java.io.OutputStream;
        import java.nio.charset.StandardCharsets;
        import java.security.GeneralSecurityException;
        import java.util.Arrays;
        import java.util.zip.GZIPInputStream;
        import javax.crypto.AEADBadTagException;
        import javax.crypto.Cipher;
        import javax.crypto.spec.GCMParameterSpec;
        import javax.crypto.spec.SecretKeySpec;

        final class SecureAsset {
            private static final byte[] MAGIC = new byte[]{'D', 'D', 'A', '3'};
            private static final int VERSION = 1;
            private static final int TAG_SIZE = 16;
            private static final int IO_BUFFER = 64 * 1024;
            private static final int MAX_CHUNK = 4 * 1024 * 1024;
            private static volatile String lastError = "";
            private SecureAsset() {}

            static void recordError(String stage, Throwable error) {
                String detail = error == null ? "未知异常" : error.getClass().getSimpleName() + ": " + String.valueOf(error.getMessage());
                lastError = stage + "（" + detail + "）";
                if (error != null) error.printStackTrace();
            }

            static String lastErrorSummary() {
                String value = lastError;
                return value == null || value.isEmpty() ? "未获得详细错误" : value;
            }

            static String readUtf8(Context context, String assetName) {
                ByteArrayOutputStream output = new ByteArrayOutputStream(32 * 1024);
                try {
                    decrypt(context, assetName, output);
                    return output.toString("UTF-8");
                } catch (Throwable error) {
                    recordError("读取 " + assetName + " 失败", error);
                    return "";
                }
            }

            static boolean decryptToFile(Context context, String assetName, File target) {
                File temporary = new File(target.getAbsolutePath() + ".part");
                try (FileOutputStream output = new FileOutputStream(temporary)) {
                    decrypt(context, assetName, output);
                    output.getFD().sync();
                } catch (Throwable error) {
                    recordError("解密 " + assetName + " 失败", error);
                    temporary.delete();
                    return false;
                }
                if (target.exists() && !target.delete()) { temporary.delete(); return false; }
                if (!temporary.renameTo(target)) { temporary.delete(); return false; }
                return true;
            }

            private static void decrypt(Context context, String assetName, OutputStream plainOutput) throws IOException, GeneralSecurityException {
                File compressed = File.createTempFile("dac", ".tmp", context.getCodeCacheDir());
                byte[] javaPart = null, token = null, key = null;
                byte[] salt = new byte[16], noncePrefix = new byte[8];
                try (InputStream input = context.getAssets().open(assetName, AssetManager.ACCESS_STREAMING);
                     FileOutputStream compressedOutput = new FileOutputStream(compressed)) {
                    byte[] magic = new byte[4]; readFully(input, magic);
                    if (!Arrays.equals(MAGIC, magic)) throw new GeneralSecurityException("资源格式错误");
                    int version = input.read(), flags = input.read();
                    if (version != VERSION || flags < 0) throw new GeneralSecurityException("资源版本错误");
                    readFully(input, salt); readFully(input, noncePrefix);
                    int chunkSize = readInt(input);
                    long totalLength = readLong(input);
                    int chunkCount = readInt(input);
                    if (chunkSize < 4096 || chunkSize > MAX_CHUNK || totalLength < 0 || chunkCount <= 0) throw new GeneralSecurityException("资源分块头异常");
                    long expectedChunks = (totalLength + chunkSize - 1L) / chunkSize;
                    if (expectedChunks != chunkCount) throw new GeneralSecurityException("资源分块数量异常");

                    ByteArrayOutputStream header = new ByteArrayOutputStream(64);
                    header.write(MAGIC); header.write(version); header.write(flags); header.write(salt); header.write(noncePrefix);
                    writeInt(header, chunkSize); writeLong(header, totalLength); writeInt(header, chunkCount);
                    byte[] assetBytes = assetName.getBytes(StandardCharsets.UTF_8);
                    ByteArrayOutputStream aadBaseOutput = new ByteArrayOutputStream(header.size() + assetBytes.length);
                    aadBaseOutput.write(header.toByteArray()); aadBaseOutput.write(assetBytes);
                    byte[] aadBase = aadBaseOutput.toByteArray();

                    javaPart = GeneratedSecuritySeed.revealPart(); token = GeneratedSecuritySeed.buildToken();
                    key = NativeSecurity.deriveAssetKeyNative(javaPart, token, salt, assetName);
                    if (key == null || key.length != 32) throw new GeneralSecurityException("安全环境校验失败");

                    long written = 0;
                    for (int index = 0; index < chunkCount; index++) {
                        int length = readInt(input);
                        int expectedLength = (int)Math.min((long)chunkSize, totalLength - written);
                        if (length != expectedLength || length <= 0) throw new GeneralSecurityException("资源块长度异常");
                        byte[] encrypted = new byte[length + TAG_SIZE];
                        byte[] nonce = new byte[12];
                        byte[] aad = null, plain = null;
                        try {
                            readFully(input, encrypted);
                            System.arraycopy(noncePrefix, 0, nonce, 0, noncePrefix.length);
                            putInt(nonce, 8, index);
                            ByteArrayOutputStream aadOutput = new ByteArrayOutputStream(aadBase.length + 8);
                            aadOutput.write(aadBase); writeInt(aadOutput, index); writeInt(aadOutput, length);
                            aad = aadOutput.toByteArray();
                            Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                            cipher.init(Cipher.DECRYPT_MODE, new SecretKeySpec(key, "AES"), new GCMParameterSpec(128, nonce));
                            cipher.updateAAD(aad);
                            plain = cipher.doFinal(encrypted);
                            if (plain.length != length) throw new GeneralSecurityException("资源块解密长度异常");
                            compressedOutput.write(plain);
                            written += plain.length;
                        } catch (AEADBadTagException error) {
                            throw new GeneralSecurityException("资源完整性验证失败", error);
                        } finally {
                            Arrays.fill(encrypted, (byte)0); Arrays.fill(nonce, (byte)0);
                            if (aad != null) Arrays.fill(aad, (byte)0);
                            if (plain != null) Arrays.fill(plain, (byte)0);
                        }
                    }
                    if (written != totalLength || input.read() != -1) throw new GeneralSecurityException("资源尾部异常");
                    compressedOutput.getFD().sync();

                    try (GZIPInputStream gzip = new GZIPInputStream(new FileInputStream(compressed), IO_BUFFER)) {
                        int first = gzip.read(), second = gzip.read();
                        if (first >= 0) {
                            if ((flags & 1) != 0 && first == 0x44 && second == 0x45) { plainOutput.write(0x50); plainOutput.write(0x4B); }
                            else { plainOutput.write(first); if (second >= 0) plainOutput.write(second); }
                        }
                        byte[] buffer = new byte[IO_BUFFER];
                        int count;
                        while ((count = gzip.read(buffer)) != -1) plainOutput.write(buffer, 0, count);
                        Arrays.fill(buffer, (byte)0);
                    }
                } finally {
                    if (javaPart != null) Arrays.fill(javaPart, (byte)0);
                    if (token != null) Arrays.fill(token, (byte)0);
                    if (key != null) Arrays.fill(key, (byte)0);
                    Arrays.fill(salt, (byte)0); Arrays.fill(noncePrefix, (byte)0);
                    compressed.delete();
                }
            }

            private static int readInt(InputStream input) throws IOException {
                byte[] bytes = new byte[4]; readFully(input, bytes);
                return ((bytes[0] & 0xFF) << 24) | ((bytes[1] & 0xFF) << 16) | ((bytes[2] & 0xFF) << 8) | (bytes[3] & 0xFF);
            }

            private static long readLong(InputStream input) throws IOException {
                byte[] bytes = new byte[8]; readFully(input, bytes);
                long value = 0; for (byte item : bytes) value = (value << 8) | (item & 0xFFL); return value;
            }

            private static void writeInt(OutputStream output, int value) throws IOException {
                output.write((value >>> 24) & 0xFF); output.write((value >>> 16) & 0xFF); output.write((value >>> 8) & 0xFF); output.write(value & 0xFF);
            }

            private static void writeLong(OutputStream output, long value) throws IOException {
                for (int shift = 56; shift >= 0; shift -= 8) output.write((int)(value >>> shift) & 0xFF);
            }

            private static void putInt(byte[] output, int offset, int value) {
                output[offset] = (byte)(value >>> 24); output[offset + 1] = (byte)(value >>> 16); output[offset + 2] = (byte)(value >>> 8); output[offset + 3] = (byte)value;
            }

            private static void readFully(InputStream input, byte[] output) throws IOException {
                int offset = 0;
                while (offset < output.length) {
                    int count = input.read(output, offset, output.length - offset);
                    if (count < 0) throw new IOException("资源数据不完整");
                    if (count == 0) continue;
                    offset += count;
                }
            }
        }
