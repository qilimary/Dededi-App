                        AppExecutors.MAIN.post(() -> { isCheckingMain = false; btnCheck.setText("开始纠错"); renderFinalBlocks(); btnCheck.setEnabled(true); btnCopy.setEnabled(true); btnSaveTxt.setEnabled(true); scrollView.post(() -> scrollView.fullScroll(View.FOCUS_UP)); });
                    } catch (Exception exception) {
