            public static synchronized void loadTypoMap(Context context) {
                typoMap.clear(); customTypoKeys.clear(); typoLengthsByFirst.clear(); maxTypoLen = 0; minTypoLen = Integer.MAX_VALUE;
                try (BufferedReader reader = new BufferedReader(new java.io.StringReader(SecureAsset.readUtf8(context, "sys_typo.dat")))) {
                    String line;
                    while ((line = reader.readLine()) != null) {
                        line = line.trim(); if (line.isEmpty()) continue; String[] parts = line.split("\\s+", 3);
                        if (parts.length >= 2 && !parts[0].equals(parts[1])) addTypo(parts[0], parts[1], false);
                    }
                } catch (Exception ignored) {}
                try {
                    JSONObject custom = new JSONObject(context.getSharedPreferences("DedediConfig", MODE_PRIVATE).getString("custom_typos", "{}")); Iterator<String> keys = custom.keys();
                    while (keys.hasNext()) { String source = keys.next(); addTypo(source, custom.getString(source), true); }
                } catch (Exception ignored) {}
                if (minTypoLen == Integer.MAX_VALUE) minTypoLen = 0;
                Map<Character, List<Integer>> temp = new HashMap<>();
                for (String source : typoMap.keySet()) temp.computeIfAbsent(source.charAt(0), key -> new ArrayList<>()).add(source.length());
                for (Map.Entry<Character, List<Integer>> entry : temp.entrySet()) {
                    List<Integer> lengths = entry.getValue(); lengths.sort(Collections.reverseOrder()); int unique = 0; int[] buffer = new int[lengths.size()]; int previous = -1;
                    for (int length : lengths) if (length != previous) { buffer[unique++] = length; previous = length; }
                    typoLengthsByFirst.put(entry.getKey(), Arrays.copyOf(buffer, unique));
                }
                typoMapLoaded = true;
            }

            private static void addTypo(String source, String correction, boolean custom) {
                if (source == null || source.isEmpty() || correction == null) return;
                typoMap.put(source, correction); if (custom) customTypoKeys.add(source); maxTypoLen = Math.max(maxTypoLen, source.length()); minTypoLen = Math.min(minTypoLen, source.length());
            }

