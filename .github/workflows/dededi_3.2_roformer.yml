            public static final class TypoMatch {
                public final String source, correction;
                TypoMatch(String source, String correction) { this.source = source; this.correction = correction; }
            }

            public static TypoMatch findTypoMatch(String sentence, int index) {
                if (index < 0 || index >= sentence.length()) return null;
                int[] lengths = typoLengthsByFirst.get(sentence.charAt(index));
                if (lengths == null) return null;
                for (int length : lengths) {
                    if (index + length > sentence.length()) continue;
                    String candidate = sentence.substring(index, index + length);
                    String correction = typoMap.get(candidate);
                    if (correction == null || isFalsePositiveTypo(sentence, index, candidate)) continue;
                    if (!candidate.equals(correction) && isConflictingCorrection(sentence, index, candidate, correction)) continue;
                    return new TypoMatch(candidate, correction);
                }
                return null;
            }

            public static boolean isFalsePositiveTypo(String sentence, int index, String source) {
                for (String white : WHITE_LIST) {
                    int searchStart = Math.max(0, index - white.length()), searchEnd = Math.min(sentence.length(), index + source.length() + white.length());
                    String window = sentence.substring(searchStart, searchEnd); int found = window.indexOf(white);
                    while (found >= 0) {
                        int start = searchStart + found, end = start + white.length();
                        if (start < index + source.length() && end > index) return true;
                        found = window.indexOf(white, found + 1);
                    }
                }
                if ("作事".equals(source) && index > 0 && sentence.charAt(index - 1) == '下') return true;
                if ("导至".equals(source) && index > 0 && sentence.charAt(index - 1) == '传') return true;
                if (source.charAt(0) == '做' || source.charAt(0) == '作') {
                    if (index > 0 && "创去要在该想会能可来把给多没不曾刚才将正就爱肯敢配帮替让叫使令".indexOf(sentence.charAt(index - 1)) >= 0) return true;
                    if (index + source.length() < sentence.length() && "扇筝联山发牙眼肢手脚衣裤帽鞋饭菜汤了".indexOf(sentence.charAt(index + source.length())) >= 0) return true;
                }
                return false;
            }

            public static boolean isConflictingCorrection(String sentence, int index, String source, String correction) {
                if (source.equals(correction) || minTypoLen <= 0) return false;
                String simulated = sentence.substring(0, index) + correction + sentence.substring(index + source.length());
                int start = index, end = index + correction.length(), searchStart = Math.max(0, start - maxTypoLen + 1);
                for (int cursor = searchStart; cursor < end; cursor++) {
                    int[] lengths = typoLengthsByFirst.get(simulated.charAt(cursor));
                    if (lengths == null) continue;
                    for (int length : lengths) {
                        if (cursor + length > simulated.length()) continue;
                        boolean crossesLeft = cursor < start && cursor + length > start, crossesRight = cursor < end && cursor + length > end;
                        if (!crossesLeft && !crossesRight) continue;
                        String candidate = simulated.substring(cursor, cursor + length), target = typoMap.get(candidate);
                        if (target != null && !candidate.equals(target)) return true;
                    }
                }
                return false;
            }

