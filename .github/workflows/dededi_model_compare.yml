name: Model Comparison Test

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/dededi_model_compare.yml"
  workflow_dispatch:

concurrency:
  group: dededi-model-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: 准备 Python 依赖
      run: |
        cat << 'EOF' > requirements-test.txt
        --extra-index-url https://download.pytorch.org/whl/cpu
        torch==2.13.0+cpu
        executorch==1.4.1
        gdown==5.2.0
        EOF

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements-test.txt

    - name: 安装测试依赖
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-test.txt

    - name: 下载模型并运行独立对比测试
      id: compare
      continue-on-error: true
      run: |
        set -o pipefail
        MODEL_FILE_ID="105_hh7wefkLUsdOJugtq90f6EsBRvpch"
        MODEL_DIR="roformer_v2_executorch"

        echo "正在下载 ExecuTorch RoFormerV2 模型..."
        gdown "$MODEL_FILE_ID" --no-cookies -O roformer_v2_executorch.zip
        mkdir -p "$MODEL_DIR"
        unzip -oq roformer_v2_executorch.zip -d "$MODEL_DIR"

        cat << 'EOF' > validate_roformer.py
        import base64
        import gzip
        import hashlib
        import json
        import math
        from pathlib import Path

        import torch
        from executorch.runtime import Runtime

        ROOT = Path('roformer_v2_executorch')
        MODEL = ROOT / 'dededi_E3EMA_executorch_xnnpack_dynamic_int8_perchannel_fp32_head_dynamicL.pte'
        VOCAB = ROOT / 'vocab.txt'
        INFO = ROOT / 'deploy_info.json'
        SELECTION = ROOT / 'selection.json'
        EXPERIMENTS = ROOT / 'pt2e_xnnpack_auto_experiments.json'

        EXPECTED = {
            MODEL: '18d156fde8f957c2cdc80c35994d14cc58b7fb9b52af86c099768fe63b97f5d9',
            VOCAB: '722b0e17d2c0d35a835811967e74f1ec3203c885bade5cd523086594e3d0b29e',
            INFO: 'fa29dc14cd7a76bf9d5af02448a027951f823dcff088d6044ba06729393b2cf9',
            SELECTION: '8d21bf750a2e91dccddbdd03ebd4221b6ccb9618a3eb68792dbe43fb2667c2d7',
            EXPERIMENTS: '47a35d919d3f95e058129eb838fa5eaaf8605cc99c1fa327eaf4dcb1bdbb48a7',
        }
        for path, expected in EXPECTED.items():
            if not path.is_file() or path.stat().st_size == 0:
                raise FileNotFoundError(f'模型资源不存在或为空：{path}')
            actual = hashlib.sha256(path.read_bytes()).hexdigest()
            if actual != expected:
                raise RuntimeError(f'模型资源校验失败：{path.name}，实际 SHA256={actual}')

        info = json.loads(INFO.read_text(encoding='utf-8'))
        if info.get('format') != 'ExecuTorch PTE' or info.get('backend') != 'XNNPACK':
            raise RuntimeError(f'不是预期的 ExecuTorch/XNNPACK 模型：{info.get("format")} / {info.get("backend")}')
        q = info.get('quantization', {})
        if q.get('activation') != 'dynamic INT8' or q.get('weight') != 'INT8 per-channel' or q.get('classifier') != 'FP32':
            raise RuntimeError(f'量化方案不匹配：{q}')
        seq = info.get('sequence', {})
        if seq.get('dynamic') is not True or int(seq.get('max_length', -1)) != 302:
            raise RuntimeError(f'动态长度配置异常：{seq}')
        quality = info.get('quality', {})
        if float(quality.get('agreement', 0.0)) < 0.999999 or float(quality.get('probability_mae', 1.0)) > 0.003:
            raise RuntimeError(f'导出量化质量低于迁移门槛：{quality}')
        xnn = info.get('xnnpack', {})
        if int(xnn.get('delegate_count', 0)) <= 0 or any(int(v) != 0 for v in xnn.get('edge_leftovers', {}).values()):
            raise RuntimeError(f'XNNPACK 委托不完整：{xnn}')

        tokens = VOCAB.read_text(encoding='utf-8').splitlines()
        if len(tokens) != len(set(tokens)):
            raise RuntimeError('vocab.txt 中存在重复 token')
        vocab = {token:index for index,token in enumerate(tokens)}
        expected_ids = {'[PAD]':0,'[UNK]':100,'[CLS]':101,'[SEP]':102,'[MASK]':103,'地':1285,'得':2108,'的':4334}
        for token, expected_id in expected_ids.items():
            if vocab.get(token) != expected_id:
                raise RuntimeError(f'词表编号异常：{token}={vocab.get(token)}，预期={expected_id}')

        runtime = Runtime.get()
        program = runtime.load_program(MODEL)
        if 'forward' not in program.method_names:
            raise RuntimeError(f'PTE 缺少 forward：{program.method_names}')
        forward = program.load_method('forward')
        labels = ['的','地','得']
        thresholds = {'的':0.76,'地':0.72,'得':0.74}
        temperature = 1.1

        def execute_ids(ids):
            length = len(ids)
            attention = [1] * length
            types = [0] * length
            outputs = forward.execute((
                torch.tensor([ids], dtype=torch.long),
                torch.tensor([attention], dtype=torch.long),
                torch.tensor([types], dtype=torch.long),
            ))
            if not outputs:
                raise RuntimeError('ExecuTorch forward 没有输出')
            out = outputs[0]
            if tuple(out.shape) != (1, length, 3):
                raise RuntimeError(f'输出形状异常：{tuple(out.shape)}，输入长度={length}')
            if not torch.isfinite(out).all():
                raise RuntimeError('ExecuTorch 输出包含 NaN/Inf')
            return out[0]

        # 动态长度基础检查。
        for length in (3, 23, 302):
            ids = [vocab['[CLS]']] + [vocab.get('测', vocab['[UNK]'])] * (length - 2) + [vocab['[SEP]']]
            execute_ids(ids)

        def infer(text):
            ids = [vocab['[CLS]']]
            targets = []
            for i, ch in enumerate(text):
                if ch in '的地得':
                    ids.append(vocab['[MASK]'])
                    targets.append(i)
                else:
                    ids.append(vocab.get(ch, vocab['[UNK]']))
            ids.append(vocab['[SEP]'])
            logits = execute_ids(ids)
            result = {}
            for pos in targets:
                probs = torch.softmax(logits[pos + 1].float() / temperature, dim=-1)
                idx = int(probs.argmax().item())
                result[pos] = (labels[idx], float(probs[idx].item()), [float(x) for x in probs.tolist()])
            return result

        # 基础语义检查。
        for text, pos, expected in [
            ('这是我的书。', 2, '的'),
            ('他高兴地跑了。', 3, '地'),
            ('他跑得很快。', 2, '得'),
            ('烈日晒得衣服发烫。', 3, '得'),
            ('妈妈晒的衣服已经干了。', 3, '的'),
        ]:
            pred, conf, _ = infer(text)[pos]
            if pred != expected:
                raise RuntimeError(f'语义 smoke 失败：{text} pos={pos} 预测={pred}/{conf:.4f} 预期={expected}')

        def decode_blob(blob):
            return json.loads(gzip.decompress(base64.b64decode(blob)).decode('utf-8'))

        fresh = decode_blob('')
        clean_total = clean_ok = err_total = err_ok = 0
        fresh_failures = []
        for row in fresh:
            source, target = row['source'], row['target']
            preds = infer(source)
            out = list(source)
            for pos, (lab, conf, _) in preds.items():
                if lab != source[pos] and conf >= thresholds[lab]:
                    out[pos] = lab
            prediction = ''.join(out)
            ok = prediction == target
            if row['kind'] == 'clean':
                clean_total += 1; clean_ok += int(ok)
            else:
                err_total += 1; err_ok += int(ok)
            if not ok:
                fresh_failures.append({'case_id':row['case_id'],'source':source,'target':target,'prediction':prediction})

        old_fresh = {'clean_ok':148,'clean_total':150,'error_ok':196,'error_total':211,'overall_ok':344,'overall_total':361}
        new_overall = clean_ok + err_ok
        print(f'全新361例：旧模型={old_fresh["overall_ok"]}/{old_fresh["overall_total"]}；新模型={new_overall}/{clean_total+err_total}；新模型干净句={clean_ok}/{clean_total}，错误句={err_ok}/{err_total}')
        fresh_regressed = clean_ok < old_fresh['clean_ok'] or err_ok < old_fresh['error_ok'] or new_overall < old_fresh['overall_ok']
        print('全新361例结论：' + ('新模型低于旧模型' if fresh_regressed else '新模型不低于旧模型'))

        # 255 词、7152 个目标位完整回归。
        term_rows = decode_blob('')
        old_term_trigger = sum(int(r['old_would_change']) for r in term_rows)
        old_term_argmax = sum(int(r['old_argmax_wrong']) for r in term_rows)
        new_term_trigger = new_term_argmax = 0
        term_cache = {}
        term_failures = []
        unprotected_term_errors = []
        for r in term_rows:
            sentence = r['sentence']
            preds = term_cache.setdefault(sentence, infer(sentence))
            lab, conf, _ = preds[int(r['pos'])]
            wrong = lab != r['gold']
            triggered = wrong and conf >= thresholds[lab]
            new_term_argmax += int(wrong)
            new_term_trigger += int(triggered)
            if triggered:
                failure = {'term':r['term'],'sentence':sentence,'pos':r['pos'],'gold':r['gold'],'pred':lab,'conf':conf,'protected':bool(r['protected'])}
                term_failures.append(failure)
                if not r['protected']:
                    unprotected_term_errors.append(failure)
        print(f'255词/7152位完整回归：旧模型触发错误={old_term_trigger}，Argmax错误={old_term_argmax}；新模型触发错误={new_term_trigger}，Argmax错误={new_term_argmax}；未保护新错误={len(unprotected_term_errors)}')
        term_regressed = new_term_trigger > old_term_trigger or new_term_argmax > old_term_argmax
        print('7152位回归结论：' + ('新模型整体退化' if term_regressed else '新模型整体不差于旧模型'))
        if unprotected_term_errors:
            print('警告：发现未纳入保护的新错误：' + json.dumps(unprotected_term_errors[:30], ensure_ascii=False))

        # 新增专有名词压力测试。
        extra_rows = decode_blob('')
        old_extra_trigger = sum(int(r['old_would_change']) for r in extra_rows)
        new_extra_trigger = 0
        unprotected_new_errors = []
        extra_cache = {}
        for r in extra_rows:
            sentence = r['sentence']
            preds = extra_cache.setdefault(sentence, infer(sentence))
            lab, conf, _ = preds[int(r['pos'])]
            triggered = lab != r['gold'] and conf >= thresholds[lab]
            new_extra_trigger += int(triggered)
            if triggered and not r['protected']:
                unprotected_new_errors.append({'term':r['term'],'sentence':sentence,'gold':r['gold'],'pred':lab,'conf':conf})
        print(f'新增专名压力：旧模型触发错误={old_extra_trigger}；新模型触发错误={new_extra_trigger}；未保护新错误={len(unprotected_new_errors)}')
        extra_regressed = new_extra_trigger > old_extra_trigger
        print('新增专名结论：' + ('新模型触发错误更多' if extra_regressed else '新模型触发错误不多于旧模型'))
        if unprotected_new_errors:
            print('警告：发现未保护的新专名错误：' + json.dumps(unprotected_new_errors[:20], ensure_ascii=False))

        report = {
            'runtime': 'ExecuTorch',
            'torch': torch.__version__,
            'program_methods': sorted(program.method_names),
            'package_quality': quality,
            'fresh_old': old_fresh,
            'fresh_new': {'clean_ok':clean_ok,'clean_total':clean_total,'error_ok':err_ok,'error_total':err_total,'overall_ok':new_overall,'overall_total':clean_total+err_total,'failures':fresh_failures},
            'term_full_7152': {'rows':len(term_rows),'old_trigger':old_term_trigger,'new_trigger':new_term_trigger,'old_argmax':old_term_argmax,'new_argmax':new_term_argmax,'new_trigger_failures':term_failures,'unprotected_new_errors':unprotected_term_errors},
            'extra_proper_names': {'rows':len(extra_rows),'old_trigger':old_extra_trigger,'new_trigger':new_extra_trigger,'unprotected_new_errors':unprotected_new_errors},
        }
        Path('executorch_migration_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
        old_score = 100.0 * old_fresh['overall_ok'] / old_fresh['overall_total']
        new_score = 100.0 * new_overall / (clean_total + err_total)
        old_term_score = 100.0 * (len(term_rows) - old_term_trigger) / len(term_rows)
        new_term_score = 100.0 * (len(term_rows) - new_term_trigger) / len(term_rows)
        print(f'361例得分：旧模型 {old_score:.2f} 分；新模型 {new_score:.2f} 分')
        print(f'7152位触发通过率：旧模型 {old_term_score:.2f} 分；新模型 {new_term_score:.2f} 分')
        print('测试完成。结果仅用于对比，不作为 APK 构建门禁。')
        EOF

        python validate_roformer.py 2>&1 | tee model_test_output.log

    - name: 输出中文对比与得分
      if: always()
      run: |
        python - << 'PY'
        import json
        import os
        from pathlib import Path

        summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
        report_path = Path('executorch_migration_report.json')
        lines = ['# 模型独立对比结果', '']

        if report_path.is_file():
            data = json.loads(report_path.read_text(encoding='utf-8'))
            old = data['fresh_old']
            new = data['fresh_new']
            term = data['term_full_7152']
            extra = data['extra_proper_names']

            old_score = old['overall_ok'] / old['overall_total'] * 100
            new_score = new['overall_ok'] / new['overall_total'] * 100
            old_term_score = (term['rows'] - term['old_trigger']) / term['rows'] * 100
            new_term_score = (term['rows'] - term['new_trigger']) / term['rows'] * 100

            if new_score > old_score:
                overall = '新模型更强'
            elif new_score < old_score:
                overall = '旧模型更强'
            else:
                overall = '两者持平'

            lines += [
                f'- **361 例综合得分**：旧模型 {old_score:.2f} 分（{old["overall_ok"]}/{old["overall_total"]}）；新模型 {new_score:.2f} 分（{new["overall_ok"]}/{new["overall_total"]}）',
                f'- **干净句**：旧模型 {old["clean_ok"]}/{old["clean_total"]}；新模型 {new["clean_ok"]}/{new["clean_total"]}',
                f'- **含错误句**：旧模型 {old["error_ok"]}/{old["error_total"]}；新模型 {new["error_ok"]}/{new["error_total"]}',
                f'- **7152 位触发通过率**：旧模型 {old_term_score:.2f} 分；新模型 {new_term_score:.2f} 分',
                f'- **7152 位触发错误**：旧模型 {term["old_trigger"]}；新模型 {term["new_trigger"]}',
                f'- **7152 位 Argmax 错误**：旧模型 {term["old_argmax"]}；新模型 {term["new_argmax"]}',
                f'- **新增专名触发错误**：旧模型 {extra["old_trigger"]}；新模型 {extra["new_trigger"]}',
                f'- **未保护新错误**：7152 位回归 {len(term["unprotected_new_errors"])}；新增专名 {len(extra["unprotected_new_errors"])}',
                '',
                f'## 结论：{overall}',
                '',
                '> 这个测试工作流与 APK 构建完全独立；模型对比没有胜出也不会让 APK 构建失败。'
            ]
        else:
            lines += [
                '本次没有生成完整评分报告，通常表示模型下载、载入或运行阶段出现技术错误。',
                '',
                '测试工作流已被设置为非构建门禁，不会影响 APK 构建。'
            ]
            log = Path('model_test_output.log')
            if log.is_file():
                tail = '\n'.join(log.read_text(encoding='utf-8', errors='replace').splitlines()[-40:])
                lines += ['', '### 最后 40 行日志', '```text', tail, '```']

        summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
        print('\n'.join(lines))
        PY
