name: Test HarmonyOS Fast Model Conversion

on:
  workflow_dispatch:
  push:
    paths:
      - "dededi_mobile.ptl"
      - "student_vocab.json"
      - ".github/workflows/harmony-model-test.yml"

concurrency:
  group: dededi-harmony-model-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-and-convert-fast-model:
    name: Inspect and Convert Fast Model
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Create dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat << 'EOF' > .ci/requirements-harmony-model.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Install conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/requirements-harmony-model.txt

      - name: Inspect PTL and try exporting ONNX
        id: convert_fast
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > inspect_and_export_fast.py
          import hashlib
          import inspect
          import json
          import os
          import sys
          import traceback
          import zipfile
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch


          MODEL_PATH = Path("dededi_mobile.ptl")
          VOCAB_PATH = Path("student_vocab.json")
          OUTPUT_DIR = Path("harmony_model_output")
          REPORT_PATH = OUTPUT_DIR / "conversion_report.txt"
          SCRIPT_MODEL_PATH = OUTPUT_DIR / "dededi_fast_recovered.pt"
          ONNX_PATH = OUTPUT_DIR / "dededi_fast.onnx"

          OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
          report_lines = []


          def log(message=""):
              text = str(message)
              print(text, flush=True)
              report_lines.append(text)


          def save_report():
              REPORT_PATH.write_text(
                  "\n".join(report_lines) + "\n",
                  encoding="utf-8"
              )


          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as file:
                  while True:
                      block = file.read(1024 * 1024)
                      if not block:
                          break
                      digest.update(block)
              return digest.hexdigest()


          def load_vocab():
              if not VOCAB_PATH.exists():
                  raise FileNotFoundError("未找到 student_vocab.json")

              with VOCAB_PATH.open("r", encoding="utf-8") as file:
                  raw = json.load(file)

              if not isinstance(raw, dict) or not raw:
                  raise ValueError("student_vocab.json 不是有效的非空字典")

              vocab = {str(key): int(value) for key, value in raw.items()}
              max_id = max(vocab.values())
              unknown_id = int(vocab.get("[UNK]", 1))
              mask_id = int(vocab.get("[MASK]", 2))

              log(f"词表数量: {len(vocab)}")
              log(f"最大词表 ID: {max_id}")
              log(f"[UNK] ID: {unknown_id}")
              log(f"[MASK] ID: {mask_id}")
              return vocab, max_id, unknown_id, mask_id


          def inspect_zip():
              with MODEL_PATH.open("rb") as file:
                  signature = file.read(4)

              log(f"文件头: {signature!r}")
              log(f"文件大小: {MODEL_PATH.stat().st_size} 字节")
              log(f"SHA-256: {sha256(MODEL_PATH)}")

              if signature[:2] != b"PK":
                  log("警告：文件头不是标准 ZIP/TorchScript 归档头。")

              try:
                  with zipfile.ZipFile(MODEL_PATH, "r") as archive:
                      names = archive.namelist()
                      log(f"归档内文件数量: {len(names)}")
                      log("归档文件列表（最多显示前 200 项）:")
                      for name in names[:200]:
                          info = archive.getinfo(name)
                          log(f"  {name} | {info.file_size} 字节")

                      has_bytecode = any(
                          name.endswith("bytecode.pkl")
                          for name in names
                      )
                      has_code = any(
                          "/code/" in name or name.startswith("code/")
                          for name in names
                      )
                      has_data = any(
                          "/data/" in name or name.startswith("data/")
                          for name in names
                      )

                      log(f"包含 bytecode.pkl: {has_bytecode}")
                      log(f"包含 TorchScript code/: {has_code}")
                      log(f"包含参数 data/: {has_data}")

                      if has_bytecode and not has_code:
                          log(
                              "判断：更接近纯 Lite Interpreter 字节码归档；"
                              "这种形式通常可以运行，但不一定能恢复为可导出的 ScriptModule。"
                          )
                      elif has_code:
                          log(
                              "判断：归档中仍包含 TorchScript 代码，"
                              "重新加载并导出 ONNX 的成功率较高。"
                          )
              except zipfile.BadZipFile as error:
                  log(f"ZIP 检查失败: {error}")


          def describe_module(module, title):
              log("")
              log(f"===== {title} =====")
              log(f"Python 类型: {type(module)!r}")

              try:
                  log(f"forward 签名: {inspect.signature(module.forward)}")
              except Exception as error:
                  log(f"无法读取 forward 签名: {error}")

              try:
                  log(f"forward schema: {module.forward.schema}")
              except Exception as error:
                  log(f"无法读取 forward schema: {error}")

              try:
                  log("计算图:")
                  log(str(module.graph))
              except Exception as error:
                  log(f"无法读取 graph: {error}")

              try:
                  log("inlined_graph:")
                  log(str(module.inlined_graph))
              except Exception as error:
                  log(f"无法读取 inlined_graph: {error}")

              try:
                  parameters = list(module.named_parameters())
                  log(f"参数张量数量: {len(parameters)}")
                  for name, parameter in parameters[:100]:
                      log(
                          f"  {name}: shape={tuple(parameter.shape)}, "
                          f"dtype={parameter.dtype}"
                      )
              except Exception as error:
                  log(f"无法枚举参数: {error}")


          def try_standard_load():
              try:
                  module = torch.jit.load(
                      str(MODEL_PATH),
                      map_location="cpu"
                  )
                  module.eval()
                  log("")
                  log("torch.jit.load：成功")
                  describe_module(module, "标准 TorchScript 模块")
                  return module
              except Exception as error:
                  log("")
                  log("torch.jit.load：失败")
                  log(f"{type(error).__name__}: {error}")
                  log(traceback.format_exc())
                  return None


          def try_lite_load():
              loaders = []

              try:
                  from torch.jit.mobile import _load_for_lite_interpreter
                  loaders.append(
                      (
                          "torch.jit.mobile._load_for_lite_interpreter",
                          _load_for_lite_interpreter
                      )
                  )
              except Exception as error:
                  log(
                      "无法导入 torch.jit.mobile."
                      f"_load_for_lite_interpreter: {error}"
                  )

              internal_loader = getattr(
                  torch._C,
                  "_load_for_lite_interpreter",
                  None
              )
              if internal_loader is not None:
                  loaders.append(
                      (
                          "torch._C._load_for_lite_interpreter",
                          internal_loader
                      )
                  )

              for name, loader in loaders:
                  try:
                      try:
                          module = loader(str(MODEL_PATH))
                      except TypeError:
                          module = loader(
                              str(MODEL_PATH),
                              torch.device("cpu")
                          )

                      log("")
                      log(f"{name}：成功")
                      describe_module(module, "Lite Interpreter 模块")
                      return module
                  except Exception as error:
                      log("")
                      log(f"{name}：失败")
                      log(f"{type(error).__name__}: {error}")
                      log(traceback.format_exc())

              return None


          def make_dummy_input(max_id, mask_id, length):
              upper = max(3, max_id + 1)
              generator = torch.Generator(device="cpu")
              generator.manual_seed(20260710)

              values = torch.randint(
                  low=0,
                  high=upper,
                  size=(1, length),
                  dtype=torch.long,
                  generator=generator
              )

              if length >= 3:
                  values[0, length // 2] = mask_id

              return values


          def run_forward(module, dummy):
              with torch.inference_mode():
                  output = module(dummy)

              if isinstance(output, tuple):
                  tensors = list(output)
                  primary = tensors[0]
                  log(f"forward 返回 tuple，元素数: {len(tensors)}")
              else:
                  primary = output

              if not torch.is_tensor(primary):
                  raise TypeError(
                      f"forward 的主要输出不是 Tensor，而是 {type(primary)!r}"
                  )

              array = primary.detach().cpu().numpy()
              log(
                  f"forward 成功: shape={array.shape}, "
                  f"dtype={array.dtype}, "
                  f"min={float(np.min(array)):.6f}, "
                  f"max={float(np.max(array)):.6f}"
              )
              return array


          def find_working_length(module, max_id, mask_id):
              candidates = [8, 16, 32, 64, 128, 256, 300]
              errors = []

              for length in candidates:
                  dummy = make_dummy_input(
                      max_id=max_id,
                      mask_id=mask_id,
                      length=length
                  )
                  try:
                      reference = run_forward(module, dummy)
                      log(f"可用测试长度: {length}")
                      return length, dummy, reference
                  except Exception as error:
                      message = (
                          f"长度 {length} 推理失败："
                          f"{type(error).__name__}: {error}"
                      )
                      errors.append(message)
                      log(message)

              raise RuntimeError(
                  "所有候选输入长度都无法推理：\n"
                  + "\n".join(errors)
              )


          def save_recovered_script_module(module):
              try:
                  torch.jit.save(module, str(SCRIPT_MODEL_PATH))
                  log(
                      "已保存可恢复的标准 TorchScript："
                      f"{SCRIPT_MODEL_PATH}"
                  )
                  return True
              except Exception as error:
                  log(
                      "无法重新保存为标准 TorchScript："
                      f"{type(error).__name__}: {error}"
                  )
                  log(traceback.format_exc())
                  return False


          def export_onnx(module, dummy):
              log("")
              log("开始导出 ONNX……")

              dynamic_axes = {
                  "input_ids": {
                      0: "batch",
                      1: "sequence"
                  },
                  "logits": {
                      0: "batch",
                      1: "sequence"
                  }
              }

              try:
                  torch.onnx.export(
                      module,
                      (dummy,),
                      str(ONNX_PATH),
                      export_params=True,
                      do_constant_folding=True,
                      input_names=["input_ids"],
                      output_names=["logits"],
                      dynamic_axes=dynamic_axes,
                      opset_version=13,
                      verbose=False
                  )
              except Exception as first_error:
                  log(
                      "动态长度 ONNX 导出失败，"
                      "尝试固定长度导出……"
                  )
                  log(
                      f"{type(first_error).__name__}: "
                      f"{first_error}"
                  )
                  log(traceback.format_exc())

                  torch.onnx.export(
                      module,
                      (dummy,),
                      str(ONNX_PATH),
                      export_params=True,
                      do_constant_folding=True,
                      input_names=["input_ids"],
                      output_names=["logits"],
                      opset_version=13,
                      verbose=False
                  )

              if not ONNX_PATH.is_file() or ONNX_PATH.stat().st_size < 1024:
                  raise RuntimeError("ONNX 文件未生成或文件异常")

              model = onnx.load(str(ONNX_PATH))
              onnx.checker.check_model(model)

              log(f"ONNX 导出成功: {ONNX_PATH}")
              log(f"ONNX 文件大小: {ONNX_PATH.stat().st_size} 字节")
              log(f"ONNX IR 版本: {model.ir_version}")
              log(
                  "ONNX opset: "
                  + ", ".join(
                      f"{item.domain or 'ai.onnx'}:{item.version}"
                      for item in model.opset_import
                  )
              )

              operators = {}
              for node in model.graph.node:
                  operators[node.op_type] = (
                      operators.get(node.op_type, 0) + 1
                  )

              log("ONNX 算子统计:")
              for operator, count in sorted(operators.items()):
                  log(f"  {operator}: {count}")

              return model


          def compare_onnx(dummy, torch_output):
              session = ort.InferenceSession(
                  str(ONNX_PATH),
                  providers=["CPUExecutionProvider"]
              )
              input_name = session.get_inputs()[0].name
              outputs = session.run(
                  None,
                  {
                      input_name:
                          dummy.detach().cpu().numpy().astype(np.int64)
                  }
              )

              if not outputs:
                  raise RuntimeError("ONNX Runtime 没有返回输出")

              onnx_output = np.asarray(outputs[0])
              if onnx_output.shape != torch_output.shape:
                  raise RuntimeError(
                      "ONNX 与 PyTorch 输出形状不一致："
                      f"{onnx_output.shape} != {torch_output.shape}"
                  )

              absolute = np.abs(
                  onnx_output.astype(np.float64)
                  - torch_output.astype(np.float64)
              )

              max_error = float(np.max(absolute))
              mean_error = float(np.mean(absolute))

              log(f"ONNX 对比最大绝对误差: {max_error:.10f}")
              log(f"ONNX 对比平均绝对误差: {mean_error:.10f}")

              if not np.allclose(
                  onnx_output,
                  torch_output,
                  rtol=1e-4,
                  atol=1e-5
              ):
                  raise RuntimeError(
                      "ONNX 与 PyTorch 输出误差超过允许范围"
                  )

              log("ONNX Runtime 与 PyTorch 输出一致性验证通过。")


          def write_github_output(name, value):
              output_file = os.environ.get("GITHUB_OUTPUT")
              if not output_file:
                  return

              with open(output_file, "a", encoding="utf-8") as file:
                  file.write(f"{name}={value}\n")


          def main():
              log("===== Dededi 极速模型鸿蒙迁移测试 =====")
              log(f"Python: {sys.version}")
              log(f"PyTorch: {torch.__version__}")
              log(f"ONNX: {onnx.__version__}")
              log(f"ONNX Runtime: {ort.__version__}")

              if not MODEL_PATH.exists():
                  raise FileNotFoundError("未找到 dededi_mobile.ptl")

              inspect_zip()
              _, max_id, _, mask_id = load_vocab()

              standard_module = try_standard_load()
              lite_module = None

              if standard_module is None:
                  lite_module = try_lite_load()

              executable_module = standard_module or lite_module
              if executable_module is None:
                  write_github_output("ptl_loadable", "false")
                  write_github_output("onnx_exported", "false")
                  log("")
                  log("最终结果：PTL 无法被当前 PyTorch 运行时载入。")
                  save_report()
                  return 2

              write_github_output("ptl_loadable", "true")

              length, dummy, torch_output = find_working_length(
                  executable_module,
                  max_id=max_id,
                  mask_id=mask_id
              )
              write_github_output("working_sequence_length", str(length))

              if standard_module is None:
                  write_github_output("onnx_exported", "false")
                  log("")
                  log(
                      "最终结果：模型可由 Lite Interpreter 运行，"
                      "但无法恢复为标准 ScriptModule。"
                  )
                  log(
                      "这说明原 PTL 仍可用于 PyTorch Lite，"
                      "但不能直接进入 ONNX/MindSpore 转换链。"
                  )
                  save_report()
                  return 3

              save_recovered_script_module(standard_module)
              export_onnx(standard_module, dummy)
              compare_onnx(dummy, torch_output)

              write_github_output("onnx_exported", "true")
              log("")
              log(
                  "最终结果：极速模型已成功恢复并导出为 ONNX，"
                  "可以继续转换为 MindSpore Lite 模型。"
              )
              save_report()
              return 0


          if __name__ == "__main__":
              try:
                  code = main()
              except Exception as error:
                  log("")
                  log("发生未处理异常：")
                  log(f"{type(error).__name__}: {error}")
                  log(traceback.format_exc())
                  write_github_output("onnx_exported", "false")
                  save_report()
                  code = 1

              save_report()
              raise SystemExit(code)
          PY

          set +e
          python inspect_and_export_fast.py
          CONVERSION_EXIT_CODE=$?
          set -e

          echo "conversion_exit_code=$CONVERSION_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ -f harmony_model_output/conversion_report.txt ]; then
            echo "### 极速模型检查与转换报告" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 500 harmony_model_output/conversion_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成转换报告。" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 此步骤故意不立即失败，确保报告和中间产物能够上传。
          exit 0

      - name: Try converting ONNX to MindSpore Lite
        id: convert_mindspore
        if: steps.convert_fast.outputs.onnx_exported == 'true'
        shell: bash
        run: |
          set -euo pipefail

          REPORT="harmony_model_output/mindspore_conversion_report.txt"
          MODEL="harmony_model_output/dededi_fast.onnx"
          OUTPUT_BASE="harmony_model_output/dededi_fast"

          {
            echo "===== MindSpore Lite 转换测试 ====="
            echo "源模型: $MODEL"
            echo "开始寻找可用的 MindSpore Lite 转换器……"
          } | tee "$REPORT"

          CONVERTED=false

          if command -v converter_lite >/dev/null 2>&1; then
            {
              echo "发现 converter_lite:"
              converter_lite --version || true
              echo "开始转换……"
            } | tee -a "$REPORT"

            set +e
            converter_lite \
              --fmk=ONNX \
              --modelFile="$MODEL" \
              --outputFile="$OUTPUT_BASE" \
              --saveType=MINDIR \
              2>&1 | tee -a "$REPORT"
            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -eq 0 ]; then
              CONVERTED=true
            fi
          else
            echo "当前 GitHub Runner 未预装 converter_lite。" | tee -a "$REPORT"
          fi

          if [ "$CONVERTED" = false ]; then
            echo "尝试安装 MindSpore Lite Python 包……" | tee -a "$REPORT"

            set +e
            python -m pip install "mindspore_lite==2.6.0" \
              2>&1 | tee -a "$REPORT"
            INSTALL_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$INSTALL_STATUS" -eq 0 ]; then
              cat << 'PY' > convert_onnx_to_ms.py
              import traceback
              from pathlib import Path

              model = Path(
                  "harmony_model_output/dededi_fast.onnx"
              )
              output = Path(
                  "harmony_model_output/dededi_fast"
              )

              try:
                  import mindspore_lite as mslite

                  converter = mslite.Converter()
                  converter.fmk_type = mslite.FmkType.ONNX
                  converter.model_file = str(model)
                  converter.output_file = str(output)
                  converter.save_type = mslite.ModelType.MINDIR_LITE
                  converter.convert()

                  print("MindSpore Lite Python 转换完成。")
              except Exception:
                  traceback.print_exc()
                  raise
              PY

              set +e
              python convert_onnx_to_ms.py \
                2>&1 | tee -a "$REPORT"
              PY_STATUS=${PIPESTATUS[0]}
              set -e

              if [ "$PY_STATUS" -eq 0 ]; then
                CONVERTED=true
              fi
            fi
          fi

          find harmony_model_output \
            -maxdepth 1 \
            -type f \
            -printf "%f | %s 字节\n" \
            | sort \
            | tee -a "$REPORT"

          if find harmony_model_output \
              -maxdepth 1 \
              -type f \
              \( -name "dededi_fast.ms" \
                 -o -name "dededi_fast.mindir" \) \
              | grep -q .; then
            CONVERTED=true
          fi

          echo "mindspore_converted=$CONVERTED" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### MindSpore Lite 转换报告"
            echo '```text'
            tail -n 300 "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 即便转换器不可用，也保留 ONNX 供后续在 DevEco 环境转换。
          exit 0

      - name: Write final conclusion
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          PTL_LOADABLE="${{ steps.convert_fast.outputs.ptl_loadable }}"
          ONNX_EXPORTED="${{ steps.convert_fast.outputs.onnx_exported }}"
          MS_CONVERTED="${{ steps.convert_mindspore.outputs.mindspore_converted }}"
          EXIT_CODE="${{ steps.convert_fast.outputs.conversion_exit_code }}"

          {
            echo "## 最终结论"
            echo ""
            echo "- PTL 可载入：\`${PTL_LOADABLE:-unknown}\`"
            echo "- ONNX 已导出：\`${ONNX_EXPORTED:-false}\`"
            echo "- MindSpore Lite 已生成：\`${MS_CONVERTED:-false}\`"
            echo "- 转换脚本退出码：\`${EXIT_CODE:-unknown}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ONNX_EXPORTED" = "true" ]; then
            {
              echo "极速模型具备迁移条件。"
              echo "下一步可将生成的 ONNX 或 MS 模型接入 HarmonyOS MindSpore Lite 推理层。"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PTL_LOADABLE" = "true" ]; then
            {
              echo "模型仍能通过 Lite Interpreter 推理，但当前 PTL 不包含可恢复的完整 TorchScript 图。"
              echo "这种情况下无法直接转换，需要原始模型结构/权重，或在 Android 端蒸馏出一个等价新模型。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "当前 PyTorch 版本无法加载该 PTL。"
              echo "请查看上方报告，确认是否为版本不匹配或文件损坏。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload conversion report and models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Fast-Model-Conversion
          path: |
            harmony_model_output/**
            inspect_and_export_fast.py
            convert_onnx_to_ms.py
          if-no-files-found: warn
          retention-days: 14

      - name: Mark conversion failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.convert_fast.outputs.onnx_exported }}" != "true" ]; then
            echo "极速模型没有成功导出 ONNX。请打开本次运行的 Summary 查看具体原因。"
            exit 1
          fi

          echo "极速模型已成功导出 ONNX。"
