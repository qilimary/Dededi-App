name: Recover HarmonyOS Fast Model

on:
  workflow_dispatch:
  push:
    paths:
      - "dededi_mobile.ptl"
      - "student_vocab.json"
      - ".github/workflows/harmony-model-test.yml"

permissions:
  contents: read

concurrency:
  group: dededi-harmony-fast-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Python requirements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat << 'EOF' > .ci/requirements-harmony-recovery.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Check source files
        shell: bash
        run: |
          set -euo pipefail
          test -s dededi_mobile.ptl || {
            echo "没有找到 dededi_mobile.ptl，或文件为空。"
            exit 1
          }
          test -s student_vocab.json || {
            echo "没有找到 student_vocab.json，或文件为空。"
            exit 1
          }
          echo "PTL: $(stat -c '%s' dededi_mobile.ptl) bytes"
          echo "Vocab: $(stat -c '%s' student_vocab.json) bytes"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: .ci/requirements-harmony-recovery.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/requirements-harmony-recovery.txt

      - name: Recover model and export ONNX
        id: convert
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > recover_fast_model.py
          import hashlib
          import json
          import os
          import traceback
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch
          import torch.nn as nn


          SOURCE = Path("dededi_mobile.ptl")
          VOCAB = Path("student_vocab.json")
          OUT = Path("harmony_fast_model")
          REPORT = OUT / "recovery_report.txt"
          ONNX_FILE = OUT / "dededi_fast.onnx"
          SCRIPT_FILE = OUT / "dededi_fast_standard.pt"
          STATE_FILE = OUT / "dededi_fast_state.pth"
          MANIFEST_FILE = OUT / "model_manifest.json"

          OUT.mkdir(parents=True, exist_ok=True)
          lines = []


          def log(value=""):
              value = str(value)
              print(value, flush=True)
              lines.append(value)


          def save_report():
              REPORT.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )


          def github_output(name, value):
              target = os.environ.get("GITHUB_OUTPUT")
              if target:
                  with open(target, "a", encoding="utf-8") as file:
                      file.write(f"{name}={value}\n")


          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as file:
                  while True:
                      block = file.read(1024 * 1024)
                      if not block:
                          break
                      digest.update(block)
              return digest.hexdigest()


          def find_node(graph, kind):
              nodes = [
                  node
                  for node in graph.nodes()
                  if node.kind() == kind
              ]
              if len(nodes) != 1:
                  raise RuntimeError(
                      f"{kind} 节点数量异常：{len(nodes)}"
                  )
              return nodes[0]


          def inputs(node):
              return list(node.inputs())


          def ivalue(value, name):
              try:
                  result = value.toIValue()
              except Exception as error:
                  raise RuntimeError(
                      f"无法读取{name}：{error}"
                  ) from error
              if result is None:
                  raise RuntimeError(f"{name}为空")
              return result


          def tensor(value, name):
              result = ivalue(value, name)
              if not torch.is_tensor(result):
                  raise TypeError(
                      f"{name}不是 Tensor：{type(result)!r}"
                  )
              return result.detach().cpu().contiguous()


          class StudentBiGRU(nn.Module):
              def __init__(
                  self,
                  vocab_size,
                  embed_size,
                  hidden_size,
                  num_layers,
                  dropout,
                  bidirectional,
                  output_size
              ):
                  super().__init__()
                  self.embedding = nn.Embedding(
                      vocab_size,
                      embed_size
                  )
                  self.gru = nn.GRU(
                      embed_size,
                      hidden_size,
                      num_layers=num_layers,
                      batch_first=True,
                      dropout=dropout if num_layers > 1 else 0.0,
                      bidirectional=bidirectional
                  )
                  features = hidden_size * (
                      2 if bidirectional else 1
                  )
                  self.norm = nn.LayerNorm(features)
                  self.classifier = nn.Linear(
                      features,
                      output_size
                  )

              def forward(self, input_ids):
                  value = self.embedding(input_ids)
                  value, _ = self.gru(value)
                  value = self.norm(value)
                  return self.classifier(value)


          def recover():
              log("===== Dededi 极速模型无损恢复 =====")
              log(f"PyTorch: {torch.__version__}")
              log(f"ONNX: {onnx.__version__}")
              log(f"ONNX Runtime: {ort.__version__}")
              log(f"源文件大小: {SOURCE.stat().st_size}")
              log(f"源文件 SHA-256: {sha256(SOURCE)}")

              vocabulary = json.loads(
                  VOCAB.read_text(encoding="utf-8")
              )
              vocab_from_json = max(
                  int(value)
                  for value in vocabulary.values()
              ) + 1

              original = torch.jit.load(
                  str(SOURCE),
                  map_location="cpu"
              )
              original.eval()
              graph = original.graph

              embedding_node = find_node(
                  graph,
                  "aten::embedding"
              )
              gru_node = find_node(graph, "aten::gru")
              norm_node = find_node(
                  graph,
                  "aten::layer_norm"
              )
              linear_node = find_node(
                  graph,
                  "prepacked::linear_clamp_run"
              )

              embedding_weight = tensor(
                  inputs(embedding_node)[0],
                  "Embedding 权重"
              )

              gru_inputs = inputs(gru_node)
              gru_list_node = gru_inputs[2].node()
              if gru_list_node.kind() != "prim::ListConstruct":
                  raise RuntimeError("GRU 参数列表结构异常")

              gru_weights = [
                  tensor(value, f"GRU 参数 {index}")
                  for index, value in enumerate(
                      inputs(gru_list_node)
                  )
              ]

              has_bias = bool(
                  ivalue(gru_inputs[3], "GRU has_bias")
              )
              num_layers = int(
                  ivalue(gru_inputs[4], "GRU num_layers")
              )
              dropout = float(
                  ivalue(gru_inputs[5], "GRU dropout")
              )
              bidirectional = bool(
                  ivalue(
                      gru_inputs[7],
                      "GRU bidirectional"
                  )
              )
              batch_first = bool(
                  ivalue(
                      gru_inputs[8],
                      "GRU batch_first"
                  )
              )

              if not batch_first:
                  raise RuntimeError(
                      "源模型不是 batch_first，脚本停止"
                  )

              norm_inputs = inputs(norm_node)
              norm_weight = tensor(
                  norm_inputs[2],
                  "LayerNorm weight"
              )
              norm_bias = tensor(
                  norm_inputs[3],
                  "LayerNorm bias"
              )
              norm_eps = float(
                  ivalue(
                      norm_inputs[4],
                      "LayerNorm epsilon"
                  )
              )
              
              context = ivalue(
                  inputs(linear_node)[1],
                  "XNNPACK LinearOpContext"
              )
        
              try:
                  packed_state = context.unpack()
              except (AttributeError, RuntimeError):
                  packed_state = context.__getstate__()
        
                  if (
                      isinstance(packed_state, tuple)
                      and len(packed_state) == 2
                      and isinstance(packed_state[0], (tuple, list))
                  ):
                      packed_state = packed_state[0]
        
              if isinstance(packed_state, list):
                  packed_state = tuple(packed_state)
        
              if (
                  not isinstance(packed_state, tuple)
                  or len(packed_state) != 4
              ):
                  raise RuntimeError(
                      "无法从 XNNPACK LinearOpContext 中读取分类层权重，"
                      f"实际返回类型：{type(packed_state)!r}"
                  )
        
              classifier_weight, classifier_bias, out_min, out_max = (
                  packed_state
              )
        
              if not torch.is_tensor(classifier_weight):
                  raise RuntimeError("分类层权重不是 Tensor")
        
              if (
                  classifier_bias is not None
                  and not torch.is_tensor(classifier_bias)
              ):
                  raise RuntimeError("分类层偏置不是 Tensor")

              
              classifier_weight, classifier_bias, out_min, out_max = (
                  context.unpack()
              )

              if out_min is not None or out_max is not None:
                  raise RuntimeError(
                      "最后一层带 Clamp，不能直接忽略"
                  )

              classifier_weight = (
                  classifier_weight
                  .detach()
                  .cpu()
                  .contiguous()
              )
              classifier_bias = (
                  classifier_bias
                  .detach()
                  .cpu()
                  .contiguous()
              )

              vocab_size, embed_size = (
                  embedding_weight.shape
              )
              hidden_size = int(gru_weights[1].shape[1])
              output_size = int(
                  classifier_weight.shape[0]
              )
              features = hidden_size * (
                  2 if bidirectional else 1
              )

              if vocab_size != vocab_from_json:
                  raise RuntimeError(
                      "词表尺寸不一致："
                      f"{vocab_size} != {vocab_from_json}"
                  )

              if classifier_weight.shape[1] != features:
                  raise RuntimeError(
                      "分类层输入尺寸与 GRU 输出不一致"
                  )

              expected_gru_parameters = (
                  num_layers
                  * (2 if bidirectional else 1)
                  * (4 if has_bias else 2)
              )
              if len(gru_weights) != expected_gru_parameters:
                  raise RuntimeError(
                      "GRU 参数数量不一致："
                      f"{len(gru_weights)} != "
                      f"{expected_gru_parameters}"
                  )

              recovered = StudentBiGRU(
                  vocab_size=vocab_size,
                  embed_size=embed_size,
                  hidden_size=hidden_size,
                  num_layers=num_layers,
                  dropout=dropout,
                  bidirectional=bidirectional,
                  output_size=output_size
              )
              recovered.eval()

              flat_names = list(
                  recovered.gru._flat_weights_names
              )
              if len(flat_names) != len(gru_weights):
                  raise RuntimeError("GRU 参数槽数量不一致")

              with torch.no_grad():
                  recovered.embedding.weight.copy_(
                      embedding_weight
                  )

                  for name, source in zip(
                      flat_names,
                      gru_weights
                  ):
                      destination = getattr(
                          recovered.gru,
                          name
                      )
                      if destination.shape != source.shape:
                          raise RuntimeError(
                              f"{name} 形状不一致："
                              f"{tuple(destination.shape)} != "
                              f"{tuple(source.shape)}"
                          )
                      destination.copy_(source)

                  recovered.norm.weight.copy_(norm_weight)
                  recovered.norm.bias.copy_(norm_bias)
                  recovered.norm.eps = norm_eps
                  recovered.classifier.weight.copy_(
                      classifier_weight
                  )
                  recovered.classifier.bias.copy_(
                      classifier_bias
                  )

              manifest = {
                  "model": "StudentBiGRU",
                  "vocabulary_size": int(vocab_size),
                  "embedding_size": int(embed_size),
                  "hidden_size": int(hidden_size),
                  "num_layers": int(num_layers),
                  "bidirectional": bool(bidirectional),
                  "batch_first": True,
                  "dropout": float(dropout),
                  "feature_size": int(features),
                  "output_size": int(output_size),
                  "labels": ["的", "地", "得"],
                  "input_dtype": "int64",
                  "output_dtype": "float32",
                  "input_shape": [1, "sequence"],
                  "output_shape": [
                      1,
                      "sequence",
                      int(output_size)
                  ],
                  "source_sha256": sha256(SOURCE)
              }
              MANIFEST_FILE.write_text(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              log("")
              log("恢复出的结构：")
              for key, value in manifest.items():
                  log(f"{key}: {value}")

              generator = torch.Generator(
                  device="cpu"
              )
              generator.manual_seed(20260710)
              max_error = 0.0

              log("")
              log("原 PTL 与恢复模型对比：")
              for batch, length in [
                  (1, 1),
                  (1, 8),
                  (2, 16),
                  (1, 32),
                  (2, 64)
              ]:
                  value = torch.randint(
                      0,
                      vocab_size,
                      (batch, length),
                      dtype=torch.long,
                      generator=generator
                  )
                  with torch.inference_mode():
                      expected = original(value)
                      actual = recovered(value)

                  difference = (
                      expected - actual
                  ).abs()
                  case_max = float(
                      difference.max().item()
                  )
                  case_mean = float(
                      difference.mean().item()
                  )
                  max_error = max(
                      max_error,
                      case_max
                  )
                  log(
                      f"batch={batch}, sequence={length}, "
                      f"max={case_max:.12g}, "
                      f"mean={case_mean:.12g}"
                  )

                  if not torch.allclose(
                      expected,
                      actual,
                      rtol=1e-5,
                      atol=2e-6
                  ):
                      raise RuntimeError(
                          "恢复模型与原 PTL 不一致"
                      )

              log(
                  "PyTorch 一致性验证通过，"
                  f"最大绝对误差={max_error:.12g}"
              )

              torch.save(
                  {
                      "manifest": manifest,
                      "state_dict":
                          recovered.state_dict()
                  },
                  str(STATE_FILE)
              )
              torch.jit.script(
                  recovered
              ).save(str(SCRIPT_FILE))

              return recovered, manifest, max_error


          def export_onnx(recovered, manifest):
              vocab_size = manifest["vocabulary_size"]
              dummy = torch.randint(
                  0,
                  vocab_size,
                  (1, 16),
                  dtype=torch.long
              )

              torch.onnx.export(
                  recovered,
                  (dummy,),
                  str(ONNX_FILE),
                  export_params=True,
                  opset_version=13,
                  do_constant_folding=True,
                  input_names=["input_ids"],
                  output_names=["logits"],
                  dynamic_axes={
                      "input_ids": {
                          1: "sequence"
                      },
                      "logits": {
                          1: "sequence"
                      }
                  }
              )

              model = onnx.load(str(ONNX_FILE))
              onnx.checker.check_model(model)

              session = ort.InferenceSession(
                  str(ONNX_FILE),
                  providers=["CPUExecutionProvider"]
              )
              input_name = session.get_inputs()[0].name
              generator = torch.Generator(
                  device="cpu"
              )
              generator.manual_seed(20260711)
              max_error = 0.0

              log("")
              log("ONNX 与恢复模型对比：")
              for batch, length in [
                  (1, 1),
                  (1, 8),
                  (1, 17),
                  (1, 64),
                  (1, 128)
              ]:
                  value = torch.randint(
                      0,
                      vocab_size,
                      (batch, length),
                      dtype=torch.long,
                      generator=generator
                  )
                  with torch.inference_mode():
                      expected = (
                          recovered(value)
                          .cpu()
                          .numpy()
                      )

                  actual = session.run(
                      None,
                      {
                          input_name:
                              value.cpu()
                              .numpy()
                              .astype(np.int64)
                      }
                  )[0]

                  difference = np.abs(
                      expected.astype(np.float64)
                      - actual.astype(np.float64)
                  )
                  case_max = float(
                      difference.max()
                  )
                  case_mean = float(
                      difference.mean()
                  )
                  max_error = max(
                      max_error,
                      case_max
                  )
                  log(
                      f"batch={batch}, sequence={length}, "
                      f"max={case_max:.12g}, "
                      f"mean={case_mean:.12g}"
                  )

                  if not np.allclose(
                      expected,
                      actual,
                      rtol=1e-4,
                      atol=2e-5
                  ):
                      raise RuntimeError(
                          "ONNX 与 PyTorch 输出不一致"
                      )

              log(f"ONNX 大小: {ONNX_FILE.stat().st_size}")
              log(f"ONNX SHA-256: {sha256(ONNX_FILE)}")
              log(
                  "ONNX 动态长度验证通过，"
                  f"最大绝对误差={max_error:.12g}"
              )
              return max_error


          try:
              recovered, manifest, torch_error = recover()
              onnx_error = export_onnx(
                  recovered,
                  manifest
              )

              github_output("recovered", "true")
              github_output("onnx_exported", "true")
              github_output(
                  "torch_error",
                  f"{torch_error:.12g}"
              )
              github_output(
                  "onnx_error",
                  f"{onnx_error:.12g}"
              )

              log("")
              log("===== 最终结论 =====")
              log("极速模型已从 XNNPACK PTL 中无损恢复。")
              log("不需要重新训练，也不需要模型蒸馏。")
              log("普通 TorchScript 和 ONNX 均已生成。")
              save_report()
          except Exception as error:
              github_output("recovered", "false")
              github_output(
                  "onnx_exported",
                  "false"
              )
              log("")
              log("===== 失败 =====")
              log(f"{type(error).__name__}: {error}")
              log(traceback.format_exc())
              save_report()
              raise
          finally:
              save_report()
          PY

          python recover_fast_model.py

          {
            echo "## 极速模型恢复报告"
            echo '```text'
            tail -n 500 harmony_fast_model/recovery_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Try MindSpore Lite conversion
        id: mindspore
        if: steps.convert.outputs.onnx_exported == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          REPORT="harmony_fast_model/mindspore_report.txt"

          {
            echo "===== MindSpore Lite 转换测试 ====="
            echo "安装 mindspore_lite……"
          } | tee "$REPORT"

          python -m pip install --upgrade mindspore_lite \
            2>&1 | tee -a "$REPORT"
          INSTALL_STATUS=${PIPESTATUS[0]}

          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "mindspore_converted=false" >> "$GITHUB_OUTPUT"
            echo "安装失败；已经生成的 ONNX 不受影响。" \
              | tee -a "$REPORT"
            exit 0
          fi

          cat << 'PY' > convert_mindspore.py
          import glob
          import os
          import mindspore_lite as mslite

          source = "harmony_fast_model/dededi_fast.onnx"
          output = "harmony_fast_model/dededi_fast"

          print("MindSpore Lite:", mslite.__version__)
          converter = mslite.Converter()
          converter.optimize = "general"
          converter.infer = False

          if hasattr(mslite.ModelType, "MINDIR_LITE"):
              converter.save_type = (
                  mslite.ModelType.MINDIR_LITE
              )
          else:
              converter.save_type = (
                  mslite.ModelType.MINDIR
              )

          converter.convert(
              mslite.FmkType.ONNX,
              source,
              output
          )

          generated = (
              glob.glob(output + ".ms")
              + glob.glob(output + ".mindir")
          )
          if not generated:
              raise RuntimeError(
                  "没有生成 .ms 或 .mindir"
              )

          for file in generated:
              print(file, os.path.getsize(file))
          PY

          python convert_mindspore.py \
            2>&1 | tee -a "$REPORT"
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -eq 0 ]; then
            echo "mindspore_converted=true" >> "$GITHUB_OUTPUT"
          else
            echo "mindspore_converted=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo ""
            echo "### MindSpore Lite 转换报告"
            echo '```text'
            tail -n 300 "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Final summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo ""
            echo "## 最终结果"
            echo ""
            echo "- 极速模型已恢复：\`${{ steps.convert.outputs.recovered || 'false' }}\`"
            echo "- ONNX 已导出：\`${{ steps.convert.outputs.onnx_exported || 'false' }}\`"
            echo "- MindSpore Lite 已生成：\`${{ steps.mindspore.outputs.mindspore_converted || 'false' }}\`"
            echo "- PTL 对比最大误差：\`${{ steps.convert.outputs.torch_error || 'unknown' }}\`"
            echo "- ONNX 对比最大误差：\`${{ steps.convert.outputs.onnx_error || 'unknown' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.convert.outputs.onnx_exported }}" = "true" ]; then
            {
              echo "✅ 极速模型恢复成功，无需重新训练。"
              echo ""
              echo "请下载 Artifact："
              echo "\`Dededi-Harmony-Fast-Model-Recovered\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 请查看上方恢复报告。" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload recovered model files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Fast-Model-Recovered
          path: |
            harmony_fast_model/**
            recover_fast_model.py
            convert_mindspore.py
          if-no-files-found: error
          retention-days: 30
