name: Recover HarmonyOS Fast Model

on:
  workflow_dispatch:
  push:
    paths:
      - "dededi_mobile.ptl"
      - "student_vocab.json"
      - ".github/workflows/harmony-model-test.yml"

permissions:
  contents: read

concurrency:
  group: dededi-harmony-fast-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          cat << 'EOF' > .ci/requirements-harmony-recovery.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==1.13.1+cpu
          onnx==1.14.1
          onnxruntime==1.16.3
          numpy==1.24.4
          EOF

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail
          test -s dededi_mobile.ptl || { echo "错误：仓库根目录没有 dededi_mobile.ptl，或文件为空。"; exit 1; }
          test -s student_vocab.json || { echo "错误：仓库根目录没有 student_vocab.json，或文件为空。"; exit 1; }
          echo "dededi_mobile.ptl: $(stat -c '%s' dededi_mobile.ptl) bytes"
          echo "student_vocab.json: $(stat -c '%s' student_vocab.json) bytes"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: .ci/requirements-harmony-recovery.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r .ci/requirements-harmony-recovery.txt

      - name: Recover model and export ONNX
        id: recovery
        shell: bash
        run: |
          set -euo pipefail

          cat << 'PY' > recover_fast_model.py
          import hashlib
          import json
          import os
          import traceback
          from pathlib import Path

          import numpy as np
          import onnx
          import onnxruntime as ort
          import torch
          import torch.nn as nn


          SOURCE = Path("dededi_mobile.ptl")
          VOCAB = Path("student_vocab.json")
          OUT = Path("harmony_fast_model")
          REPORT = OUT / "recovery_report.txt"
          ONNX_FILE = OUT / "dededi_fast.onnx"
          SCRIPT_FILE = OUT / "dededi_fast_standard.pt"
          STATE_FILE = OUT / "dededi_fast_state.pth"
          MANIFEST_FILE = OUT / "model_manifest.json"

          OUT.mkdir(parents=True, exist_ok=True)
          REPORT_LINES = []


          def log(value=""):
              text = str(value)
              print(text, flush=True)
              REPORT_LINES.append(text)


          def save_report():
              REPORT.write_text(
                  "\n".join(REPORT_LINES) + "\n",
                  encoding="utf-8"
              )


          def github_output(name, value):
              target = os.environ.get("GITHUB_OUTPUT")
              if target:
                  with open(target, "a", encoding="utf-8") as file:
                      file.write(f"{name}={value}\n")


          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as file:
                  while True:
                      block = file.read(1024 * 1024)
                      if not block:
                          break
                      digest.update(block)
              return digest.hexdigest()


          def inputs(node):
              return list(node.inputs())


          def find_node(graph, kind):
              nodes = [
                  node
                  for node in graph.nodes()
                  if node.kind() == kind
              ]

              if len(nodes) != 1:
                  raise RuntimeError(
                      f"{kind} 节点数量异常：{len(nodes)}"
                  )

              return nodes[0]


          def ivalue(value, name):
              try:
                  result = value.toIValue()
              except Exception as error:
                  raise RuntimeError(
                      f"无法读取{name}：{error}"
                  ) from error

              if result is None:
                  raise RuntimeError(f"{name}为空")

              return result


          def tensor(value, name):
              result = ivalue(value, name)

              if not torch.is_tensor(result):
                  raise TypeError(
                      f"{name}不是 Tensor：{type(result)!r}"
                  )

              return result.detach().cpu().contiguous()


          def call_script_method(script_object, method_name):
              errors = []

              try:
                  has_method = getattr(
                      script_object,
                      "_has_method",
                      None
                  )
                  get_method = getattr(
                      script_object,
                      "_get_method",
                      None
                  )

                  if (
                      callable(has_method)
                      and callable(get_method)
                      and has_method(method_name)
                  ):
                      return get_method(method_name)()
              except Exception as error:
                  errors.append(
                      f"_get_method："
                      f"{type(error).__name__}: {error}"
                  )

              try:
                  return getattr(
                      script_object,
                      method_name
                  )()
              except Exception as error:
                  errors.append(
                      f"getattr："
                      f"{type(error).__name__}: {error}"
                  )

              raise RuntimeError(
                  f"无法调用 {method_name}；"
                  + "；".join(errors)
              )


          def read_xnnpack_state(context):
              errors = []
              state = None

              for method_name in (
                  "__getstate__",
                  "unpack"
              ):
                  try:
                      state = call_script_method(
                          context,
                          method_name
                      )
                      break
                  except Exception as error:
                      errors.append(
                          f"{method_name}: {error}"
                      )

              if state is None:
                  raise RuntimeError(
                      "无法读取 XNNPACK LinearOpContext："
                      + "；".join(errors)
                  )

              if (
                  isinstance(state, tuple)
                  and len(state) == 2
                  and isinstance(
                      state[0],
                      (tuple, list)
                  )
              ):
                  state = state[0]

              if isinstance(state, list):
                  state = tuple(state)

              if (
                  not isinstance(state, tuple)
                  or len(state) != 4
              ):
                  raise RuntimeError(
                      "XNNPACK 状态结构异常："
                      f"type={type(state)!r}, "
                      f"value={state!r}"
                  )

              (
                  weight,
                  bias,
                  output_min,
                  output_max
              ) = state

              if not torch.is_tensor(weight):
                  raise RuntimeError(
                      "分类层权重不是 Tensor"
                  )

              if (
                  bias is not None
                  and not torch.is_tensor(bias)
              ):
                  raise RuntimeError(
                      "分类层偏置不是 Tensor"
                  )

              weight = (
                  weight
                  .detach()
                  .cpu()
                  .contiguous()
              )

              if bias is not None:
                  bias = (
                      bias
                      .detach()
                      .cpu()
                      .contiguous()
                  )

              return (
                  weight,
                  bias,
                  output_min,
                  output_max
              )


          class StudentBiGRU(nn.Module):
              def __init__(
                  self,
                  vocab_size,
                  embed_size,
                  hidden_size,
                  num_layers,
                  dropout,
                  bidirectional,
                  output_size,
                  classifier_has_bias
              ):
                  super().__init__()

                  self.embedding = nn.Embedding(
                      vocab_size,
                      embed_size
                  )

                  self.gru = nn.GRU(
                      embed_size,
                      hidden_size,
                      num_layers=num_layers,
                      batch_first=True,
                      dropout=(
                          dropout
                          if num_layers > 1
                          else 0.0
                      ),
                      bidirectional=bidirectional
                  )

                  features = hidden_size * (
                      2 if bidirectional else 1
                  )

                  self.norm = nn.LayerNorm(
                      features
                  )

                  self.classifier = nn.Linear(
                      features,
                      output_size,
                      bias=classifier_has_bias
                  )

              def forward(self, input_ids):
                  value = self.embedding(
                      input_ids
                  )
                  value, _ = self.gru(value)
                  value = self.norm(value)
                  return self.classifier(value)


          def recover():
              log(
                  "===== Dededi 极速模型无损恢复 ====="
              )
              log(f"PyTorch: {torch.__version__}")
              log(f"ONNX: {onnx.__version__}")
              log(
                  f"ONNX Runtime: "
                  f"{ort.__version__}"
              )
              log(
                  f"源文件大小: "
                  f"{SOURCE.stat().st_size}"
              )
              log(
                  f"源文件 SHA-256: "
                  f"{sha256(SOURCE)}"
              )

              vocabulary = json.loads(
                  VOCAB.read_text(
                      encoding="utf-8"
                  )
              )

              if (
                  not isinstance(vocabulary, dict)
                  or not vocabulary
              ):
                  raise ValueError(
                      "student_vocab.json "
                      "不是有效的非空字典"
                  )

              vocab_from_json = max(
                  int(value)
                  for value in vocabulary.values()
              ) + 1

              original = torch.jit.load(
                  str(SOURCE),
                  map_location="cpu"
              )
              original.eval()

              graph = original.graph

              log("PTL 已成功载入。")
              log(
                  f"forward schema: "
                  f"{original.forward.schema}"
              )

              embedding_node = find_node(
                  graph,
                  "aten::embedding"
              )

              gru_node = find_node(
                  graph,
                  "aten::gru"
              )

              norm_node = find_node(
                  graph,
                  "aten::layer_norm"
              )

              linear_node = find_node(
                  graph,
                  "prepacked::linear_clamp_run"
              )

              embedding_weight = tensor(
                  inputs(embedding_node)[0],
                  "Embedding 权重"
              )

              gru_inputs = inputs(gru_node)
              gru_list_node = (
                  gru_inputs[2].node()
              )

              if (
                  gru_list_node.kind()
                  != "prim::ListConstruct"
              ):
                  raise RuntimeError(
                      "GRU 参数列表结构异常"
                  )

              gru_weights = [
                  tensor(
                      value,
                      f"GRU 参数 {index}"
                  )
                  for index, value in enumerate(
                      inputs(gru_list_node)
                  )
              ]

              has_bias = bool(
                  ivalue(
                      gru_inputs[3],
                      "GRU has_bias"
                  )
              )

              num_layers = int(
                  ivalue(
                      gru_inputs[4],
                      "GRU num_layers"
                  )
              )

              dropout = float(
                  ivalue(
                      gru_inputs[5],
                      "GRU dropout"
                  )
              )

              bidirectional = bool(
                  ivalue(
                      gru_inputs[7],
                      "GRU bidirectional"
                  )
              )

              batch_first = bool(
                  ivalue(
                      gru_inputs[8],
                      "GRU batch_first"
                  )
              )

              if not batch_first:
                  raise RuntimeError(
                      "源模型不是 batch_first，"
                      "停止恢复"
                  )

              norm_inputs = inputs(
                  norm_node
              )

              norm_weight = tensor(
                  norm_inputs[2],
                  "LayerNorm weight"
              )

              norm_bias = tensor(
                  norm_inputs[3],
                  "LayerNorm bias"
              )

              norm_eps = float(
                  ivalue(
                      norm_inputs[4],
                      "LayerNorm epsilon"
                  )
              )

              context = ivalue(
                  inputs(linear_node)[1],
                  "XNNPACK LinearOpContext"
              )

              (
                  classifier_weight,
                  classifier_bias,
                  output_min,
                  output_max
              ) = read_xnnpack_state(
                  context
              )

              if (
                  output_min is not None
                  or output_max is not None
              ):
                  raise RuntimeError(
                      "分类层带 Clamp，"
                      "当前脚本不会静默忽略"
                  )

              (
                  vocab_size,
                  embed_size
              ) = embedding_weight.shape

              hidden_size = int(
                  gru_weights[1].shape[1]
              )

              output_size = int(
                  classifier_weight.shape[0]
              )

              features = hidden_size * (
                  2 if bidirectional else 1
              )

              if (
                  vocab_size
                  != vocab_from_json
              ):
                  raise RuntimeError(
                      "词表尺寸不一致："
                      f"{vocab_size} != "
                      f"{vocab_from_json}"
                  )

              if (
                  classifier_weight.shape[1]
                  != features
              ):
                  raise RuntimeError(
                      "分类层输入尺寸与 "
                      "GRU 输出不一致"
                  )

              if (
                  tuple(norm_weight.shape)
                  != (features,)
              ):
                  raise RuntimeError(
                      "LayerNorm weight "
                      "尺寸异常"
                  )

              if (
                  tuple(norm_bias.shape)
                  != (features,)
              ):
                  raise RuntimeError(
                      "LayerNorm bias "
                      "尺寸异常"
                  )

              direction_count = (
                  2 if bidirectional else 1
              )

              expected_count = (
                  num_layers
                  * direction_count
                  * (
                      4
                      if has_bias
                      else 2
                  )
              )

              if (
                  len(gru_weights)
                  != expected_count
              ):
                  raise RuntimeError(
                      "GRU 参数数量不一致："
                      f"{len(gru_weights)} != "
                      f"{expected_count}"
                  )

              recovered = StudentBiGRU(
                  vocab_size=vocab_size,
                  embed_size=embed_size,
                  hidden_size=hidden_size,
                  num_layers=num_layers,
                  dropout=dropout,
                  bidirectional=bidirectional,
                  output_size=output_size,
                  classifier_has_bias=(
                      classifier_bias is not None
                  )
              )

              recovered.eval()

              flat_names = list(
                  recovered.gru
                  ._flat_weights_names
              )

              if (
                  len(flat_names)
                  != len(gru_weights)
              ):
                  raise RuntimeError(
                      "重建 GRU 的参数槽"
                      "数量不一致"
                  )

              with torch.no_grad():
                  recovered.embedding.weight.copy_(
                      embedding_weight
                  )

                  for (
                      name,
                      source
                  ) in zip(
                      flat_names,
                      gru_weights
                  ):
                      destination = getattr(
                          recovered.gru,
                          name
                      )

                      if (
                          tuple(destination.shape)
                          != tuple(source.shape)
                      ):
                          raise RuntimeError(
                              f"{name} 形状不一致："
                              f"{tuple(destination.shape)} "
                              f"!= "
                              f"{tuple(source.shape)}"
                          )

                      destination.copy_(
                          source
                      )

                  recovered.norm.weight.copy_(
                      norm_weight
                  )

                  recovered.norm.bias.copy_(
                      norm_bias
                  )

                  recovered.norm.eps = (
                      norm_eps
                  )

                  recovered.classifier.weight.copy_(
                      classifier_weight
                  )

                  if (
                      classifier_bias
                      is not None
                  ):
                      recovered.classifier.bias.copy_(
                          classifier_bias
                      )

              manifest = {
                  "model": "StudentBiGRU",
                  "vocabulary_size": int(
                      vocab_size
                  ),
                  "embedding_size": int(
                      embed_size
                  ),
                  "hidden_size": int(
                      hidden_size
                  ),
                  "num_layers": int(
                      num_layers
                  ),
                  "bidirectional": bool(
                      bidirectional
                  ),
                  "batch_first": True,
                  "dropout": float(
                      dropout
                  ),
                  "feature_size": int(
                      features
                  ),
                  "output_size": int(
                      output_size
                  ),
                  "classifier_has_bias": (
                      classifier_bias
                      is not None
                  ),
                  "labels": [
                      "的",
                      "地",
                      "得"
                  ],
                  "input_dtype": "int64",
                  "output_dtype": "float32",
                  "input_shape": [
                      1,
                      "sequence"
                  ],
                  "output_shape": [
                      1,
                      "sequence",
                      int(output_size)
                  ],
                  "source_sha256": (
                      sha256(SOURCE)
                  )
              }

              MANIFEST_FILE.write_text(
                  json.dumps(
                      manifest,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              log("")
              log("恢复出的结构：")

              for key, value in (
                  manifest.items()
              ):
                  log(
                      f"{key}: {value}"
                  )

              generator = torch.Generator(
                  device="cpu"
              )
              generator.manual_seed(
                  20260710
              )

              max_error = 0.0

              log("")
              log(
                  "原 PTL 与恢复模型对比："
              )

              for length in (
                  1,
                  8,
                  16,
                  32,
                  64,
                  128
              ):
                  value = torch.randint(
                      0,
                      vocab_size,
                      (1, length),
                      dtype=torch.long,
                      generator=generator
                  )

                  with torch.inference_mode():
                      expected = original(
                          value
                      )
                      actual = recovered(
                          value
                      )

                  difference = (
                      expected - actual
                  ).abs()

                  case_max = float(
                      difference
                      .max()
                      .item()
                  )

                  case_mean = float(
                      difference
                      .mean()
                      .item()
                  )

                  max_error = max(
                      max_error,
                      case_max
                  )

                  log(
                      f"sequence={length}, "
                      f"max={case_max:.12g}, "
                      f"mean={case_mean:.12g}"
                  )

                  if not torch.allclose(
                      expected,
                      actual,
                      rtol=1e-5,
                      atol=2e-6
                  ):
                      raise RuntimeError(
                          "恢复模型与原 PTL "
                          "输出不一致"
                      )

              log(
                  "PyTorch 一致性验证通过，"
                  f"最大绝对误差="
                  f"{max_error:.12g}"
              )

              torch.save(
                  {
                      "manifest": manifest,
                      "state_dict":
                          recovered.state_dict()
                  },
                  str(STATE_FILE)
              )

              torch.jit.script(
                  recovered
              ).save(
                  str(SCRIPT_FILE)
              )

              log(
                  f"普通权重已保存："
                  f"{STATE_FILE}"
              )

              log(
                  f"普通 TorchScript "
                  f"已保存：{SCRIPT_FILE}"
              )

              return (
                  recovered,
                  manifest,
                  max_error
              )


          def export_onnx(
              recovered,
              manifest
          ):
              vocab_size = manifest[
                  "vocabulary_size"
              ]

              dummy = torch.randint(
                  0,
                  vocab_size,
                  (1, 16),
                  dtype=torch.long
              )

              torch.onnx.export(
                  recovered,
                  (dummy,),
                  str(ONNX_FILE),
                  export_params=True,
                  opset_version=13,
                  do_constant_folding=True,
                  input_names=[
                      "input_ids"
                  ],
                  output_names=[
                      "logits"
                  ],
                  dynamic_axes={
                      "input_ids": {
                          1: "sequence"
                      },
                      "logits": {
                          1: "sequence"
                      }
                  },
                  verbose=False
              )

              if (
                  not ONNX_FILE.is_file()
                  or ONNX_FILE.stat().st_size
                  < 1024
              ):
                  raise RuntimeError(
                      "ONNX 文件未生成"
                      "或大小异常"
                  )

              model = onnx.load(
                  str(ONNX_FILE)
              )

              onnx.checker.check_model(
                  model
              )

              session = (
                  ort.InferenceSession(
                      str(ONNX_FILE),
                      providers=[
                          "CPUExecutionProvider"
                      ]
                  )
              )

              if (
                  len(session.get_inputs())
                  != 1
              ):
                  raise RuntimeError(
                      "ONNX 输入数量不是 1"
                  )

              if (
                  len(session.get_outputs())
                  != 1
              ):
                  raise RuntimeError(
                      "ONNX 输出数量不是 1"
                  )

              input_name = (
                  session
                  .get_inputs()[0]
                  .name
              )

              generator = torch.Generator(
                  device="cpu"
              )

              generator.manual_seed(
                  20260711
              )

              max_error = 0.0

              log("")
              log(
                  "ONNX 与恢复模型对比："
              )

              for length in (
                  1,
                  8,
                  17,
                  64,
                  128,
                  300
              ):
                  value = torch.randint(
                      0,
                      vocab_size,
                      (1, length),
                      dtype=torch.long,
                      generator=generator
                  )

                  with torch.inference_mode():
                      expected = (
                          recovered(value)
                          .detach()
                          .cpu()
                          .numpy()
                      )

                  actual = session.run(
                      None,
                      {
                          input_name:
                              value
                              .cpu()
                              .numpy()
                              .astype(
                                  np.int64
                              )
                      }
                  )[0]

                  if (
                      actual.shape
                      != expected.shape
                  ):
                      raise RuntimeError(
                          "ONNX 输出形状不一致："
                          f"{actual.shape} != "
                          f"{expected.shape}"
                      )

                  difference = np.abs(
                      expected.astype(
                          np.float64
                      )
                      - actual.astype(
                          np.float64
                      )
                  )

                  case_max = float(
                      difference.max()
                  )

                  case_mean = float(
                      difference.mean()
                  )

                  max_error = max(
                      max_error,
                      case_max
                  )

                  log(
                      f"sequence={length}, "
                      f"max={case_max:.12g}, "
                      f"mean={case_mean:.12g}"
                  )

                  if not np.allclose(
                      expected,
                      actual,
                      rtol=1e-4,
                      atol=2e-5
                  ):
                      raise RuntimeError(
                          "ONNX 与 PyTorch "
                          "输出不一致"
                      )

              log(
                  f"ONNX 大小: "
                  f"{ONNX_FILE.stat().st_size}"
              )

              log(
                  f"ONNX SHA-256: "
                  f"{sha256(ONNX_FILE)}"
              )

              log(
                  "ONNX 动态长度验证通过，"
                  f"最大绝对误差="
                  f"{max_error:.12g}"
              )

              return max_error


          try:
              (
                  recovered,
                  manifest,
                  torch_error
              ) = recover()

              onnx_error = export_onnx(
                  recovered,
                  manifest
              )

              github_output(
                  "recovered",
                  "true"
              )

              github_output(
                  "onnx_exported",
                  "true"
              )

              github_output(
                  "torch_error",
                  f"{torch_error:.12g}"
              )

              github_output(
                  "onnx_error",
                  f"{onnx_error:.12g}"
              )

              log("")
              log(
                  "===== 最终结论 ====="
              )
              log(
                  "极速模型已从 "
                  "XNNPACK PTL 中无损恢复。"
              )
              log(
                  "普通 TorchScript 和 "
                  "ONNX 均已生成。"
              )
              log(
                  "不需要重新训练，"
                  "也不需要模型蒸馏。"
              )

          except Exception as error:
              github_output(
                  "recovered",
                  "false"
              )

              github_output(
                  "onnx_exported",
                  "false"
              )

              log("")
              log("===== 失败 =====")
              log(
                  f"{type(error).__name__}: "
                  f"{error}"
              )
              log(
                  traceback.format_exc()
              )
              raise

          finally:
              save_report()
          PY

          set +e
          python recover_fast_model.py
          RECOVERY_STATUS=$?
          set -e

          if [ -f harmony_fast_model/recovery_report.txt ]; then
            {
              echo "## 极速模型恢复报告"
              echo ""
              echo '```text'
              tail -n 500 harmony_fast_model/recovery_report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$RECOVERY_STATUS"

      - name: Try converting ONNX to MindSpore Lite
        id: mindspore
        if: steps.recovery.outputs.onnx_exported == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          REPORT="harmony_fast_model/mindspore_report.txt"

          {
            echo "===== MindSpore Lite 转换尝试 ====="
            echo "开始安装 mindspore_lite。"
          } | tee "$REPORT"

          python -m pip install --upgrade mindspore_lite 2>&1 | tee -a "$REPORT"
          INSTALL_STATUS=${PIPESTATUS[0]}

          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "mindspore_converted=false" >> "$GITHUB_OUTPUT"
            echo "mindspore_lite 安装失败；经过验证的 ONNX 仍然有效。" | tee -a "$REPORT"
            exit 0
          fi

          cat << 'PY' > convert_to_mindspore.py
          import glob
          import os
          from pathlib import Path

          import mindspore_lite as mslite


          source = Path(
              "harmony_fast_model/dededi_fast.onnx"
          )

          output = Path(
              "harmony_fast_model/dededi_fast"
          )

          converter = mslite.Converter()
          converter.optimize = "general"
          converter.infer = False

          if hasattr(
              mslite.ModelType,
              "MINDIR_LITE"
          ):
              converter.save_type = (
                  mslite.ModelType.MINDIR_LITE
              )
          else:
              converter.save_type = (
                  mslite.ModelType.MINDIR
              )

          converter.convert(
              mslite.FmkType.ONNX,
              str(source),
              str(output)
          )

          produced = sorted(
              glob.glob(
                  "harmony_fast_model/"
                  "dededi_fast.ms"
              )
              + glob.glob(
                  "harmony_fast_model/"
                  "dededi_fast.mindir"
              )
          )

          if not produced:
              raise RuntimeError(
                  "MindSpore Converter "
                  "没有生成模型文件"
              )

          for path in produced:
              print(
                  f"generated: {path} "
                  f"({os.path.getsize(path)} bytes)"
              )
          PY

          python convert_to_mindspore.py 2>&1 | tee -a "$REPORT"
          CONVERT_STATUS=${PIPESTATUS[0]}

          if [ "$CONVERT_STATUS" -eq 0 ]; then
            echo "mindspore_converted=true" >> "$GITHUB_OUTPUT"
          else
            echo "mindspore_converted=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo ""
            echo "### MindSpore Lite 转换报告"
            echo '```text'
            tail -n 300 "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          RECOVERED="${{ steps.recovery.outputs.recovered }}"
          ONNX_EXPORTED="${{ steps.recovery.outputs.onnx_exported }}"
          MINDSPORE_CONVERTED="${{ steps.mindspore.outputs.mindspore_converted }}"
          PYTORCH_ERROR="${{ steps.recovery.outputs.torch_error }}"
          ONNX_ERROR="${{ steps.recovery.outputs.onnx_error }}"

          {
            echo ""
            echo "## 最终结果"
            echo ""
            echo "- 极速模型已恢复：\`${RECOVERED:-false}\`"
            echo "- ONNX 已导出：\`${ONNX_EXPORTED:-false}\`"
            echo "- MindSpore Lite 已生成：\`${MINDSPORE_CONVERTED:-false}\`"
            echo "- PTL 对比最大误差：\`${PYTORCH_ERROR:-unknown}\`"
            echo "- ONNX 对比最大误差：\`${ONNX_ERROR:-unknown}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ONNX_EXPORTED" = "true" ]; then
            {
              echo "✅ 极速模型恢复成功，不需要重新训练。"
              echo ""
              echo "请下载 Artifact："
              echo "\`Dededi-Harmony-Fast-Model-Recovered\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 请查看上方恢复报告。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload recovered models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dededi-Harmony-Fast-Model-Recovered
          path: |
            harmony_fast_model/**
            recover_fast_model.py
            convert_to_mindspore.py
          if-no-files-found: warn
          retention-days: 30
